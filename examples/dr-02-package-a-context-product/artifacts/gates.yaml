# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DECLARED PRODUCT GATES OF `dr-02` — eight, `PKG-G01`..`PKG-G08`.
#
# The acceptance authority for every gate is `DR-SPEC-002` §G. Each id is
# claimed by at least one executing test under `tests/examples/`, and no
# estate figure is pinned anywhere.
#
# A CHECKER GAP, RECORDED RATHER THAN WORKED AROUND. `tools/
# check_product_gates.py` globs `examples/cp-*` **by construction** — its own
# docstring says `hw1-*` and `s1-*` are outside it — so this roster is NOT
# held to its executing tests by that checker. It reported 29 trees unchanged
# after this thirtieth serving tree appeared, and a count that does not move
# when its population does is measuring something else. Raised for a ruling
# (`PKG-F-05`); the tests below are real either way, and each id appears in
# its test's docstring so the pairing is greppable until the glob widens.
#
# WHAT THIS RUNG EXISTS TO PROVE, and the three gates that carry it:
#   `PKG-G01` — the record CARRIES the mode the class declares. A config
#     string nobody checks is a claim, not a demonstration.
#   `PKG-G02` — §7.10.4's four pinned rendering primitives are populated, so
#     an examiner reads the packaging off the record without a dereference.
#   `PKG-G04` — THE SMOOTHING GATE. A figure in the prose that the substrate
#     does not carry refuses the serve. This one caught its own author on the
#     rung's first honest run (`PKG-F-01`).

semver: "1.0.0"
class_id: dr-02.product-gates

declaration:
  product: credit-risk.packaged-memo

  test_naming_convention: >-
    the gate id appears in the executing test's docstring, as a `Declared
    product gate` line naming the id and the spec clause it answers.

  sabotage_states: >-
    each gate records the single reverting edit that turned it red, with the
    date and the commit the observation was made against. A gate whose
    sabotage left it green is recorded as a proof-machinery defect and the
    sabotage is replaced, never the claim.

  gates:
    - id: PKG-G01
      spec_clause: "§0.2 (1)"
      statement: >-
        The served record's dimension 3 reads `llm_packaged`, and the product
        class declares it. Both halves, because either alone is satisfiable
        without the other being true.
      test: tests/examples/test_dr_02_packaging.py::test_the_record_carries_the_declared_assembly_mode
      sabotage: >-
        declare `algorithmic` in `ccf_config.yaml` and the assertion on
        dimension 3 fails; the class and the record must agree.

    - id: PKG-G02
      spec_clause: "§0.2 (2)"
      statement: >-
        Every one of §7.10.4's four pinned rendering primitives — model,
        temperature, prompt artifact URI and prompt artifact hash — is
        populated on a served product and none is the `no-packaging` sentinel.
      test: tests/examples/test_dr_02_packaging.py::test_the_four_rendering_primitives_are_pinned
      sabotage: >-
        return the sentinel for `model_version` from the packager and the
        assertion fails by name.

    - id: PKG-G03
      spec_clause: "§D.1 (2)"
      statement: >-
        The prompt is a VERSIONED ARTIFACT and the hash on the product
        resolves to the bytes the packaging actually used — not to a
        re-read of whatever the file says now.
      test: tests/examples/test_dr_02_packaging.py::test_the_prompt_hash_resolves_to_the_bytes_used
      sabotage: >-
        hash a different document and the served hash stops matching the
        artifact's own content hash.

    - id: PKG-G04
      spec_clause: "§D.4"
      statement: >-
        A figure stated in the prose that the substrate does not carry REFUSES
        the serve, with the declared gate's identity stamped on the refusal.
      test: tests/examples/test_dr_02_packaging.py::test_an_invented_figure_refuses_the_serve
      sabotage: >-
        carried INSIDE the test — a packager that adds one unsupported figure
        must refuse, and the same packager without it must serve. Both
        directions, because a gate that refused everything would pass the
        first assertion alone.

    - id: PKG-G05
      spec_clause: "§B.2"
      statement: >-
        A section whose audience is outside the request's `audience` set never
        materializes. Absent from the view, not filtered from a payload — a
        materialized-then-dropped section is a section that existed.
      test: tests/examples/test_dr_02_packaging.py::test_a_section_outside_the_audience_never_materializes
      sabotage: >-
        widen the request's audience set and the excluded section appears,
        which is the positive control the exclusion needs.

    - id: PKG-G06
      spec_clause: "§D.1 (1)"
      statement: >-
        An upstream refusal is THIS product's refusal, and the upstream's own
        reason is retained rather than replaced with a generic one.
      test: tests/examples/test_dr_02_packaging.py::test_an_upstream_refusal_becomes_this_products_refusal
      sabotage: >-
        carried inside the test — point the deployment at a door that refuses
        and assert the refusal rather than an exception or an empty memo.

    - id: PKG-G07
      spec_clause: "§B.1 (3)"
      statement: >-
        The memo's expiry follows the SUBSTRATE's evidence, never the request
        instant. A rendering cannot be fresher than what it renders.
      test: tests/examples/test_dr_02_packaging.py::test_the_expiry_follows_the_substrate_not_the_request
      sabotage: >-
        declare `ttl_anchor: from_decision` and the served expiry moves to the
        request instant, which the assertion catches.

    - id: PKG-G08
      spec_clause: "§D.2"
      statement: >-
        Same subject, same pins, same packager → same content address. Mode 2
        is deterministic GIVEN its pins, which is what makes the four of them
        worth recording.
      test: tests/examples/test_dr_02_packaging.py::test_the_same_question_reaches_the_same_address_twice
      sabotage: >-
        carried inside the test — vary the temperature pin and the address
        must move, or the pins are not part of the identity they claim to be.
