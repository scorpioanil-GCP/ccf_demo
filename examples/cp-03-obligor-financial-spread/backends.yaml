# yaml-language-server: $schema=../../docs/schemas/ccf.declared-artifact.json
#
# HOW the declared backend kind's connection settings are COMPOSED, and how the
# system of record is reached. Not in `ccf_config.yaml`: connection material is
# deployment ENVIRONMENT, not Control Plane state, and a DSN in a
# content-hashed artifact is a DSN persisted into the audit plane forever.
#
# NO CONNECTION VALUE APPEARS HERE — no host, no port, no path, no credential.
# This document holds a variable's NAME and a per-run path RECIPE, and nothing
# else.
#
# THIS IS THE FILE SPEC §F.3 POINTS AT. The spec names the STORE — PostgreSQL,
# schema `ccf_v2` — because an implementation specification that will not say
# which of five stores an element lives in cannot be built from. It does NOT
# name the DEPLOYMENT: the spec says which store, this says how to reach it,
# and only the environment says where it is.
#
# ONE SOURCE, AND THE SECOND STORE IS NOT HERE ON PURPOSE. Spec §C.6 declares a
# Fluree policy-version binding; §C.6.1 holds it out of Gate 2 on build
# sequencing, so there is no `fibo-v2` block below. When it lands it arrives as
# a second `sources:` entry and nothing else in this document moves.

semver: "1.0.0"
class_id: cp-03.backend-profiles

declaration:
  profiles:
    sqlite:
      settings:
        database_path:
          per_run: path
          prefix: cp_03
          suffix: .sqlite3

  sources:
    # The financial-spread system of record — spec §C.1 rows 1-5, 9 and 10.
    # ONE source block, not seven: §C.1 keeps the AUTHORITIES distinct because
    # single-writer discipline is about authorities, and in this estate they
    # are materialized in one relational schema. The spec says which store; the
    # connection is one because the store is one.
    #
    # AN UNSET VARIABLE RAISES, CARRYING THIS REMEDY STRING. There is no
    # default and no in-tree DSN to fall back onto.
    financial_spread:
      settings:
        dsn:
          from_env: CCF_CP_03_POSTGRES_DSN
          remedy: >-
            export CCF_CP_03_POSTGRES_DSN with a READ-ONLY connection string for
            the financial spread estate — schema `ccf_v2`, tables
            `financial_fact`, `peer_fact`, `peer_entity`, `peer_cohort`,
            `filing_profile`, `crosswalk`, `legal_entity` and `principal`. See
            the example README's "Before you run" section for what the role
            needs and what it must not have. The role needs SELECT and nothing
            else: this deployment never writes to the store it reads, and a role
            that could write would make that a promise rather than a guarantee.
