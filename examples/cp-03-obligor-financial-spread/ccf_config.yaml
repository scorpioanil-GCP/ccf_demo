# yaml-language-server: $schema=../../docs/schemas/ccf.deployment-config.json
#
# THE SINGLE DEPLOYMENT DOCUMENT — every Control Plane section this example puts
# in force, in one file. `load_config_and_boot` derives and parses each section,
# registers the `role: register` ones, and boots on the resulting pins.
#
# NO CONNECTION VALUE APPEARS HERE. The backend is named as a KIND; how it is
# reached is `backends.yaml`, and where it is lives only in the environment. A
# DSN in a content-hashed artifact is a DSN persisted into the audit plane
# forever.

semver: "1.0.0"
tenant_id: cp-03-demo
backend: sqlite

# ---------------------------------------------------------------------------
# The product class — spec §B.1's nine elements, as Control Plane state.
# ---------------------------------------------------------------------------
product_class:
  schema_name: credit-risk.spread
  schema_version: "1.0.0"

  # §B.1 element 3, and §B.1.1 is the argument. The expiry is a function of the
  # FILINGS THE PAYLOAD CONSUMED, never of the request. The vault's test, ruled
  # 2026-08-30: a freshness anchor must be an OBSERVATION TIMESTAMP THAT MOVES,
  # and `filed_date` moves because filers file quarterly.
  ttl_anchor: from_entity_freshness

  # §B.1 element 9, DECLARED in the vault article 2026-08-30 rather than
  # inferred here. No LLM is reachable from any §D step; `OFS-G07` asserts it.
  assembly_mode: algorithmic

  max_ttl_key: cp-03/product/obligor-financial-spread/max-ttl

  # ONE operator. Spec §D.2.1: the attribute batch-select is L2 assembly and is
  # deliberately NOT an `Enrich` operator — `Enrich` is 0 hits in `src/`, and
  # forcing it into one of the four canonical categories would be a fake
  # mapping that made the lineage record say something untrue. `OFS-G10` is the
  # tripwire that turns RED if the §10.2 vocabulary is later adopted.
  required_operator_keys:
    - policy.principal-subgraph

# ---------------------------------------------------------------------------
# The L4 operator parameters. ONE entry, so `build_operator_registry` returns a
# one-operator registry — §D.2.
# ---------------------------------------------------------------------------
operators:
  policy.principal-subgraph:
    # The obligor carries the jurisdiction, so the filter reads the attribute
    # the ENTITY holds. There is no per-fact jurisdiction: a financial fact has
    # no nationality of its own, it inherits the filer's.
    classification_attribute_by_class:
      obligor: obligor_jurisdiction

    # THE DEFAULT PRINCIPAL'S EXPANDED GRANT, and it is a DEFAULT rather than
    # the rule. `deployment.py` expands the CALLING principal's prefixes against
    # the jurisdictions the estate actually holds and hands the result to
    # `build_operator_registry` per request — so this list is what the
    # deployment falls back to, never what any principal is held to.
    #
    # Expansion is `= prefix OR LIKE prefix || '-%'`, NOT `LIKE prefix || '%'`.
    # A grant of `US` reaches `US` itself and `US-DE`, and must not reach a
    # jurisdiction that merely starts with those letters.
    #
    # MEASURED CONSEQUENCE — entitlement DISCRIMINATES here, §B.2:
    #     PRIN-RES-002  research-analyst   49 of 50 obligors
    #     PRIN-COV-001  coverage-banker    47 of 50
    #     PRIN-KYC-004  kyc-analyst         0 of 50
    #     PRIN-TRD-003  trader              0 of 50
    # and one obligor — the sole NZ filer — is visible to no principal at all.
    # `OFS-G15` holds all four populations AND `49 != 47`, because two
    # legitimate zeroes are exactly the condition under which a broken check
    # looks correct.
    #
    # AMENDED 2026-10-11 (compatibility repair; examples/AMENDMENTS-2026-10-11.md).
    # This list was a literal the deployment then OVERWROTE per request with the
    # calling principal's expanded grant — an ungoverned write into a resolved
    # Control Plane artifact, which the governed resolver this specimen now
    # serves through does not allow (it resolves operator parameters by key off
    # the booted fabric). The SDK's supported form of exactly that substitution
    # is a request binding (`RequestBoundParameter`, D-IMPL-295): the admitted
    # set is the `jurisdictions` parameter of the governed effective request,
    # which `deployment.read` states from the SAME per-principal expansion it
    # always computed. The literal it replaces was the default principal's
    # expanded grant (US, US-DE, US-FL, US-MD, US-MN, US-NV, US-NY, US-OH,
    # US-TX, US-WA); which obligors each principal sees is unchanged.
    permitted_classifications:
      source: effective_request
      parameter: jurisdictions

# ---------------------------------------------------------------------------
# The request contract — spec §B.4. Checked at the door, before the graph is
# touched, so a question this class does not answer costs nothing.
# ---------------------------------------------------------------------------
request_contract:
  class_id: cp-03.request-contract
  role: register
  registration: typed
  schema_name: credit-risk.spread
  schema_version: "1.0.0"
  arguments:
    properties:
      # AMENDED 2026-10-11 (compatibility repair): `intent` was declared here as
      # an ARGUMENT — a shadow of the request's own top-level `intent` axis,
      # which the SDK refuses at contract construction (D-IMPL-264 D-01; the
      # specimen's recorded Defect A). The top-level `ProductRequest.intent`
      # always carried the same value (`deployment.request` reads both from
      # `artifacts/question.yaml`), so the argument is removed and the axis
      # stands alone. No `discovery.intents` is declared, so — as before —
      # this class does not judge which intent it is asked under.
      periods:
        type: integer
        description: how many periods of history to spread
      basis:
        type: string
        description: >-
          as-reported returns each figure as it was FILED for that period;
          latest-restated returns it as most recently amended. Different numbers
          for the same period, and which is correct depends on the decision.
      include_peers:
        type: boolean
        description: peer comparison at identical period_end, never at identical filing date
      peer_basis:
        type: string
        description: sic or sic-and-size
      debt_tolerance:
        type: number
        description: the ceiling above which assembly refuses with 409 and the debt block
      as_of:
        type: string
        description: DECLARED AND INERT — refused, never honored. See unsupported_arguments.
      # AMENDED 2026-10-11: the binding target above. Stated by the deployment
      # from the calling principal's grant as it expands against the estate,
      # never invented by the caller's tooling.
      jurisdictions:
        type: array
        items:
          type: string
          description: one jurisdiction the request is entitled to read.
        description: >-
          the jurisdictions this request is entitled to read — the calling
          principal's grant, expanded against the estate — and the value that
          reaches the policy operator's admitted set.
    required:
      - debt_tolerance

  # §B.5. Reconstructing a spread as it stood on a past date needs ledger
  # time-travel, which arrives at Tier 3. Refusing loudly is the tier boundary
  # doing its job rather than a gap; `OFS-G06` asserts the refusal.
  unsupported_arguments:
    as_of: >-
      reconstructing the spread as it stood on a past date requires ledger
      time-travel and arrives at Tier 3 with covenant-in-force-as-of. This tier
      serves the spread as it stands, with every figure naming the filing that
      asserted it.

# ---------------------------------------------------------------------------
# L2 entity resolution — one entity class, no relationships. This product has
# no `R` at all, which is what makes it the last rung before the graph.
# ---------------------------------------------------------------------------
resolution:
  entity_rules:
    - match_key: obligor_ref
      # SEC-023 (D-IMPL-372): only the named sources may assert the attribute the Policy operator admits on. A claim from any other source is refused and audited, and without this declaration the deployment refuses to boot.
      attribute_authorities: {obligor_jurisdiction: [financial_fact]}
      entity_class: obligor
      identity_keys:
        - lei
      attribute_keys:
        - cik
        - obligor_legal_name
        - obligor_jurisdiction
        - fiscal_year_end_month
        - latest_filed_date
        - formally_restated
        - spread_periods
        - peer_comparison
  relationship_rules: []

# ---------------------------------------------------------------------------
# Half-life — spec §E.1. PER SIGNAL CLASS, not per product, which is this
# rung's whole subject: a payload mixing an annual with a current quarter
# carries two decay rates at once and a single product-level figure could not
# express it.
# ---------------------------------------------------------------------------
half_life:
  # AMENDED 2026-10-11 (compatibility repair): the clock the
  # `from_entity_freshness` expiry runs from. Before the repair the spine
  # computed `expires_at` itself — the latest `filed_date` in the payload plus
  # the declared window (`artifacts/ttl.yaml`). The governed resolver computes
  # it now, from the freshest `valid_from` on a `decay_basis: valid-from` row
  # keyed by ENTITY CLASS, and the one entity this product mints, `obligor`,
  # carries exactly that instant (its envelope's `observed_time` is the latest
  # filed date). `supersede-only` declares the clock and NO rate: this row adds
  # no half-life, and the debt below still decays per signal class exactly as
  # it did.
  obligor:
    decay: supersede-only
    decay_basis: valid-from
    decay_driver: filing-cadence
    supersession_event: a later filing by the same obligor
  annual_facts:
    half_life_seconds: 31536000      # ~365d — superseded by the next annual filing
    decay_driver: filing-cadence
    supersession_event: new-10-K-accession
  quarterly_facts:
    half_life_seconds: 7776000       # ~90d — superseded by the next quarterly filing
    decay_driver: filing-cadence
    supersession_event: new-10-Q-accession
  # ---------------------------------------------------------------------------
  # THE FOURTH CLASS IS ABSENT, AND ITS ABSENCE IS THE FINDING.
  # ---------------------------------------------------------------------------
  #
  # Spec §E.1 names FOUR signal classes and gives Restatement a `λ_c` of
  # **event-driven** — "rewrites a closed period, the earliest supersession case
  # in the catalog." It commits to no number, because there is no curve: a
  # restatement does not decay, it SUPERSEDES.
  #
  # `src/ccf/controlplane/artifacts.py::HalfLifeEntry` cannot express that.
  # `half_life_seconds` is validated positive — `0` raises
  # `half_life_seconds must be positive` at registration — and
  # `supersession_event` is carried BESIDE a decay curve, never INSTEAD of one.
  # So the SDK's λ_c table can hold a class that decays and supersedes, and has
  # no shape for one that only supersedes.
  #
  # An earlier draft of this file wrote `half_life_seconds: 0` and this
  # deployment could not have booted. The two ways to keep the row were to
  # invent a positive number the spec does not give — a domain value minted by a
  # build, which the No-Hardcoding Rule forbids as firmly in an artifact as in
  # code — or to leave the fabric unable to start. Neither is admissible, so the
  # row is OMITTED and the gap is recorded.
  #
  # NOTHING IS SILENTLY LOST. No observation is typed `restatement`: a restated
  # cell decays against the class of the PERIOD it belongs to (`annual_facts` or
  # `quarterly_facts`), which is the rate at which that figure actually goes
  # stale. What restatement contributes to `D_c` is §E.2's "restatement pending"
  # row — a penalty on `F`, not a λ_c lookup — and that is a separate mechanism.
  #
  # RECORDED AS AN SDK-SURFACE FINDING for spec §F.4, owner Dave. It is the
  # fifth SDK-side finding of Phase 24 and it is ALGEBRA rather than seam
  # ergonomics — the table cannot say a thing the specification says — which is
  # what `D-05` reads for drift. It is raised here, NOT resolved here.
  peer_set:
    half_life_seconds: 15552000      # ~180d — drifts as filers change SIC or exit
    decay_driver: cohort-drift
    supersession_event: sic-reclassification

debt_profile:
  risk_sensitivity: "1.0"
  forced_llm_threshold: "0.60"
  fail_closed_threshold: "0.77"

policy:
  class_id: cp-03.policy-bundle
  role: register
  registration: typed
  regime: obligor-financial-spread-entitlement

default_perspective:
  principal_id: PRIN-COV-001
  role: analyst

# ---------------------------------------------------------------------------
# AMENDED 2026-10-11 — compatibility repair (Dave, ruling 3 of 2026-10-11 16:23
# MST; examples/AMENDMENTS-2026-10-11.md). Two declarations the SDK now
# requires of every governed serve; neither changes the question, a
# parameter, the TTL, the debt arithmetic or the expected answer.
#
# `temporal_boundary:` — D-IMPL-358 ruling 11: a tenant that declares no
# boundary refuses every question. hw1-companies-over-revenue's precedent
# values.
#
# `demonstration_serve_instant:` — D-IMPL-378 C1, ruled option (b). This
# specimen's question is DATED (asked as of 2026-08-29T12:00Z), and before the
# repair the spine judged its gates at that same instant. The governed resolver
# judges them at its serve clock, so the dated scenario keeps its meaning only
# if the serve clock is declared to be the question's own instant. Honored only
# on the SDK's own development backends (this specimen's per-run SQLite graph
# and file-backed store) and pinned into dimension 2 of every record made
# under it. It moves `served_at` and nothing else: no observation is relabeled,
# no expiry check is disabled, no limit is widened.
#
# **Illustrative calibration:** This example runs against a point-in-time
# demonstration estate rather than continuously refreshed production data.
# Freshness half-lives and related thresholds are calibrated to make the
# governed behavior observable in that snapshot. They demonstrate how the SDK
# applies these controls and should not be interpreted as recommended
# production coverage-policy thresholds.
# ---------------------------------------------------------------------------
temporal_boundary:
  max_past_seconds: 3600
  permitted_clock_skew_seconds: 0

demonstration_serve_instant:
  serve_instant: "2026-08-29T12:00:00+00:00"
