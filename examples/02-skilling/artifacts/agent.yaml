# Skilling-example agent definition — a declared, versioned Control Plane
# artifact (CLAUDE.md §6.1/§6.2; D-IMPL-28). Clinical-trials-operations
# domain, D-IMPL-52.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: tenant, agent name, scope identifiers, product-class names,
# role/selection values, threshold values. [MECHANISM]: the six axis field
# names (`archetypes`, `context_contract`, `perspective`, `policy_regime`,
# `halflife_debt_profile`, `instruction_bindings`), `referenced_artifacts`
# structure, `skill_governance` envelope field names, `ref` URI scheme.
#
# The axis-4 policy regime below carries the D-IMPL-29 `skill_governance`
# envelope this example exercises: `permitted_scopes` names the ONE
# requirement scope agents under this regime may bind (`enrollment-read`)
# and deliberately excludes `protocol-write` — which is why the second
# grant in run.py is refused by the tier-1 compatibility check. The
# envelope's field names are mechanism schema; every scope identifier is
# this deployment's statement, never the SDK's (§6.4).
#
# This definition NEVER CHANGES during the example: skilling is channel 2 —
# capability changes travel through the Control Plane grant ledger, not
# through agent re-declaration (§6.2). run.py asserts the file is
# byte-identical before and after the grant/exercise/revoke cycle.

keys:
  agent_definition: helix-trials/agents/enrollment-analytics

referenced_artifacts:
  policy_regime:
    key: helix-trials/policy-bundle/trial-operations-regime
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: trial-operations-regime
      permitted_classifications: [internal]
      skill_governance:
        permitted_scopes: [enrollment-read]
        grant_requires_approval: false
  halflife_debt_profile:
    key: helix-trials/debt-profile/enrollment-review
    class_id: debt-profile
    semver: "1.0.0"
    declaration:
      review_cycle: weekly
      risk_sensitivity: "1.0"
      forced_llm_threshold: "0.40"
      fail_closed_threshold: "0.80"

agent_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: enrollment-analytics
  tenant: helix-trials

  # axis 1 — ordered archetype list (D-IMPL-19)
  archetypes: [analytics_insights]

  # axis 2 — context contract: the product class this fabric serves. The
  # permitted skill's required_context_products must be a subset of this
  # (tier 1); the impermissible skill's required scopes exceed axis 4.
  context_contract:
    consumes:
      - product_class: helix-trials.enrollment-summary
        schema_version: "1.0.0"

  # axis 3 — perspective (Π role-conditioning)
  perspective:
    role: trial-operations-analyst
    selection_params:
      protocol_arm: arm-a

  # axis 4 — policy regime (versioned-URI ref, never inline)
  policy_regime:
    ref: "ccf-artifact://helix-trials/policy-bundle/trial-operations-regime@1.0.0"

  # axis 5 — half-life and debt profile (versioned-URI ref)
  halflife_debt_profile:
    ref: "ccf-artifact://helix-trials/debt-profile/enrollment-review@1.0.0"

  # axis 6 — instruction bindings: an empty list is an allowed author
  # statement (this agent's run needs no prompt artifact; example 01
  # demonstrates a populated axis 6).
  instruction_bindings: []
