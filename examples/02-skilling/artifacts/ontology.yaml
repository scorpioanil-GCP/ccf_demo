# Skilling-example ontology — the deployment's declared vocabulary
# (clinical-trials-operations domain, D-IMPL-52). Everything in this file is
# a *value*: entity classes, relationship types, attribute names,
# identifiers. None of it exists in `/src`, and none of it exists in
# `run.py` (CLAUDE.md §6.4 No-Hardcoding Rule).
#
# Authored fresh for this example; it mirrors the *shape* the assembly
# worker accepts (whitepaper §7.3), never the content of any test fixture
# or earlier example.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: tenant_id, entity classes, relationship types, attribute names.
# [MECHANISM]: `entity_rules`, `relationship_rules`,
# `classification_attribute_by_class` and their inner field names.

schema_version: "1.0.0"
artifact_version: "1.0.0"

tenant_id: helix-trials

entity_rules:
  - match_key: site_ref
    entity_class: trial_site
    identity_keys: [site_ref]
    attribute_keys:
      - site_name
      - country
      - site_classification

  - match_key: cohort_ref
    entity_class: enrollment_cohort
    identity_keys: [cohort_ref]
    attribute_keys:
      - protocol_arm
      - enrollment_status
      - cohort_classification

relationship_rules:
  - relationship_type: enrolls_at
    subject_entity_class: enrollment_cohort
    object_entity_class: trial_site

classification_attribute_by_class:
  trial_site: site_classification
  enrollment_cohort: cohort_classification
