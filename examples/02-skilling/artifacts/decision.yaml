# This decision's inputs (clinical-trials-operations domain, D-IMPL-52).
#
# Explicit inputs, never clock reads: the example is replayable precisely
# because these are data. `now` is also the injected clock the Control Plane
# registry and the grant ledger record their audit timestamps from, which is
# what makes the audited grant lifecycle reproducible.
#
# **Not named by the manifest**, unlike example 01's equivalent. The injected
# clock is a *constructor* argument to the Control Plane registry, and the
# registry is in turn an argument to `load_and_boot` — so this document has to
# be read one line before the manifest is. It goes through the same
# `load_artifact` seam either way. Had it been in the manifest it would have
# been `role: load`: what instant one run asked about is not part of what the
# fabric was permitted to do.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and both instants are [ADAPT]; the keys `semver`,
# `class_id` and `declaration` are [MECHANISM]. Every timestamp states its zone
# — the loader refuses a zone-less one rather than guessing (D-IMPL-38).

semver: "1.0.0"
class_id: helix-trials.decision-inputs

declaration:
  temporal_boundary: 2026-04-20T09:00:00Z
  now: 2026-04-20T09:00:02Z
