# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# The remaining governance values this deployment puts in force
# (clinical-trials-operations domain, D-IMPL-52).
#
#   * `max_ttl_seconds` — the per-class TTL ceiling (INV-CH7-48, D-IMPL-39).
#     MAX_TTL has no SDK default. `run.py` registers this number as a typed
#     `MaxTTL` to MINT the pin `register_product_class` needs, which is what
#     leaves Gate 3 something real to compare against `product_ttl_seconds`.
#   * `product_ttl_seconds` — a SEPARATELY authored number, on purpose.
#   * `plan_id` — the projection's identity, carried into replay dimension 5.
#   * `replay_record_class` — the artifact class the replay writer stores under.
#
# **No `similarity_index_version` here**, because this deployment registers no
# similarity operator. The builder refuses one supplied without the artifact it
# would version — an unowned corpus identity is not a harmless extra.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: helix-trials.product-governance

declaration:
  max_ttl_seconds: 1200
  product_ttl_seconds: 900
  plan_id: helix-trials.enrollment-summary.plan
  replay_record_class: decision-replay-record
