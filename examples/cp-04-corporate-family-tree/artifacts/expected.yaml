# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# WHAT THE SERVED PRODUCT SHOULD CONTAIN, DECLARED — the strong form of the
# obligation.
#
# **THIS DOCUMENT DERIVES NOTHING FROM A RUN.** There is no regeneration target
# and none will be added. If the artifacts change, run the example's test suite,
# review the failure, then deliberately edit this file to match what you
# reviewed, IN THE SAME COMMIT as the change. That is what makes an
# expected-output change an edit to a REVIEWED ARTIFACT rather than a refreshed
# transcript.
#
# **It also exists so the test modules have a source for their expectations
# OTHER THAN THEMSELVES.** A number a test authored would be the test agreeing
# with itself about what the estate holds.
#
# ==========================================================================
# WHO OWNS WHICH HALF OF THIS DOCUMENT, AND WHY IT IS REOPENED LATER
# ==========================================================================
#
# **WAVE 3 (plan `24.4-03`) OWNS EXACTLY TWO THINGS HERE:** the contract
# envelope and payload key rosters, the `census:` block carrying every figure of
# ROADMAP criteria 3 through 18, and the `wrong_methods:` block. Nothing else.
#
# **WAVE 5 (plan `24.4-07`) REOPENS THIS FILE AND APPENDS.** The values it adds
# are the ones only wave 5 can know — the roster of the twenty unresolved
# SMCI-subtree members, and the class that explains the `CFT-G16` perspective
# difference. **The append is ADDITIVE: plan 07 rewrites no key authored here.**
# Said out loud so a later reader meets the append as ownership rather than as
# drift.
#
# **THIS FILE CARRIES EXPECTED VALUES ONLY AND IS NOT WIDENED TO CARRY GATE
# ROSTERS** (criterion 44). The sixteen `CFT-G` ids live as DATA in
# `artifacts/gates.yaml` under a closed schema, and the specification's §G.2
# prose table is the machine source for nothing at all. Two documents, two
# subjects: what the product should CONTAIN is here, what must be OBSERVED RED
# is there.
#
# **AND THERE IS NO CONTENT ADDRESS IN HERE.** A `payload_hash` authored here
# would be a transcript of a run — which is what this document exists NOT to be
# — or the suite agreeing with itself. The hash belongs to the test's own
# comparison: two runs of the same question, compared to each other.
#
# **EVERY CENSUS FIGURE NAMES THE SECTION OF `24.4-MEASUREMENT.md` IT WAS
# TRANSCRIBED FROM.** Not one is authored from memory and not one is copied out
# of the specification — the specification was itself authored from that
# document, so copying from it would be a second-hand number wearing a
# first-hand citation.
#
# `role: load`. An expectation is not something the fabric is permitted to do.

semver: "1.0.0"
class_id: cp-04.expected

declaration:
  # --- The contract envelope. Follows from §B.1 and `ccf_config.yaml`. ------
  product: reference.corporate-family
  semantic_version: "1.0.0"
  assembly_mode: 1
  determinism_class: deterministic
  ttl_anchor: from_entity_freshness
  ttl_basis: latest_family_edge_assertion_time_in_payload
  declared_ttl_seconds: 86400

  # --- The payload's shape — §D.6's emitted contract. ----------------------
  #
  # KEYS, not values. What the product is addressed by is its payload, so a
  # value written here would be a second place to change one fact.
  payload_keys_always_present:
    - anchor
    - nodes
    - edges
    - findings
    - max_depth_applied

  anchor_keys_always_present:
    - uri
    - lei
    - label
    - type_chain

  node_keys_always_present:
    - uri
    - lei
    - label
    - type_chain
    - depth
    - attributes

  edge_keys_always_present:
    - parent
    - child
    - predicate

  # ORTHOGONAL TO `nodes`, and that orthogonality is the shape rather than a
  # convention: a cycle is A SET PLUS THE EDGE THAT CLOSES IT, never a bit on a
  # node. Flattening it onto the nodes destroys the closing edge while every
  # node count stays right, which is why the sabotage for `CFT-G08` is exactly
  # that flattening.
  finding_keys_always_present:
    - type
    - predicate
    - members
    - closing_edge

  # THE NULLABILITY SPLIT IS THIS PRODUCT'S SUBJECT, NOT A DETAIL. 606 of 748
  # family nodes have no attribute row. A member with no row is a member.
  nullable_node_keys:
    - lei
    - label
    - attributes

  non_nullable_node_keys:
    - uri
    - type_chain
    - depth

  lineage_keys_always_present:
    - operators_invoked
    - graph_snapshot_at
    - ledger_t
    - policy_version
    - projection_plan_id
    - context_debt
    - payload_hash

  # EXACTLY TWO, and lineage strict equality is why the number is assertable
  # rather than approximate. Six of the ten §D steps declare `operator: null`
  # and one declares a Standard name against a mechanism that is not a
  # registered operator; none of the seven enters this list.
  operators_invoked_expected:
    - policy.principal-subgraph
    - traversal.typed-neighborhood

  # `graph_snapshot_at` IS A `datetime` AND `ledger_t` IS AN `int`. Two fields
  # describing two axes, and one cannot carry the other (§B.1.1). Declared here
  # because the temptation to collapse them is specific and was struck by name.
  lineage_field_types:
    graph_snapshot_at: datetime
    ledger_t: integer

  # ========================================================================
  # THE CENSUS — every figure of ROADMAP criteria 3 through 18.
  # ========================================================================
  #
  # Each block names its criterion and the section of `24.4-MEASUREMENT.md` the
  # figure was transcribed from. Read at `ledger_t = 5112` on 2026-08-31, in one
  # pass that read `ledger_t` ONCE at its start — a per-query read lets the
  # anchor drift inside a single pass and leaves no way to tell which figure was
  # read against which state.
  #
  # THE FIXTURE REPRODUCES ALL OF THEM. Every figure below was re-measured
  # against the committed fixture seeded into a local `fluree/server:4.1.4` and
  # a local `postgres:16`, twice, into two ledgers and two schemas. All 32
  # measured figures agreed on both runs, and two planted defects each moved a
  # DIFFERENT subset — 14 figures and 9 figures — so the comparison
  # discriminates rather than merely reacting.
  census:
    ledger_t_read_at: 5112
    measured_on: "2026-08-31"

    # --- Criterion 3 -----------------------------------------------------
    family_predicate_triples:
      criterion: 3
      source: "24.4-MEASUREMENT.md :: Criterion 3 — the six predicate counts"
      # ENUMERATED, NEVER AGGREGATED. Over this ledger the aggregate forms
      # invent phantoms: `COUNT(DISTINCT ?p)` returns 178 and `GROUP BY ?p`
      # returns 198 where `SELECT DISTINCT ?p` returns 171, which is correct.
      # Row count and distinct-pair count agree for every predicate below, so
      # no count is inflated by a duplicated triple.
      owns: 636
      isDirectlyConsolidatedBy: 140
      isUltimatelyConsolidatedBy: 140
      hasGlobalUltimateParent: 103
      hasDomesticUltimateParent: 36
      controls: 3

    # SEVEN OTHER RELATIONSHIP PREDICATES EXIST IN THIS LEDGER AND ARE
    # DELIBERATELY EXCLUDED. Named so the exclusion is a roster rather than an
    # implication, and so `CFT-G02`'s sabotage — admit a seventh — has a
    # declared population to draw from.
    predicates_deliberately_excluded:
      criterion: 3
      source: "24.4-MEASUREMENT.md :: Query surface, stated once; spec §C.5"
      names:
        - hasSubsidiary
        - hasBeneficialOwner
        - isBeneficialOwnerOf
        - ownershipIn
        - hasOwnershipPercentage
        - isDirectorOf
        - isOfficerOf
      distinct_predicates_in_ledger: 171

    # --- Criterion 4 -----------------------------------------------------
    normalization:
      criterion: 4
      source: "24.4-MEASUREMENT.md :: Criterion 4 — 1,058 raw triples, 722 normalized edges, a 336-triple collapse"
      # THE COLLAPSE MUST BE VISIBLE RATHER THAN HIDDEN. 1,058 raw triples are
      # 722 distinct parent->child edges: six predicates routinely assert the
      # SAME parent-child pair, so a build reporting 1,058 edges is reporting
      # assertions and calling them relationships.
      raw_family_triples: 1058
      distinct_normalized_edges: 722
      collapse: 336

    # --- Criterion 5 -----------------------------------------------------
    graph:
      criterion: 5
      source: "24.4-MEASUREMENT.md :: Criterion 5 — 748 nodes, 83 roots"
      distinct_nodes: 748
      roots: 83

    # --- Criterion 6 -----------------------------------------------------
    #
    # DIRECTION IS ASSERTED PER PREDICATE, AND A COUNT IS BLIND TO AN ARROW.
    # The reading below is a claim about each predicate's semantics, and the
    # flip table under it is what makes the claim falsifiable: reversing ANY ONE
    # of the six moves the root count off 83. A product that reported 722 edges
    # and 83 roots with one arrow backwards would look right on both figures.
    edge_direction:
      criterion: 6
      source: "24.4-MEASUREMENT.md :: Criterion 6 — direction is asserted per predicate"
      reading:
        owns: subject_to_object
        controls: subject_to_object
        isDirectlyConsolidatedBy: object_to_subject
        isUltimatelyConsolidatedBy: object_to_subject
        hasGlobalUltimateParent: object_to_subject
        hasDomesticUltimateParent: object_to_subject
      basis:
        owns: FIBO `owns` runs parent -> child
        controls: the validator's explicit negative control against a blanket flip
        isDirectlyConsolidatedBy: the subject is the subsidiary
        isUltimatelyConsolidatedBy: the subject is the subsidiary
        hasGlobalUltimateParent: "`rdfs:range GlobalUltimateParent` — the object is the parent"
        hasDomesticUltimateParent: same as hasGlobalUltimateParent

    # EDGES AND ROOTS AFTER FLIPPING EACH PREDICATE, ONE AT A TIME. Every one
    # moves the root count, including `controls` — three edges, and flipping it
    # still moves the count by one, which is what makes a three-edge predicate
    # worth asserting rather than rounding away.
    edge_direction_flipped:
      criterion: 6
      source: "24.4-MEASUREMENT.md :: Criterion 6 — the flip table"
      owns: {edges: 825, roots: 391}
      controls: {edges: 722, roots: 82}
      isDirectlyConsolidatedBy: {edges: 841, roots: 59}
      isUltimatelyConsolidatedBy: {edges: 841, roots: 59}
      hasGlobalUltimateParent: {edges: 825, roots: 59}
      hasDomesticUltimateParent: {edges: 756, roots: 69}

    # --- Criterion 7 -----------------------------------------------------
    lei_coverage:
      criterion: 7
      source: "24.4-MEASUREMENT.md :: Criterion 7 — 181 of 748 carry `ex:lei`, 142 resolve"
      family_nodes: 748
      nodes_carrying_lei: 181
      distinct_lei_values: 181          # 1:1 — no node carries two, no LEI is shared
      resolving_in_legal_entity: 142
      # THE POPULATION CONTROL, AND IT IS THE HAZARD THIS ESTATE HAS ALREADY
      # PRODUCED ONCE. The same 181 LEIs measured against `crosswalk` — the
      # decoy of §C.4 trap 4 — give 39: a real number about the wrong thing,
      # which survives re-checking. 142 and 39 are far enough apart that a check
      # reading the wrong table cannot report the right answer by accident.
      resolving_in_crosswalk_decoy: 39
      correct_table: legal_entity
      decoy_table: crosswalk

    # --- Criterion 8 -----------------------------------------------------
    anchor:
      criterion: 8
      source: "24.4-MEASUREMENT.md :: Criterion 8 — the anchor"
      uri: "http://example.org/fibo/SuperMicroComputerInc"
      lei: "54930022CZO1N2UGVW07"
      label: "SUPER MICRO COMPUTER, INC."
      type_chain_length: 7
      type_chain:
        - Corporation
        - FormalOrganization
        - LegalEntity
        - LegalPerson
        - Organization
        - Agent
        - Party

    # --- Criterion 9 -----------------------------------------------------
    #
    # THE ROSTER, NOT ONLY THE CARDINALITY. A right count with a wrong member
    # audits clean forever.
    #
    # AND THE ROSTER IS WHAT CATCHES A PLAUSIBLE-LOOKING PREFIX BUG. TWO of the
    # seventeen stubs carry a lower-case `micro` — `SubSupermicroKk` and
    # `SubSupermicroTechnologyBeijingCoLtd` — so a classifier matching
    # `SubSuperMicro` rather than `Sub` finds FIFTEEN and reports a
    # clean-looking count. The classification below matches on the `Sub` prefix.
    anchor_direct_children:
      criterion: 9
      source: "24.4-MEASUREMENT.md :: Criterion 9 — SMCI's 19 direct children, as a ROSTER"
      total: 19
      exhibit_21_stub_count: 17
      exhibit_21_stubs:
        - SubSuperMicroAsiaScienceAndTechnologyParkInc
        - SubSuperMicroComputerArabiaLtd
        - SubSuperMicroComputerBV
        - SubSuperMicroComputerGmbh
        - SubSuperMicroComputerHoldingsBV
        - SubSuperMicroComputerIncTaiwan
        - SubSuperMicroComputerInternationalInc
        - SubSuperMicroComputerKoreaYh
        - SubSuperMicroComputerLimited
        - SubSuperMicroComputerMalaysiaSdnBhd
        - SubSuperMicroComputerSRL
        - SubSuperMicroComputerSarl
        - SubSuperMicroComputerSingaporePteLtd
        - SubSuperMicroComputerSpainSL
        - SubSuperMicroComputerUsLlc
        - SubSupermicroKk
        - SubSupermicroTechnologyBeijingCoLtd
      non_stub_children:
        - SuperMicroComputerBV
        - CycMeridianHoldingsSa

    # PER-PREDICATE CHILD COUNTS FROM THE ANCHOR, all measured. Recorded here
    # because one of them is the whole reason criterion 19's control is a real
    # control: SMCI has EXACTLY ONE `isDirectlyConsolidatedBy` edge, not zero.
    # An earlier draft asserted zero — written from the shape of the argument
    # rather than from a query — and had it stood, that control would have been
    # an EMPTY WALK asserting no cycle, which is a control that cannot fail.
    anchor_children_by_predicate:
      criterion: 9
      source: "24.4-MEASUREMENT.md :: Appendix A — the correction made inside the pass"
      owns: 19
      isDirectlyConsolidatedBy: 1
      isUltimatelyConsolidatedBy: 1
      hasGlobalUltimateParent: 1
      controls: 0
      hasDomesticUltimateParent: 0

    # --- Criterion 10 ----------------------------------------------------
    #
    # THE SAME COMPANY ENTERED TWICE, ONE HOP FROM THE ANCHOR. The product
    # SURFACES THE PAIR rather than silently serving both as distinct
    # subsidiaries — a family that double-counts a subsidiary is a concentration
    # denominator that is wrong in the safe-looking direction.
    duplicate_entity_pair:
      criterion: 10
      source: "24.4-MEASUREMENT.md :: Criterion 10 — the same company entered twice"
      members:
        - uri: SuperMicroComputerBV
          lei: "549300F16C4PEFXU0S92"
          label: "SUPER MICRO COMPUTER B.V."
          type_chain_length: 7
        - uri: SubSuperMicroComputerBV
          lei: null
          label: "Super Micro Computer B.V"
          type_chain_length: 7

    # --- Criterion 11 ----------------------------------------------------
    anchor_subtree:
      criterion: 11
      source: "24.4-MEASUREMENT.md :: Criterion 11 — the SMCI subtree: 22 nodes, max depth 3"
      reachable_nodes: 22            # the anchor itself included
      maximum_depth: 3
      depth_to:
        CycMeridianHoldingsSa: 1
        CycCalderIndustrialNv: 2
        CycThornburyCapitalLtd: 3
      # THE ARITHMETIC THE MEASUREMENT SECTION STATES IN PLACE: 19 direct
      # children + the anchor = 20 at depth 1; + Calder = 21 at depth 2;
      # + Thornbury = 22 at depth 3. THREE DEPTHS, THREE DIFFERENT ANSWERS,
      # and therefore three content addresses — which is the material
      # `CFT-G05` needs to be non-vacuous.
      nodes_reached_by_depth:
        1: 20
        2: 21
        3: 22
      # THE WALK IS CYCLE-SAFE. A node already assigned a depth is never
      # re-queued, so the walk TERMINATES INSIDE CYCLE 1 rather than running
      # forever. A detector that cannot terminate fails closed.
      walk_is_cycle_safe: true

    # --- Criterion 12 ----------------------------------------------------
    #
    # THE MULTI-STORE SPLIT MADE VISIBLE ON ONE SMALL SUBTREE: the tree is
    # Fluree's, the attributes are PostgreSQL's, and 20 of 22 members have no
    # attribute row at all. That is exactly the population `CFT-G09` protects.
    anchor_subtree_store_split:
      criterion: 12
      source: "24.4-MEASUREMENT.md :: Criterion 12 — the subtree's store split"
      subtree_nodes: 22
      nodes_carrying_lei: 2
      of_those_resolving_in_legal_entity: 2
      nodes_with_no_postgres_row: 20
      the_two_resolving:
        - uri: SuperMicroComputerInc
          lei: "54930022CZO1N2UGVW07"
        - uri: SuperMicroComputerBV
          lei: "549300F16C4PEFXU0S92"

    # --- Criterion 13 ----------------------------------------------------
    #
    # PHRASED AS "DEPTH 6, WHICH `PSC-0124` ATTAINS", NEVER AS "THE DEEPEST ROOT
    # IS `PSC-0124`". The second asserts a uniqueness this estate does not
    # carry: SEVEN roots attain depth 6, and nothing distinguishes `PSC-0124`
    # among them — six of the seven span 7 nodes and `PSC-0037` spans 11, so it
    # is not even the largest. Recorded at spec §F.4 finding 7 and raised to
    # Dave rather than smoothed.
    deepest_tree:
      criterion: 13
      source: "24.4-MEASUREMENT.md :: Criterion 13 — the deepest tree in the estate is depth 6"
      maximum_depth_anywhere: 6
      roots_attaining_it: 7
      roots_attaining_it_roster:
        - PSC-0018
        - PSC-0037
        - PSC-0053
        - PSC-0089
        - PSC-0124
        - PSC-0140
        - PSC-0153
      psc_0124_attains_it: true
      psc_0124_is_unique: false
      root_depth_distribution:
        1: 33
        2: 18
        3: 13
        4: 11
        5: 1
        6: 7

    # --- Criterion 14 ----------------------------------------------------
    cycles:
      criterion: 14
      source: "24.4-MEASUREMENT.md :: Criterion 14 — exactly two cycles, both wholly inside `owns`"
      distinct_cycles: 2
      all_wholly_inside_owns: true
      cycle_edges: 6
      # ALL SIX CYCLE EDGES ARE PRESENT IN THE `owns` ENUMERATION READ
      # SUBJECT->OBJECT, and ZERO are contributed by any of the other five
      # predicates in either direction.
      cycle_edges_contributed_by_other_predicates: 0

      # ==================================================================
      # THE ROSTER ORDER IS A CONVENTION, AND IT SHIPS WITH THE DETECTOR
      # ==================================================================
      #
      # Criteria 15 and 16 assert EXACT ORDERED rosters. The same circuit
      # entered from a different node is the same SET in a different ORDER, so
      # the ordering convention has to be PINNED or the roster assertion is
      # unstable across runs — and A CORRECT DETECTOR USING A DIFFERENT ROTATION
      # WOULD FAIL A CORRECT ASSERTION.
      #
      # The convention: ROTATE EACH CIRCUIT TO START AT ITS LEXICOGRAPHICALLY
      # SMALLEST MEMBER. Stated at spec §C.4 trap 5 and §D.2.2 and carried here
      # so the shipped detector INHERITS it rather than rediscovering it.
      roster_order_convention: rotate_to_lexicographically_smallest_member

    # --- Criterion 15 ----------------------------------------------------
    cycle_1:
      criterion: 15
      source: "24.4-MEASUREMENT.md :: Criterion 15 — cycle 1's roster and closing edge"
      type: ownership_cycle
      predicate: owns
      members:
        - CycCalderIndustrialNv
        - CycThornburyCapitalLtd
        - CycMeridianHoldingsSa
      closing_edge:
        - CycMeridianHoldingsSa
        - CycCalderIndustrialNv
      member_iris:
        - "http://example.org/fibo/CycCalderIndustrialNv"
        - "http://example.org/fibo/CycThornburyCapitalLtd"
        - "http://example.org/fibo/CycMeridianHoldingsSa"

    # --- Criterion 16 ----------------------------------------------------
    #
    # CYCLE 2 IS NOT THE HEADLINE AND THE REASON IS MEASURED RATHER THAN
    # EDITORIAL: it has ZERO external in-edges, so no walk from any LEI-bearing
    # anchor can reach it. That same measurement is why the withdrawn
    # `CFT-G17` could never have fired on it.
    cycle_2:
      criterion: 16
      source: "24.4-MEASUREMENT.md :: Criterion 16 — cycle 2's roster, closing edge, and zero external in-edges"
      type: ownership_cycle
      predicate: owns
      members:
        - CycHarborstoneKy
        - CycLindenfeldGmbh
        - CycPahangPteLtd
      closing_edge:
        - CycPahangPteLtd
        - CycHarborstoneKy
      external_in_edges: 0

    # --- Criterion 17 ----------------------------------------------------
    #
    # EXACTLY ONE, NOT ONE OF SEVERAL. The anchor's reach into cycle 1 is THE
    # only path from the LEI-bearing population into either cycle in the whole
    # 722-edge graph.
    external_edges_into_any_cycle:
      criterion: 17
      source: "24.4-MEASUREMENT.md :: Criterion 17 — exactly one external edge into any cycle"
      count: 1
      edge:
        parent: SuperMicroComputerInc
        child: CycMeridianHoldingsSa
      into_cycle_1: 1
      into_cycle_2: 0

    # --- Criterion 18 ----------------------------------------------------
    #
    # SCOPE NOTE, CARRIED FORWARD RATHER THAN DROPPED. Criterion 18 was AMENDED
    # 2026-08-31 (Dave): its trailing clause — *"so a type-constrained walk
    # demonstrably behaves differently on each"* — is STRUCK along with ontology
    # role 1. The SURVIVING half is the 7-versus-5 fact below and it is still
    # asserted. Nothing about admitted sets, class boundaries, off-ontology
    # neighbors or a stopped-at node is expected anywhere in this document.
    cycle_member_typing:
      criterion: 18
      source: "24.4-MEASUREMENT.md :: Criterion 18 — no LEI on any cycle member; 7 classes versus 5"
      all_members_carry_no_lei: true
      cycle_1_type_chain_length: 7
      cycle_2_type_chain_length: 5
      per_member:
        CycCalderIndustrialNv: {cycle: 1, lei: null, type_chain_length: 7}
        CycThornburyCapitalLtd: {cycle: 1, lei: null, type_chain_length: 7}
        CycMeridianHoldingsSa: {cycle: 1, lei: null, type_chain_length: 7}
        CycHarborstoneKy: {cycle: 2, lei: null, type_chain_length: 5}
        CycLindenfeldGmbh: {cycle: 2, lei: null, type_chain_length: 5}
        CycPahangPteLtd: {cycle: 2, lei: null, type_chain_length: 5}

  # ========================================================================
  # THE WRONG METHODS — the three method controls of criteria 21, 22 and 23.
  # ========================================================================
  #
  # **WHY THESE NUMBERS ARE HERE AND NOT IN A TEST MODULE.** Plan `24.4-05`
  # builds the three controls and is told the wrong results are declared HERE,
  # never authored there. Had this document not carried them, the control module
  # would have authored its own expectations and criterion 24 would have become
  # a test checking its own literals — which is the same vacuity as a check that
  # reads a token present in both the compliant and the violating case.
  #
  # **CRITERION 24 IS THE SUBJECT.** Each control must assert BOTH its specific
  # wrong result AND the failure. Asserting only "this fails" keeps passing
  # after the method stops producing a wrong answer; asserting only the number
  # does not prove the control still discriminates.
  #
  # **THE THREE `yields` ARE PAIRWISE DISTINCT AND NONE EQUALS THE CENSUS FIGURE
  # ITS CONTROL IS A CONTROL ON.** Both properties are asserted by parsing this
  # file, not by reading it.
  #
  # Every `yields` is transcribed from `24.4-MEASUREMENT.md`. The shape follows
  # rung 03's `tests/examples/fixtures/cp_03_census_expected.yaml`.
  wrong_methods:
    unnormalized_graph:
      criterion: 21
      source: "24.4-MEASUREMENT.md :: Appendix A — the detector over the RAW 1,058 triples"
      description: >-
        the cycle detector run over the RAW 1,058 family triples read
        subject->object — 825 distinct pairs — instead of over the 722
        normalized parent->child edges.
      yields: 130
      controls_census_figure:
        name: census.cycles.distinct_cycles
        value: 2
      hides: >-
        the per-predicate direction entirely. Reading all six predicates
        subject->object turns every consolidation and ultimate-parent edge
        backwards, and the resulting graph carries 130 circuits where the family
        graph carries 2. The gap is what makes this control able to
        DISCRIMINATE rather than merely able to differ.

    inverted_ultimate_parent:
      criterion: 22
      source: "24.4-MEASUREMENT.md :: Criterion 6 flip table; Appendix A row 22"
      description: >-
        `hasGlobalUltimateParent` read subject->object instead of
        object->subject — one predicate reversed, the other five left correct.
      yields: 59
      controls_census_figure:
        name: census.graph.roots
        value: 83
      hides: >-
        an inverted arrow behind a plausible edge count. The flip leaves 825
        edges where the correct reading gives 722, and both look like reasonable
        graph sizes — so a check that counted edges, or counted nodes, would
        report clean. Only the ROOT count moves decisively, 83 to 59, which is
        why criterion 6 asserts the arrow per predicate rather than trusting a
        total.

    roster_blind:
      criterion: 23
      source: "24.4-MEASUREMENT.md :: Criterion 14 (the count) and Criterion 15 (the roster it accepts)"
      description: >-
        asserting `len(findings) > 0` against a detector that returns the RIGHT
        NUMBER of cycles with a WRONG three-member roster on cycle 1.
      # THE NUMBER THE ROSTER-BLIND ASSERTION REPORTS IS THE RIGHT ONE, AND THAT
      # IS THE WHOLE POINT. The substituted detector still returns two findings,
      # so `len(findings) > 0` passes and so would `len(findings) == 2`. What
      # fails is the EXACT ORDERED ROSTER. A right count with a wrong member
      # audits clean forever.
      yields: 2
      controls_census_figure:
        name: census.cycle_1.members length
        value: 3
      hides:
        wrong_roster_accepted:
          - CycCalderIndustrialNv
          - CycThornburyCapitalLtd
          - CycHarborstoneKy
        explanation: >-
          cycle 1's third member replaced by a cycle-2 member. Same length,
          same first two names, same finding count, and a circuit that does not
          exist in the graph at all — `CycHarborstoneKy` has zero external
          in-edges and is unreachable from this anchor. A roster-blind assertion
          accepts it; the exact-roster assertion of `CFT-G07` does not.
