  # ---- The class `CFT-G16` must NAME (criterion 40) -----------------------
  #
  # **THE ONE FIBO CLASS BOTH DECLARED PERSPECTIVES CONDITION ON**, declared by
  # IRI at `artifacts/source-vocabulary.yaml::perspective_conditioning
  # .class_axis_iri` and named here by its local name, the census vocabulary.
  #
  # **ONE CLASS, TWO SIDES — not two independent predicates**, and that is what
  # lets the gate fail. The credit officer's view details the members that CARRY
  # it; the KYC analyst's details the members that do NOT. Measured over the
  # 22-node subtree: **22 detailed for `credit-officer` and 0 for
  # `kyc-analyst`**, from one class read off the `type_chain` the graph carries.
  # So ONE mutation to ONE node's chain moves that node in BOTH views, in
  # opposite directions — which a hand-written role map keyed by entity name
  # cannot reproduce, and which is the substitution `CFT-G16` is sabotaged with.
  #
  # **THE POPULATION IS CLASS-HOMOGENEOUS AND THAT IS MEASURED.** All 22 nodes
  # carry the IDENTICAL 7-class chain, so no class discriminates BETWEEN
  # members — the same measured property that withdrew ontology role 1 and the
  # seventeenth gate with it (criterion 41). What the two roles differ by is
  # therefore the class's presence on ALL of them, which is a difference between
  # VIEWS and not a difference between members. Recorded plainly rather than
  # implied.
  #
  # THE WITHDRAWN ID IS DELIBERATELY NOT WRITTEN HERE.
  # `tests/examples/test_cp_04_gates_declaration.py` collects every `CFT-G`
  # token found on a COMMENT LINE across this tree and requires each one to be
  # DECLARED; naming the withdrawn id in a comment would demand its declaration,
  # which is precisely what the withdrawal forbids. Wave 3 recorded that trap in
  # `census.cycle_2` above and this append walked straight into it — caught by
  # running the gate rather than by reading it.
  perspective_discriminating_class: Corporation
  perspective_detailed_members:
    credit-officer: 22
    kyc-analyst: 0

  # ---- The two addresses `--role` seals to (`D-IMPL-233`, Dave) -----------
  #
  # source: re-derived 2026-09-01 from TWO INDEPENDENT RUNS of the shipped
  #   caller, never copied from a summary, a README or a brief —
  #   (1) `examples/cp-04-corporate-family-tree/run.py` with `--role <role>`
  #       against the live estate (Fluree ledger `fibo-v2`, PostgreSQL schema
  #       `ccf_v2`), at the declared default depth;
  #   (2) the same two asks through
  #       `tests/examples/test_cp_04_payload.py::views` against the COMMITTED
  #       FIXTURE seeded into a local `fluree/server:4.1.4` and a local
  #       `postgres:16`, under per-module ledger and schema names.
  #   Both runs returned the same two addresses. That agreement is what makes
  #   the pin assertable in CI at all: a figure true only of the live estate
  #   would be a figure no test leg could ever read.
  #
  # **WHAT THIS PIN IS FOR, SAID PLAINLY.** The served member roster is the
  # SAME 22 under both declared roles — that is the product's own claim, and
  # `CFT-G16`'s first limb asserts it. So **the roster cannot detect a role
  # that has stopped conditioning anything.** A regression that made `--role`
  # cosmetic would leave every member-set assertion in this suite green, the
  # family intact, the tree of 22 unchanged, and nothing but these two figures
  # moved. The seal and the detailed count are the whole of what can fail.
  #
  # **TWO FIGURES AND NOT ONE, BECAUSE EITHER ALONE IS REACHABLE BY ACCIDENT.**
  # `perspective_role` is echoed into the sealed payload, so a projection that
  # ignored the role entirely would STILL produce two different addresses —
  # exactly the shape that let `CFT-G05` pass its own first sabotage on
  # `max_depth_applied`. **An "the two addresses differ" check is therefore
  # vacuous here and is deliberately not what is declared.** What is declared is
  # each address EXACTLY, so a role read for its name and not for its meaning
  # moves one of them off the value below and is caught.
  #
  # **A DIFFERENT VALUE ON EACH SIDE, ASSERTED RATHER THAN ASSUMED.** The two
  # entries below are distinct, and the check reads that distinctness from this
  # document rather than trusting it: one address written twice would satisfy an
  # equality pin against a product serving one view under two names.
  #
  # **THIS PIN IS EDITED THE WAY THIS WHOLE DOCUMENT IS EDITED** (the header):
  # nothing regenerates it. A legitimate change to the served payload moves both
  # addresses, the suite goes red naming `CFT-G16`, and the values below are
  # replaced deliberately, in the same commit as the change, after the failure
  # has been read.
  # Re-sealed 2026-09-02 under `D-IMPL-240` (1): `24.5-L-02` added `ProductLineage.store_snapshot_pin`, which is inside every content address by construction; the two addresses moved for that cause and no other; `CFT-G16` is on the 24.5 flip roster by id.
  # Restored 2026-09-02 under `D-IMPL-240` amendment 1: that re-seal was computed over a RENDERED SENTINEL (`NO_STORE_SNAPSHOT_PIN` — this product never carried a real pin), and `D-IMPL-243`'s hash transparency omits the sentinel, so the two addresses returned to their pre-phase values, measured live on the Fluree leg.
  # RE-SEALED 2026-09-05 (`24.6-L-01`), for the ONE named cause `D-IMPL-240`
  # amendment 1 requires: `D-23` added the depth-and-cost `traversal` finding
  # to the payload's finding roster, so the addressed bytes changed and both
  # seals moved with them. Read off the shipped caller against the LIVE estate
  # (Fluree ledger `fibo-v2`, PostgreSQL schema `ccf_v2`), one run per role,
  # and copied from the program's own `content address` line — never computed
  # here.
  #
  #   credit-officer  205ae065…  ->  fad6e55d…
  #   kyc-analyst     838afbb0…  ->  79733117…
  #
  # THE TWO ARE STILL DIFFERENT AND THE DETAILED COUNTS STILL 22 AND 0, which
  # is the whole content of the pin: a re-seal that collapsed the two would
  # have made the role cosmetic while every roster stayed green, which is the
  # regression Dave asked these values to stand against.
  perspective_content_addresses:
    credit-officer: "fad6e55da2c0e6276b69d9a053e4eff155e5c3266b68f3fffb873b0c5e754fc7"
    kyc-analyst: "79733117121056fe40c6c095e4f7ff7ec6be33b884676fa4e60b38d43979bac8"

  # ---- `D_c` at two depths — the close-panel Finding 1 pin ----------------
  #
  # source: re-derived 2026-09-01 from TWO INDEPENDENT RUNS of the shipped
  #   caller, never copied from a summary, a README or a brief —
  #   (1) `ccf.client.client.ProductClient` over
  #       `examples/cp-04-corporate-family-tree/transport.py::FamilyTreeInProcessAdapter`
  #       against the LIVE estate (Fluree ledger `fibo-v2`, PostgreSQL schema
  #       `ccf_v2`), asked twice — `max_depth` absent, and at the declared
  #       floor;
  #   (2) the same two asks through
  #       `tests/examples/test_cp_04_traversal.py::ask` against the COMMITTED
  #       FIXTURE seeded into a local `fluree/server:4.1.4` and a local
  #       `postgres:16`, under per-module ledger and schema names.
  #   Both runs returned the same two pairs. That agreement is what makes the
  #   pin assertable in CI at all: a figure true only of the live estate would
  #   be a figure no test leg could ever read.
  #
  # **WHY THIS PIN EXISTS.** The 2026-09-01 close panel found that
  # `examples/cp-04-corporate-family-tree/produce.py::_agreement` opened with
  # *"S — the fraction of SERVED members whose identity no finding disputes"*
  # and then took its denominator from `scenario.facts` — the deployment's
  # SOURCE-READ population, bounded by the declared CEILING, with the caller's
  # `max_depth` applied downstream of it by the L4 traversal. So `max_depth=1`
  # served 20 members and still reported `20/22`, and `D_c` read `0.0909` at
  # depth 1, depth 2 and depth 3 alike. Dave: *"a scalar that cannot fail
  # through the door. That is not the §E.2 weight TBC. It is a wrong
  # denominator."* Depth is now a real boundary for this scalar, and this is
  # where that claim is held.
  #
  # **THE ARITHMETIC, SO A READER CAN CHECK IT RATHER THAN TRUST IT.** `D_c =
  # 1 − (F · C · S)`; on this estate `F` is 1 and `C` is 1 (§E.2.1), so `S` is
  # the whole of the variation. Both disputed members — `SuperMicroComputerBV`
  # and `SubSuperMicroComputerBV`, the duplicate-identity finding — sit ONE HOP
  # from the anchor, so they survive every depth this product accepts while the
  # denominator shrinks with it. At the declared default the payload carries 22
  # members and `S` is `20/22`; at the declared floor it carries 20 and `S` is
  # `18/20`. The two served rosters themselves are not re-declared here — the
  # subtree roster lives at `census.anchor_subtree` above and the floor roster
  # is compared between two runs rather than against a document, which is the
  # `CFT-G05` roster limb's own design.
  #
  # **THIS PIN IS NOT THE TWENTY MISSING JURISDICTIONS AND NEVER BECOMES
  # THEM.** `D-IMPL-230` ruled SERVE: the attribute shortfall reaches the
  # consumer as the `unresolved_jurisdiction` roster finding and as
  # `attributes: null` on each member, and is deliberately NOT folded into `S`.
  # Folding it in gives `S = 2/22` and `D_c ≈ 0.909`, which against the
  # declared `debt_tolerance` of `0.25` would refuse `409` and never serve the
  # tree. Nothing in this fix moved §E.2's routing, its weights or the
  # tolerance; only the SET `S` is taken over changed.
  #
  # **STRINGS AND NOT YAML FLOATS.** `0.1` parsed as a float is not the
  # `Decimal` the fabric computed, and an equality between the two would either
  # be false or be true by rounding. The gate compares `Decimal(str)`.
  #
  # **EDITED THE WAY THIS WHOLE DOCUMENT IS EDITED** (the header): nothing
  # regenerates it. A legitimate change to the debt profile or to the estate
  # moves these figures, the suite goes red naming `CFT-G05`, and the values
  # below are replaced deliberately, in the same commit as the change, after
  # the failure has been read.
  debt_by_depth:
    criterion: 29
    at_the_declared_default:
      max_depth_applied: 3
      semantic_consistency: "0.9090909090909090909090909091"
      context_debt: "0.0909090909090909090909090909"
    # RENAMED 2026-09-05 (`24.6-L-01`): this row was `at_the_declared_floor`.
    # `D-IMPL-253` Q21 deleted the request contract's depth bounds, so there is
    # no declared floor to name; the DEPTH IS UNCHANGED at 1 and so are both
    # figures below, which is why nothing here was re-measured. It is now the
    # caller's own shallower question, `tests/examples/
    # test_cp_04_traversal.py::SHALLOW_DEPTH`.
    at_the_shallow_depth:
      max_depth_applied: 1
      semantic_consistency: "0.9"
      context_debt: "0.1"
