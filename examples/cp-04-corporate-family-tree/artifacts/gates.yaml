          'http://example.org/fibo/SuperMicroComputerInc' was served
          [('legal_name', 'SUPER MICRO COMPUTER, INC.')] where a DIRECT read of
          'legal_entity' holds [('legal_name', 'Super Micro Computer, Inc.')]".
