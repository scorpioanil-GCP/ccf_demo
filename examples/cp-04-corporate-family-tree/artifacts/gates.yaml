        query.
      test: tests/examples/test_cp_04_seams.py::test_cft_g11_attributes_resolve_in_one_batched_query
      sabotage: >-
        fire one query per node — a fan-out that works at depth 2 and collapses
        at depth 4. AND, DECLARED 2026-09-01 after the close panel's finding 4,
        a second sabotage against the roster limbs: issue exactly ONE statement
        that does not ADDRESS the requested roster — an unparameterized read of
        the whole attribute table. It leaves the statement count at one, returns
