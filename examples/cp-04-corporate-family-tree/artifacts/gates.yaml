    # ---- The MCP door (§D.1, D-18, D-34) ---------------------------------
    #
    # THIS GATE IS THREE ASSERTIONS HELD TOGETHER, NOT "TOOL-ONLY". Criterion 37
    # was AMENDED at Gate 1 (2026-08-31, Dave, `D-IMPL-225` amendment 1) because
    # its original wording was FALSE against this tree:
    # `runtime/ccf_runtime/mcp/egress.py::build_egress_server` registers `@server.resource`
    # UNCONDITIONALLY and only the tool at `:529` sits behind
    # `expose_product_tool`, so `build_egress_server` can be resource-only or
    # resource-plus-tool and CANNOT be tool-only. `runtime/` is not touched
    # (`D-04`), so the door this rung ships is a REGISTERED RESOURCE THAT
    # REFUSES, and the residual gap is recorded as `D-34`.
    - id: CFT-G13
      criterion: 37
      statement: >-
        The MCP door SERVES THROUGH THE TOOL ONLY, and the registered product
        resource REFUSES. Three parts, asserted together — (a) the resource IS
        registered and enumerable in resources/list; (b) a resolve or read of it
        returns ProductNotServable, or the existing refusal type, and NEVER a
        tree; (c) the TOOL is the only path that serves, taking a
        client-supplied lei and max_depth.
      test: tests/examples/test_cp_04_seams.py::test_cft_g13_the_tool_serves_and_the_registered_resource_refuses
      sabotage: >-
        make the resolver return a payload — a resource read that yields a tree
        instead of refusing. A resolver docstring saying it refuses is not the
        resolver refusing, and a refusal type merely imported is not a refusal
        raised, so the gate must drive a real resource read and a real tool ask.
        AND, DECLARED 2026-09-01 after the close panel's finding 3, a second
        sabotage against limb (c): make the door ECHO the requested depth into
        the payload while WALKING the declared default. `max_depth_applied` is
        written from the request and the walk is bound by the operator parameter
        set, so the two can disagree — and a limb reading the echo cannot tell.
      observed_red:
        result: >-
          RED, under its own id, SIX WAYS AT ONCE. Sabotage applied to
          `examples/cp-04-corporate-family-tree/server/compose.py::build_resolver`
          — the `request is None` refusal replaced by the deployment's own
          demonstration question, so a parameter-free resource read serves a
          standing answer. This is the sabotage `D-IMPL-225` names in terms:
          *"make the resolver return a payload and the gate must go RED."*

          Observed, all on limb (b) and all against a REAL MCP client reading a
          REAL resource: "the product RESOURCE served"; "the resource read did
          not refuse for THIS deployment's stated reason" (followed by the
          served vessel); and one entry each for `"nodes"`, `"anchor"`,
          `"findings"` and `type_chain` — "that is a TREE, and the one thing
          this surface must never produce".

          LIMBS (a) AND (c) STAYED GREEN, correctly: the door still enumerated
          its template and the tool still served at the caller's depth. That is
          why the three limbs are asserted TOGETHER — a gate asserting only the
          refusal passes on a door where nothing works at all, and a gate
          asserting only the tool passes on a door that also serves a standing
          answer.

          CRITERION 37'S WORDING IS NOT TOUCHED HERE. It says the resource is
          *"enumerable in `resources/list`"*; measured at an MCP client the
          product enumerates in `resources/templates/list` and `resources/list`
          returns `[]`, because a URI carrying placeholders registers as a
          resource TEMPLATE. That is an open wording question for Dave (plan
          24.4-09's deferred item 7) and this gate does not resolve it: BOTH
          listings are asserted as shipped, so neither the template vanishing
          nor a concrete entry appearing goes unseen, whichever way the wording
          lands. Substance and `D-34` are unchanged.

          The expectation resolves from
          `runtime/ccf_runtime/mcp/egress.py::PRODUCT_URI_TEMPLATE`, from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.anchor`
          and from the declared depth default; the behavior comes from
          `examples/cp-04-corporate-family-tree/server/compose.py`, which the
          sabotage mutated. Different files.

          APPENDED 2026-09-01 at `b05bad3`, FOR THE ROSTER LIMBS THE CLOSE
          PANEL'S FINDING 3 REQUIRED — and this is the gate the phase's headline
          claim, *"the ladder's first MCP door"*, rests on. As shipped, limb (c)
          read `max_depth_applied` off the served payload and compared the
          anchor URI. NEITHER IS THE WALK.
          `examples/cp-04-corporate-family-tree/projection.py::FamilyTreeProjection.invoke`
          writes `max_depth_applied` from the REQUEST while the walk takes its
          bound from the operator parameter set
          `examples/cp-04-corporate-family-tree/deployment.py::traversal_parameters`
          binds, so a door echoing the caller's depth while walking the declared
          default passed the gate whole. Dave: *"the door must compare rosters
          across depths, not echo `max_depth_applied` — that is CFT-G13."*

          FOUR LIMBS WERE ADDED, all over ROSTERS and never sizes (`D-13`): the
          shallower ask's roster is a SUBSET of the deeper one's; the deeper ask
          reached members the shallower did not; every member
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.anchor_subtree.depth_to`
          declares beyond the ask is ABSENT by name; every member it declares
          within the ask is PRESENT by name. The one lifespan already drove both
          asks, so no second door was needed.

          SECOND SABOTAGE, WATCHED RED.
          `examples/cp-04-corporate-family-tree/deployment.py::traversal_parameters`
          was made to return the declared parameters unchanged, so the caller's
          depth reached the payload's label and not the walk. Observed on two
          roster limbs at once — "CFT-G13 (c): max_depth=1 and the declared
          default 3 served the IDENTICAL roster [22 members]" and "max_depth=1
          served ['CycCalderIndustrialNv', 'CycThornburyCapitalLtd'], which
          expected.yaml::census.anchor_subtree.depth_to declares at [2, 3] —
          deeper than the caller asked for".

          AND THE ECHO LIMB SAID NOTHING. Neither "did not reach the walk" nor
          "substituted the declared default" appeared: the gate AS IT SHIPPED
          would have been GREEN here. That comparison is asserted in the tree
          rather than only recorded, by
          `tests/examples/test_cp_04_seams.py::test_the_door_check_refuses_a_walk_at_the_default_while_the_echo_says_the_ask`,
          which requires the roster limbs to fire AND both echo limbs to stay
          silent.

          Reach measured: 4 of 225 cp-04 tests went red — this gate, `CFT-G04`,
          `CFT-G05` and the traversal precondition. `CFT-G14` stayed green,
          correctly, because both callers are equally sabotaged and their
          rosters still agree — which is the same lesson `CFT-G05`'s third limb
          recorded from the other side: a movement gate over one boundary says
          nothing about a second.

          The added expectation resolves from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.anchor_subtree.depth_to`,
          which no sabotage of the door touches; the behavior comes from
          `examples/cp-04-corporate-family-tree/deployment.py`. Different files.
        date: "2026-09-01"
        commit: "0b02099, roster limbs b05bad3"

