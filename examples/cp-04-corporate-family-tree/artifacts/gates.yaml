        fixture loader. An import of a PostgreSQL driver is not the attribute
        leg reading PostgreSQL.
      observed_red:
        result: >-
          RED, under its own id, in THREE VARIANTS — and the first is recorded
          rather than glossed because it never reached this gate at all.

          THE DECLARED SABOTAGE DOES NOT MOVE THE OPENED-STORE SET, MEASURED.
          With the attribute leg reading the graph store,
          `examples/cp-04-corporate-family-tree/assembler.py::stores_opened`
          still reported ('corporate_family_graph',
          'corporate_family_attributes') while the relational leg issued 0
          statements — probed directly, not inferred. A gate asserting only
          "both stores were opened" therefore PASSES its own declared sabotage,
          exactly as `CFT-G05` and `CFT-G16` did on this ladder. The role limb
          and the provenance limb exist because of that, and both were written
          before the sabotage was run.

          VARIANT A — the sabotage as declared, the whole attribute leg reading
          Fluree. It does NOT reach this gate: the graph store carries no
          jurisdiction at all, so
          `examples/cp-04-corporate-family-tree/deployment.py::refuse_open_jurisdiction_world`
