          carries a jurisdiction, so the declared set ['NL', 'US-DE'] is held
          against an empty observation." That is evidence the two stores hold
          different things, and it is NOT this gate speaking, so it was
          recorded and a second variant was run. Same shape as `CFT-G08`'s
          split in plan 24.4-11.

          VARIANT B — the whole attribute leg reading Fluree, with a
          jurisdiction assigned from the declared observed set so the assembly
          completes. Observed on TWO limbs: "CFT-G10: the relational leg
          'corporate_family_attributes' issued NO statement, so the attributes
