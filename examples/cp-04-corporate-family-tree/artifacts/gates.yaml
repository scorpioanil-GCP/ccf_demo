# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE SIXTEEN DECLARED PRODUCT GATES, AS DATA — `CFT-G01` through `CFT-G16`.
#
# The `$schema` header above names the OPEN ENVELOPE, because that is what the
# tree-wide header gate reads (`tools/check_schema_headers.py`) and this is a
# deployment-authored class the SDK does not own. THE CLOSED SCHEMA THAT
# ACTUALLY CONSTRAINS THIS DOCUMENT is
# `docs/schemas/product-gates/cp.product-gates.json`, and
# `tests/examples/test_cp_04_gates_declaration.py` validates against it with a
# negative control proving the closure can fail. Two schemas, two jobs: the
# envelope says this is a versioned artifact, the closed schema says what a gate
# roster is.
#
# ============================================================================
# WHY THIS FILE EXISTS AND WHY THE SPECIFICATION'S TABLE DOES NOT REPLACE IT
# ============================================================================
#
# `D-IMPL-224`: product gates are a DECLARED ARTIFACT plus CI coverage. There is
# no `ProductGate` Protocol, no serve path, and the SDK's universal gates stay
# the only serve-time gates — nothing here is added to the fabric.
#
# **THE SPECIFICATION'S §G.2 TABLE IS THE MACHINE SOURCE FOR NOTHING** (`D-22`).
# CI must not depend on parsing prose out of Markdown; a prose table cannot be
# held against a run. The statements below are the same statements, and this
# document is where a checker reads them.
#
# **ENFORCEMENT IS PHASE 24.5's, NOT THIS PHASE's** (`D-24`). The checker that
# asserts each declared id has an EXECUTING test — never an `id in file`
# substring match — is scheduled and is deliberately not built here. Measured
# across this ladder, 40 product-level gate ids exist across four products and
# `grep -rnE "OFS-G|FTS-G|[A-Z]{2,4}-G[0-9]{2}" --include=*.py src/ runtime/`
# returns 0. That is `D-31`, recorded and open.
#
# **NO GATE IS RECORDED AS PASSING UNTIL IT HAS BEEN OBSERVED RED AT LEAST
# ONCE.** All sixteen `observed_red` values are `null` at the end of plan
# `24.4-03` — required as KEYS so an unsabotaged gate is VISIBLY unsabotaged
# rather than absent. Plans `24.4-10`, `24.4-11` and `24.4-12` build the tests,
# apply the sabotage, watch the failure and fill them in. A gate that has never
# been seen red is not evidence that it runs; fourteen declared gates once sat
# idle on this ladder behind exactly that assumption.
#
# ============================================================================
# THE ROSTER IS SIXTEEN, AND THAT IS A RULING RATHER THAN A COUNT
# ============================================================================
#
# `CFT-G01` through `CFT-G16`, discharging locked ROADMAP criteria 25 through
# 40, one-for-one in both directions. **Criterion 41 is WITHDRAWN IN PLACE**
# (Dave, 2026-08-31) together with ontology role 1 — *the walk stops when the
# neighbor's class is outside the admitted set* — and NO GATE CLAIMS IT.
#
# Two independently measured reasons, either sufficient on its own:
#
#   * **THE ESTATE CANNOT EXHIBIT THE STOP.** Over all 748 family nodes, no
#     LEI-bearing anchor reaches a node outside the 7-class profile within depth
#     3. The class-diverse populations are real — `Person` 46,
#     `SpecialPurposeVehicle` 50, 5-class 123 — and every one sits in a
#     component no LEI-bearing anchor reaches downward. A gate over this would
#     go green having proven nothing and its sabotage would change no output.
#     Recorded as the estate gap `D-32`.
#
#   * **THE SDK CANNOT EXPRESS THE STOP.** The Traversal family types the walk
#     on EDGES ONLY (`GQ-10`); `seed_entity_classes` seeds the frontier and is
#     never re-applied per hop (`src/ccf/operators/categories.py::TraversalNeighborhood`). A
#     node-class admission filter has NO SDK EXPRESSION. Recorded as the
#     mechanism gap `D-33`. Had the estate carried the data, the walk still
#     could not have stopped without work under `src/` that criterion 49 forbids.
#
# **IT IS NOT REPLACED BY A POSITIVE-PROPERTY RESTATEMENT.** *"Every admitted
# node's class is in the declared set"* was refused BY NAME: it is a tautology
# over a class-homogeneous population, and it would read as coverage while
# measuring nothing. **A seventeenth id is declared here under no name at all**,
# and the absence is asserted BY NAME on a CODE line in
# `tests/examples/test_cp_04_gates_declaration.py` — never in a comment, because
# that module's own comment-only check would then demand the very id the
# withdrawal forbids.
#
# SEVENTEEN DECLARED GATES AS OF 2026-09-03 (Phase 24.5.1, `D-IMPL-245` (4);
# criterion 19 as amended, `24.5.1-CRITERIA-LOCK.md` Amendment 1): `CFT-G01`
# through `CFT-G16` and `CFT-G18`. `CFT-G18` is the AMBIGUOUS-ANCHOR gate —
# an anchor LEI carried by more than one node is refused as typed ambiguity
# data — and it is NOT a restatement of withdrawn criterion 41 / ontology
# role 1, which stays withdrawn and claimed by no gate. The withdrawn
# seventeenth id is still declared here under no name at all; a withdrawn id
# is never re-minted, so `CFT-G18` is the next free id, not a re-mint. The
# ruling block above is preserved as written: sixteen was the roster on the
# day it was ruled, and this note is the dated record of the one addition.
#
# `role: load`. A gate roster is a declaration of obligations, parsed and handed
# back; it is not something the fabric is PERMITTED to do.

semver: "1.0.0"
class_id: cp-04.product-gates

declaration:
  product: reference.corporate-family

  # HOW A GATE ID MAPS ONTO THE FUNCTION THAT EXECUTES IT, DECLARED RATHER THAN
  # INFERRED. Measured across this ladder, three products used three conventions
  # and a coverage instrument keyed on function names reported 0 of 8, 0 of 9 and
  # 0 of 9 falsely — three products, three conventions, one instrument that could
  # not read any of them. Plans 24.4-10, 11 and 12 hit the convention below, and
  # each may CORRECT the `test:` reference it finds here in the same edit that
  # records its `observed_red`.
  test_naming_convention: >-
    the gate id lower-cased with its hyphen dropped, prefixed `test_`, followed
    by a slug of the statement — `CFT-G01` becomes
    `test_cft_g01_every_returned_node_carries_a_known_fibo_class`.

  gates:
    # ---- Ontology validates the assembly (§D.2.1 role 4) -----------------
    - id: CFT-G01
      criterion: 25
      statement: >-
        Every returned node carries a known FIBO class. An untyped or
        off-ontology node cannot enter silently.
      test: tests/examples/test_cp_04_traversal.py::test_cft_g01_every_returned_node_carries_a_known_fibo_class
      sabotage: admit an untyped node into the returned set
      observed_red:
        result: >-
          RED, under its own id. Sabotage applied to
          `examples/cp-04-corporate-family-tree/deployment.py::read_node_facts` — the drop guard
          `if chains.get(uri)` removed so an untyped node is admitted rather
          than dropped, AND the first walked node's type read forced empty. The
          second half is necessary and is recorded rather than glossed: the
          committed fixture carries `@type` on all 748 documents and no
          family-predicate object lacks a document, so removing the guard ALONE
          changes no output and would have been a sabotage this gate could not
          have failed. Observed — "CFT-G01: node
          'http://example.org/fibo/CycCalderIndustrialNv' was served UNTYPED —
          an empty type_chain." The expectation was read from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.anchor.type_chain`, which the
          sabotage does not touch; the product's behavior comes from
          `examples/cp-04-corporate-family-tree/deployment.py`. Two different files, so the gate cannot pass its
          own sabotage by moving both sides together.
        date: "2026-09-01"
        commit: "6213b86"

    - id: CFT-G02
      criterion: 26
      statement: >-
        Every returned edge is one of the six declared family predicates —
        owns, controls, isDirectlyConsolidatedBy, isUltimatelyConsolidatedBy,
        hasGlobalUltimateParent, hasDomesticUltimateParent.
      test: tests/examples/test_cp_04_traversal.py::test_cft_g02_every_returned_edge_is_one_of_the_six_declared_predicates
      sabotage: >-
        admit a seventh predicate into the edge set. Seven others exist in this
        ledger and are deliberately excluded, so the sabotage draws on real data
        rather than an invented predicate.
      observed_red:
        result: >-
          RED, under its own id. Sabotage applied to
          `examples/cp-04-corporate-family-tree/deployment.py::normalize_edges` — every normalized
          parent-to-child edge admitted carrying a seventh predicate beside the
          ones the source asserted. Observed — "CFT-G02: the served edge set
          carries ['hasSubsidiary'], which are not among the six declared family
          predicates." The name is drawn from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.predicates_deliberately_excluded`,
          a real predicate of this estate that this product excludes. THE
          COMMITTED FIXTURE CARRIES ONLY THE SIX, measured, so the seventh is
          injected by name rather than read out of the fixture — recorded rather
          than implied, because the declared sabotage says the seventh is drawn
          from real data and against this fixture it cannot be. The expectation
          was read from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.family_predicate_triples`, which
          the sabotage does not touch. Two different files.
        date: "2026-09-01"
        commit: "6213b86"

    # ---- The depth parameter (§B.4.1) ------------------------------------
    - id: CFT-G03
      criterion: 27
      statement: >-
        max_depth above the BACKEND's TECHNICAL ceiling is refused BY NAME —
        `constraint-refusal`, `bound.authority == "technical"`, carrying the
        bound; the capability identity that refused it is on the internal
        determination and its replay record, and crosses the door only at
        `full` (`D-IMPL-260` P-F) — and is answered at no narrower depth. A
        depth this estate cannot exhibit (8) is SERVED.
      test: tests/examples/test_cp_04_traversal.py::test_cft_g03_max_depth_above_the_technical_ceiling_is_refused_by_name
      sabotage: >-
        clamp to the technical ceiling instead of refusing. This is the
        sabotage a count-based check cannot see — the request says 101, the
        walk does 100, the payload looks fine and the content address greens.
      # WHY `D-23`'s FINDINGS CLAIM CARRIES NO ID OF ITS OWN, recorded here
      # because the alternative was measured and refused rather than
      # overlooked. Depth-and-cost-in-the-findings is a separate obligation
      # with a separate sabotage (a wall clock in addressed content), and it
      # would have earned the next free id — except that a gate row keys its
      # obligation on a BARE INTEGER criterion, and Phase 24.6's criterion 33
      # is already claimed here by Phase 24.4's criterion 33 (`CFT-G13`).
      # `tests/examples/test_cp_04_gates_declaration.py::test_the_criteria_map_one_to_one_onto_the_gates`
      # refuses the collision, correctly: `RETURN_TRIP_CRITERIA` holds
      # 24.5.1's 19 apart only because 19 happened not to collide. Minting the
      # gate would have needed either a criterion number that is not the one
      # the phase locked, or a `criterion_phase` key widening the CLOSED
      # schema at `docs/schemas/product-gates/cp.product-gates.json` — a
      # change to every rung's roster contract and outside `24.6-L-01`'s
      # fence. The OBLIGATION is not lost: the statement above carries the
      # served-deep half, and
      # `tests/examples/test_cp_04_traversal.py::test_findings_carry_depth_and_structural_cost_and_no_clock`
      # ships with both its sabotages watched RED (24.6-13 SUMMARY).
      observed_red:
        result: >-
          RED, under its own id, on BOTH limbs — re-observed 2026-09-05 against
          the LIVE estate (ledger `fibo-v2`, PostgreSQL schema `ccf_v2`) after
          `24.6-L-01` moved the gate's subject from the deleted declared bound
          to the substrate's technical capability. Sabotage applied to
          `examples/cp-04-corporate-family-tree/assembler.py`: the
          `ConstraintRefusal` branch replaced by a clamp to
          `effective.bound.value` and a re-entry into the spine at that depth.
          The SHIPPED predicate
          (`tests/examples/test_cp_04_traversal.py::refusal_violations`) then
          reported TWO violations — "max_depth=101 was ANSWERED rather than
          refused — a tree came back, walked at max_depth_applied=100 over 22
          members" and "and the answer was CLAMPED to the technical capability
          100." The program itself printed `depth applied 100 requested, 3
          reached` for a request at 101, which is the fourteen-idle-gates class
          stated concretely: well-formed payload, greened content address, and
          a question nobody asked. Restored by `cp` and verified `cmp`-clean;
          the same predicate reported 0 violations afterwards and a request at
          depth 8 came back SERVED with `requested_depth: 8, depth_reached: 3`.
          The capability the refusal is held against is read off the graph leg
          through `ccf.graph.protocols::TraversalDepthCapability`; the sabotage
          edits `assembler.py` and never the substrate, so the two sides cannot
          move together.
        date: "2026-09-05"
        commit: "24a8b5a3"

    - id: CFT-G04
      criterion: 28
      statement: >-
        A missing max_depth takes the DECLARED default, read by the SDK's own
        resolution from `ccf_config.yaml`'s `request_contract.defaults` and
        never invented at serve time. The walk FOLLOWS the declaration: moving
        it moves the depth applied and the members served.
      test: tests/examples/test_cp_04_traversal.py::test_cft_g04_a_missing_max_depth_takes_the_declared_default
      sabotage: >-
        default at serve time instead of letting the declaration resolve it —
        substitute a literal for the absent parameter before the effective
        request is resolved
      observed_red:
        result: >-
          RED, under its own id — and RED ONLY on the control limb, which is the
          whole reason the control lives inside the gate. Re-observed 2026-09-05
          against the LIVE estate after `24.6-L-01` moved the default's
          resolution from the deployment to the SDK. Sabotage applied to
          `examples/cp-04-corporate-family-tree/assembler.py`: a serve-time
          substitution of the literal `3` onto an absent `max_depth`, before
          the effective request is resolved — a default equal to the shipped
          declaration. THE PLAIN LIMB PASSED UNDER THE SABOTAGE: a missing
          max_depth still walked at 3, exactly as a number-only check would
          have reported. The SHIPPED predicate
          (`tests/examples/test_cp_04_traversal.py::default_violations`) then
          reported TWO violations — "with the declared default moved to 1, a
          missing max_depth still walked at 3. The default did not FOLLOW the
          declaration" and "moving the declared default served the IDENTICAL
          member roster (22 members)." The control moves the declaration in a
          SCRATCH TEXT COPY of
          `examples/cp-04-corporate-family-tree/ccf_config.yaml` — a text
          rewrite, because
          `examples/cp-04-corporate-family-tree/deployment.py::refuse_stale_vocabulary_pointer`
          reads that document's comments and a YAML round trip would lose them
          — while the sabotage edits `assembler.py`. Two different files.
          Restored by `cp` and verified `cmp`-clean; 0 violations afterwards,
          with the shipped declaration walking at 3 and the scratch one at 1
          over two different rosters.
        date: "2026-09-05"
        commit: "24a8b5a3"

    - id: CFT-G05
      criterion: 29
      statement: >-
        Depth is part of product identity. Two depths are two content addresses.
      test: tests/examples/test_cp_04_traversal.py::test_cft_g05_depth_is_part_of_product_identity
      sabotage: make max_depth not change the content address
      observed_red:
        result: >-
          RED, under its own id — on the ROSTER limb ONLY, and that is the
          finding worth carrying out of this plan. Sabotage applied to
          `examples/cp-04-corporate-family-tree/deployment.py::traversal_parameters`, made to return the
          declared operator parameters unchanged so the caller's depth never
          reaches the walk. Observed — "CFT-G05: `max_depth=1 (the declared
          floor)` and `max_depth absent (the declared default)` served the
          IDENTICAL member roster (22 members), so max_depth reached the
          payload's label but not the walk." THE TWO CONTENT ADDRESSES STILL
          DIFFERED UNDER THE SABOTAGE, because `max_depth_applied` is echoed
          into the sealed payload — so a gate asserting only that two depths
          give two addresses would have PASSED its own sabotage, which is the
          Phase 24.3 defect class exactly. The roster limb was written before
          the sabotage was run, from that same reasoning, and is what made this
          gate able to fail. The comparison is between two runs of this product
          rather than against a document, so there is no shared declaration for
          a sabotage to move.

          THIRD LIMB ADDED 2026-09-01 AFTER THE CLOSE PANEL'S FINDING 1, and
          watched red twice. Dave ruled that `S` — and therefore `D_c` — are
          taken over the SERVED ROSTER rather than over the deployment's
          source read: *"Computing over the source-read 22 is why
          `MAX_DEPTH=1` still prints `20/22` and why `D_c` is the same at
          every depth — a scalar that cannot fail through the door. That is
          not the §E.2 weight TBC. It is a wrong denominator."* NO NEW GATE ID
          WAS MINTED; the pair lands here because *depth is part of product
          identity* is exactly the statement it holds.

          SABOTAGE A — THE OLD DENOMINATOR, RESTORED. Applied to
          `examples/cp-04-corporate-family-tree/produce.py::_agreement`, whose
          member set was put back to `tuple(sorted(scenario.facts))`. RED,
          under its own id, on THREE of the new limb's assertions at once —
          "CFT-G05: `max_depth=1 (the declared floor)` served D_c
          0.0909090909090909090909090909 where
          `debt_by_depth.at_the_declared_floor.context_debt` declares 0.1",
          the matching S mismatch, and "CFT-G05: two different depths served
          the SAME D_c" naming both values. The expectation was read from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::debt_by_depth`,
          which the sabotage does not touch. Two different files.

          AND THE SABOTAGE'S REACH WAS MEASURED RATHER THAN ASSUMED. Under
          sabotage A, EXACTLY ONE test in the 216-test cp-04 suite went red
          and it was this gate. In particular the pre-existing `D_c` movement
          gate — `tests/examples/test_cp_04_debt.py`, built by plan `24.4-08`
          — passed WHOLE, all six tests green: it moves the IDENTITY boundary
          at a FIXED depth, where the served roster and the source read
          coincide on all 22, so the wrong denominator is invisible to it.
          That is the finding worth carrying: a movement gate over one
          boundary says nothing about a second.

          SABOTAGE B — THE INVERSE CONTROL, proving the gate READS the
          artifact rather than ignoring it. The shipped code was left
          untouched and one pinned value was corrupted in
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml`
          (`debt_by_depth.at_the_declared_floor.context_debt`, 0.1 -> 0.125).
          RED, under its own id — "served D_c 0.1 where … declares 0.125". A
          gate that had hard-coded its own figure would have stayed green
          through this.

          FIVE POSITIVE CONTROLS SIT BESIDE THE LIMB, each handing the shipped
          check a subject it must refuse, and the first of them mirrors the
          shipped defect exactly: one `D_c` at two depths. The pin's
          DISTINCTNESS is asserted from the document as well, because an
          equality-only reading is satisfiable by a frozen scalar if the
          document happens to carry one value twice — the trap
          `expected.yaml::perspective_content_addresses` records for `CFT-G16`,
          met here from the other side.
        date: "2026-09-01"
        commit: "6213b86, third limb fa73839"

    # ---- The inert parameter (§B.4.3) ------------------------------------
    - id: CFT-G06
      criterion: 30
      statement: >-
        as_of is refused 400 not_supported_at_tier.
      test: tests/examples/test_cp_04_payload.py::test_cft_g06_as_of_is_refused_not_supported_at_tier
      sabotage: silently honor it
      observed_red:
        result: >-
          RED, under its own id, on BOTH limbs. Sabotage applied to
          `examples/cp-04-corporate-family-tree/produce.py::assemble_and_serve`
          — the declared-but-inert branch neutralized so the parameter is
          noted and then ignored. Observed — "CFT-G06: 'as_of' was ANSWERED
          rather than refused — a tree came back over 22 members" and "the
          assembly SERVED ['Assembled'] while 'as_of' was on the wire." THE
          SECOND LIMB IS THE ONE A REASON-STRING CHECK CANNOT MAKE, and it
          exists because cp-03's close panel found exactly that shape in its
          own `OFS-G06`: a product can note the parameter, emit the declared
          reason and serve the tree anyway. The parameter name and the
          refusal reason are read from
          `examples/cp-04-corporate-family-tree/ccf_config.yaml::request_contract.unsupported_arguments`
          through the deployment's accessor; the status 400 is AUTHORED in
          the gate from locked criterion 30 rather than read from
          `examples/cp-04-corporate-family-tree/produce.py`, because that is
          the file this sabotage mutates and an expectation resolving from
          the mutated file is how a gate comes to pass its own sabotage. A
          precondition asserts the shipped verdict type still carries 400,
          so a drift is reported rather than absorbed. Two different files.
        date: "2026-09-01"
        commit: "8ecd22f"

    # ---- Findings (§D.2.2) -----------------------------------------------
    - id: CFT-G07
      criterion: 31
      statement: >-
        A cycle reaches the consumer carrying type, ORDERED members AND the
        closing_edge — asserted as the exact roster, never as len(findings) > 0.
      test: tests/examples/test_cp_04_payload.py::test_cft_g07_a_cycle_carries_type_ordered_members_and_closing_edge
      sabotage: >-
        drop the closing edge, which is precisely the part a flattened
        representation loses.
      observed_red:
        result: >-
          RED, under its own id. Sabotage applied to
          `examples/cp-04-corporate-family-tree/projection.py::FamilyTreeProjection._finding`
          — `closing_edge` emitted as `None` for every finding. Observed —
          "CFT-G07: the cycle reached the consumer with NO closing edge."
          The members survived, every count stayed right, and the arrow that
          makes it a circuit was gone: that is why all four fields are
          asserted rather than the roster alone. The members are compared as
          an ORDERED sequence and never as a set, because the same circuit
          entered from a different node is the same set naming a DIFFERENT
          closing edge — `test_the_cycle_check_refuses_a_rotated_roster`
          feeds the shipped check exactly that and watches it refuse. The
          expectation was read from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.cycle_1`,
          which the sabotage does not touch. Two different files.
        date: "2026-09-01"
        commit: "8ecd22f"

    - id: CFT-G08
      criterion: 32
      statement: >-
        Findings are ORTHOGONAL to the tree. No node carries a cycle flag.
      test: tests/examples/test_cp_04_payload.py::test_cft_g08_findings_are_orthogonal_to_the_tree
      sabotage: >-
        flag cycle membership on the nodes instead, which destroys the closing
        edge while every node count stays right.
      observed_red:
        result: >-
          RED, under its own id, and RUN IN TWO VARIANTS because the
          declared sabotage trips one limb before the other is reached.
          VARIANT A is the sabotage as declared — the cycle moved OUT of
          `findings[]` and ONTO the nodes, applied to
          `examples/cp-04-corporate-family-tree/projection.py::FamilyTreeProjection.invoke`
          and
          `examples/cp-04-corporate-family-tree/projection.py::FamilyTreeProjection._node`.
          Observed — "CFT-G08: no finding of type 'ownership_cycle' is in
          findings[]." That is the POSITIVE limb and the gate returns on it,
          so the content limb was never reached. VARIANT B keeps the finding
          and adds the node flag alone. Observed — "CFT-G08: the served node
          field 'in_cycle' takes the value True on EXACTLY the cycle members
          ['CycCalderIndustrialNv', 'CycMeridianHoldingsSa',
          'CycThornburyCapitalLtd'] and on no other member." THE CONTENT
          LIMB READS A PARTITION AND NEVER A NAME: a check scanning the node
          keys for the token "cycle" is green against a flag called
          `flagged`, which
          `test_the_orthogonality_check_refuses_a_flag_named_anything`
          demonstrates. Measured against the shipped product BEFORE the
          sabotage was written: no field of a served node partitions the 22
          members into the cycle's three — `lei` and `attributes` are null
          on twenty, `depth` takes three different values across the three,
          and `type_chain` and `conditioning` are identical across all 22.
          The expectation was read from
          `examples/cp-04-corporate-family-tree/artifacts/expected.yaml::census.cycle_1`;
          the sabotage edits
          `examples/cp-04-corporate-family-tree/projection.py`. Two
          different files.
        date: "2026-09-01"
        commit: "8ecd22f"

    # ---- The unresolved member (§C.3, D-16) ------------------------------
    - id: CFT-G09
      criterion: 33
      statement: >-
        A node carrying no LEI stays in the tree AND in the roster. A failed
        join is a null resolution or a finding.
      test: tests/examples/test_cp_04_payload.py::test_cft_g09_a_node_with_no_lei_stays_in_the_tree_and_the_roster
      sabotage: >-
        drop members whose PostgreSQL join fails. 606 of 748 family nodes have
        no attribute row, so the sabotage returns a smaller, tidier, wrong
        family with no error at all.
      observed_red:
        result: >-
          RED, under its own id, on all three limbs. Sabotage applied to
          `examples/cp-04-corporate-family-tree/projection.py::FamilyTreeProjection.invoke`
          — the served member set filtered to those whose PostgreSQL join
          resolved. Observed — "CFT-G09: 2 members were served where
          expected.yaml::census.anchor_subtree declares 22. Served
          ['SuperMicroComputerBV', 'SuperMicroComputerInc']", then the
          twenty NAMED as dropped, then "the unresolved roster reached the
