# THE DOOR'S ENVIRONMENT — NAMES, never values (D-IMPL-343). AMENDED 2026-10-11
# (round 3, examples/AMENDMENTS-2026-10-11.md): added when `server/serve.py` moved
# onto the SDK's standard door (`open_door_with_verifier`), which reads the boot
# credential by the name this document declares. The in-process run reads no part
# of this document; the two systems of record stay `backends.yaml`'s.
config: ccf_config.yaml
substrate:
  # Required by the document's shape. The door boots nothing through it: this
  # specimen composes its fabric per question itself (`produce.py`).
  setting: database_path
  prefix: cp_04_door_inert
  suffix: .sqlite3
door:
  credential:
    from_env: CCF_CP_04_DOOR_TOKEN
    remedy: >-
      export CCF_CP_04_DOOR_TOKEN with the bearer credential this door is to be
      reached with, or leave it unset to have one minted per boot.
