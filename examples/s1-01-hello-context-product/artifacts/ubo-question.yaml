# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# The question this product answers, as a Control Plane statement (KYC/UBO
# domain, phase 16 CONTEXT D-03; CLAUDE.md §6.4, the No-Hardcoding Rule).
#
# *"Who ultimately owns Acme Corporation?"* is a question with parameters, and
# every one of them is here rather than in `../deployment.py`: which entity is
# the subject, which class counts as a natural person, which class carries an
# ownership interest, and which attribute of that class carries the owner, the
# target and the percentage. The projection is an interpreter of this document.
# Delete it and there is nothing left for the projection to compute.
#
# `role: register`, not `load`. Changing the subject of the question, or which
# class the fabric treats as a natural person, changes what this fabric is
# permitted to answer — so it belongs in the pin set and in Decision Replay
# dimension 2, beside the policy bundle that supplies the threshold.
#
# THE THRESHOLD IS NOT HERE. It lives in `policy-bundle.yaml`, because it is
# jurisdiction-conditioned regulatory policy rather than a property of the
# question. A deployment can ask the same question under a different regime and
# get a different set of beneficial owners out of the same graph.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: fibo-kyc.ubo-question

declaration:
  # The entity the question is about. Its source-system reference, which is what
  # the reified stakes name their endpoints by.
  subject_entity_ref: "http://example.org/fibo/AcmeCorp"

  # Which resolved class is a human being. A beneficial owner is a natural
  # person; a holding company on the chain is a step, not an answer.
  natural_person_class: party

  # Which resolved class carries a qualified ownership interest, and which of
  # its attributes carry the two endpoints and the fraction.
  ownership_stake_class: ownership_stake
  stake_owner_attribute: stake_owner_ref
  stake_target_attribute: stake_target_ref
  stake_percent_attribute: ownership_percent

  # Which attributes of a natural person the answer reports.
  party_ref_attribute: party_ref
  party_name_attribute: party_name
