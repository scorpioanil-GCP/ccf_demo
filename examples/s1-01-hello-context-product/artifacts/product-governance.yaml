# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# The remaining governance values this deployment puts in force, in one
# deployment-authored document (KYC/UBO domain, phase 16 CONTEXT D-03).
#
# Every value here is one the SDK deliberately declines to own:
#
#   * `max_ttl_seconds` — the per-class TTL ceiling (INV-CH7-48, D-IMPL-39).
#     MAX_TTL has no SDK default. `spine.py` registers this number as a typed
#     `MaxTTL` to MINT the pin `register_product_class` needs; the number and
#     the pin are therefore two things, which is what leaves Gate 3 something
#     real to compare against `product_ttl_seconds` below.
#   * `product_ttl_seconds` — how long an individual product stays servable.
#     A SEPARATELY authored number from the ceiling, on purpose. A UBO answer
#     goes stale as ownership changes; ten minutes is this deployment's choice
#     and not a recommendation.
#   * `similarity_index_version` — the version identity this deployment assigns
#     to the screening corpus at its named boundary (INV-CH7-27, D-IMPL-38). The
#     builder does not mint one: a version derived from the parameters
#     artifact's pin would be identical across two different boundaries, which
#     is precisely the corpus identity the determinism contract distinguishes.
#   * `request_contract_key` — the Control Plane key this deployment registers
#     its class's request surface under (D-IMPL-98). The KEY is authored here;
#     the VERSION pinning it is minted by registering the parsed contract, on
#     exactly the `max_ttl_key` discipline above — which is why
#     `request-contract.yaml` declares no version of its own.
#   * `replay_record_class` — the artifact class the replay writer stores under.
#   * `query_pin_class` — the artifact class the executed graph queries are
#     stored under, so that every pin in the record's `graph_query_sequence`
#     resolves to the canonical bytes it names (T-15.2-28). A separate class
#     from the record's, because a record and the questions it pins are two
#     kinds of thing an auditor retrieves separately.
#   * `required_entity_classes` — what a COMPLETE assembly for this question
#     contains. C in the D_c product is the fraction of these the assembled
#     view actually holds, so a class the operators removed entirely shows up
#     as a completeness shortfall in the delivered debt rather than as a
#     quietly thinner answer (whitepaper §7.7.4). This deployment's list, not
#     the SDK's: only the deployment knows what its own question needs.
#   * `semantic_consistency` — S, DECLARED rather than measured, and the
#     honesty matters. The SDK ships a reference scorer for F and none for S,
#     so this number is a deployment assertion carried into the answer, and the
#     assessment's `scorers` tuple pins F alone — an unpinned factor and a
#     pinned one are different artifacts on purpose (D-IMPL-47, `NO_SCORER_PINS`).
#   * `artifact_store_dirname` — where under the run root the file-backed
#     ArtifactStore lives. A path relative to a caller-supplied root, so no
#     absolute location enters a content-hashed artifact.
#   * `source_refresh_recency` — WHEN EACH UPSTREAM SOURCE LAST PUBLISHED, and
#     this deployment declares it because nobody else can. D-IMPL-112 recorded
#     the gap in a KYC analyst's own terms: the delivered `debt.factors
#     .freshness` says how much of the fabric's decay budget has been eaten,
#     and says NOTHING about when the corporate registry last filed. The two
#     are different facts and the second is not derivable from the first — a
#     registry that publishes annually and filed last week is current, and one
#     that publishes nightly and filed last week is three hundred and sixty
#     four days of nothing.
#
#     DECLARED, not derived, and deliberately not read off any clock. Deriving
#     it from `observed_time` on an envelope would collapse it back into the
#     fact it exists to be distinct from — that is when the FABRIC learned
#     something, not when the SOURCE published it — and computing it from the
#     decision instant would make it a restatement of `now`. So it is authored
#     here, by the only party that knows: the deployment that operates the
#     feeds. The three references are this estate's own source system ids, the
#     same ones `events.yaml` stamps on every envelope, so an auditor can join
#     a refresh instant to the envelopes it covers by eye.
#
#     The SDK stores the pair and draws NO conclusion from it: no cadence, no
#     staleness threshold, no comparison against anything (D-IMPL-117 — *"a
#     slot for source-refresh recency, owing no definition of a source or a
#     cadence"*; D-IMPL-101, which deferred salience). Whether a registry that
#     last published in July is recent enough for a UBO decision taken in
#     August is this deployment's judgement to express in its own reporting,
#     and it is deliberately not expressed here.
#
# `plan_id` is deliberately NOT here. It lives in
# `projection-requirements.yaml`, the document that states the plan's operator
# set, because a value authored in two places is a value that can drift.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: fibo-kyc.product-governance

declaration:
  max_ttl_seconds: 1200
  product_ttl_seconds: 600
  similarity_index_version: "fibo-kyc-screening-corpus@2026-08-01"
  request_contract_key: fibo-kyc/product/ultimate-beneficial-ownership/requests
  replay_record_class: decision-replay-record
  query_pin_class: graph-query
  artifact_store_dirname: replay

  # What a complete UBO assembly holds. `registered_address` is deliberately
  # NOT here: the traversal is never given `registered_at`, so an address has
  # no business being counted as missing from an answer that does not need one.
  required_entity_classes:
    - party
    - corporation
    - ownership_stake
    - screening_candidate

  # Quoted, and validated as a decimal, for the reason `debt-profile.yaml`
  # states: this figure reaches the product's content address.
  semantic_consistency: "0.97"

  # [ADAPT] One entry per upstream source this deployment reads, keyed by the
  # source system id `events.yaml` stamps on its envelopes. Every instant names
  # its zone: the artifact loader refuses a zone-less timestamp rather than
  # guessing one, and so does `SourceRefreshWindow` (D-IMPL-38). Quoted so the
  # loader hands back text and `deployment.py` parses it explicitly — an
  # implicit YAML timestamp would be a conversion nobody wrote down.
  #
  # A source may appear at most once. Two refresh instants for one source
  # describe two facts claiming to be one, and this deployment does not author
  # the pair rather than authoring it and picking a winner later.
  #
  # [ADAPT] THESE REFERENCES STOP HERE (D-IMPL-124).
  #
  # They are THIS DEPLOYMENT'S OWN RECORDS, and a deployment is entitled to
  # know which of its sources published when — that is why they survive in this
  # document with their human-interpretable names intact. What changed under
  # `D-IMPL-124` is where they stop. `deployment.py` reads these three entries,
  # reduces them to a single `SourceRefreshWindow` — the oldest and the newest
  # of the instants below — and it is the WINDOW that crosses onto the
  # delivered product.
  #
  # So a consumer of the delivered product learns when the oldest and the
  # newest of this estate's sources published, and learns NOTHING about which
  # systems those are, nor how many there are. The reason, in this deployment's
  # own voice: a reader entitled to the answer is not thereby entitled to the
  # inventory of systems that produced it. Both shipped delivery paths
  # serialize the whole vessel verbatim to every principal who can reach the
  # product, and nothing in the assembly path is principal-scoped — so a
  # reference left on the vessel would tell every such reader that a system
  # called `name-screening` exists and when it last published, with no check
  # that they were entitled to that system's contents. Dave's ruling: *"the
  # field's purpose is freshness, not source enumeration."*
  #
  # The COUNT stops here too, and deliberately: the window carries no
  # cardinality, because how many systems this estate reads is source
  # enumeration in aggregate — it names none of them and still discloses the
  # size of the inventory — and it is not freshness.
  #
  # The reduction lives in `deployment.py` and NOT in the SDK. The SDK ships no
  # reducer taking per-source instants, because a reducer there would put a
  # source-bearing input type back on the public surface and would make the SDK
  # the party deciding which of a deployment's sources count toward the window.
  # The completeness of the set below is a fact only this deployment can
  # vouch for.
  source_refresh_recency:
    # The company registry the entity and stake records come from. Batch-filed
    # a week before the decision instant.
    - source_ref: corporate-registry
      refreshed_at: "2026-08-04T02:00:00+00:00"

    # The KYC master file. Refreshed nightly, so the most current of the three.
    - source_ref: kyc-registry
      refreshed_at: "2026-08-10T23:45:00+00:00"

    # The sanctions/PEP screening corpus, cut at the same boundary the
    # similarity index version above names. The oldest of the three, and the
    # one whose age a reader is most likely to want to know about — which is
    # exactly the judgement this document declines to make for them.
    - source_ref: name-screening
      refreshed_at: "2026-08-01T00:00:00+00:00"
