# yaml-language-server: $schema=../../../docs/schemas/ccf.operator-parameters.temporal.json
# Temporal category parameters (whitepaper §7.4; KYC/UBO domain, phase 16
# CONTEXT D-03).
#
# Read as: reconcile to the boundary on both temporal axes. Which of the
# bitemporal model's two axes a decision needs is a decision-class property, so
# it is declared rather than assumed — a flag nobody set is a flag nobody chose
# (D-IMPL-38).
#
# WHAT THIS FLAG BUYS HERE, CONCRETELY. `reader.as_of(at=boundary)` already cuts
# on the axis the fabric always knows: when it OBSERVED a claim. Setting this
# true adds the second cut — when the claim is VALID at the source. The signal
# stream carries one envelope that separates the two: a share transfer recorded
# in the registry before the decision instant and taking legal effect a month
# after it (`obs:17` in `events.yaml`). The fabric knows about it. It is
# correctly absent from an as-of-today answer, and this flag is what makes it
# absent. Set this false and Sarah Chen crosses the beneficial-ownership
# threshold in an answer about today, on the strength of a transfer that has not
# happened yet.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the value is [ADAPT]; the key `require_valid_at_boundary` is
# [MECHANISM].

semver: "1.0.0"

require_valid_at_boundary: true
