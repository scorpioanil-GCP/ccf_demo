  # system gets right, kept so the contrast with Jane Doe is visible.
  - envelope_id: kyc-001
    tenant_id: meridian-bank
    source:
      system_id: kyc-registry
    ingestion_timestamp: 2026-07-31T09:00:00Z
    observed_time: 2026-07-30T12:00:00Z
    raw_payload:
      party_ref: "http://example.org/fibo/JohnSmith"
      party_name: "John Michael Smith"
      party_nationality: "US"
      party_role: "Ultimate Beneficial Owner"
      party_classification: "kyc-disclosable"
      stake_ref: "rel:5"
      stake_owner_ref: "http://example.org/fibo/JohnSmith"
      stake_target_ref: "http://example.org/fibo/AcmeCorp"
      ownership_percent: "45.0"
      stake_classification: "kyc-disclosable"
      corporation_ref: "http://example.org/fibo/AcmeCorp"
