# yaml-language-server: $schema=../../../docs/schemas/ccf.signal-batch.json
# The KYC/UBO L1 signal stream — the envelopes this fabric OBSERVED (whitepaper
# §7.1; KYC/UBO domain, phase 16 CONTEXT D-03, D-04, D-05).
#
# WHERE THIS COMES FROM, AND WHY IT IS NOT THE WHOLE ESTATE.
# `source-estate.yaml` beside this file declares the *enterprise source estate*:
# 14 entities and 16 relationships in the shipped FIBO shape, materialised by
# `../source_estate.py` as standalone source-system files. This document is the
# SELECTION of that estate which the ultimate-beneficial-ownership product
# needs, expressed as L1 envelopes. The two are deliberately different things,
# and D-04 is why: CCF *reads* an enterprise estate and assembles selectively;
# it never mirrors an estate wholesale into its own graph. A signal stream that
# were a copy of the estate would be exactly the replication D-04 rejects.
#
# Every reference below is the estate's own `_id`, so the provenance of each
# envelope is checkable by eye against `source-estate.yaml`.
#
# ONE ENVELOPE HERE IS NOT IN THE ESTATE, AND THAT IS D-05.
# `obs:17` is an *observation*, not state: a share transfer recorded by the
# registry before the decision instant and taking legal effect a month after it.
# L1 is signal; L3 is state. See the temporal note on that envelope.
#
# The document adopts the SDK's OWN envelope vocabulary — `source: {system_id}`,
# `raw_payload:` — rather than a flat shape the loader would have to translate.
# A translation removed is one that cannot drift.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's, and
# every value is quoted text: a resolved claim's attributes are strings, and a
# YAML float would not survive canonical serialization anyway.
#
# HOW TO READ THE SHAPE. A stake is a resolved entity (see
# `resolution-spec.yaml` for why), so an envelope that names a stake and an
# entity emits the incidence edge between them:
#
#   * a stake held by a PERSON needs one envelope — the person, the stake and
#     the corporation it is held in all resolve from it, and both edges follow;
#   * a stake held by a CORPORATION needs two — one envelope resolves one
#     corporation, so the owner side and the target side are two records, which
#     is also how a source system emits them.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: everything under `raw_payload:` and every source system id is
# [ADAPT]; the envelope keys (`envelope_id`, `tenant_id`, `source`,
# `system_id`, `ingestion_timestamp`, `observed_time`, `raw_payload`) are
# [MECHANISM].

semver: "1.0.0"

tenant_id: meridian-bank

envelopes:
