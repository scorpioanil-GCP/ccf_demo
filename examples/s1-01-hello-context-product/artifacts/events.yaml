  # ==========================================================================
  # The future-effective transfer (D-05: L1 is signal, L3 is state).
  # ==========================================================================

  # A share transfer the registry recorded on 31 July which takes legal effect
  # on 1 September: a new investor acquiring 30.0% of the client. Both
  # timestamps are true and they are different facts. `ingestion_timestamp` is
  # when the fabric RECEIVED it — before the decision boundary, so
  # `reader.as_of` keeps it — and `observed_time` is when it becomes VALID at
  # the source, which is a month AFTER the boundary.
  #
  # `require_valid_at_boundary: true` in the temporal parameters is what makes
  # both the new party and his stake correctly absent from an answer about
  # 1 August. Turn that flag off and he appears as a beneficial owner at 30.0%
  # on the strength of a transfer that has not happened yet. This envelope is
  # the only reason that flag is checkable rather than decorative.
  #
  # NEITHER OF THESE TWO ENTITIES IS IN THE ESTATE, AND THAT IS D-05: L1 is
  # signal, L3 is state. An observation stream carries things the estate does
  # not yet know about; that is what makes it an observation stream.
  #
  # It asserts NO existing entity, and that is deliberate rather than
  # incidental. `valid_from` is part of a claim's content identity, so
  # re-asserting a corporation at a future validity would mint a NEW claim that
  # supersedes the current one — and the current one, superseded before the
  # boundary, would drop out of the as-of answer. The fabric is right to do
  # that; a future-dated record of an entity is a future-dated record of that
  # entity. An envelope announcing a pending transfer therefore names the
  # pending parties and nothing else, which is also what a registry emits.
  - envelope_id: kyc-019
    tenant_id: meridian-bank
    source:
      system_id: kyc-registry
    ingestion_timestamp: 2026-07-31T20:00:00Z
    observed_time: 2026-09-01T00:00:00Z
    raw_payload:
      party_ref: "http://example.org/fibo/MarcusVale"
      party_name: "Marcus Vale"
      party_nationality: "US"
      party_role: "Incoming Shareholder"
      party_classification: "kyc-disclosable"
      stake_ref: "obs:17"
      stake_owner_ref: "http://example.org/fibo/MarcusVale"
      stake_target_ref: "http://example.org/fibo/AcmeCorp"
      ownership_percent: "30.0"
      stake_classification: "kyc-disclosable"
