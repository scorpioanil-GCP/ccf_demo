# yaml-language-server: $schema=../../../docs/schemas/ccf.operator-parameters.similarity.json
# Similarity category parameters (whitepaper §7.4; KYC/UBO domain, phase 16
# CONTEXT D-03).
#
# Read as: rank name-screening hits against the client's registered legal name
# and keep those at or above 40% token overlap.
#
# WHY THIS IS NON-TRIVIAL HERE. The estate carries two planted near-duplicates,
# and they are near-duplicates of DIFFERENT entities. "Acme Global Trading
# Corporation Inc." shares three of five tokens with the client's own legal name
# and scores 60; "Beta Investment Holdings LLC" shares none and scores 0. One
# survives the floor and one does not, so "similarity did something" is
# distinguishable from an identity function. Name screening that cannot tell
# those two apart is the failure mode this operator exists to have an opinion
# about.
#
# `similarity_corpus_attribute_by_class` lives HERE rather than in the
# resolution spec: one artifact, one consumer (D-03). The SDK holds no corpus;
# the deployment says what text means "this thing". Two rules govern it and they
# get opposite answers (plan 15-11):
#
#   * a class ABSENT from this map contributes no corpus entry, silently — the
#     map is this deployment's statement of which classes are rankable. Note
#     what that means here: `corporation` is absent, so the ownership chain is
#     never ranked and never at risk of being ranked away. Only screening hits
#     are ranked, which is the only place ranking belongs;
#   * an entity of a class this map NAMES that carries no such attribute is
#     REFUSED at registry-build time. Refuse, never repair: skipping it would be
#     a governed omission produced by no rule anyone wrote down.
#
# `index_version` — the corpus's version identity — IS here, as of `24.11-02b`
# (`D-IMPL-292`). It used to be declared in `product-governance.yaml`, an
# adopter-namespaced document the SDK cannot interpret, and carried to
# `build_operator_registry` by hand in `deployment.py` and `spine.py`. Dave
# ruled that wrong: *"it must not remain an ungoverned deployment-supplied
# semantic value"*, and *"declaration owns the version -> resolver consumes it
# -> deployment supplies the implementation, not an alternate semantic
# version."* It sits beside the corpus map for the same reason the corpus map
# sits here: both are read at index CONSTRUCTION, before the operator exists.
#
# Declared here, it is content-hashed into a registered artifact — so
# re-authoring the corpus identity necessarily shows up as a changed pin in
# replay dimension 2 (INV-CH7-27). Declared in code, it showed up nowhere.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the query text, the threshold, every entity class name and the
# attribute name are [ADAPT]; the keys `query`, `minimum_score_percent`,
# `ranked_entity_classes`, `similarity_corpus_attribute_by_class` and
# `index_version` are [MECHANISM].

semver: "1.0.0"

# The client's own registered legal name, as the screening query.
query: "Acme Corporation Inc."
minimum_score_percent: 40
ranked_entity_classes:
  - screening_candidate

# The attribute the screening corpus is built from, per ranked class.
similarity_corpus_attribute_by_class:
  screening_candidate: screening_legal_name

# What THIS deployment calls the corpus state above. Re-author it when the
# screening corpus changes; the SDK will not mint one, because a version it
# derived from this document's own pin would be identical across two different
# corpus boundaries — precisely the identity replay needs to tell apart.
index_version: "fibo-kyc-screening-corpus@2026-08-01"
