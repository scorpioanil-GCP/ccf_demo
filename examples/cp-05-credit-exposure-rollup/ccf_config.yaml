# yaml-language-server: $schema=../../docs/schemas/ccf.declared-artifact.json
#
# THE CONTROL PLANE DOCUMENT for cp-05 — what this deployment is PERMITTED to
# do. `deployment.py` interprets it; it is data, and the program that reads it
# holds none of these values (CLAUDE.md §6.4).
#
# READ-SIDE VOCABULARY IS NOT HERE. The anchor, the pinned instant and the
# request parameters live in `artifacts/question.yaml`. A question is not a
# permission.

semver: "1.0.0"
tenant_id: cp-05-demo
backend: sqlite

product_class:
  schema_name: credit-risk.exposure-rollup
  schema_version: "1.0.0"

  # THE RUNTIME INVARIANT THIS CLASS HOLDS ITSELF TO, declared so the fabric can
  # execute it and replay can name it (`R-11`, `D-IMPL-282`). The predicate is
  # this deployment's — `assembler.py::reconciliation_guard`, which catches the
  # PLAUSIBLE WRONG ANSWER the other three gates cannot: an adjusted total
  # exceeding gross means step 5.2 removed the same exposure twice. The Control
  # Plane owns the identity; the deployment supplies the implementation.
  declared_product_gate:
    gate_id: cp-05.reconciliation-guard
    gate_version: "1.0.0"

  # THE PRODUCT'S DEFAULT FITNESS BAR — one authority, and it is this one.
  #
  # `D-IMPL-251` C1=A: a class's `default_debt_tolerance` is a declared
  # CHARACTERISTIC that reaches the Authority layer as a DEFAULT under the
  # SDK's own parameter name — never as a ceiling. So the governed chain is
  # policy boundary > caller value > product default, and a consumer may
  # specialize their own fitness bar without changing this product.
  #
  # It lives HERE and not in `request_contract.argument_defaults` because the
  # value is consumed INSIDE the governed determination: `refuse_over_tolerance`
  # compares assessed Context Debt against it. A default the SDK cannot read is
  # a default that does not govern — measured, it served a D_c of 1.000 that
  # should have been withheld.
  serve_obligations:
    default_debt_tolerance: "0.25"

  # THE ANCHOR FLIPS AT THIS RUNG — spec §B.1 element 3, `artifacts/ttl.yaml`.
  # `from_decision`, against rungs 02 and 04's `from_entity_freshness`. An
  # exposure is scoped to the decision taken against it; no entity's validity
  # period governs it.
  ttl_anchor: from_decision

  # Every stage is deterministic arithmetic or a typed graph walk. No semantic
  # stage is invoked and no LLM client may be imported by any module
  # implementing this product (spec §C.2).
  assembly_mode: algorithmic

  max_ttl_key: cp-05/product/credit-exposure-rollup/max-ttl

  # THE SDK's OPERATOR REGISTRY IS A CLOSED VOCABULARY, and these are the two
  # entries this product requires. `policy.principal-subgraph` scopes the walk
  # to what the principal may see; `traversal.typed-neighborhood` walks
  # BIDIRECTIONALLY over several predicate types in one pass —
  # `typed-descendants` would be one-directional, and a guarantee RECEIVED
  # matters as much as one given.
  #
  # THIS IS NOT THE SAME LIST AS `operators_invoked` IN LINEAGE, and the
  # difference is worth stating because it invites a mistake. The vault's
  # §B lineage names five — Resolve, Policy, Traversal, Enrich, Aggregate.
  # `operators_invoked` is `frozenset[str]`, *"the operator set the producer
  # DECLARES it ran"* (`src/ccf/products/contract.py::ProductLineage`),
  # so all five are declarable. `required_operator_keys` is different: it is
  # checked against the REGISTRY at boot, and Resolve, Enrich and Aggregate are
  # not registered operators — they are assembly steps. An implementer who
  # tries to register a `Resolve` operator to make the two lists match has
  # misread which list is constrained.
  required_operator_keys:
    - policy.principal-subgraph
    - traversal.typed-neighborhood

operators:
  policy.principal-subgraph:
    classification_attribute_by_class:
      exposure_anchor: family_id
      exposure_member: family_id
    # DECLARED AS REQUEST-BOUND, which is what this deployment always meant and
    # previously could not say (`24.10-F-11`, `D-IMPL-295`). The envelope is not
    # a constant: which family a determination may admit is knowable only per
    # request, so the value is supplied by the GOVERNED EFFECTIVE request — the
    # caller's `families` after class defaults, policy bounds and technical
    # capabilities have been folded, never the raw caller value.
    #
    # This REPLACES `permitted_classifications: []`, and the replacement is the
    # point rather than a spelling change. The empty list was valid and it meant
    # what it said — ADMIT NOTHING — so the fabric honestly served a family of 0
    # over an L3 holding 77 entities, and `deployment.py` substituted a family
    # into the resolved artifact at runtime to get an answer. That substitution
    # was an ungoverned write to a Control Plane declaration: invisible to the
    # pins and to replay. The binding makes the same intent a declaration.
    #
    # A literal and a binding cannot both be written here — they are two
    # variants of one field — so `[]` keeps its honest meaning for every
    # deployment that means it.
    permitted_classifications:
      source: effective_request
      parameter: families

  # THE FOUR PREDICATE TYPES OF THE ONE WALK — spec §D.3 step 3. Declared here
  # so the operator the fabric registers and the walk the assembler issues are
  # the same walk; a relationship type present in one and absent from the other
  # would be a traversal the Control Plane never permitted.
  #
  # `depth_limit` is the OPERATOR's technical ceiling and is deliberately not
  # the request contract's bound of 5. The request bound is what this PRODUCT
  # offers a caller; the operator ceiling is what the BACKEND can be asked for.
  # One number serving as both would make a product decision look like a
  # capability limit.
  traversal.typed-neighborhood:
    seed_entity_classes:
      - exposure_anchor
    relationship_types:
      - owns
      - isUltimatelyConsolidatedBy
      - isGuarantorOf
      - crossDefaultsWith
    depth_limit: 6

request_contract:
  class_id: cp-05.request-contract
  role: register
  registration: typed
  schema_name: credit-risk.exposure-rollup
  schema_version: "1.0.0"

  arguments:
    properties:
      depth:
        type: integer
        description: >-
          ownership walk depth. Absent takes the declared default below, read
          from this declaration and never invented at serve time. Depth is part
          of PRODUCT IDENTITY, not a tuning knob — measured, the family is 21
          nodes at depth 1, 46 at depth 2 and 77 at depth 3, so two depths are
          two answers and two content addresses.
      materiality:
        type: number
        description: >-
          entities below this share of group exposure are aggregated into a
          residual rather than enumerated. It does NOT apply to zero-exposure
          entities reached by cross-default — absorbing those would delete the
          finding the traversal exists to produce (spec §C.4 trap 2).
      follow_guarantees:
        type: boolean
        description: >-
          traversal scope, NOT measurement policy. Where this disagrees with the
          intent's `counts_guarantees`, the DEFINITION governs the measure and
          this flag governs the walk, and the conflict is reported as a finding
          rather than resolved silently (spec §B.4).
      follow_cross_default:
        type: boolean
        description: traversal scope, on the same reading as `follow_guarantees`.
      debt_tolerance:
        type: number
        description: >-
          the MOST Context Debt this consumer will accept and still act on the
          answer. **The fabric owns truth and quantified uncertainty; the
          consumer owns fitness, within policy boundaries.** Two clients may ask
          the same business question with different fitness requirements, and
          the same assembled determination may legitimately be fulfilled for one
          and refused for the other. Folded exactly once with the class default
          and any applicable policy constraint by
          `ccf.products.constraints::resolve_effective_request`; the fulfillment
          check downstream performs no fold of its own.
      basis:
        type: string
        description: >-
          `committed`, `outstanding` or `both`. `both` is the default and is
          what makes the undrawn column meaningful — `internal-appetite` sets
          `counts_undrawn=false`, which is only observable when both bases ship.
      families:
        type: array
        description: >-
          the corporate families this determination may admit, supplied by the
          caller and folded through `resolve_effective_request` before it
          reaches the policy operator (`D-IMPL-295`). AN ARRAY AND NOT A
          STRING, and the plural is not cosmetic: it binds to
          `permitted_classifications`, which is a SET, and the SDK supplies a
          bound value without converting it — a scalar widened to a
          one-element set would be a transform, and the binding performs none.
          Two families are two parameter-set hashes and therefore two content
          addresses, so the replay record says WHICH families a decision
          admitted rather than leaving it to be inferred from the payload.
    # NO `required` ENTRIES. `lei` and `intent` are NOT arguments: they are
    # TOP-LEVEL fields of `ccf.products.request::ProductRequest` (`subject` and
    # `intent`), and the SDK REFUSES a contract that declares either under
    # `arguments.properties` — *"which is a shadow of the top-level request
    # field ... what a class serves is declared once, on
    # ProductDiscovery.intents, and judged there"* (`D-IMPL-264` D-01,
    # amendment 1 F-2). An earlier draft of this document declared both and was
    # refused at construction. Every remaining argument carries a declared
    # default, so none is required.
    #
    # `families` IS REQUIRED, and it is the one exception (`D-IMPL-295`). Every
    # other argument has an author's default because a caller who says nothing
    # still asks a well-formed question. There is no honest default here: the
    # SDK cannot invent which family a caller may see, and a default that
    # admitted some family would grant scope nobody declared, while one that
    # admitted none would restore the family-of-0 this binding exists to end.
    # So the question is malformed without it, and it is refused by name.
    required:
      - families

  # READ FROM THE DECLARATION, NEVER INVENTED AT SERVE TIME. The vault declares
  # each of these; this deployment does not recalibrate them.
  # QUOTED, AND NOT AS A STYLE CHOICE. The Control Plane REFUSES a bare float:
  # *"float values are not admissible in a Control Plane artifact (not bit-stable
  # across platforms); quote the value so it parses as text and is validated as a
  # decimal."* It caught this on the first boot of this config. A float
  # materiality would have made the content address platform-dependent — the
  # product would have reproduced on the machine that built it and nowhere else.
  argument_defaults:
    # THE AUTHOR'S DEFAULT FITNESS BAR, not the product's truth. A consumer who
    # says nothing is treated as requiring a reasonably trustworthy answer.
    # `debt_tolerance` IS DELIBERATELY ABSENT HERE — one product-default
    # authority, declared on `product_class.serve_obligations` above where the
    # SDK reads it. Two independent defaults for one parameter is the
    # duplication this migration exists to remove.
    depth: 3
    materiality: "0.05"
    follow_guarantees: true
    follow_cross_default: true
    basis: both

  # A DEPTH ABOVE THE CEILING IS REFUSED BY NAME, NEVER CLAMPED. Clamping would
  # answer a question the caller did not ask and label it as the one they did.
  argument_bounds:
    depth:
      minimum: 1
      maximum: 5
    materiality:
      minimum: "0.0"
      maximum: "1.0"
    debt_tolerance:
      minimum: "0.0"
      maximum: "1.0"

  # DECLARED AND REFUSED, not silently ignored — spec §B.4, `artifacts/question.yaml`.
  # ARGUMENT NAME -> THE AUTHORED REASON IT IS UNSUPPORTED, and the reason is
  # the point (`24.10-F-12`, `D-IMPL-288` (2)). This was a bare list until the
  # Control Plane learned to refuse one at boot: a sequence names WHICH
  # arguments are refused and never WHY, and `deployment.py` filled the gap in
  # Python with the constant "not supported at this tier" — filler standing
  # where an explanation belongs. The sentence below is transcribed from this
  # product's own `artifacts/question.yaml`, where it was already written.
  unsupported_arguments:
    as_of: >-
      this product's TTL is anchored `from_decision` (spec §B.1 element 3), so
      the answer is scoped to the decision being taken now and there is no
      entity validity period an `as_of` could address; Fluree's ledger `t` is
      TRANSACTION time and `D-IMPL-88` rules it must not back `as_of`

# THE TWO ENTITY CLASSES THE WALK PRODUCES, and what identifies each.
#
# `entity_uri` is the identity key on BOTH — the Fluree subject URI, which every
# family member has. `lei` is an ATTRIBUTE and not an identity, because 58 of
# this family's 77 members carry no LEI at all (spec §C.1). A resolution spec
# keyed on LEI would silently drop three quarters of the family and return a
# smaller, tidier, wrong answer.
# ============================================================================
# POLICY CONSTRAINTS — the boundary that outranks a caller
# ============================================================================
#
# THE AUTHORITY MODEL, and it is the SDK's own: `policy > caller > default`,
# with `technical` bounding all three. `ccf.products.provenance::Authority` is
# the literal `['default', 'caller', 'policy', 'technical']`, and
# `ccf.products.constraints::resolve_effective_request` applies the precedence.
# This example does not implement that ordering; it DECLARES into it.
#
# WHY MATERIALITY IS A CALLER PARAMETER AT ALL. The threshold expresses the
# CONSUMER'S DECISION TOLERANCE, not a fact about the family. 5% is the product
# DEFAULT, not the product TRUTH. The product truth is *"return family exposures
# above the effective materiality threshold"*, and the effective threshold is
# resolved at request time. Three clients wanting 2%, 5% and 10% are three
# parameterizations of ONE product, not three products.
#
# WHAT THIS PARTICULAR CONSTRAINT SAYS. Under `internal-appetite` — the tightest
# regime, 15% of capital against the other two at 25% — a caller may NOT ask for
# a COARSER threshold than the default. A higher materiality shows FEWER
# entities, so raising it under an appetite review is asking to be shown less of
# the book than the regime requires. Under the other two intents the caller is
# unconstrained and may ask for 2% or 10% freely.
#
# `overridable: false` — this boundary is not waivable by an entitled caller.
# A regime that can be asked to look away is not a boundary.
# Keyed by the Control Plane KEY the constraint registers under — one key, one
# artifact, one content hash. Two constraints of one `policy_id` are two
# artifacts under two keys, never one document with two bounds.
policy_constraints:
  cp-05/policy/materiality-ceiling/internal-appetite:
    semver: "1.0.0"
    policy_id: internal-appetite-materiality-ceiling
    parameter: materiality
    operator: maximum
    value: "0.05"
    overridable: false
    source_authority: internal credit policy
    effective_from: "2026-01-01T00:00:00+00:00"
    reason: >-
      Internal appetite review must see positions the group-limit test may
      summarize. A coarser threshold than the product default would hide
      exposure the regime exists to examine.
    applies_to:
      product_class: credit-risk.exposure-rollup
      intent: internal-appetite

  cp-05/policy/debt-tolerance-ceiling/regulatory-large-exposure:
    semver: "1.0.0"
    policy_id: regulatory-debt-tolerance-ceiling
    parameter: debt_tolerance
    operator: maximum
    value: "0.10"
    overridable: false
    source_authority: regulatory reporting policy
    effective_from: "2026-01-01T00:00:00+00:00"
    reason: >-
      A regulatory large-exposure return may not be founded on context the
      fabric holds in low confidence. A consumer may declare a stricter bar than
      this; none may declare a looser one.
    applies_to:
      product_class: credit-risk.exposure-rollup
      intent: regulatory-large-exposure

resolution:
  # `relationship_rules: []` IS DELIBERATE AND IS NOT AN OMISSION.
  # `AssemblyWorker.ingest` mints relationship claims by CLASS CO-OCCURRENCE:
  # every declared rule whose subject and object classes both resolve from one
  # envelope fires, and nothing selects the predicate from the payload. cp-04
  # measured one envelope minting two entities and TWELVE relationships, six of
  # them self-loops (`D-35`). Each normalized edge is therefore admitted through
  # `worker.admit_relationship_claim` carrying its TRUE predicate. Still one
  # writer, still L2, and no file under `src/` changes.
  relationship_rules: []
  entity_rules:
    # THE ANCHOR IS ITS OWN CLASS, and the traversal operator's
    # `seed_entity_classes` names it. Minting every node as `exposure_member`
    # leaves the operator with nothing to seed from — a walk that starts nowhere
    # returns nothing, and the empty-operator guard would report an empty family
    # for a graph that is fully populated.
    - match_key: anchor_ref
      # SEC-023 (D-IMPL-372): only the named sources may assert the attribute the Policy operator admits on. A claim from any other source is refused and audited, and without this declaration the deployment refuses to boot.
      attribute_authorities: {family_id: [exposure_graph]}
      entity_class: exposure_anchor
      identity_keys:
        - entity_uri
      attribute_keys:
        - lei
        - label
        - family_id
    - match_key: member_ref
      attribute_authorities: {family_id: [exposure_graph]}
      entity_class: exposure_member
      identity_keys:
        - entity_uri
      attribute_keys:
        - lei
        - label
        - family_id

# ============================================================================
# THE HALF-LIFE TABLE — spec §E.1
# ============================================================================
#
# THE SPREAD IS THE DESIGN CONSTRAINT. The fastest class moves ~2,190x faster
# than the slowest. A single product-level half-life would either declare a
# stable ownership graph stale every four hours, or serve a balance hours after
# it stopped being true. Per-class λ_c is not a refinement here; it is the only
# correct shape.
half_life:
  outstanding_balances:
    half_life_seconds: 14400         # ~4h — drawdowns and repayments land intraday
    decay_driver: drawdown-repayment
    supersession_event: drawdown-or-repayment-posted-to-the-facility
  guarantee_structure:
    half_life_seconds: 31536000      # ~365d — amendment-driven
    decay_driver: guarantee-amendment
    supersession_event: ex-10-amendment-touching-the-guarantee
  cross_default_structure:
    half_life_seconds: 31536000      # ~365d — amendment-driven
    decay_driver: cross-default-amendment
    supersession_event: ex-10-amendment-touching-the-cross-default-clause
  ownership_edges:
    half_life_seconds: 15552000      # ~180d — inherited from rung 04
    decay_driver: acquisition-disposal-restructuring
    supersession_event: gleif-rr-cdf-delta-touching-either-endpoint
  group_limit_definition:
    half_life_seconds: 15552000      # ~180d — policy review cycle
    decay_driver: credit-policy-review
    supersession_event: limit-definition-row-replaced

# ============================================================================
# THE DEBT PROFILE — spec §E.2
# ============================================================================
#
# ONLY THE BALANCE COMPONENT FAILS CLOSED, and the asymmetry is deliberate. A
# stale ownership edge produces an answer slightly out of date; a stale balance
# produces an answer that is WRONG ABOUT MONEY while looking current.
debt_profile:
  risk_sensitivity: "1.0"
  forced_llm_threshold: "0.60"
  fail_closed_threshold: "0.77"

policy:
  class_id: cp-05.policy-bundle
  role: register
  registration: typed
  regime: credit-exposure-rollup-entitlement

default_perspective:
  principal_id: PRIN-CRO-001
  role: credit-officer

# WHERE THIS DEPLOYMENT'S DECISION RECORDS GO — `R-12` (`D-IMPL-282`).
#
# THIS SECTION WAS ONCE REFUSED, and `artifacts/replay.yaml` records the
# refusal verbatim: the Control Plane's section vocabulary was closed and did
# not include `replay`, so a deployment's replay binding had nowhere declared
# to live. cp-05 logged that as a finding (spec §F.4) rather than working
# around it silently. Phase 24.10's `R-12` added the ninth section and closed
# it, so the binding is declared HERE now and the resolver consumes it — no
# argument, no module constant, no artifact read by hand.
replay:
  record_class: ccf.cp-05.decision-replay-record
  query_pin_class: ccf.cp-05.query-pin
  store_dirname: artifacts-store
