# Hello-context event stream — L1 signal envelopes (financial-services
# domain, D-07; authored fresh — nothing here is ported).
#
# A handful of events, but not a flat happy path: the stream is built so the
# fabric has something real to do at each layer.
#
#   * ev-102 asserts the SAME borrower as ev-101 from a DIFFERENT source with
#     identical attributes -> one claim whose lineage accumulates by
#     set-union, not a second node.
#   * ev-105 carries a stale, off-topic legacy rating narrative that the
#     similarity operator must rank out — so "similarity did something" is
#     distinguishable from an identity function.
#   * ev-106 carries a RESTRICTED signal, which the policy operator must
#     substitute out along with the edge that would otherwise leak its
#     existence by absence.
#
# The two signals that survive are exactly what changes the decision the
# served context informs: liquidity coverage strengthened and covenant
# headroom widened -> extend the credit line rather than hold it.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: every payload key and value, source system ids, timestamps.
# [MECHANISM]: the envelope field names (`envelope_id`, `source_system_id`,
# `ingestion_timestamp`, `observed_time`, `payload`).

