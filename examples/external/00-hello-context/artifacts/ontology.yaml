# Hello-context ontology — the deployment's declared vocabulary
# (financial-services domain, deliberately small: one borrower, one credit
# facility, a handful of financial signals — D-07; authored 100% fresh,
# nothing ported from any prior example or system).
#
# Everything in this file is a *value*: entity classes, relationship types,
# attribute names, identifiers. None of it exists in `/src`, and none of it
# exists in `serve.py` (CLAUDE.md §6.4 No-Hardcoding Rule) — the server is
# thin loading-and-serving logic over this artifact.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: tenant_id, entity classes, relationship types, attribute names.
# [MECHANISM]: `entity_rules`, `relationship_rules`,
# `classification_attribute_by_class`,
# `similarity_corpus_attribute_by_class` and their inner field names.

schema_version: "1.0.0"
artifact_version: "1.0.0"

tenant_id: first-meridian-bank

# Source payload vocabulary -> E nodes. `match_key` selects a rule by
# presence; `identity_keys` mint the canonical URI, so the same borrower
# arriving from two source systems converges on one node without either
# system knowing about the other.
entity_rules:
  - match_key: borrower_ref
    entity_class: borrower
    identity_keys: [borrower_ref]
    attribute_keys:
      - borrower_name
      - borrower_sector
      - borrower_classification

  - match_key: facility_ref
    entity_class: credit_facility
    identity_keys: [facility_ref]
    attribute_keys:
      - facility_kind
      - facility_limit
      - facility_classification

  - match_key: signal_ref
    entity_class: financial_signal
    identity_keys: [signal_ref]
    attribute_keys:
      - signal_kind
      - signal_summary
      - signal_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence. Subjects are
# chosen so the traversal below walks forward from the borrower seed.
relationship_rules:
  - relationship_type: holds
    subject_entity_class: borrower
    object_entity_class: credit_facility

  - relationship_type: evidenced_by
    subject_entity_class: credit_facility
    object_entity_class: financial_signal

# Which attribute carries each class's policy classification — per class,
# because a signal's sensitivity and a facility's are different fields.
classification_attribute_by_class:
  borrower: borrower_classification
  credit_facility: facility_classification
  financial_signal: signal_classification

# The attribute the similarity corpus is built from, per ranked class. The
# SDK holds no corpus; the deployment says what text means "this signal".
similarity_corpus_attribute_by_class:
  financial_signal: signal_summary
