# Hello-context Control Plane bundle (financial-services domain, D-07 —
# authored fresh; deliberately small: one entity focus, one decision).
#
# Every number, threshold, version identifier, query string and instant the
# example uses is here. `serve.py` holds none of them: MAX_TTL has no SDK
# default (D-IMPL-39), operator parameters are declared artifacts with no
# silent defaults (D-IMPL-38), and every domain value is deployment
# configuration (CLAUDE.md §6.4).
#
# The keys are deployment vocabulary too. The SDK never enumerates Control
# Plane keys; the fabric is told which ones to pin.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: key paths, regime/jurisdiction values, classifications, the
# similarity query, entity classes, relationship types, principal/role
# strings, timestamps, TTL numbers.
# [MECHANISM]: every field name (`keys`, `policy_bundle`,
# `operator_parameters`, `perspective`, `decision`, `artifacts`).

schema_version: "1.0.0"
artifact_version: "1.0.0"

keys:
  resolution_spec: first-meridian-bank/entity-resolution-spec
  policy_bundle: first-meridian-bank/policy-bundle/credit-desk
  max_ttl: first-meridian-bank/product/credit-context/max-ttl

# The policy bundle in force. A *version* of it is resolved from the Control
# Plane, stamped onto every claim at assembly, and carried into the product's
# lineage — which is what the replay record pins (whitepaper §7.10).
policy_bundle:
  regime: first-meridian-credit-desk
  jurisdiction: US
  permitted_classifications:
    - internal

# Per-class TTL ceiling (D-IMPL-39). Ten minutes is a value this deployment
# chose, not a recommendation.
max_ttl_seconds: 600

# Declared operator parameter sets (D-IMPL-38). Read as: the credit-desk
# perspective may see internally-classified state; rank financial signals
# against the covenant/liquidity query at or above 30%; reconcile to the
# boundary on both temporal axes; expand two hops from the borrower over
# these typed edges.
operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "covenant headroom liquidity quarter"
    minimum_score_percent: 30
    ranked_entity_classes:
      - financial_signal
    index_version: "first-meridian-signal-corpus@2026-07-01"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - borrower
    relationship_types:
      - holds
      - evidenced_by
    depth_limit: 2

perspective:
  principal_id: credit-desk-201
  role: credit-analyst

# The decision's instants. Explicit inputs, never clock reads: the fabric
# boot is deterministic because it reads these declared instants.
decision:
  temporal_boundary: 2026-07-01T10:00:00Z
  now: 2026-07-01T10:00:05Z

# Artifact classes for the file-backed ArtifactStore this deployment files
# its serve-side records under. Deployment vocabulary; the SDK enumerates
# no artifact classes.
artifacts:
  replay_record_class: decision-replay-record
  serve_request_class: serve-request-record
