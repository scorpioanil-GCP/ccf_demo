# Hello-context token table (D-12: bearer auth on from day one, no
# anonymous mode; D-26 verifier+settings precedent).
#
# The example's in-server token source reads this table; no token value,
# client identifier, scope, or lifecycle status exists in code (§6.4;
# CINV-01). These are SYNTHETIC tokens for a runnable demonstration —
# illustrative values, never production credentials. A real deployment
# supplies its own TokenSourceProtocol implementation backed by its
# identity infrastructure.
#
# One ACTIVE external-analyst entry (the four client legs present it), and
# one REVOKED entry that backs the bad-token 401 refusal assertion — every
# refusal demonstrated from artifact data, never from a hardcoded bad-token
# string.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the token source — do not rename

schema_version: "1.0.0"
artifact_version: "1.0.0"

tokens:
  - label: analyst
    token: fmb-external-context-token-2026
    client_id: external-analyst-07
    scopes: ["context:read"]
    status: active
  - label: revoked
    token: fmb-external-context-token-2025
    client_id: external-analyst-07
    scopes: ["context:read"]
    status: revoked
