# Hello-context product class — the ONE typed Context Product this fabric
# serves (D-07: one product, one entity focus, one decision).
#
# The decision the served context visibly changes: extend or hold the
# borrower's revolving credit line. The two surviving signals (liquidity
# coverage strengthened; covenant headroom widened) are what tip it to
# `extend` — delete ev-103/ev-104 from events.yaml and the expected block
# below stops holding.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: schema_name, plan_id, TTL numbers, the focus entity, the
# `expected:` values.
# [MECHANISM]: every field name (`product_class`, `focus`, `expected`).

schema_version: "1.0.0"
artifact_version: "1.0.0"

product_class:
  schema_name: first-meridian-bank.credit-context
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: first-meridian-bank.credit-context.plan
  product_ttl_seconds: 300

# The single entity focus of the hello-world scenario. The `get_context`
# tool resolves requests against this reference; anything else is not
# servable.
focus:
  entity_ref: "FMB-BRW-0007"
  decision: "extend-credit-line"

# What the served product should contain, as declared by the deployment
# that authored the events. serve.py asserts against these instead of
# carrying domain expectations of its own.
expected:
  entity_classes:
    - borrower
    - credit_facility
    - financial_signal
  relationship_types:
    - evidenced_by
    - holds
  entity_count: 4
