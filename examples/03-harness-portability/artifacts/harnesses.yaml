# Per-harness deployment values for the portability drive (CLAUDE.md §7.3;
# D-IMPL-24; D-09 no-model discipline).
#
# Every value here is a *deployment* value, which is why none of it lives in
# example code or in `/src`: a model identifier, an MCP server name, a
# session/thread identifier, and the fields a harness reports back are the
# deployment's and the vendor's, never the SDK's (No-Hardcoding Rule §6.4).
# The reported model is deliberately *not* the configured `model` in each
# block: the fabric records what it invoked and the harness records what it
# invoked, and a drive that used one value for both could not tell a
# governed claim from a harness-reported one (T-06-62).
#
# In deterministic mode none of the configured models is ever invoked: the
# legs run real harness loop machinery over scripted/no-model transports,
# and the driver installs a guard that fails the run if anything opens a
# socket (D-02, T-08-25).

claude-agent:
  model: claude-sonnet-4-5
  mcp_server_name: atlas-skills
  mcp_server_version: "1.0.0"
  reported_model: claude-sonnet-4-5-20250929
  session_id: 9d2f4a6b-1c3e-4f5a-8b7d-0e1f2a3b4c5d
  result_subtype: success
  # The scripted user turn the real ClaudeSDKClient session sends over the
  # in-process wire — a drive marker, not a prompt.
  drive_turn: portability-drive
  input_tokens: 812
  output_tokens: 341

