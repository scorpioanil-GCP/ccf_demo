# Harness-portability agent definition — THE one agent definition all three
# harness legs share byte-identically (CLAUDE.md §6.1/§6.5; EXAM-04, D-01).
# A declared, versioned Control Plane artifact (D-IMPL-28), e-commerce
# domain (D-IMPL-52).
#
# This file deliberately names no harness — no vendor, no SDK, no loop.
# Harness binding happens at runtime through each HarnessAdapterProtocol
# adapter (§7.3), never in the definition (§6.5). All six specialization
# axes are here, as values; `/src` and the example code hold none of them
# (No-Hardcoding Rule §6.4). Decimals are quoted so they parse as text,
# never floats (D-IMPL-26).

keys:
  agent_definition: atlas-commerce/agents/order-experience-insights

# The referenced Control Plane artifacts the driver registers so the factory
# can resolve the definition's axis-4/axis-5 refs through Control Plane
# resolution (DESIGN.md §3.5 — never raw storage). Keys mirror the versioned
# URIs below: {tenant}/{artifact_class}/{name}.
referenced_artifacts:
  policy_regime:
    key: atlas-commerce/policy-bundle/order-operations
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: order-operations
      permitted_classifications: [internal]
  halflife_debt_profile:
    key: atlas-commerce/debt-profile/order-window-review
    class_id: debt-profile
    semver: "1.0.0"
    declaration:
      review_cycle: per-shift
      risk_sensitivity: "1.1"
      forced_llm_threshold: "0.35"
      fail_closed_threshold: "0.80"

agent_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: order-experience-insights
  tenant: atlas-commerce

  # axis 1 — ordered archetype list (D-IMPL-19)
  archetypes: [analytics_insights]

  # axis 2 — context contract: the product class the fabric in this example
  # actually serves (controlplane.yaml `product_class`), so every leg
  # consumes a real gated product.
  context_contract:
    consumes:
      - product_class: atlas-commerce.order-experience-context
        schema_version: "1.0.0"

  # axis 3 — perspective (Π role-conditioning)
  perspective:
    role: commerce-analyst
    selection_params:
      region: pacific-coast

  # axis 4 — policy regime (versioned-URI ref, never inline)
  policy_regime:
    ref: "ccf-artifact://atlas-commerce/policy-bundle/order-operations@1.0.0"

  # axis 5 — half-life and debt profile (versioned-URI ref)
  halflife_debt_profile:
    ref: "ccf-artifact://atlas-commerce/debt-profile/order-window-review@1.0.0"

  # axis 6 — instruction bindings: refs plus declared parameter names
  instruction_bindings:
    - prompt: "ccf-artifact://atlas-commerce/prompt/order-experience-briefing@1.0.0"
      parameters: [order_ref, as_of]
