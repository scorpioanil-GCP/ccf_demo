# Harness-portability Control Plane bundle (e-commerce domain, D-IMPL-52).
#
# Every number, threshold, version identifier, query string and product-class
# property the example uses is here. `run.py` holds none of them: MAX_TTL has
# no SDK default (D-IMPL-39), operator parameters are declared artifacts with
# no silent defaults (D-IMPL-38), and every domain value is deployment
# configuration (CLAUDE.md §6.4).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: key paths, regime/jurisdiction values, classifications, the
# similarity query, entity classes, relationship types, schema names,
# principal/role strings, timestamps, TTL numbers, the `expected:` values.
# [MECHANISM]: every field name (`keys`, `policy_bundle`,
# `operator_parameters`, `product_class`, `perspective`, `decision`,
# `instruction_parameters`, `artifacts`, `expected`).

schema_version: "1.0.0"
artifact_version: "1.0.0"

keys:
  resolution_spec: atlas-commerce/entity-resolution-spec
  policy_bundle: atlas-commerce/policy-bundle/order-experience-fabric
  max_ttl: atlas-commerce/product/order-experience-context/max-ttl

# The policy bundle the *fabric* boots under. A version of it is resolved
# from the Control Plane, stamped onto every claim at assembly, and carried
# into the product's policy binding and replay dimension 2. (The *agent's*
# axis-4 policy regime is a separate declared artifact in agents/.)
policy_bundle:
  regime: atlas-order-experience
  jurisdiction: US-OR
  permitted_classifications:
    - internal

# Per-class TTL ceiling (INV-CH7-48, D-IMPL-39).
max_ttl_seconds: 900

# Declared operator parameter sets (D-IMPL-38). Read as: the commerce
# perspective may see internally-classified state; rank orders against the
# refund-escalation query at or above 40%; reconcile to the boundary on
# both temporal axes; expand two hops from orders over these typed edges.
operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "delayed shipment refund request"
    minimum_score_percent: 40
    ranked_entity_classes:
      - order
    index_version: "atlas-order-corpus@2026-06-01"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - order
    relationship_types:
      - placed_by
      - includes
      - shipped_via
    depth_limit: 2

# The product class this fabric serves — the SAME class the agent definition
# declares in its axis-2 context contract (agents/order_insights.yaml), which
# is what makes each leg's consumption a contract admission rather than a
# coincidence.
product_class:
  schema_name: atlas-commerce.order-experience-context
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: atlas-commerce.order-experience-context.plan
  product_ttl_seconds: 600

perspective:
  principal_id: commerce-ops-207
  role: commerce-analyst

# The decision's instants. Explicit inputs, never clock reads.
decision:
  temporal_boundary: 2026-06-02T10:00:00Z
  now: 2026-06-02T10:00:03Z

# Parameter values for the agent's axis-6 instruction binding, rendered
# exactly once by the fabric and handed to every leg identically (T-06-64).
instruction_parameters:
  order_ref: "ORD-5521"

artifacts:
  replay_record_class: decision-replay-record

# What the served product should contain, as declared by the deployment that
# authored the events above. The driver asserts against these instead of
# carrying domain expectations of its own.
expected:
  entity_classes:
    - customer
    - order
    - shipment
  relationship_types:
    - placed_by
    - shipped_via
  entity_count: 3
