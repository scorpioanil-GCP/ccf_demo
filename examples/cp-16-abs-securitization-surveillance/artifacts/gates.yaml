# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DECLARED PRODUCT GATES OF cp-16 — twenty-two, `ABS-G01`..`ABS-G22`
# plus `ABS-G07`.
#
# The acceptance authority for every gate is `CP-SPEC-016` §G.1
# (`D-IMPL-326`). Each id is claimed by at least one executing test under
# `tests/examples/`, and no estate figure is pinned anywhere.
#
# THE TWO ANCHORING INVARIANTS ARE SEPARATE GATES BY RULING (Dave,
# 2026-09-21, Route B): `ABS-G06` proves every publicly sourced threshold
# anchors, `ABS-G07` proves every threshold without a public anchor is named
# as unanchored. Neither can be satisfied by the other — an implementation
# that anchored everything would fail `ABS-G07` for having nothing to name.
semver: 1.0.0
class_id: cp-16.product-gates
declaration:
  product: cib.abs-surveillance
  test_naming_convention: the gate id appears in the executing test's docstring, as a `Declared product gate` line naming the CP-SPEC clause that approves it.
  # Measured 2026-09-21 against the live estate with `CCF_REQUIRE_ESTATE=1`:
  # 21 of 22 gates observed RED — thirteen by a single reverting edit with only
  # that gate's test executed, and eight (`ABS-G06`, `ABS-G07`, `ABS-G09`,
  # `ABS-G10`, `ABS-G13`, `ABS-G15`, `ABS-G16` and the honest-payload control)
  # carrying the sabotage inside the test.
  #
  # ONE is `unavailable` and names its guard: `ABS-G01`. The gate ASSERTS a
  # real ordered fact — the executed plan in replay dimension 5 — but no
  # deployment edit can make it red, because `CATEGORY_ORDER` in the SDK's
  # planner fixes the executed order and the forbidden ordering is therefore
  # inexpressible. This is the same guard rungs 15 and 19 named.
  #
  # THREE sabotages left their gate green on the first attempt and were
  # corrected rather than swapped (`ABS-F-07`, `ABS-F-08`, `ABS-F-09`):
  #   - `ABS-G02`: every tranche identifier in this estate sorts into seniority
  #     order, so removing the sort changed nothing. A positive control now
  #     feeds the projection a case where the two orders disagree.
  #   - `ABS-G05`: the temporal operator also cuts at the boundary, so a
  #     product that acquired everything and filtered afterwards serves
  #     identical rows. The gate now reads what ACQUISITION materialized.
  #   - `ABS-G21`: pinning the payload's `as_of` did not collapse two
  #     determinations that differ in their trigger sets too; the sabotage now
  #     makes the reader ignore the instant.
  sabotage_states:
    passed: the invariant was broken and the gate went red
    unavailable: an upstream SDK invariant makes the bad state unreachable; the guard is named
  gates:
  - id: ABS-G01
    statement: the EXECUTED operator plan runs Policy before Similarity — read off replay dimension 5, because the product's own `operators_invoked` is a frozenset and can say nothing about order
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_the_served_plan_runs_policy_before_similarity
    sabotage: reorder the required operator keys so Similarity precedes Policy and assert the executed order is unchanged (CATEGORY_ORDER decides)
    sabotage_state: unavailable
    observed_red:
      result: >-
        UNAVAILABLE 2026-09-21 — the four operator keys were reordered so Similarity precedes Policy and the EXECUTED plan in replay dimension 5 did not move. `CATEGORY_ORDER` in the SDK's planner fixes the executed order, so the forbidden ordering is inexpressible from a deployment. The same guard rungs 15 and 19 named.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G02
    statement: tranches are ordered by SENIORITY read from the served claims, never by identifier
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_tranche_ordering_is_by_seniority_and_not_by_identifier
    sabotage: return the rows unsorted; the positive control's identifiers disagree with its seniority
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the seniority sort was removed. The estate alone could not redden it, because every tranche identifier here sorts into seniority order; the positive control, whose identifiers disagree with its seniority, did.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G03
    statement: the trigger definition IN FORCE is the one valid at the requested instant — a 2026 pool is not evaluated against a 2022 definition, and a definition not yet valid is not disclosed
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_the_trigger_in_force_depends_on_the_instant
    sabotage: stop cutting the candidate definitions at the instant
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the candidate definitions stopped being cut at the instant, so a definition not yet valid was served as in force.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G04
    statement: the amendment is reached by `specifiesTrigger` then `supersededBy` — the estate's own two-hop structure, never a name-prefix join
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_the_amendment_is_reached_by_supersession_not_by_name
    sabotage: stop naming what the in-force definition replaced
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the in-force definition stopped naming what it replaced, so the supersession walk was no longer observable.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G05
    statement: acquisition is BOUNDED AT THE DECISION INSTANT — a filing made after it is never selected, and the proof is what acquisition materialized rather than what the payload shows
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_acquisition_is_bounded_at_the_decision_instant
    sabotage: remove the `filed_date <= as_of` bound from the statement and let the temporal operator filter instead
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the `filed_date <= as_of` bound was removed from the statement. The SERVED rows were unchanged, because the temporal operator also cuts at the boundary; the gate reddened on what ACQUISITION materialized, which is the distinction residual 341-1 is about.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G06
    statement: ANCHORING INVARIANT 1 — every publicly sourced threshold resolves to a filed prospectus passage whose stored `sha256` is carried
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_every_publicly_sourced_threshold_carries_a_rehashable_anchor
    sabotage: unanchor a public threshold, and separately strip an anchor's hash (both in-test)
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — a publicly sourced threshold was unanchored, and separately an anchor's stored hash was emptied. Both refused by name.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G07
    statement: ANCHORING INVARIANT 2 — every threshold WITHOUT a public anchor is named as unanchored, classified by what sourced it, and carries no field implying a passage exists
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_every_threshold_without_a_public_anchor_is_named_unanchored
    sabotage: give the unanchored threshold an empty `anchor_passage_id`, and separately empty the `unanchored_thresholds` member (both in-test)
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the unanchored threshold was given an empty `anchor_passage_id`, and separately the `unanchored_thresholds` member was emptied. Both refused: an absence must be stated, never encoded as a blank, and never left unnamed.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G08
    statement: a granularity outside the declared DOMAIN is a request-contract violation, not a policy refusal
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_a_granularity_outside_the_domain_is_a_request_violation
    sabotage: widen `argument_domains.granularity.members` to admit the value
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — `servicer` was added to the declared domain, and the out-of-domain refusal stopped being a request-contract violation.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G09
    statement: a granularity inside the domain but above the role ceiling is refused by POLICY, and the bound travels into the determination
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_a_granularity_above_the_role_ceiling_is_a_policy_refusal
    sabotage: serve a loan-granularity payload under a cohort ceiling (in-test)
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — a loan-granularity payload was presented under a cohort ceiling and the declared gate refused it.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G10
    statement: POSITIVELY — the ceiling the product states equals the constraint actually resolved for that principal, asserted for all three roles so it cannot pass by coincidence
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_the_stated_ceiling_is_the_constraint_that_was_resolved
    sabotage: state a ceiling that is not the resolved one (in-test)
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the payload stated a ceiling that was not the resolved constraint. This is the anti-vacuity control: nothing ever lowers a granularity here, so a `did policy lower it` assertion would be true forever.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G11
    statement: the Control Plane ceiling agrees with the estate's own `abs_granularity_entitlement` row for the same role
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_the_control_plane_ceiling_agrees_with_the_estate
    sabotage: raise one role's declared ceiling above what the estate grants it
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — one role's declared ceiling was raised above what `abs_granularity_entitlement` grants it, and the two authorities disagreed.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G12
    statement: the payload's SHAPE is a function of the perspective and the effective granularity and never of the deal — three ceilings give three nested shapes
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_the_payload_shape_follows_the_granularity_not_the_deal
    sabotage: return the loan-granularity member set for every granularity
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the loan-granularity member set was returned for every granularity, so a coarser role carried members it may not ask for.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G13
    statement: LOAD-BEARING — the complete source population is never materialized; records materialized track the answer while records scanned track the partition
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_the_source_population_is_never_materialized
    sabotage: report the whole population as materialized (in-test)
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the assembly reported the whole 1,322,453-row population as materialized and the declared gate refused it.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G14
    statement: the loan sample is REPRESENTATIVE and is not the partition's prefix
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_the_loan_sample_is_representative_and_not_a_prefix
    sabotage: replace the deterministic stride with a plain `order by … limit`
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the deterministic stride was replaced by a plain `order by … limit`, and the sample became the partition's prefix.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G15
    statement: cost is served RELATIONALLY in blocks and records — the aggregate rungs indistinguishable and all far from `loan` — with the measured counts as stamped evidence and never a time
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_granularity.py::test_cost_is_reported_relationally_in_blocks_and_never_in_time
    sabotage: report an elapsed time, contradict the band, or omit the cost entirely (all in-test)
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — an elapsed time was added to the cost, the band was made to contradict the granularity, and the cost was removed entirely. All three refused.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G16
    statement: a threshold defined as a FORMULA is served as a finding naming why proximity is uncomputable, never as a distance of zero
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_a_threshold_that_is_a_formula_is_a_finding_not_a_zero
    sabotage: drop the reason from an uncomputable proximity (in-test)
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the reason was dropped from an uncomputable proximity, leaving a distance that reads as already breached.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G17
    statement: a two-component threshold carries BOTH components, and the served value is one of them
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_a_two_component_threshold_keeps_both_components
    sabotage: keep only the first component
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — only the first component of a two-component threshold was kept.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G18
    statement: repurchase activity is DEPOSITOR-SCOPED with per-deal attribution stated as absent; no deal-to-filing join is invented
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_repurchase_activity_is_depositor_scoped_with_a_stated_absence
    sabotage: claim every filing is attributed to this deal
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — every ABS-15G filing was claimed as attributed to this deal, which is the invented join the gate exists to refuse.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G19
    statement: standing state and dated events are DIFFERENT CLASSES — the standing ones decay supersede-only and carry no observed time, the dated ones declare `valid-from` and carry their day
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_standing_state_and_dated_events_are_different_classes
    sabotage: change a dated class's decay basis away from `valid-from`
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — a dated class's decay basis was moved off `valid-from`, collapsing the distinction between a standing state and a dated event.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G20
    statement: expiry is anchored on the EVIDENCE's own reporting period, never on request time
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_expiry_rides_the_reporting_period_not_request_time
    sabotage: move the TTL anchor to `from_decision`
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the TTL anchor was moved to `from_decision` and expiry stopped following the evidence's own reporting period.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G21
    statement: the determination replays from its record with no second producer call, and the same question hashes to the same bytes while a different instant or role does not
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_replay.py::test_a_different_instant_is_a_different_determination
    sabotage: make the period reader ignore the instant, so two instants collapse to one determination
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the period reader was made to ignore the instant, collapsing two instants into one determination and one content address.
      date: '2026-09-21'
      commit: '55536420'
  - id: ABS-G22
    statement: EXISTENCE IS NOT AN ORACLE — a deal that does not exist and a real deal with no reporting period at the instant are refused indistinguishably, while a subject with evidence is served
    spec_clause: {document: spec/CP-SPEC-016_ABS_Securitization_Surveillance.md, clause: G.1}
    test: tests/examples/test_cp_16_surveillance.py::test_a_subject_with_no_evidence_is_refused_indistinguishably
    sabotage: raise a distinct refusal for a deal id the estate does not carry
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — a distinct refusal was raised for a deal id the estate does not carry, and the two refusals stopped being indistinguishable.
      date: '2026-09-21'
      commit: '55536420'
