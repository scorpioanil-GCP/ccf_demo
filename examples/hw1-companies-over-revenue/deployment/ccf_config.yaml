# yaml-language-server: $schema=../../../docs/schemas/ccf.deployment-config.json
#
# HW-1's whole Control Plane configuration — one document. `D-IMPL-136`'s
# AMENDMENT (Dave, 2026-08-15): the section name IS the class, so no file
# name, manifest key or class id is stated three times over for a section
# the SDK owns.
#
# **Recovered, not re-authored.** This document is
# `examples/s1-00-companies-over-revenue/ccf_config.yaml` with its `backend:`
# adapted and its schema path re-rooted for the extra directory level. The
# vocabulary — the product class, the request contract, the resolution rules,
# the half-life curve, the debt bands and the policy regime — is unchanged,
# because it was the part of the rejected example that was never the problem.
#
# `binding.yaml` beside this file is deliberately NOT here — it is deployment
# wiring, not Control Plane state, and it is never registered or content-hashed
# (`D-IMPL-141`). `scenario.yaml` is likewise this deployment's own vocabulary
# and not an artifact.
semver: "1.0.0"
tenant_id: hw1-demo
backend: sqlite

# What this product IS, and the ONE operator category it claims
# (D-IMPL-132: "Operators help me assemble it but I should not be forced
# into a single format"). No traversal: this question is about a SET, not
# a path, so there is no walk to seed.
product_class:
  schema_name: hw1.companies-over-revenue
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  max_ttl_key: hw1/product/companies-over-revenue/max-ttl
  required_operator_keys: [temporal.as-of-boundary]

operators:
  temporal.as-of-boundary:
    require_valid_at_boundary: true

# WHICH QUESTIONS this class answers. `revenue_threshold` is REQUIRED — a
# threshold nobody supplied is not a question this class answers, and a
# request omitting it is refused before the graph is touched.
# Adopter-owned (D-IMPL-138(a)): class_id, role and registration have no
# default the SDK could derive for a class it does not own.
request_contract:
  class_id: hw1.request-contract
  role: load
  registration: typed
  schema_name: hw1.companies-over-revenue
  schema_version: "1.0.0"
  arguments:
    properties:
      revenue_threshold:
        type: number
        description: Return companies whose revenue exceeds this amount.
    required: [revenue_threshold]

# How a source row becomes an entity. A filing date is NOT an attribute
# here — it rides the envelope, not the payload.
#
# **Corrected against the tree while recovering this document.** The s1-00
# original said the filing date "arrives as the envelope's `observed_time` and
# becomes the claim's `observed_at`". It does not:
# `src/ccf/assembly/worker.py::AssemblyWorker._stitch` sets `observed_at` from
# `ingestion_timestamp` ALWAYS — it records when *the fabric* learned the
# claim, which is a fact the fabric always knows (INV-CH7-03) — and routes
# `observed_time` to `valid_from`. `observed_at` is what the half-life curve
# reads, so a deployment wanting a spread of ages gives each envelope the
# instant the fabric learned it.
resolution:
  entity_rules:
    - match_key: company_ref
      entity_class: company
      identity_keys: [company_ref]
      attribute_keys: [company_name, company_revenue]

# λ_c — how fast this deployment's one observation type goes stale. One
# year, because a revenue figure is restated on the annual reporting cycle.
half_life:
  company:
    half_life_seconds: 31536000
    decay_driver: the annual revenue reporting cycle
    supersession_event: a newer filing restating the same company's revenue

# Where the D_c bands sit. D_c = 1 − (F · C · S); above 0.20 routes to
# Forced-LLM, above 0.60 to Fail-Closed.
debt_profile:
  risk_sensitivity: "1.0"
  forced_llm_threshold: "0.20"
  fail_closed_threshold: "0.60"

# The regime in force. Its VERSION rides the served product's lineage.
# Adopter-owned (D-IMPL-138(a)), same three bookkeeping lines as above.
policy:
  class_id: hw1.policy-bundle
  role: register
  registration: typed
  regime: published-annual-revenue-disclosure

# Π role-conditioning: whose view of the graph this product is served
# under. No door in this in-process example, so this names it directly.
default_perspective:
  principal_id: revenue-screening-desk-1
  role: analyst
