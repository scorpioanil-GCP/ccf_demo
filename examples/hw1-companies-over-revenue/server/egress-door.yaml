#
# HW-1's egress door: what the SDK's standard door asserts and advertises, and
# nothing else. `serve.py` loads this document through the SDK's own artifact
# loader as the `ccf.egress-door` class (`EgressDoorBinding`, `D-IMPL-343`) and
# hands it to `open_door`. It interprets no value of its own.
#
# The four values, each a deployment value the SDK holds no default for
# (CINV-01):
#
# * `producer_id`: the identity the door asserts on every outcome, served or
#   refused (`D-IMPL-340` ruling 2). A consumer holds it to the registration it
#   governs; equality is a binding check, never an authorization.
# * `producer_tenant`: the tenant that assertion names. It is the `tenant_id`
#   of `../deployment/ccf_config.yaml`, stated again here because `D-IMPL-343`
#   R-6 rules that the door DECLARES its tenant and never derives it from the
#   answer.
# * `required_scope`: the bearer scope the door requires. The SDK's door also
#   registers the scope mapping its authorizer decides every call under, for
#   this scope and this deployment's product class (`D-IMPL-353`).
# * `tool_description`: the prose the door's one tool advertises.
#
# What is deliberately NOT here (the class refuses each as an unknown key):
#
# * the principal and the role: `../deployment/binding.yaml`'s `perspective:`
#   already says who this fabric serves and in what capacity;
# * any URL or credential: deployment ENVIRONMENT, named in
#   `ccf_environment.yaml` beside this file (Dave, `D-IMPL-343`: "Do not put
#   URLs or tokens in configuration.").
#
# Read by this door's program alone. A paved-road deployment states these four
# values as the reserved `door:` section of its `ccf_config.yaml`; this
# deployment's Control Plane document did not change when its door moved onto
# `open_door`, so nothing registers this document.

semver: "1.0.0"
producer_id: hw1-companies-over-revenue-egress
producer_tenant: hw1-demo
required_scope: ccf:egress
tool_description: >-
  Answer HW-1's declared question — which companies have revenue over a
  threshold — as a governed, content-addressed Context Product.
