    rate_shift_bp: 300
    collateral_shift_bp: -2000
    collateral_class: real_property
    horizon_months: 12
  # The collateral class the estate carries most of, and the requirements'
  # own CRE sub-portfolio.
  stressed_class: real_property
  # The base rate the shift applies to.
  base_rate_series: SOFR
