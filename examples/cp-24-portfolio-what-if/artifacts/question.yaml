declaration:
  question:
    # BKR019 (Mei Nkosi, role `product`, desk M&A Advisory) — the only book of
    # the forty carrying ALL TEN signal families. Measured 2026-09-21.
    subject: "BKR019"
    intent: stress-test
    freshness: event-driven
    asked_at: "2026-08-25T00:00:00+00:00"
    principal: PRIN-PM-001
  instants:
    ASKED_AT: "2026-08-25T00:00:00+00:00"
  # A second book, for the membership-identity proof (`WIF-G06`).
  other_book: "BKR001"
  # Books that exist nowhere, for the no-oracle comparator.
  nonexistent_books: ["BKR999", "BKR998"]
