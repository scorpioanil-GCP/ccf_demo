# yaml-language-server: $schema=../../docs/schemas/ccf.deployment-config.json
#
# THE CONTROL PLANE DOCUMENT — what this fabric is permitted to do.
# The specification this realizes is
# `spec/CP-SPEC-024_Portfolio_What_If_Stress.md`.

semver: "1.0.0"
tenant_id: cp-24-demo

backend: sqlite

product_class:
  schema_name: cib.portfolio-what-if
  schema_version: "1.0.0"
  # NOT evidence-anchored (`CP-SPEC-024` §E.1). A book's evidence is 25
  # members' worth with staleness from 12 to 53 days, so *whose* freshness
  # would anchor it is not answerable. The evidence's age lives in the
  # per-class freshness and in `D_c`, where it belongs (`WIF-G11`).
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  max_ttl_key: cp-24/product/portfolio-what-if/max-ttl

  # THREE keys, not four. There is no ranked corpus here: the signals are typed
  # rows, not passages, so Similarity is absent from the declaration and
  # `WIF-G01` asserts the served plan against THIS list rather than a fixed
  # four (`CP-SPEC-024` §D.2).
  required_operator_keys:
    - policy.principal-subgraph
    - temporal.as-of-boundary
    - traversal.typed-neighborhood

  serve_obligations:
    # ILLUSTRATIVE CALIBRATION (`D-IMPL-323`). The worst collateral
    # observation in the demonstration book is 545 DAYS old, so the book's
    # worst-member freshness is genuinely low and a tighter tolerance would
    # withhold every answer — making the scenario mechanism unobservable
    # rather than demonstrating it. The evidence's staleness is not hidden:
    # it drives this number, it is reported per observation, and it is the
    # subject of `WIF-G11`.
    default_debt_tolerance: "0.98"
    lineage_inputs_at:
      - perspective
      - as_of

  discovery:
    domain: cib
    intents:
      - stress-test
      - credit-review
      - what-if
    capabilities:
      - explicit-hypothetical-assumptions
      - observed-versus-derived-separated
      - stale-evidence-survives-stress
      - scenario-replayable-to-one-address
    audiences:
      - coverage
      - credit
      - product

  declared_product_gate:
    gate_id: cp-24.portfolio-holds
    gate_version: "1.0.0"

operators:
  # STEP 2 — Policy. The permitted set is the product's whole vocabulary; the
  # per-role member and measure narrowing is formative and arrives at the
  # acquisition seam from `context.perspective`, per the adopter page
  # `public/how-to/condition-acquisition-on-the-verified-credential.md`.
  policy.principal-subgraph:
    classification_attribute_by_class:
      book: classification
      member: classification
      facility: classification
      collateral: classification
      rate: classification
    permitted_classifications:
      - public
      - internal

  temporal.as-of-boundary:
    require_valid_at_boundary: true

  traversal.typed-neighborhood:
    seed_entity_classes:
      - book
    relationship_types:
      - hasMember
      - hasFacility
      - hasCollateral
      - hasRate
    depth_limit: 1

request_contract:
  class_id: cp-24.request-contract
  role: register
  registration: typed
  schema_name: cib.portfolio-what-if
  schema_version: "1.0.0"
  arguments:
    properties:
      as_of:
        type: string
        description: the decision instant; bounds acquisition of the OBSERVED state.
      scenario:
        type: object
        description: >-
          THE HYPOTHETICAL, and a CLOSED object (`Q1`/`WIF-G02`, ruled
          2026-09-21). Every magnitude is an INTEGER IN CANONICAL UNITS —
          basis points — so no fraction ever reaches a wire: SOFR +150bps is
          `150`, CRE -10% is `-1000`. A bare JSON fraction parses to a float
          and the SDK REFUSES it as not bit-stable; that refusal is correct
          behavior and is never coerced around (`WIF-G04`). An undeclared
          member is refused, and a structure deeper than this one level is not
          representable — `SkillArgumentMember` carries no `properties` and no
          `items`, and is NOT widened for this rung.
        properties:
          rate_shift_bp:
            type: integer
            description: the parallel shift applied to the observed base rate, in basis points.
          collateral_shift_bp:
            type: integer
            description: the shift applied to observed collateral values in the named class, in basis points.
          collateral_class:
            type: string
            description: which collateral category the shift applies to; other classes are unchanged.
          horizon_months:
            type: integer
            description: the window the incremental interest is expressed over.
        required:
          - rate_shift_bp
      members:
        type: array
        description: >-
          Which book members to report, as a LIST of LEIs. Empty means the
          whole book. NARROWS ONLY. The deployment canonicalizes this list
          before the effective request is built, exactly as rung 23 ruled.
      coverage_floor_bp:
        type: integer
        description: >-
          The secured-coverage floor the roll-up counts crossings against, in
          basis points. May be RAISED above the declared floor and never
          lowered.
      debt_tolerance:
        type: number
        description: the caller's ceiling on assessed Context Debt, 0..1.
    required:
      - scenario

  argument_domains:
    coverage_floor_bp:
      minimum: 0
      maximum: 20000

  relative_defaults:
    as_of:
      offset_seconds: 0
      render: timestamp

resolution:
  entity_rules:
    - match_key: book_node
      # SEC-023 (D-IMPL-372): only the named sources may assert the attribute the Policy operator admits on. A claim from any other source is refused and audited, and without this declaration the deployment refuses to boot.
      attribute_authorities: {classification: [cp-24-portfolio-what-if]}
      entity_class: book
      identity_keys: [entity_uri]
      attribute_keys: [banker_id, banker_name, banker_role, banker_desk, perspective,
                       as_of, intent, member_count, book_member_total, book_roster_total,
                       members_requested, member_digest, facility_covered_count,
                       coverage_floor_bp, sensitivity_version, rate_shift_bp,
                       collateral_shift_bp, collateral_class, horizon_months,
                       base_rate_series, base_rate_pct, base_rate_observed_at,
                       records_materialized, classification]
    - match_key: member_node
      attribute_authorities: {classification: [cp-24-portfolio-what-if]}
      entity_class: member
      identity_keys: [entity_uri]
      attribute_keys: [lei, legal_name, sic, sic_description, in_book, is_primary,
                       assigned_date, classification]
    - match_key: facility_node
      attribute_authorities: {classification: [cp-24-portfolio-what-if]}
      entity_class: facility
      identity_keys: [entity_uri]
      attribute_keys: [facility_id, lei, facility_type, commitment_amount, drawn_amount,
                       drawdown_count, maturity_date, classification]
    # THE OBSERVED COLLATERAL. Its `valuation_date` and age travel into every
    # derived figure and are never reset by arithmetic (`WIF-G11`/`WIF-G12`).
    - match_key: collateral_node
      attribute_authorities: {classification: [cp-24-portfolio-what-if]}
      entity_class: collateral
      identity_keys: [entity_uri]
      attribute_keys: [asset_id, lei, category, valuation, valuation_date,
                       valuation_age_days, haircut, classification]
    # THE OBSERVED BASE RATE — a claim with source lineage. The SHIFT is not
    # here and never becomes a claim (`WIF-G06`).
    - match_key: rate_node
      attribute_authorities: {classification: [cp-24-portfolio-what-if]}
      entity_class: rate
      identity_keys: [entity_uri]
      attribute_keys: [series_id, obs_date, value_pct, unit, label, classification]

    - {match_key: book_subject, entity_class: book,
       identity_keys: [entity_uri], identity_sources: {entity_uri: subject_uri}}
    - {match_key: member_object, entity_class: member,
       identity_keys: [entity_uri], identity_sources: {entity_uri: object_uri}}
    - {match_key: facility_object, entity_class: facility,
       identity_keys: [entity_uri], identity_sources: {entity_uri: object_uri}}
    - {match_key: collateral_object, entity_class: collateral,
       identity_keys: [entity_uri], identity_sources: {entity_uri: object_uri}}
    - {match_key: rate_object, entity_class: rate,
       identity_keys: [entity_uri], identity_sources: {entity_uri: object_uri}}

  relationship_rules:
    - {relationship_type: hasMember, predicate_key: predicate,
       subject_entity_class: book, object_entity_class: member,
       subject_rule: book_subject, object_rule: member_object}
    - {relationship_type: hasFacility, predicate_key: predicate,
       subject_entity_class: book, object_entity_class: facility,
       subject_rule: book_subject, object_rule: facility_object}
    - {relationship_type: hasCollateral, predicate_key: predicate,
       subject_entity_class: book, object_entity_class: collateral,
       subject_rule: book_subject, object_rule: collateral_object}
    - {relationship_type: hasRate, predicate_key: predicate,
       subject_entity_class: book, object_entity_class: rate,
       subject_rule: book_subject, object_rule: rate_object}

# ---------------------------------------------------------------------------
# λ_c — PER SIGNAL CLASS, and that is the ruling (`CP-SPEC-024` §C.2).
#
# The five signal classes carry genuinely different staleness in the
# demonstration book — 12, 14, 51, 52 and 53 days at the pinned instant — so
# one table keyed by entity class makes the book's freshness a DISTRIBUTION
# rather than an average. Collapsing them into a single `signal` class would
# hide a stale class behind a fresh one, which `WIF-G09` refuses.
#
# The standing classes carry no event date and decay `supersede-only`
# (`D-IMPL-332`): book membership, the member itself and a facility's terms are
# true AS OF NOW, not on a day.
#
# ILLUSTRATIVE CALIBRATION (`D-IMPL-323`): the half-lives below are chosen so
# the mechanism is observable against a point-in-time snapshot. See the README.
# ---------------------------------------------------------------------------
half_life:
  book:
    decay: supersede-only
    decay_driver: coverage-assignment
    supersession_event: coverage-reassignment
  member:
    decay: supersede-only
    decay_driver: coverage-assignment
    supersession_event: coverage-reassignment
  facility:
    decay: supersede-only
    decay_driver: facility-agreement
    supersession_event: facility-amendment
  # DATED EVENTS. A scenario does NOT refresh either of them: a stressed stale
  # valuation is still stale, and the observed instant travels into every
  # derived figure (`WIF-G11`, `WIF-G12`, ruled 2026-09-21).
  collateral:
    half_life_seconds: 15552000
    decay_basis: valid-from
    decay_driver: appraisal
    supersession_event: revaluation
  rate:
    half_life_seconds: 604800
    decay_basis: valid-from
    decay_driver: daily-rate-publication
    supersession_event: new-observation

debt_profile:
  risk_sensitivity: "1.0"
  forced_llm_threshold: "0.70"
  fail_closed_threshold: "0.99"

policy:
  class_id: cp-24.policy-bundle
  role: register
  registration: typed
  regime: portfolio-role-and-severity-envelope

default_perspective:
  principal_id: PRIN-PM-001
  role: coverage

replay:
  record_class: ccf.replay-record
  query_pin_class: ccf.graph-query
  store_dirname: artifact-store

ttl:
  max_ttl_seconds: 86400
  product_ttl_seconds: 86400

door:
  producer_id: cp-24-portfolio-what-if-egress
  producer_tenant: cp-24-demo
  required_scope: ccf:egress
  tool_description: >-
    Report one coverage book's proactive-monitoring state as a governed,
    content-addressed Context Product (`cib.portfolio-what-if`):
    utilization and headroom across the book's facilities, severity-tiered
    early-warning signals in five classes each with its own freshness,
    covenant history, and the book's concentration against a declared
    threshold. Context Debt is the WORST FACTOR across members, so a weak
    member cannot disappear behind a stronger aggregate, and the member and
    signal class each weak factor came from are named.
