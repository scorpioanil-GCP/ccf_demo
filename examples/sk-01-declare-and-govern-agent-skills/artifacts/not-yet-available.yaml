semver: "1.0.0"
class_id: sk-01.not-yet-available

declaration:
  items:
    - id: SK01-F-01
      what: a granted skill appearing as a model tool, or a revoked one disappearing
      status: not yet possible — the paved road declares only mcp_product skills, which are never model tools; the low road's children= hatch can carry other skill types but has no grant authority an example may hold (gap 1)
    - id: gap 1
      what: granting or revoking a skill while the product runs
      status: not yet available — no door an example can use is authorized to grant or revoke
    - id: gap 3
      what: replaying this composite decision through replay_decision
      status: not yet available
    - id: gap 4
      what: an agent that holds grants outside a composite product
      status: not yet available — the brief around collateral-analyst exists for that reason
