semver: "1.0.0"
class_id: sk-01.not-yet-available

declaration:
  items:
    - what: a granted skill appearing as a model tool, or a revoked one disappearing
      status: not yet possible — the supported configuration declares only skills that ask another Context Product, and a model never calls those; the one other route that can carry a model-callable skill gives an example no way to grant it
      recorded_as: SK01-F-01
    - what: granting or revoking a skill while the product runs
      status: not yet available — every grant here is declared in ccf_config.yaml and put in force when the product opens; the SDK offers an example no authorized way to grant or revoke one afterwards
    - what: replaying this decision through the SDK's one-step replay
      status: not yet available — the one-step replay cannot yet rebuild a decision that admitted another product's answer
    - what: an agent that holds grants and asks another product on its own, without a product of its own around it
      status: not yet available — today such an agent exists only inside a product built from other products, which is why this example wraps collateral-analyst in a small facility collateral brief
      recorded_as: SK01-F-05
