#
# THE SOURCE TERMS THE PARENT'S OWN LEG READS, named once. `acquisition.py`
# reads this file and holds no vocabulary of its own (CLAUDE.md §6.4).
#
# One table, one key, four columns: the obligor's identity record. Nothing the
# brief says about collateral or set-off is read here — that is the child's,
# acquired through the composite.

semver: "1.0.0"
class_id: sk-01.source-vocabulary

declaration:
  #: The obligor's identity record.
  table: legal_entity
  #: The column the request's subject is matched on.
  key: lei
  #: The identity columns read, in the order the resolver hands them back.
  identity_columns:
    - lei
    - legal_name
    - legal_jurisdiction
    - retrieved_at
