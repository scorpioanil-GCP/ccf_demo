# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# The PRODUCER fabric's policy bundle (syndicated-lending domain, whitepaper §8.3 Pattern 4).
#
# A *version* of this document is resolved from the Control Plane, stamped onto
# every claim at assembly, and carried into the product's lineage — which is
# exactly the regime the consumer's trust policy holds the producer to at
# admission (CLAUDE.md §7.2).
#
# The consumer declares its own copy of this regime in
# `consumer-policy-bundle.yaml`, deliberately as a SECOND document rather than
# a shared one. The two Control Planes belong to two deployments, and the
# entitlement check is only a check while the two statements are independent:
# one file read by both sides would move together under any edit and admission
# would keep passing for a reason unrelated to what it claims to verify.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: harborline-syndications.policy-bundle

declaration:
  regime: harborline-syndications-desk
  jurisdiction: GB
  permitted_classifications:
    - internal
