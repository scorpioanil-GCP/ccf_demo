# Cross-process event stream — L1 signal envelopes (property-intelligence
# domain, D-08; authored fresh per D-07 — nothing here is ported).
#
# A handful of events, but not a flat happy path: the stream is built so the
# producer's fabric has something real to do at each layer.
#
#   * ev-202 asserts the SAME property as ev-201 from a DIFFERENT source with
#     identical attributes -> one claim whose lineage accumulates by
#     set-union, not a second node.
#   * ev-204 introduces a second, permitted sensor that the similarity
#     operator must rank out — so "similarity did something" is
#     distinguishable from an identity function.
#   * ev-205 carries a RESTRICTED occupancy signal, which the policy operator
#     must substitute out along with the edge that would otherwise leak its
#     existence by absence.
#
#   * ev-206 adds a SECOND perimeter-relevant sensor (a camera confirming
#     the same overnight motion) that the similarity operator must keep —
#     so the exchanged product carries two sensors and the cross-process
#     admission story covers a multi-sensor payload.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# [ADAPT]: every payload key and value, source system ids, timestamps.
# [MECHANISM]: the envelope field names (`envelope_id`, `source_system_id`,
# `ingestion_timestamp`, `observed_time`, `payload`).

schema_version: "1.0.0"
artifact_version: "1.0.0"

