# yaml-language-server: $schema=../../../docs/schemas/ccf.signal-batch.json
# The PRODUCER's event stream — L1 signal envelopes (property-intelligence
# domain, D-08; authored fresh per D-07 — nothing here is ported).
#
# A handful of events, but not a flat happy path: the stream is built so the
# producer's fabric has something real to do at each layer.
#
#   * ev-202 asserts the SAME property as ev-201 from a DIFFERENT source with
#     identical attributes -> one claim whose lineage accumulates by set-union
#     (INV-CH7-17), not a second node.
#   * ev-204 introduces a second, permitted sensor that the similarity operator
#     must rank out — so "similarity did something" is distinguishable from an
#     identity function.
#   * ev-206 adds a SECOND perimeter-relevant sensor (a camera confirming the
#     same overnight motion) that similarity must KEEP, so the exchanged
#     product carries two sensors and the cross-process admission story covers
#     a multi-sensor payload.
#   * ev-205 carries a RESTRICTED occupancy signal, which the policy operator
#     must substitute out along with the edge that would otherwise leak its
#     existence by absence.
#
# The document adopts the SDK's OWN envelope vocabulary — `source: {system_id}`,
# `raw_payload:` — rather than a flat shape a loader would have to translate. A
# translation removed is one that cannot drift.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: everything under `raw_payload:` and every source system id is
# [ADAPT]; the envelope keys (`envelope_id`, `tenant_id`, `source`,
# `system_id`, `ingestion_timestamp`, `observed_time`, `raw_payload`) are
# [MECHANISM].

semver: "1.0.0"

tenant_id: larkfield-estates

envelopes:
  - envelope_id: ev-201
    tenant_id: larkfield-estates
    source:
      system_id: site-registry
    ingestion_timestamp: 2026-06-01T09:00:00Z
    observed_time: 2026-06-01T08:50:00Z
    raw_payload:
      property_ref: "LFE-PROP-0114"
      property_name: "Larkfield Gate House"
      property_kind: "residential"
      property_classification: "internal"
      zone_ref: "LFE-ZONE-0114-GARDEN"
      zone_label: "walled garden perimeter"
      zone_purpose: "perimeter"
      zone_classification: "internal"

  - envelope_id: ev-202
    tenant_id: larkfield-estates
