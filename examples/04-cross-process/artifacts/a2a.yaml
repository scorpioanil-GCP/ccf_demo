# Cross-process A2A federation values — the exchange's user-declared
# vocabulary (property-intelligence domain, D-08; authored fresh per D-07).
#
# EVERYTHING here is a *value*. There is no peer name, key identifier,
# producer hash, ceiling, endpoint path or federation entity class anywhere
# in `/src` or `/runtime` (CLAUDE.md §6.4 No-Hardcoding Rule; CINV-01). The
# example code that loads this file is thin: it maps these declarations onto
# SDK mechanism and asserts. Delete this file and both drivers have nothing
# to run.
#
# No key *material* is here: keys are generated per run into a temp directory
# and never committed. What is declared is which identifier the producer is
# entitled to sign under, which is policy rather than secret (D-IMPL-15).

schema_version: "1.0.0"
artifact_version: "1.0.0"

# The consuming fabric's own federation identity and its trust-policy lane.
consumer:
  peer_id: larkfield-consumer-hub
  semver: "1.0.0"
  # Defence in depth at the transport, and the authoritative Control Plane
  # ceiling the gate applies. Both are this deployment's numbers, not
  # recommendations (D-IMPL-38: the SDK ships neither).
  inbound_payload_ceiling_bytes: 65536
  max_request_bytes: 262144
  # The route this deployment mounts its federation endpoint at. A
  # deployment's URL space is the deployment's; the SDK holds no default.
  receive_path: /ccf/peering/inbound
  # The consuming fabric's own lineage at admission time (CLAUDE.md §7.2:
  # inbound L extends the consumer's by set-union, never replaces it). These
  # are the consumer deployment's statements about its own state.
  lineage:
    operators_invoked:
      - temporal.as-of
    policy_bundle_versions:
      - larkfield-consumer-own-policy
    graph_snapshot_at: 2026-06-01T10:00:00Z

# The producing peer: which identity it runs as, which key id it signs
# under, and which producing agent it asserts in the protected header. The
# consumer's trust-policy entry is built from exactly these declarations
# (D-23: entitlements are per peer, per entry).
producer:
  peer_id: larkfield-site-assembler
  key_id: larkfield-site-assembler-key-1
  producer_hash: "sha256:larkfield-site-situation-assembler"

# How an admitted federated product becomes L1 signal on the consumer's side.
#
# This is the consumer's own ontology extension, not the producer's: the
# producer's entities arrive as *claims about another fabric's graph*, so
# they resolve into their own entity class rather than being merged into the
# consumer's vocabulary. Merging them would assert that the consumer had
# independently observed what a peer told it.
federation:
  system_id: larkfield-peering-federation
  payload_records_key: entities
  record_key_aliases:
    entity_uri: federated_entity_uri
    entity_class: federated_entity_class
  entity_rule:
    match_key: federated_entity_uri
    entity_class: federated_entity
    identity_keys: [federated_entity_uri]
    attribute_keys: [federated_entity_class]
