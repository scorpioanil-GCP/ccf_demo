# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# The AGENT's axis-5 half-life and debt profile (CLAUDE.md §6.2 channel 1;
# whitepaper §7.7 CAR; property-intelligence domain, D-08).
#
# What staleness this assembler tolerates, and what D_c sends it to Forced-LLM
# or Fail-Closed. The agent definition names it by versioned URI; the manifest
# registers it under `larkfield-estates/debt-profile/perimeter-watch`, the key
# that ref resolves to.
#
# The document stays on the open envelope rather than the SDK's
# `ccf.debt-profile` class because it is what the *agent's* definition
# references, and a versioned-URI ref names a deployment key rather than an SDK
# artifact class.
#
# Values are QUOTED so they parse as text and validate as decimals: the
# canonical serializer refuses floats, and the artifact loader refuses a YAML
# float rather than silently converting one.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every calibrated value is [ADAPT]; the keys
# `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: debt-profile

declaration:
  semver: "1.0.0"
  review_cycle: nightly
  risk_sensitivity: "1.1"
  forced_llm_threshold: "0.35"
  fail_closed_threshold: "0.80"
