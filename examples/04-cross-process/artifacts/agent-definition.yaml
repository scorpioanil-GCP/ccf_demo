# yaml-language-server: $schema=../../../docs/schemas/ccf.agent-definition.json
# The assembler agent — a declared, versioned Control Plane artifact
# (CLAUDE.md §6.1/§6.2; D-IMPL-28). Property-intelligence domain, D-08.
#
# All six specialization axes are here, as values. `/src` holds none of them:
# the SDK ships the six-axis schema and the Agent Factory, never a specific
# agent (CLAUDE.md §6.1 — "any agent found in library code is a defect";
# No-Hardcoding Rule §6.4). The `context_assembly` archetype makes this the
# §6.3 `ContextAssemblyAgent` case: an assembler whose output is itself a typed
# Context Product, served on the wire for other agents.
#
# This document is NOT named by `producer-manifest.yaml`. It carries D-IMPL-28
# two-field versioning and registers through `register_versioned`, which holds
# the author's `artifact_version` claim against content identity (the D-05 bump
# check); `load_and_boot` registers through `register_typed`, which does not.
# See `agent-registration.yaml` for the key it registers under.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the agent name, tenant, product-class names, role, selection
# params, every URI and parameter name are [ADAPT]; the six axis keys, the
# versioning keys and `ref` are [MECHANISM].

schema_version: "1.0.0"
artifact_version: "1.0.0"
name: site-situation-assembler
tenant: larkfield-estates

# axis 1 — ordered archetype list (D-IMPL-19)
archetypes: [context_assembly]

# axis 2 — context contract: the product class this assembler emits and
# validates against before serving. Its own output being a typed Context
# Product is exactly what makes it consumable by other agents across the
# process boundary (§6.3, ContextAssemblyAgent).
context_contract:
  consumes:
    - product_class: larkfield-estates.property-situation
      schema_version: "1.0.0"

# axis 3 — perspective (Π role-conditioning)
perspective:
  role: situation-analyst
  selection_params:
    estate: larkfield

# axis 4 — policy regime (versioned-URI ref, never inline)
policy_regime:
  ref: "ccf-artifact://larkfield-estates/policy-bundle/situation-desk-regime@1.0.0"

# axis 5 — half-life and debt profile (versioned-URI ref)
halflife_debt_profile:
  ref: "ccf-artifact://larkfield-estates/debt-profile/perimeter-watch@1.0.0"

# axis 6 — instruction bindings: refs plus declared parameter names
instruction_bindings:
  - prompt: "ccf-artifact://larkfield-estates/prompt/situation-brief@1.0.0"
    parameters: [property_ref, as_of]
