# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# The PRODUCER's product-governance numbers (syndicated-lending domain).
#
# The per-class TTL ceiling and this product's own TTL are two independently
# authored values on purpose: Gate 3 compares the class's ceiling against the
# product's `expires_at`, and that is only a check while the two are separate.
# Fifteen minutes and five minutes are values this deployment chose, not
# recommendations — the SDK ships no MAX_TTL default (D-IMPL-39).
#
# `plan_id` is also this deployment's serving identity on the MCP egress
# surface. A server name written in code would be a domain value in code.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: harborline-syndications.product-governance

declaration:
  max_ttl_seconds: 900
  product_ttl_seconds: 300
  similarity_index_version: "harborline-covenant-corpus@2026-06-01"
  plan_id: harborline-syndications.syndicated-covenant-context.plan
