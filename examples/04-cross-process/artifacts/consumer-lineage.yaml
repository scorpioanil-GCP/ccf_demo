# The CONSUMER's own lineage at admission time (CLAUDE.md §7.2;
# property-intelligence domain, D-08).
#
# Inbound L EXTENDS the consumer's by set-union; it never replaces it. These
# two operators are deliberately DISJOINT from the producer's four-operator
# plan: the merged lineage the admission gate produces must be exactly
# `producer ∪ consumer`, and the asserted union is only convincing evidence of
# set-union rather than replacement when both sides contribute members the other
# lacks. Overlapping sets would satisfy a union assertion under replacement too.
#
# **`role: load` in the manifest.** This is the consumer's statement about its
# own state at one instant, not about what it was permitted to do.
#
# Timestamps are QUOTED so they arrive as text (D-IMPL-38).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

