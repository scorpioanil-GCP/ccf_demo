# yaml-language-server: $schema=../../../docs/schemas/ccf.product-class.json
# The product class the CONSUMER will admit from its peer
# (property-intelligence domain, D-08).
#
# The consumer's own statement, not the producer's. It must agree with
# `product-class.yaml` for admission to succeed, and it is a separate document
# for the same reason `consumer-policy-bundle.yaml` is: an entitlement stated
# once and read by both sides is not an entitlement.
#
# `required_operator_keys` carries the consumer's declared minimum for a product
# of this class. It is never derived from an inbound product's own lineage — a
# consumer that read its admission criteria off the thing being admitted would
# be verifying a value against itself.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `schema_name`, `schema_version`, `max_ttl_key` and the operator
# key strings are [ADAPT]; every other key is [MECHANISM].

semver: "1.0.0"

schema_name: larkfield-estates.property-situation
schema_version: "1.0.0"
ttl_anchor: from_decision
assembly_mode: algorithmic

max_ttl_key: larkfield-estates/product/property-situation/max-ttl

required_operator_keys:
  - traversal.typed-neighborhood
  - temporal.as-of-boundary
  - policy.principal-subgraph
  - similarity.corpus-select
