# Cross-process Control Plane bundle (property-intelligence domain, D-08;
# authored fresh per D-07).
#
# Every number, threshold, version identifier, query string and product-class
# property the example uses is here. Neither driver holds any of them: MAX_TTL
# has no SDK default (D-IMPL-39), operator parameters are declared artifacts
# with no silent defaults (D-IMPL-38), and every domain value is deployment
# configuration (CLAUDE.md §6.4).
#
# The keys are deployment vocabulary too. The SDK never enumerates Control
# Plane keys; the fabric is told which ones to pin.

schema_version: "1.0.0"
artifact_version: "1.0.0"

keys:
  resolution_spec: larkfield-estates/entity-resolution-spec
  policy_bundle: larkfield-estates/policy-bundle/situation-desk
  max_ttl: larkfield-estates/product/property-situation/max-ttl

# The policy bundle in force. A *version* of it is resolved from the Control
# Plane, stamped onto every claim at assembly, and carried into the product's
# lineage — which is exactly the regime the consumer's trust policy holds the
# producer to at admission (CLAUDE.md §7.2).
policy_bundle:
  regime: larkfield-situation-desk
  jurisdiction: GB
  permitted_classifications:
    - internal

# Per-class TTL ceiling (D-IMPL-39). Fifteen minutes is a value this
# deployment chose, not a recommendation.
max_ttl_seconds: 900

# Declared operator parameter sets (D-IMPL-38). Read as: the situation-desk
# perspective may see internally-classified state; rank sensors against the
# perimeter query at or above 40%; reconcile to the boundary on both temporal
# axes; expand two hops from properties over these typed edges.
operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "garden perimeter motion overnight"
    minimum_score_percent: 40
    ranked_entity_classes:
      - sensor
    index_version: "larkfield-sensor-corpus@2026-06-01"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - property
    relationship_types:
      - contains
      - monitored_by
    depth_limit: 2

# The product class this fabric serves — over MCP egress and over A2A — and
# the perspective it is served to.
product_class:
  schema_name: larkfield-estates.property-situation
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: larkfield-estates.property-situation.plan
  product_ttl_seconds: 300

perspective:
  principal_id: situation-desk-011
  role: situation-analyst

# The decision's instants. Explicit inputs, never clock reads: both processes
# read the same declared instants, which is what makes the exchange
# deterministic end to end.
decision:
  temporal_boundary: 2026-06-01T10:00:00Z
  now: 2026-06-01T10:00:05Z

# What the served product should contain, as declared by the deployment that
# authored the events above. The producer asserts against these instead of
# carrying domain expectations of its own.
expected:
  entity_classes:
    - property
    - zone
    - sensor
  relationship_types:
    - contains
    - monitored_by
  entity_count: 3
