# Agent-basics Control Plane bundle (field-service domain, D-IMPL-52).
#
# Every number, threshold, version identifier, query string and product-class
# property the example uses is here. `run.py` holds none of them: MAX_TTL has
# no SDK default (D-IMPL-39), operator parameters are declared artifacts with
# no silent defaults (D-IMPL-38), and every domain value is deployment
# configuration (CLAUDE.md §6.4).

schema_version: "1.0.0"
artifact_version: "1.0.0"

keys:
  resolution_spec: cascadia-fieldworks/entity-resolution-spec
  policy_bundle: cascadia-fieldworks/policy-bundle/dispatch-fabric
  max_ttl: cascadia-fieldworks/product/work-order-context/max-ttl

# The policy bundle the *fabric* boots under. A version of it is resolved
# from the Control Plane, stamped onto every claim at assembly, and carried
# into the product's policy binding and replay dimension 2. (The *agent's*
# axis-4 policy regime is a separate declared artifact in agent.yaml.)
policy_bundle:
  regime: cascadia-dispatch
  jurisdiction: US-WA
  permitted_classifications:
    - internal

# Per-class TTL ceiling (INV-CH7-48, D-IMPL-39).
max_ttl_seconds: 900

# Declared operator parameter sets (D-IMPL-38). Read as: the dispatch
# perspective may see internally-classified state; rank work orders against
# the urgent-repair query at or above 40%; reconcile to the boundary on both
# temporal axes; expand two hops from technicians over these typed edges.
operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "compressor fault urgent repair"
    minimum_score_percent: 40
    ranked_entity_classes:
      - work_order
    index_version: "cascadia-workorder-corpus@2026-05-11"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - technician
    relationship_types:
      - assigned_to
      - located_at
    depth_limit: 2

# The product class this fabric serves — the SAME class the agent definition
# declares in its axis-2 context contract (agent.yaml), which is what makes
# the consumption below a contract admission rather than a coincidence.
product_class:
  schema_name: cascadia-fieldworks.work-order-context
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: cascadia-fieldworks.work-order-context.plan
  product_ttl_seconds: 600

perspective:
  principal_id: dispatcher-114
  role: dispatch-analyst

# The decision's instants. Explicit inputs, never clock reads.
decision:
  temporal_boundary: 2026-05-11T08:00:00Z
  now: 2026-05-11T08:00:03Z

artifacts:
  replay_record_class: decision-replay-record

# What the served product should contain, as declared by the deployment that
# authored the events above. The driver asserts against these instead of
# carrying domain expectations of its own.
expected:
  entity_classes:
    - technician
    - work_order
  relationship_types:
    - assigned_to
  entity_count: 2
