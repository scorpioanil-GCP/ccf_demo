# yaml-language-server: $schema=../../../docs/schemas/ccf.resolution-spec.json
# Agent-basics entity-resolution spec — the deployment's declared vocabulary
# (field-service/logistics domain, D-IMPL-52). Everything here is a *value*:
# entity classes, relationship types, attribute names. None of it exists in
# `/src`, and none of it exists in `run.py` (CLAUDE.md §6.4, the No-Hardcoding
# Rule).
#
# This document is closed-world over resolution rules only (D-03). The two
# attribute maps that used to live beside them now sit with the operator whose
# construction reads them — `classification_attribute_by_class` in the policy
# parameters document, `similarity_corpus_attribute_by_class` in the similarity
# one. `tenant_id` moved onto the manifest, which is where the deployment's own
# identity already is.
#
# It mirrors the *shape* the assembly worker accepts (whitepaper §7.3:
# identity_keys mint the canonical entity URI, INV-CH7-18).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, match key, attribute name and
# relationship type is [ADAPT]; the keys `entity_rules`, `match_key`,
# `entity_class`, `identity_keys`, `attribute_keys`, `relationship_rules`,
# `relationship_type`, `subject_entity_class` and `object_entity_class` are
# [MECHANISM].

semver: "1.0.0"

# Source payload vocabulary -> E nodes. `match_key` selects a rule by presence;
# `identity_keys` mint the canonical URI, so the same technician arriving from
# two source systems converges on one node without either system knowing about
# the other.
entity_rules:
  - match_key: technician_ref
    entity_class: technician
    identity_keys: [technician_ref]
    attribute_keys:
      - technician_name
      - trade
      - technician_classification

  - match_key: work_order_ref
    entity_class: work_order
    identity_keys: [work_order_ref]
    attribute_keys:
      - priority
      - work_order_summary
      - work_order_classification

  - match_key: site_ref
    entity_class: site
    identity_keys: [site_ref]
    attribute_keys:
      - region
      - site_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence.
relationship_rules:
  - relationship_type: assigned_to
    subject_entity_class: technician
    object_entity_class: work_order

  - relationship_type: located_at
    subject_entity_class: work_order
    object_entity_class: site
