# Agent-basics agent definition — a declared, versioned Control Plane
# artifact (CLAUDE.md §6.1/§6.2; D-IMPL-28). Field-service domain, D-IMPL-52.
#
# All six specialization axes are here, as values. `/src` holds none of
# them: the SDK ships the six-axis schema and the Agent Factory, never a
# specific agent (CLAUDE.md §6.1 — "any agent found in library code is a
# defect"; No-Hardcoding Rule §6.4). Instruction bindings are versioned-URI
# refs only; an inline prompt string here or anywhere else is a D-13
# violation. Two-field versioning per D-IMPL-28; decimals quoted so they
# parse as text, never floats (D-IMPL-26).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the agent name, tenant, role, region, every URI, threshold
# value and parameter name are [ADAPT]; the six axis keys (`archetypes`,
# `context_contract`, `perspective`, `policy_regime`,
# `halflife_debt_profile`, `instruction_bindings`) and the artifact
# framing keys (`keys`, `referenced_artifacts`, `agent_definition`,
# `schema_version`, `artifact_version`, `ref`, `semver`, `class_id`,
# `declaration`) are [MECHANISM].

keys:
  agent_definition: cascadia-fieldworks/agents/response-time-analytics

# The referenced Control Plane artifacts the driver registers so the factory
# can resolve the definition's axis-4/axis-5 refs through Control Plane
# resolution (DESIGN.md §3.5 — never raw storage). Keys mirror the versioned
# URIs below: {tenant}/{artifact_class}/{name}.
referenced_artifacts:
  policy_regime:
    key: cascadia-fieldworks/policy-bundle/field-operations
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: field-operations
      permitted_classifications: [internal]
  halflife_debt_profile:
    key: cascadia-fieldworks/debt-profile/dispatch-window-review
    class_id: debt-profile
    semver: "1.0.0"
    declaration:
      review_cycle: per-shift
      risk_sensitivity: "1.2"
      forced_llm_threshold: "0.30"
      fail_closed_threshold: "0.75"

agent_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: response-time-analytics
  tenant: cascadia-fieldworks

  # axis 1 — ordered archetype list (D-IMPL-19)
  archetypes: [analytics_insights]

  # axis 2 — context contract: the product class the fabric in this example
  # actually serves (controlplane.yaml `product_class`), so the agent
  # consumes a real gated product.
  context_contract:
    consumes:
      - product_class: cascadia-fieldworks.work-order-context
        schema_version: "1.0.0"

  # axis 3 — perspective (Π role-conditioning)
  perspective:
    role: dispatch-analyst
    selection_params:
      region: pacific-northwest

  # axis 4 — policy regime (versioned-URI ref, never inline)
  policy_regime:
    ref: "ccf-artifact://cascadia-fieldworks/policy-bundle/field-operations@1.0.0"

  # axis 5 — half-life and debt profile (versioned-URI ref)
  halflife_debt_profile:
    ref: "ccf-artifact://cascadia-fieldworks/debt-profile/dispatch-window-review@1.0.0"

  # axis 6 — instruction bindings: refs plus declared parameter names (D-13)
  instruction_bindings:
    - prompt: "ccf-artifact://cascadia-fieldworks/prompt/work-order-briefing@1.0.0"
      parameters: [work_order_ref, as_of]
