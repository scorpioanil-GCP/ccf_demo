# yaml-language-server: $schema=../../../docs/schemas/ccf.half-life-table.json
# Agent-basics λ_c table (whitepaper §7.7; field-service domain, D-IMPL-52).
#
# Every half-life lives here. The SDK ships the decay formula, never a
# calibration (INV-CH7-58/59; CLAUDE.md §11): an observation type with no
# declared λ_c raises rather than decaying at a rate nobody chose.
#
# This table plus the agent's axis-5 debt profile (`agent-debt-profile.yaml`)
# are what make axis 5 OBSERVABLE: `debt-evaluation.yaml` names dated
# observations against these bands, and the assessed D_c lands in a CAR routing
# state the deployment reviewed.
#
# Decimal-valued entries are QUOTED wherever they appear. The canonical
# serializer refuses floats (not bit-stable across platforms), and the artifact
# loader refuses a YAML float rather than silently converting one.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: observation-type names and every calibrated value are [ADAPT];
# the row shape (`half_life_seconds`, `decay_driver`, `supersession_event`) is
# [MECHANISM].

semver: "1.0.0"

# The (type, band, dominant decay driver, supersession event) row shape is the
# whitepaper's commitment (INV-CH7-59); the values are this deployment's.
entries:
  work-order-status:
    half_life_seconds: 3600
    decay_driver: field progress updates from technicians
    supersession_event: status transition on the work order
  technician-roster-entry:
    half_life_seconds: 604800
    decay_driver: weekly roster publication
    supersession_event: roster republication
