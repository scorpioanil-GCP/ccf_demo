# yaml-language-server: $schema=../../../docs/schemas/ccf.deployment-manifest.json
# The one document naming what this deployment puts in force (D-06, D-08,
# D-IMPL-80; field-service/logistics domain, D-IMPL-52).
#
# Every artifact is ENUMERATED, never globbed: the set of Control Plane
# artifacts in force is dimension 2 of the five-dimension Decision Replay
# record, and a pattern would make that set a function of directory contents at
# boot time with no artifact recording that a dropped-in file changed what was
# in force.
#
# **What this manifest deliberately does not carry.** The agent definition and
# the prompt artifact are absent, and their absence is a governance decision
# rather than an omission. Both carry D-IMPL-28 two-field versioning and
# register through `ControlPlaneRegistry.register_versioned`, which holds the
# author's `artifact_version` claim against content identity (the D-05 bump
# check). `load_and_boot` registers through `register_typed`, which does not.
# Routing an author-versioned artifact through this manifest would therefore
# silently drop that check, so `run.py` registers those two itself — see
# `agent-registration.yaml` for the keys.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `tenant_id`, every `key`, every `path`, and the
# non-`ccf.`-prefixed `class_id` values are [ADAPT]; the keys `semver`,
# `tenant_id`, `backend`, `resolution_spec_key`, `policy_bundle_key`,
# `artifacts`, `path`, `key`, `class_id` and `role`, the `ccf.`-prefixed class
# ids, and the `role` values are [MECHANISM].

semver: "1.0.0"

tenant_id: cascadia-fieldworks
backend: sqlite

resolution_spec_key: resolution-spec
policy_bundle_key: policy-bundle

artifacts:
  # --- role: register — into the registry, into the pin set, into replay
  #     dimension 2. This is "what this fabric was permitted to do".
  - path: resolution-spec.yaml
    key: resolution-spec
    class_id: ccf.resolution-spec
    role: register

  - path: policy-bundle.yaml
    key: policy-bundle
    class_id: cascadia-fieldworks.policy-bundle
    role: register

  - path: half-life-table.yaml
    key: half-life-table
    class_id: ccf.half-life-table
    role: register

  - path: operator-parameters-traversal.yaml
    key: traversal
    class_id: ccf.operator-parameters.traversal
    role: register

  - path: operator-parameters-temporal.yaml
    key: temporal
    class_id: ccf.operator-parameters.temporal
    role: register

  - path: operator-parameters-policy.yaml
    key: policy
    class_id: ccf.operator-parameters.policy
    role: register

  - path: operator-parameters-similarity.yaml
    key: similarity
    class_id: ccf.operator-parameters.similarity
    role: register

  - path: perspective.yaml
    key: perspective
    class_id: ccf.perspective
    role: register

  - path: product-class.yaml
    key: product-class
    class_id: ccf.product-class
    role: register

  - path: product-governance.yaml
    key: product-governance
    class_id: cascadia-fieldworks.product-governance
    role: register

  # The agent's axis-4 and axis-5 targets. Their keys are LONG because a key
  # here is the Control Plane key, and the agent definition's versioned-URI
  # refs resolve to exactly `{tenant}/{artifact_class}/{name}` — the manifest
  # and the definition are two independent statements of one key, and the
  # factory refuses loudly if they disagree.
  - path: agent-policy-regime.yaml
    key: cascadia-fieldworks/policy-bundle/field-operations
    class_id: policy-bundle
    role: register

  - path: agent-debt-profile.yaml
    key: cascadia-fieldworks/debt-profile/dispatch-window-review
    class_id: debt-profile
    role: register

  # --- role: load — parsed and validated through the same seam as everything
  #     above, then handed back on `BootedFabric.artifacts`. Never registered,
  #     never pinned, never in replay dimension 2.

  # The events batch is `role: load` and the SDK FIXES it that way (D-IMPL-80,
  # SDK_ARTIFACT_ROLES): registering a signal batch would content-hash raw
  # event data into Control Plane state and therefore into Decision Replay
  # dimension 2. Events are what the fabric OBSERVED; the Control Plane is what
  # the fabric was PERMITTED TO DO.
  - path: events.yaml
    key: events
    class_id: ccf.signal-batch
    role: load

  # This run's decision instants. The deployment's own class, so the role is
  # the deployment's call — `load`, because what instant one run asked about is
  # not part of what the fabric was permitted to do.
  - path: decision.yaml
    key: decision
    class_id: cascadia-fieldworks.decision-inputs
    role: load

  # An expectation is not a permission.
  - path: expected.yaml
    key: expected
    class_id: cascadia-fieldworks.expected-product
    role: load

  # The D_c evaluation inputs this run scores. Observations and reviewed
  # outcomes, not permissions.
  - path: debt-evaluation.yaml
    key: debt-evaluation
    class_id: cascadia-fieldworks.debt-evaluation
    role: load

  # The scripted analyst's canned content. Model output is an observation of a
  # run, never a statement of what the fabric may do.
  - path: analysis-output.yaml
    key: analysis-output
    class_id: cascadia-fieldworks.analysis-output
    role: load

  # The Control Plane keys the two author-versioned artifacts register under.
  # A pointer to where something will be registered is not itself a permission;
  # the registration is.
  - path: agent-registration.yaml
    key: agent-registration
    class_id: cascadia-fieldworks.agent-registration
    role: load
