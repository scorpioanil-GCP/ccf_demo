# yaml-language-server: $schema=../../docs/schemas/ccf.deployment-config.json
#
# THE SINGLE DEPLOYMENT DOCUMENT — every Control Plane section this example puts
# in force, in one file (`D-IMPL-136`'s AMENDMENT: the section name IS the
# class, so no file name, manifest key or class id is stated three times over
# for a section the SDK owns).
#
# THIS IS THE CANONICAL SUCCESSOR TO `examples/cp-04-corporate-family-tree`.
# It answers the same rung-4 business question — walk a corporate family from an
# anchor LEI across two stores and return the tree, the ontology class of every
# node, and any ownership cycles as findings — and it is authored directly
# against the SDK as it ships today rather than derived from cp-04's tree
# (`D-IMPL-313`, `D-IMPL-314`). **cp-04 remains frozen** as the historical
# specimen (`D-IMPL-261`, `D-IMPL-312`); nothing here reuses its content
# addresses, published identifiers, snippet includes or expectations.
#
# WHAT A READER SHOULD COMPARE. cp-04 declared the same six family predicates
# and the same two operators, and then SUBSTITUTED the caller's depth and the
# caller's family into its own resolved artifacts at runtime, from
# `deployment.py`. That substitution was an ungoverned write to a Control Plane
# declaration — invisible to the pins and to replay. Both are DECLARATIONS here,
# and the two `source: effective_request` bindings below are where the
# difference lives. Everything else in this document is the same product.
#
# NO CONNECTION VALUE APPEARS HERE. The fabric's own L3 is named as a KIND; how
# the two SOURCE stores are reached is `backends.yaml`, and where they are lives
# only in the environment. A DSN in a content-hashed artifact is a DSN persisted
# into the audit plane forever.

semver: "1.0.0"
tenant_id: cp-04-canonical-demo

# The FABRIC's own graph state, not a source. This deployment opens two source
# stores and writes to neither; L3 is per-run SQLite exactly as at every rung
# below it.
backend: sqlite

# ---------------------------------------------------------------------------
# The product class.
# ---------------------------------------------------------------------------
product_class:
  schema_name: reference.corporate-family

  # A MAJOR LANE OF ITS OWN, and the version is doing real work. cp-04 serves
  # `1.1.0` of this same class name. Two examples answering one business
  # question must not share a lane: a shared version would make cp-04's pinned
  # expectations and this deployment's determinations addressable as though
  # they came from one declaration, which is exactly the provenance the
  # specimen/successor separation exists to keep apart.
  schema_version: "2.0.0"

  # DECISION-ANCHORED, DECLARED HONESTLY (`D-IMPL-341`, validation pass
  # 2026-09-18; was `from_entity_freshness`). The declaration above this line
  # once read "the expiry is a function of the latest assertion time among the
  # family edges the payload admitted" — and no such instant exists to read.
  # Measured against `fibo-v2`: an `owns` / `controls` edge is a bare triple
  # with no assertion date, and the only `validFrom` near the demonstration
  # anchor sits on a `prior-obs-…` supersession record shared by 84 subjects
  # (a load artifact, not a per-edge assertion). `deployment.envelopes` dates
  # every family claim by the question instant because the source says
  # nothing else. An evidence anchor over claims dated by the question IS a
  # decision anchor wearing the other name, so the class now says what it
  # does: the window runs from the decision instant. The spec's element 8 and
  # `FINDINGS.md` carry the changed claim; a GLEIF RR-CDF record date, if one
  # is ever ingested onto the edge claims, is what would let this return to
  # `from_entity_freshness`.
  ttl_anchor: from_decision

  # No LLM is reachable from any step: the whole product is a walk, a
  # normalization, a batched join and a circuit enumeration.
  assembly_mode: algorithmic

  max_ttl_key: cp-04-canonical/product/corporate-family-tree/max-ttl

  # TWO OPERATORS. The subject of this product IS the relationships, so the
  # walk is a registered L4 operator and `operators_invoked` carries exactly
  # two entries. Cycle enumeration is NOT among them and declares no operator:
  # the graph store has no in-store graph-algorithm library, so the circuit
  # walk runs application-side in L2. A step that declares a Standard name but
  # is not a registered operator does not enter `operators_invoked`, and
  # lineage strict equality is why that distinction is load-bearing rather than
  # tidy.
  required_operator_keys:
    - policy.principal-subgraph
    - traversal.typed-neighborhood

# ---------------------------------------------------------------------------
# The L4 operator parameters.
# ---------------------------------------------------------------------------
operators:
  # --- Policy runs BEFORE anything reads graph state. -----------------------
  #
  # On a graph that ordering stops being decoration: the envelope shapes WHAT
  # IS WALKED rather than what is returned, so a node the principal may not see
  # is never materialized and no edge to it is ever built. Suppression silence
  # holds structurally instead of by filtering afterwards.
  policy.principal-subgraph:
    # THE AXIS IS OBSERVED FAMILY MEMBERSHIP, NOT JURISDICTION, and the reason
    # is measured rather than stylistic. `PolicyFilter._admits` reads one claim
    # attribute and refuses a null as firmly as an out-of-grant value, so an
    # axis whose attribute most family members do not carry serves almost
    # nobody. `family_id` is minted when a node is ADMITTED TO THE WALK, so the
    # value is OBSERVED by the walk rather than inherited from the anchor or
    # joined in from the attribute leg.
    classification_attribute_by_class:
      family_node: family_id

    # THE FIRST OF THIS DEPLOYMENT'S TWO REQUEST BINDINGS, and the one that
    # replaces cp-04's runtime substitution into a resolved artifact.
    #
    # The family a request names is not knowable when this document is written.
    # cp-04 wrote `permitted_classifications: []` — which is valid and means
    # ADMIT NOTHING — and then wrote the caller's family into the resolved
    # artifact from its own code. A binding says the same intent as a
    # DECLARATION: the value arrives from the EFFECTIVE request, after class
    # defaults, policy bounds and technical capabilities have folded, and it
    # travels into the operator parameter set's content hash and therefore into
    # the replay record. An audit can read WHICH family this decision admitted.
    #
    # A literal and a binding cannot both be written here — they are two
    # variants of one field — so `[]` keeps its honest meaning for every
    # deployment that means it (`D-IMPL-288`, `D-IMPL-295`).
    #
    # WHY THE CALLER STATES A LIST RATHER THAN THE SDK WRAPPING THE ANCHOR. A
    # binding supplies a value; it never converts one, and a widening as small
    # as scalar-to-singleton is still a transform. So `families` is declared on
    # the request surface as a list and the caller says it, which also makes a
    # two-family question expressible without a second code path.
    permitted_classifications:
      source: effective_request
      parameter: families

  # --- The walk. ------------------------------------------------------------
  traversal.typed-neighborhood:
    # SEED CLASSES ARE WALK STARTING POINTS, not a per-hop admitted-class
    # filter. The frontier is seeded with every entity of these classes and
    # then hops over the adjacency for `depth_limit` rounds. The seed is the
    # ANCHOR ALONE, which is why the resolution section below mints two classes
    # rather than one: if every family node shared a class the frontier would
    # be the whole estate and the depth bound would bound nothing.
    #
    # The value is the anchor's RESOLUTION class, never a FIBO class name. A
    # FIBO name here would match no entity record and seed an EMPTY frontier,
    # which reads as a bounded walk that returned nothing. The FIBO chain is
    # SERVED on every node as `type_chain` — it is payload, not an admission
    # filter.
    # Every admitted node, because L3 holds ONLY what acquisition admitted —
    # the depth bound was already applied at the source, and this operator's
    # `depth_limit` below is the BACKEND ceiling rather than the product bound.
    # Seeding from the anchor alone would reach the same set by a longer route.
    seed_entity_classes:
      - family_node

    # THE SIX DECLARED FAMILY PREDICATES, in the short-name vocabulary the
    # normalization step mints. Other relationship predicates exist in this
    # ledger — `hasSubsidiary`, `hasBeneficialOwner`, `isBeneficialOwnerOf`,
    # `ownershipIn`, `hasOwnershipPercentage`, `isDirectorOf`, `isOfficerOf` —
    # and are deliberately excluded. The full IRI for each of the six is in
    # `artifacts/source-vocabulary.yaml`, beside the read that uses them:
    # these short names are the fabric's own relationship vocabulary, which the
    # normalization step mints, and the IRIs are the source's.
    relationship_types:
      - owns
      - controls
      - isDirectlyConsolidatedBy
      - isUltimatelyConsolidatedBy
      - hasGlobalUltimateParent
      - hasDomesticUltimateParent

    # A LITERAL, AND DELIBERATELY NOT A REQUEST BINDING — this is the successor's
    # sharpest departure from cp-04, and it was reached by measurement rather
    # than by preference.
    #
    # cp-04 declared a literal here and then substituted the CALLER's depth over
    # it at runtime, which made one number serve two authorities at once. The
    # obvious canonical repair looks like binding this key to `max_depth` the way
    # `permitted_classifications` binds to `families` above. It is the wrong
    # repair, and `examples/cp-05-credit-exposure-rollup/ccf_config.yaml` says so
    # in as many words: the request bound is what this PRODUCT offers a caller;
    # the operator ceiling is what the BACKEND can be asked for, and one number
    # serving as both would make a product decision look like a capability limit.
    #
    # SO THE TWO NUMBERS ARE SEPARATED HERE. This is the ceiling the walk over
    # the fabric's own L3 will never exceed. The caller's depth is governed
    # somewhere else entirely and by a different authority: `max_depth` folds
    # through `resolve_effective_request` — class default when the caller omits
    # it, `argument_domains` minimum, and the graph leg's own `traversal-depth`
    # technical capability — and the EFFECTIVE value that survives is what the
    # acquisition walks at. A depth above the backend's capability is refused by
    # name with authority `technical`, carrying the bound that refused it, and is
    # never quietly answered at a narrower depth: a request for 101 answered by a
    # walk at 100 would look fine and would seal to a content address that greens.
    #
    # WHERE THE CALLER'S DEPTH IS THEREFORE RECORDED: in the effective request,
    # which replay dimension 2 carries as the request-contract binding
    # (`D-IMPL-310`) — not smuggled into an operator parameter hash by a
    # substitution nobody declared.
    depth_limit: 6

# ---------------------------------------------------------------------------
# WHICH QUESTIONS this class answers.
# ---------------------------------------------------------------------------
#
# Adopter-owned bookkeeping (`D-IMPL-138`(a)): `class_id`, `role` and
# `registration` have no default the SDK could derive for a class it does not
# own.
request_contract:
  class_id: cp-04-canonical.request-contract
  role: register
  registration: typed
  schema_name: reference.corporate-family
  schema_version: "2.0.0"
  # `intent` IS NOT DECLARED HERE, and its absence is current-surface
  # correctness rather than an omission. cp-04 declared `intent` among its
  # arguments; the SDK now refuses that, because `intent` is a top-level
  # `ProductRequest` field and an argument of the same name shadows it — what a
  # class serves is declared once, on `ProductDiscovery.intents`, and judged
  # there (`D-IMPL-264` D-01). The request still carries an intent; it is simply
  # not an argument.
  arguments:
    properties:
      lei:
        type: string
        description: >-
          the anchor. Unresolvable is a refusal and never an empty payload — an
          empty family is a claim about the world, not about the request.
      families:
        type: array
        items:
          type: string
          description: one family identifier the request is entitled to walk.
        description: >-
          the family identifiers this request is entitled to walk, and the
          value that reaches the policy operator's admitted set. Ordinarily the
          anchor's own LEI, stated as a one-element list; a caller entitled to
          two families can ask about both without a second code path. Stated by
          the caller rather than derived from `lei` because a binding supplies
          a value and never converts one.
      max_depth:
        type: integer
        description: >-
          how many hops from the anchor. ABSENT TAKES THE DECLARED DEFAULT
          below, read from the declaration and never invented at serve time. A
          depth this estate cannot exhibit is SERVED — the walk returns what it
          reaches, and the payload's findings carry the depth actually reached
          beside the depth requested. A depth above the BACKEND's technical
          capability is refused by name with authority `technical`, carrying
          the bound that refused it.
      debt_tolerance:
        type: number
        description: >-
          the caller's ceiling on assessed Context Debt, folded through the
          same resolution as every other parameter.
      as_of:
        type: string
        description: DECLARED AND INERT — refused, never honored. See unsupported_arguments.
    required:
      - lei
      - families

  # ABSENT `max_depth` TAKES THIS, and the default lives here rather than in
  # code so replay resolves the same number the serve did.
  defaults:
    max_depth: 3

  argument_domains:
    max_depth:
      minimum: 1

  # The ceiling is the BACKEND's, read off the graph store at assembly time and
  # supplied to the resolver as a technical capability. It is deliberately not
  # written here as a number: a product decision and a substrate limit are
  # different authorities, and one literal serving as both would report a
  # capability refusal as a policy one.
  capability_bindings:
    max_depth: traversal-depth

  # ARGUMENT NAME -> AUTHORED REASON. The canonical shape is a mapping, and the
  # reason is authored by the deployment that refuses the argument; a bare list
  # names WHICH arguments are refused and never WHY, and is refused at boot
  # (`D-IMPL-289`, `24.10-F-12`).
  unsupported_arguments:
    as_of: >-
      not_supported_at_tier. Reconstructing the corporate family as it stood on
      a past date requires ledger time-travel on the CCF temporal axis. This
      tier serves the family as it stands, recording the graph leg's own
      transaction watermark BESIDE the snapshot instant and never inside it.

# ---------------------------------------------------------------------------
# How a source fact becomes fabric state.
# ---------------------------------------------------------------------------
#
# ONE ENTITY CLASS, AND THREE RULES THAT ALL MINT IT. A family node is a family
# node whether this deployment met it as an anchor, as somebody's parent or as
# somebody's child. cp-04 declared two classes so that the walk could be seeded
# from the anchor alone; that is unnecessary here, because L3 holds ONLY what
# acquisition admitted, so seeding from every admitted node reaches the same set.
#
# `identity_sources` IS WHAT MAKES THE THREE RULES AGREE (`D-IMPL-316`). It
# changes WHERE an identity value is READ FROM; it does not change WHAT
# CONSTITUTES IDENTITY. All three rules identify a node by the declared key
# `entity_uri`, and each names the payload field carrying it — `entity_uri`,
# `parent_uri` or `child_uri`. The same node therefore mints ONE URI however it
# was met. Without this, a company observed once as a parent and once as a child
# became two entities and this family's 22 mutual pairs each became four nodes
# (`CP04C-F-01`).
resolution:
  entity_rules:
    # The node's own envelope — the only one carrying attributes.
    - match_key: node_ref
      # SEC-023 (D-IMPL-372): only the named sources may assert the attribute the Policy operator admits on. A claim from any other source is refused and audited, and without this declaration the deployment refuses to boot.
      attribute_authorities: {family_id: [corporate_family_graph]}
      entity_class: family_node
      identity_keys: [entity_uri]
      attribute_keys: [lei, label, type_chain, family_id, depth, attributes_resolved]

    # The two endpoint rules. Deliberately NO attribute keys: an edge asserts
    # that two nodes are related, and nothing about what either node is.
    - match_key: parent_ref
      entity_class: family_node
      identity_keys: [entity_uri]
      identity_sources: {entity_uri: parent_uri}
    - match_key: child_ref
      entity_class: family_node
      identity_keys: [entity_uri]
      identity_sources: {entity_uri: child_uri}

  # SIX TYPED EDGE RULES, one per declared family predicate. The envelope's
  # `predicate` field SELECTS among them; it cannot name a type no rule
  # declares, because the comparison is against the rule. Endpoints are chosen
  # by the RULE that resolved them, not by class — which is what lets one
  # envelope mint a single edge between two nodes of the same class.
  relationship_rules:
    - {relationship_type: owns, predicate_key: predicate,
       subject_entity_class: family_node, object_entity_class: family_node,
       subject_rule: parent_ref, object_rule: child_ref}
    - {relationship_type: controls, predicate_key: predicate,
       subject_entity_class: family_node, object_entity_class: family_node,
       subject_rule: parent_ref, object_rule: child_ref}
    - {relationship_type: isDirectlyConsolidatedBy, predicate_key: predicate,
       subject_entity_class: family_node, object_entity_class: family_node,
       subject_rule: parent_ref, object_rule: child_ref}
    - {relationship_type: isUltimatelyConsolidatedBy, predicate_key: predicate,
       subject_entity_class: family_node, object_entity_class: family_node,
       subject_rule: parent_ref, object_rule: child_ref}
    - {relationship_type: hasGlobalUltimateParent, predicate_key: predicate,
       subject_entity_class: family_node, object_entity_class: family_node,
       subject_rule: parent_ref, object_rule: child_ref}
    - {relationship_type: hasDomesticUltimateParent, predicate_key: predicate,
       subject_entity_class: family_node, object_entity_class: family_node,
       subject_rule: parent_ref, object_rule: child_ref}

# ---------------------------------------------------------------------------
# λ_c — how fast each observation type goes stale.
# ---------------------------------------------------------------------------
#
# Six types, because this product admits six genuinely different observations
# and one curve over all of them would price a daily-refreshed attribute row
# like an annually-published ontology.
half_life:
  ownership_edges:
    half_life_seconds: 15552000      # ~180d — `owns`, `controls`
    decay_driver: acquisition-disposal-restructuring
    supersession_event: gleif-rr-cdf-delta-touching-either-endpoint
  ultimate_parent_designation:
    half_life_seconds: 31536000      # ~365d — the two ultimate-parent predicates
    decay_driver: group-reorganization
    supersession_event: rr-cdf-delta-on-the-designation
  consolidation_relationships:
    half_life_seconds: 31536000      # ~365d — the two consolidation predicates
    decay_driver: change-of-consolidating-parent
    supersession_event: rr-cdf-delta
  exhibit_21_subsidiary_list:
    half_life_seconds: 31536000      # ~365d — annual filing cadence
    decay_driver: annual-filing-cadence
    supersession_event: new-10-K-exhibit-21-for-the-filer
  entity_attributes:
    half_life_seconds: 2592000       # ~30d — GLEIF Level 1, the attribute leg
    decay_driver: gleif-level-1-refresh
    supersession_event: level-1-record-update
  fibo_t_box:
    half_life_seconds: 31536000      # ~365d — the ontology itself
    decay_driver: edm-council-release
    supersession_event: new-fibo-version-loaded

# ---------------------------------------------------------------------------
# Where the D_c bands sit.
# ---------------------------------------------------------------------------
#
# D_c is measured over the SERVED ROSTER — what the payload actually carries —
# and not over the deployment's source read. A denominator taken from the read
# describes a scalar that cannot fail through the door.
debt_profile:
  risk_sensitivity: "1.0"
  forced_llm_threshold: "0.60"
  fail_closed_threshold: "0.77"

# The regime in force. Its VERSION rides the served product's lineage.
policy:
  class_id: cp-04-canonical.policy-bundle
  role: register
  registration: typed
  regime: corporate-family-tree-entitlement

# Π role-conditioning: whose view of the graph this product is served under.
default_perspective:
  principal_id: PRIN-COV-001
  role: credit-officer

# ---------------------------------------------------------------------------
# The deployment's bindings — declared ONCE (`D-IMPL-343`; `D-IMPL-282` R-12;
# `D-IMPL-292`). Re-expressed on the paved road for CP-14 Gate 2 slice 2
# (2026-09-15): no spine restates any of these as an argument, and the numbers
# `FamilyScenario` once derived from the half-life table are now the class's
# own declared TTL — the SDK's contract keeps the two apart.
# ---------------------------------------------------------------------------

# Where every decision record for this deployment is filed, served and refused
# alike — ONE store under ONE class, shared by the spine and the door.
replay:
  record_class: ccf.replay-record
  query_pin_class: ccf.graph-query
  store_dirname: artifact-store

# THE TTL THIS PRODUCT DECLARES. The class ceiling is the ownership-edge
# half-life (~180 days); the product's own window is the entity-attribute
# freshness anchor the class declares (~30 days, GLEIF Level 1 refresh) — the
# same two figures the canonical spine derived from `half_life:` above, now
# stated as the TTL contract element they are. `ttl_anchor` is
# `from_decision` (see the class block above, `D-IMPL-341`): the 30-day window
# runs from the decision instant, and says so on the served contract.
ttl:
  max_ttl_seconds: 15552000          # ~180 days
  product_ttl_seconds: 2592000       # ~30 days

# THE STANDARD DOOR'S OWN VALUES: the identity every consumer's registration
# holds this producer's answers to (`D-IMPL-340`; R-6 — the tenant is declared
# and checked equal to this deployment's), the scope a caller must carry, and
# the prose the tool advertises. No principal, no role, no URL and no credential
# here — each has exactly one other home.
door:
  producer_id: cp-04-canonical-corporate-family-tree-egress
  producer_tenant: cp-04-canonical-demo
  required_scope: ccf:egress
  tool_description: >-
    Answer one corporate family as a governed, content-addressed Context
    Product (`reference.corporate-family`). The subject is the anchor's LEI.
    Returns the family walked from the anchor over the declared ownership,
    control and consolidation predicates to the effective depth — every node
    with its FIBO class chain, its label and its LEI, every typed edge, the
    ownership circuits found as findings rather than errors, and the count of
    nodes the attribute store resolved. The caller MUST supply `lei` and
    `families` (the family identifiers this request is entitled to walk) and
    may supply `max_depth` (absent takes the class default) and
    `debt_tolerance`. A depth above the graph leg's technical ceiling is
    REFUSED by name with authority `technical`; `as_of` is declared and
    refused, never honored.
