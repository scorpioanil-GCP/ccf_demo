# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# WHAT THE SERVED PRODUCT SHOULD CONTAIN, DECLARED — the STRONG form of the
# obligation, and the precedent worth reading beside this one is
# `examples/s1-01-hello-context-product/artifacts/expected.yaml`.
#
# **This document derives NOTHING from a run.** There is no regeneration target
# and none will be added. If the artifacts change, run the example's test suite,
# review the failure, then deliberately edit this file to match what you
# reviewed, in the same commit as the change. That is what makes an
# expected-output change an edit to a REVIEWED ARTIFACT rather than a refreshed
# transcript — and it is why the assertions built on it are independent
# expectations rather than propagation checks.
#
# **This document also exists so the test module has a source for its domain
# expectations OTHER THAN ITSELF.** A value the test authored would be the test
# agreeing with itself about what this deployment's vocabulary says. CINV-01
# reaches `tests/` and would flag an inlined domain literal, but the discipline
# is the point, not the lint.
#
# ============================================================================
# WHY THERE IS NO ROW COUNT IN HERE, AND WHY NOBODY SHOULD ADD ONE LATER
# "FOR COMPLETENESS".
# ============================================================================
#
# The number of holders served at a given threshold comes from the STORE. It is
# a fact about the source estate's contents at the moment of the read, not a
# fact about this product's declaration — and the store's contents can
# legitimately change under a later load without anything here being wrong.
#
# A count authored here would therefore be one of two bad things: a transcript
# of a run (which is what this document exists NOT to be), or the suite
# agreeing with itself. The row count belongs to the test's own SELECT oracle,
# which asks the source the same question by a different route and compares —
# an independent instrument rather than a remembered number.
#
# Everything below is checkable by a reader WITHOUT running anything, because
# every line of it follows from the specification and from `ccf_config.yaml`.
#
# `role: load`. An expectation is not something the fabric is permitted to do,
# so it has no business in Control Plane state or in replay dimension 2. It is
# parsed, validated and handed back.

semver: "1.0.0"
class_id: cp-00.expected-product

declaration:
  # --- WHICH PRODUCT ------------------------------------------------------
  # Spec §B.1 elements 6 and 7. `plan_id` equals `schema_name` because the
  # assembly-recipe's step-5 witness is `plan_id_matches:
  # holdings.institutional-holders`, and a plan id that drifted from the class
  # name would leave that witness with nothing to match.
  schema_name: holdings.institutional-holders
  schema_version: "1.0.0"
  plan_id: holdings.institutional-holders

  # Spec §B.1 element 9. Mode 1 — no model in the trust path.
  assembly_mode: algorithmic

  # Spec §B.1 element 3, and `24-CONTEXT.md` `D-22`.
  ttl_anchor: from_entity_freshness

  # The declared TTL applied to the pinned reported quarter end (2026-03-31).
  # `24-CONTEXT.md` `D-43`: after this date
  # `src/ccf/products/gates.py::_refuse_ttl` refuses, and THAT IS THE GATE
  # WORKING. A refusal naming the gate's UPPER bound before this date is a
  # deployment whose `MAX_TTL` is below 31,536,000 s — a configuration
  # mismatch, not an example bug. Spec §E.5 tells the two apart from the
  # refusal message alone.
  expires_at: "2027-03-31T00:00:00+00:00"

  # --- WHAT RAN -----------------------------------------------------------
  # The declared operator set, which gate 2 holds to STRICT EQUALITY against
  # the set the projection engine resolved, in both directions. These are also
  # the `operator_in_lineage` witnesses the assembly recipe declares for §D.2
  # steps 3 and 4.
  operator_keys:
    - policy.principal-subgraph
    - temporal.as-of-boundary

  # What L2 resolved the source rows into. Spec §B.1 element 1.
  entity_classes:
    - institutional_manager
    - issuer

  relationship_types:
    - reports_position_in

  # --- WHAT THE CALLER MUST SUPPLY ----------------------------------------
  # Spec §B.4. Exactly one class-declared parameter, required, no default.
  required_request_parameters:
    - minimum_position_usd

  # --- THE SHAPE OF THE ANSWER — spec §D.6 -------------------------------
  # The payload's top-level key set. Declared as a SET, not as values.
  payload_keys:
    - count
    - holders
    - issuer
    - perspective_role
    - report_period
    - resolved_security
    - threshold

  # THE KEY THAT MUST NOT BE THERE, and it arms product gate `IH-G08`.
  # `s1-00`'s payload carries `assembled` — the count of rows the fabric read.
  # This product omits it: spec §B.2 commits the product to being SILENT about
  # what fell below the caller's line, and a read count published beside a
  # served count IS the below-threshold count by subtraction. The assembled
  # count is still needed as F's denominator; it lives in the debt block, which
  # is a governed disclosure of what the fabric read rather than a description
  # of the answer's shape.
  payload_keys_forbidden:
    - assembled

  # The nested shapes, each declared as its key set.
  issuer_keys:
    - lei
    - registered_name

  # Step 1's output — the L1 group-and-rank, whose only available witness is
  # `payload_key_present: resolved_security`, because a group-and-rank cannot
  # run on the per-envelope L2 seam.
  resolved_security_keys:
    - candidates_considered
    - cusip
    - resolution_basis
  resolution_basis: dominant-by-position-count

  threshold_keys:
    - comparison
    - minimum_position_usd

  # THE COMPARISON IS `>=`, NOT `>`, and it is declared IN THE PAYLOAD so a
  # consumer never has to infer it. Spec §B.4 declares the parameter as the
  # value AT OR ABOVE which a manager appears; product gate `IH-G04` exists
  # because copying `s1-00`'s strict `>` is the obvious way to get it wrong.
  threshold_comparison: ">="

  # One holder row. `issuer_match_band` is present on every row and filtered
  # nowhere: spec §C.4 trap 3 rules the band a completeness signal that TRAVELS
  # WITH THE ROW, and product gate `IH-G03` catches its loss.
  holder_keys:
    - issuer_match_band
    - issuer_match_score
    - last_updated
    - manager_cik
    - manager_name
    - shares
    - value_usd

  # A total order, so the bytes are stable and the content address is
  # reproducible. Spec §D.6.
  holder_sort_order:
    - field: value_usd
      direction: descending
    - field: manager_cik
      direction: ascending

  # --- WHAT IS SERVED AS A STRING, AND WHY --------------------------------
  # `ccf.contracts.canonical::canonical_bytes` refuses `float` outright,
  # because binary floating point is not bit-stable across platforms and a
  # payload carrying one cannot reach a content address. Decimals therefore
  # travel as strings.
  decimal_string_fields:
    - holders[].issuer_match_score
    - holders[].shares
    - holders[].value_usd
    - threshold.minimum_position_usd

  # --- WHAT MAY BE MISSING, AND WHAT MUST NOT ------------------------------
  # Spec §E.2's per-component debt table and §G's degradation contract. A
  # non-mandatory field absent is served MARKED, never dropped and never turned
  # into a product-level failure.
  not_evaluable_marker: NOT_EVALUABLE
  nullable_payload_fields:
    - holders[].manager_name
    - holders[].shares
    - issuer.registered_name

  # Any of these unavailable is FAIL CLOSED, never a partial payload.
  mandatory_signal_classes:
    - report_period
    - resolved_security
    - value_usd
