# yaml-language-server: $schema=../../../docs/schemas/ccf.skill-catalog-entry.json
# The cycle-detection skill's catalog entry (CLAUDE.md §6.2 channel 2;
# D-IMPL-12/29; Phase 12 CONTEXT D-10/D-11). Banking domain.
#
# One catalog entry, inside the agent's governance envelope:
# `agent-policy-regime.yaml` permits the scope `payment-network-read`, which is
# what admits this skill's grant through the tier-1 compatibility check.
#
# `argument_schema` is the load-bearing part. The callable in `run.py` is
# generic walk-a-graph mechanism; every graph-vocabulary name and every
# threshold it interprets arrives through these declared arguments (§6.4). The
# values themselves are in `skill-dispatch.yaml`.
#
# Author-versioned and therefore deliberately not manifest-addressable — see
# `agent-definition.yaml`'s header for the D-05 reasoning.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the name, tenant, description, every argument name and the
# requirement values are [ADAPT]; the keys `schema_version`,
# `artifact_version`, `name`, `tenant`, `skill_type`, `description`,
# `argument_schema`, `binding` and `requirements`, and the `skill_type` enum
# value, are [MECHANISM].

schema_version: "2.0.0"
artifact_version: "1.0.0"
name: payment-cycle-detect
tenant: meridian-bank
skill_type: local_callable
description: >-
  Detect structured payment cycles over the resolved-entity payment
  network in the served context product: directed cycles of at least
  the declared length whose consecutive amounts stay within tolerance
  and whose timestamps strictly increase inside the span window.
argument_schema:
  properties:
    min_cycle_length:
      type: string
      description: Minimum number of distinct parties in a cycle.
    amount_tolerance_percent:
      type: string
      description: Max consecutive-edge amount delta, in percent.
    max_span_days:
      type: string
      description: Max days between a cycle's first and last edge.
    counterparty_entity_class:
      type: string
      description: Entity class of canonical counterparties.
    transfer_entity_class:
      type: string
      description: Entity class of payment movements.
    site_link_type:
      type: string
      description: Relationship type linking a transfer to its site.
    registration_link_type:
      type: string
      description: Relationship type linking a counterparty to a site.
    origin_attribute:
      type: string
      description: Transfer attribute naming the paying party.
    beneficiary_attribute:
      type: string
      description: Transfer attribute naming the receiving party.
    amount_attribute:
      type: string
      description: Transfer attribute carrying the amount.
    sent_attribute:
      type: string
      description: Transfer attribute carrying the value timestamp.
    name_attribute:
      type: string
      description: Counterparty attribute carrying the display name.
  required:
    - min_cycle_length
    - amount_tolerance_percent
    - max_span_days
    - counterparty_entity_class
    - transfer_entity_class
    - site_link_type
    - registration_link_type
    - origin_attribute
    - beneficiary_attribute
    - amount_attribute
    - sent_attribute
    - name_attribute
binding:
  callable_ref: payment-cycle-detect
requirements:
  required_scopes: [payment-network-read]
  required_context_products: [meridian-bank.payment-network-context]
