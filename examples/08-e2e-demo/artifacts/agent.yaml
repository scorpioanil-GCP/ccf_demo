# ccf-schema: deferred(15-21) `ccf.agent-definition` is an SDK-owned artifact class with no committed docs/schemas/ file and no SDK_ARTIFACT_CLASSES entry, so no honest header exists yet; exporting that schema is SDK surface work, not an example rewrite
# E2E-demo agent definition — a declared, versioned Control Plane artifact
# (CLAUDE.md §6.1/§6.2; D-IMPL-28; Phase 12 CONTEXT D-09). Banking domain.
#
# All six specialization axes are here, as values; `/src` holds none of
# them and run.py constructs the agent through the Agent Factory only
# (§6.4). Instruction bindings are versioned-URI refs only.
#
# The axis-4 and axis-5 documents this definition refs by URI used to be
# inlined here under `referenced_artifacts`, which made this file three
# artifact classes in one. They are now `agent-policy-regime.yaml` and
# `agent-debt-profile.yaml`, registered by the deployment manifest under the
# very keys the refs below name — so the ref and the registration are two
# independent statements of one fact, and `run.py` no longer carries a loop
# that registers artifacts out of another artifact's body.

keys:
  agent_definition: meridian-bank/agents/payment-ring-analytics

agent_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: payment-ring-analytics
  tenant: meridian-bank

  # axis 1 — ordered archetype list (D-IMPL-19; CONTEXT D-09)
  archetypes: [analytics_insights]

  # axis 2 — context contract: the product class this fabric serves
  context_contract:
    consumes:
      - product_class: meridian-bank.payment-network-context
        schema_version: "1.0.0"

  # axis 3 — perspective (Π role-conditioning)
  perspective:
    role: financial-crime-analyst
    selection_params:
      desk: transaction-monitoring

  # axis 4 — policy regime (versioned-URI ref, never inline)
  policy_regime:
    ref: "ccf-artifact://meridian-bank/policy-bundle/financial-crime-regime@1.0.0"

  # axis 5 — half-life and debt profile (versioned-URI ref)
  halflife_debt_profile:
    ref: "ccf-artifact://meridian-bank/debt-profile/ring-investigation@1.0.0"

  # axis 6 — instruction bindings: refs plus declared parameter names
  instruction_bindings:
    - prompt: "ccf-artifact://meridian-bank/prompt/ring-investigation-summary@1.0.0"
      parameters: [cycle_members, as_of]
