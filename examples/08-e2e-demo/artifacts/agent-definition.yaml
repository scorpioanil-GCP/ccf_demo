# yaml-language-server: $schema=../../../docs/schemas/ccf.agent-definition.json
# E2E-demo agent definition — a declared, versioned Control Plane artifact
# (CLAUDE.md §6.1/§6.2; D-IMPL-28; Phase 12 CONTEXT D-09). Banking domain.
#
# All six specialization axes are here, as values; `/src` holds none of them and
# `run.py` constructs the agent through the Agent Factory only (§6.4).
# Instruction bindings are versioned-URI refs, never inline text.
#
# **This document is outside the deployment manifest by this example's choice,
# not by necessity.** `ccf.agent-definition` is author-versioned: it registers
# through `register_versioned`, which holds the author's version claim against
# content identity — the D-05 bump check. A manifest CAN name it, as
# `registration: versioned`, and `load_and_boot` then registers it through that
# same path; declaring `typed` for it is refused at preflight (D-IMPL-85),
# because `register_typed` runs no bump check and the author's claim would go
# unheld. It stays in `run.py` so the bump check is visible at the call site.
# It is an SDK-owned schema, which is why the header above resolves (plan
# 15-14's author-versioned schema set).
#
# The document root IS the artifact: this file's Control Plane key lives in
# `agent-registration.yaml`, because a document that carried both its own
# contents and its filing location could not be validated against its class.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the name, tenant, role, refs and parameter names are [ADAPT];
# the keys `schema_version`, `artifact_version`, `name`, `tenant`, `archetypes`,
# `context_contract`, `perspective`, `policy_regime`, `halflife_debt_profile`
# and `instruction_bindings`, and the archetype identifiers, are [MECHANISM].

schema_version: "1.0.0"
artifact_version: "1.0.0"
name: payment-ring-analytics
tenant: meridian-bank

# axis 1 — ordered archetype list (D-IMPL-19; CONTEXT D-09)
archetypes: [analytics_insights]

# axis 2 — context contract: the product class this fabric serves
context_contract:
  consumes:
    - product_class: meridian-bank.payment-network-context
      schema_version: "1.0.0"

# axis 3 — perspective (Π role-conditioning)
perspective:
  role: financial-crime-analyst
  selection_params:
    desk: transaction-monitoring

# axis 4 — policy regime (versioned-URI ref, never inline). The document it
# names is `agent-policy-regime.yaml`, registered by the deployment manifest
# under exactly this key — so the ref and the registration are two independent
# statements of one fact.
policy_regime:
  ref: "ccf-artifact://meridian-bank/policy-bundle/financial-crime-regime@1.0.0"

# axis 5 — half-life and debt profile (versioned-URI ref to
# `agent-debt-profile.yaml`, likewise manifest-registered)
halflife_debt_profile:
  ref: "ccf-artifact://meridian-bank/debt-profile/ring-investigation@1.0.0"

# axis 6 — instruction bindings: refs plus declared parameter names
instruction_bindings:
  - prompt: "ccf-artifact://meridian-bank/prompt/ring-investigation-summary@1.0.0"
    parameters: [cycle_members, as_of]
