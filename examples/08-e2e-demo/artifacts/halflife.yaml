# E2E-demo λ_c table and D_c debt profile (whitepaper §7.7; banking domain,
# D-IMPL-52). Every half-life, the risk-sensitivity multiplier and both debt
# thresholds live here; the SDK ships the decay formula and the routing
# predicate, never a calibration (INV-CH7-58/59; CLAUDE.md §11).
#
# Decimal-valued entries are QUOTED: the canonical serializer refuses floats
# and the artifact loader refuses a YAML float rather than silently
# converting one.

schema_version: "1.0.0"
artifact_version: "1.0.0"

half_life_table:
  semver: "1.0.0"
  entries:
    wire-transfer-record:
      half_life_seconds: 7776000
      decay_driver: settlement finality and archive rollover
      supersession_event: transfer amendment or recall
    kyc-registration:
      half_life_seconds: 31536000
      decay_driver: annual KYC refresh cycle
      supersession_event: registration reassessment
    ledger-balance-snapshot:
      half_life_seconds: 900
      decay_driver: continuous transaction flow
      supersession_event: newer balance snapshot

debt_profile:
  semver: "1.0.0"
  risk_sensitivity: "1.1"
  forced_llm_threshold: "0.30"
  fail_closed_threshold: "0.80"

# The observation the driver evaluates for freshness at the decision
# instant — the last ring wire, dated from the scenario's fixed epoch.
demonstration:
  observation_type: wire-transfer-record
  observed_at: 2026-03-17T15:00:00+00:00
