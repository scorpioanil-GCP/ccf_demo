# Demo scenario definition — the versioned artifact that carries EVERY domain
# value the end-to-end demonstration needs (CLAUDE.md §6.4 No-Hardcoding Rule;
# Phase 12 CONTEXT D-01..D-08). `generator.py` is a pure interpreter of this
# file: it holds zero vocabulary — no source names, table names, aliases,
# amounts, or lexicon words. Change this file to make your own demo.
#
# Determinism (D-08): the `seed` below is the single documented seed. Changing
# it — or any value in this file — invalidates every pinned checksum in the
# `expected` block and in tests/examples/test_demo_generator.py. Update the
# pins in the same commit or the drift alarm fires, as designed.

artifact_version: "1.0.0"

# The documented fixed seed (D-08). Changing it invalidates all pinned
# checksums below — regeneration is a reviewed, deliberate event.
seed: 20260812

# Fixed epoch every timestamp derives from (never a clock read).
epoch: "2026-03-02T00:00:00+00:00"

# ---------------------------------------------------------------------------
# Three source systems (D-03). Each declares its SQLite file, its mechanism
# role (how the generator interprets it), and its table/column vocabulary.
# Column `role` keys are mechanism selectors the interpreter understands;
# column `name` values are this scenario's domain vocabulary.
# ---------------------------------------------------------------------------
sources:
  core_banking:
    role: ledger
    db_file: core_banking.db
    tables:
      entities:
        name: accounts
        columns:
          - { role: id, name: account_number, type: TEXT }
          - { role: holder, name: holder_name, type: TEXT }
          - { role: tax_id, name: holder_tax_id, type: TEXT }
          - { role: currency, name: currency, type: TEXT }
          - { role: balance, name: balance, type: TEXT }
          - { role: opened, name: opened_date, type: TEXT }
      movements:
        name: transactions
        columns:
          - { role: id, name: txn_id, type: TEXT }
          - { role: account, name: account_number, type: TEXT }
          - { role: counterparty_account, name: counterparty_account, type: TEXT }
          - { role: amount, name: amount, type: TEXT }
          - { role: currency, name: currency, type: TEXT }
          - { role: booked, name: booked_at, type: TEXT }
          - { role: memo, name: memo, type: TEXT }

  wires:
    role: transfer_log
    db_file: wires.db
    tables:
      movements:
        name: wire_transfers
        columns:
          - { role: id, name: wire_reference, type: TEXT }
          - { role: sender, name: originator_name, type: TEXT }
          - { role: sender_bic, name: originator_bic, type: TEXT }
          - { role: beneficiary, name: beneficiary_name, type: TEXT }
          - { role: beneficiary_bic, name: beneficiary_bic, type: TEXT }
          - { role: beneficiary_address, name: beneficiary_address, type: TEXT }
          - { role: amount, name: amount, type: TEXT }
          - { role: currency, name: currency, type: TEXT }
          - { role: sent, name: value_date, type: TEXT }
          - { role: purpose, name: purpose, type: TEXT }

  kyc_registry:
    role: registry
    db_file: kyc_registry.db
    tables:
      entities:
        name: counterparties
        columns:
          - { role: id, name: registry_id, type: TEXT }
          - { role: name, name: legal_name, type: TEXT }
          - { role: tax_id, name: tax_id, type: TEXT }
          - { role: address, name: registered_address, type: TEXT }
          - { role: jurisdiction, name: jurisdiction, type: TEXT }
          - { role: registered, name: registered_date, type: TEXT }

