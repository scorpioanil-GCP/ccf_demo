# E2E-demo skill material (CLAUDE.md §6.2 channel 2; D-IMPL-12/29; Phase 12
# CONTEXT D-10/D-11). One catalog entry inside the agent's governance
# envelope (agent.yaml permits `payment-network-read`), the grant that
# binds it, and the dispatch whose arguments carry EVERY graph-vocabulary
# and threshold value the cycle-detection callable interprets — the
# callable in run.py is generic mechanism over these values (§6.4).

skills:
  payment_cycle_detect:
    schema_version: "2.0.0"
    artifact_version: "1.0.0"
    name: payment-cycle-detect
    tenant: meridian-bank
    skill_type: local_callable
    description: >-
      Detect structured payment cycles over the resolved-entity payment
      network in the served context product: directed cycles of at least
      the declared length whose consecutive amounts stay within tolerance
      and whose timestamps strictly increase inside the span window.
    argument_schema:
      properties:
        min_cycle_length:
          type: string
          description: Minimum number of distinct parties in a cycle.
        amount_tolerance_percent:
          type: string
          description: Max consecutive-edge amount delta, in percent.
        max_span_days:
          type: string
          description: Max days between a cycle's first and last edge.
        counterparty_entity_class:
          type: string
          description: Entity class of canonical counterparties.
        transfer_entity_class:
          type: string
          description: Entity class of payment movements.
        site_link_type:
          type: string
          description: Relationship type linking a transfer to its site.
        registration_link_type:
          type: string
          description: Relationship type linking a counterparty to a site.
        origin_attribute:
          type: string
          description: Transfer attribute naming the paying party.
        beneficiary_attribute:
          type: string
          description: Transfer attribute naming the receiving party.
        amount_attribute:
          type: string
          description: Transfer attribute carrying the amount.
        sent_attribute:
          type: string
          description: Transfer attribute carrying the value timestamp.
        name_attribute:
          type: string
          description: Counterparty attribute carrying the display name.
      required:
        - min_cycle_length
        - amount_tolerance_percent
        - max_span_days
        - counterparty_entity_class
        - transfer_entity_class
        - site_link_type
        - registration_link_type
        - origin_attribute
        - beneficiary_attribute
        - amount_attribute
        - sent_attribute
        - name_attribute
    binding:
      callable_ref: payment-cycle-detect
    requirements:
      required_scopes: [payment-network-read]
      required_context_products: [meridian-bank.payment-network-context]

# The grant document. agent_definition_hash is derived identity, computed
# by mechanism at request time — a hash is never an artifact value.
grant:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: ring-analytics-network-read
  tenant: meridian-bank
  skill_name: payment-cycle-detect
  skill_version: "1.0.0"

actors:
  requesting_actor: financial-crime-platform-operator

# The dispatch: arguments the granted skill is invoked with (and the
# baseline contrast pass reuses the three numeric constraints verbatim, so
# both passes execute the same detection under the same parameters), and
# the pinned output the governed run must produce (D-11 second leg).
dispatch:
  arguments:
    min_cycle_length: "3"
    amount_tolerance_percent: "3.0"
    max_span_days: "30"
    counterparty_entity_class: counterparty
    transfer_entity_class: transfer
    site_link_type: delivered_at
    registration_link_type: registered_at
    origin_attribute: origin_party_name
    beneficiary_attribute: beneficiary_party_name
    amount_attribute: transfer_amount
    sent_attribute: transfer_sent_at
    name_attribute: party_display_name
  expected_output:
    cycles_found: "1"
    cycle_length: "5"
    cycle_members: >-
      Bluegate Trading Company S.A.|Harrow Point Consulting Pte.
      Ltd.|Kestrel Marine Supply GmbH|Northquay Advisory
      Limited|Palmera Logistics S.L.
