# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# How the skill is granted and how it is invoked (CLAUDE.md §6.2 channel 2;
# D-IMPL-29; Phase 12 CONTEXT D-11). Banking domain.
#
# **Why this is a deployment-authored document and not a `ccf.skill-grant`.**
# `SkillGrant` requires `agent_definition_hash`, which is *derived identity* —
# computed by mechanism at request time from the definition's content. A hash is
# never an artifact value, so a standalone document of that class cannot be
# authored, and pointing a `ccf.skill-grant` header at this file would be a
# header its own class rejects. What is authorable is the grant REQUEST, and
# that is what `grant_request` below is: `run.py` completes it into a real
# `ccf.skill-grant` by supplying the hash.
#
# `dispatch.arguments` carry EVERY graph-vocabulary name and threshold the
# cycle-detection callable interprets, per the catalog entry's declared
# `argument_schema`. The baseline contrast pass reuses the three numeric
# constraints verbatim, so both passes execute the same detection under the same
# parameters — which is what makes the D-11 contrast honest.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: meridian-bank.skill-dispatch

declaration:
  # The authorable half of the grant. `agent_definition_hash` is absent on
  # purpose — see the header comment.
  grant_request:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: ring-analytics-network-read
    tenant: meridian-bank
    skill_name: payment-cycle-detect
    skill_version: "1.0.0"

  requesting_actor: financial-crime-platform-operator

  dispatch:
    arguments:
      min_cycle_length: "3"
      amount_tolerance_percent: "3.0"
      max_span_days: "30"
      counterparty_entity_class: counterparty
      transfer_entity_class: transfer
      site_link_type: delivered_at
      registration_link_type: registered_at
      origin_attribute: origin_party_name
      beneficiary_attribute: beneficiary_party_name
      amount_attribute: transfer_amount
      sent_attribute: transfer_sent_at
      name_attribute: party_display_name
    # The pinned output the governed run must produce (D-11, second leg).
    expected_output:
      cycles_found: "1"
      cycle_length: "5"
      cycle_members: >-
        Bluegate Trading Company S.A.|Harrow Point Consulting Pte.
        Ltd.|Kestrel Marine Supply GmbH|Northquay Advisory
        Limited|Palmera Logistics S.L.
