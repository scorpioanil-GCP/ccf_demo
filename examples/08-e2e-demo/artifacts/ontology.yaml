# E2E-demo ontology — the deployment's declared vocabulary (banking domain,
# D-IMPL-52; Phase 12 CONTEXT D-01/D-02). Everything here is a *value*:
# entity classes, relationship types, attribute names, ingest mappings.
# None of it exists in `/src` and none of it exists in `run.py`
# (CLAUDE.md §6.4, the No-Hardcoding Rule).
#
# This file is where the demo's hero lives: the L2 entity-resolution rules
# below are what link the three source systems' GENUINELY DISJOINT
# identifiers (scenario.yaml, RESEARCH Pitfall 4) into one canonical graph:
#
#   * the ledger account and the KYC registry entry converge on ONE
#     `counterparty` node because both carry the same tax reference
#     (identity_keys mint the canonical URI, whitepaper §7.3 / INV-CH7-18);
#   * the wire transfer and the KYC registry entry converge on ONE `site`
#     node because both carry the same registered address — which is the
#     only evidence tying a wire alias back to a registered counterparty.
#
# No single source contains both links. That is why the baseline pass over
# raw rows finds nothing and the governed pass finds the ring (D-11).

schema_version: "1.0.0"
artifact_version: "1.0.0"

tenant_id: meridian-bank

# Source payload vocabulary -> E nodes. `match_key` selects a rule by
# presence; `identity_keys` mint the canonical URI, so the same counterparty
# arriving from two source systems converges on one node without either
# system knowing about the other.
entity_rules:
  - match_key: party_tax_ref
    entity_class: counterparty
    identity_keys: [party_tax_ref]
    attribute_keys:
      - party_display_name
      - party_jurisdiction
      - record_classification

  - match_key: site_address
    entity_class: site
    identity_keys: [site_address]
    attribute_keys:
      - record_classification

  - match_key: account_ref
    entity_class: account
    identity_keys: [account_ref]
    attribute_keys:
      - account_currency
      - record_classification

  - match_key: transfer_ref
    entity_class: transfer
    identity_keys: [transfer_ref]
    attribute_keys:
      - origin_party_name
      - beneficiary_party_name
      - transfer_amount
      - transfer_currency
      - transfer_sent_at
      - transfer_purpose
      - record_classification

  - match_key: movement_ref
    entity_class: movement
    identity_keys: [movement_ref]
    attribute_keys:
      - movement_amount
      - movement_memo
      - record_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence.
relationship_rules:
  - relationship_type: holds
    subject_entity_class: counterparty
    object_entity_class: account

  - relationship_type: registered_at
    subject_entity_class: counterparty
    object_entity_class: site

  - relationship_type: delivered_at
    subject_entity_class: transfer
    object_entity_class: site

# Which attribute carries each class's policy classification (PolicyFilter
# admits nothing whose class has no declared classification attribute).
classification_attribute_by_class:
  counterparty: record_classification
  site: record_classification
  account: record_classification
  transfer: record_classification
  movement: record_classification

# The attribute the similarity corpus is built from, per ranked class.
similarity_corpus_attribute_by_class:
  movement: movement_memo

# ---------------------------------------------------------------------------
# L1 envelope mapping: how raw source-system rows become SignalEnvelope
# payloads. Sources and tables are selected by the mechanism roles
# scenario.yaml declares; payload keys map onto column ROLES, never column
# names, so `run.py` holds no source vocabulary. Entry order is ingest
# order — the registry is ingested last so KYC legal names are the display
# names the resolved counterparty carries at the boundary.
# ---------------------------------------------------------------------------
ingest:
  - source_role: ledger
    table_role: entities
    envelope_id_role: id
    observed_time_role: opened
    payload:
      account_ref: id
      party_display_name: holder
      party_tax_ref: tax_id
      account_currency: currency
    constants:
      record_classification: internal

  - source_role: ledger
    table_role: movements
    envelope_id_role: id
    observed_time_role: booked
    payload:
      movement_ref: id
      movement_amount: amount
      movement_memo: memo
    constants:
      record_classification: internal

  - source_role: transfer_log
    table_role: movements
    envelope_id_role: id
    observed_time_role: sent
    payload:
      transfer_ref: id
      origin_party_name: sender
      beneficiary_party_name: beneficiary
      site_address: beneficiary_address
      transfer_amount: amount
      transfer_currency: currency
      transfer_sent_at: sent
      transfer_purpose: purpose
    constants:
      record_classification: internal

  - source_role: registry
    table_role: entities
    envelope_id_role: id
    observed_time_role: registered
    payload:
      party_tax_ref: tax_id
      party_display_name: name
      site_address: address
      party_jurisdiction: jurisdiction
    constants:
      record_classification: internal
