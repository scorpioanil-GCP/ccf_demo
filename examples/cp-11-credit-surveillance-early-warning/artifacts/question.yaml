# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DEMONSTRATION QUESTION — the caller's vocabulary, read-side.
#
# `run.py` asks this when no flag overrides it. The `as_of` pin is here rather
# than in code because it is a REQUEST parameter: the instant a question is
# asked as-of is the caller's to state, and a program that read a clock would
# make its own answer unreproducible (`D-IMPL-98`).

semver: "1.0.0"
class_id: cp-11.question

declaration:
  question:
    # SUPER MICRO COMPUTER. The heaviest-signalled name in the estate: 139
    # signals in the delta across three classes, a composite that reaches the
    # credit-committee band, and 25 superseded 8-K filings that contribute
    # NOTHING — which is the rung's whole argument, visible in one run.
    lei: "54930022CZO1N2UGVW07"
    intent: daily-sweep
    # The window's end. Late enough to contain the 2024-09-18 acceleration and
    # everything after it.
    as_of: "2026-08-19T00:00:00+00:00"
    # Omitted, the delta runs from the obligor's prior-observation anchor.
    # A fixed lookback is the LAST resort, never the default: the product is a
    # delta and a delta needs a prior.
    since: null
    window_days: 730
    # NO debt_tolerance by default. The composite and the Context Debt are
    # independent measures (`EWS-G29`), and a default ceiling would hide one
    # behind the other on the first run a reader sees. `run.py --debt-tolerance`
    # asks for the refusal.
    debt_tolerance: null
