      clause: G.1
    test: tests/examples/test_cp_11_output.py::test_ews_g03_expiry_derives_from_the_decision_instant
    sabotage: anchor the TTL on ingestion
    sabotage_state: unavailable
    observed_red:
      result: '**DEPLOYMENT SABOTAGE UNAVAILABLE.** The SDK refuses the declaration at artifact load:
