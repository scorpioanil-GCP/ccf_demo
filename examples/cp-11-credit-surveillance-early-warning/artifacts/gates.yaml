# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DECLARED PRODUCT GATES OF cp-11 — ALL TWENTY-NINE CP-SPEC-011 §G.1 NAMES.
#
# `sabotage_state` HAS THREE VALUES AND THEY ARE NOT INTERCHANGEABLE.
# Twenty-five are `passed`. THREE are `unavailable` — `D-IMPL-86`'s bind-time
# operator-divergence refusal (EWS-G01, EWS-G02) and the closed `ttl_anchor`
# vocabulary (EWS-G03). ONE is `not-required` (EWS-G24): no anchor this module
# serves carries a spread signal naming instruments, so it SKIPS with that
# reason rather than passing over an empty set.
#
# TWO GATES WERE GREEN UNDER THEIR OWN SABOTAGE ON THE FIRST ATTEMPT, AND BOTH
# ARE RECORDED AS SUCH (EWS-G27, EWS-G29). Neither was a weak sabotage; both
# were weak TESTS. `EWS-G27` asserted only where the declared answer and the
# inferred answer are the same value. `EWS-G29` asserted structure and
# correlation, and a crossing changed neither. A THIRD (EWS-G20) went red
# against CORRECT code, because it grepped source text and tripped on the
# docstring that explains its own rule.
#
# `EWS-G25` runs the REAL `D-IMPL-334` path — assembly, the boot-bound writer,
# the Control Plane register, the serve-time gate — with no stub and no seeded
# boundary, and pins the instant BOTH WAYS.
#
# The principle the whole file is written to: the evidence should describe
# where the guarantee really comes from, not where we wish it came from.

semver: 1.0.0
class_id: cp-11.product-gates
declaration:
  product: credit-risk.early-warning
  test_naming_convention: the gate id appears in the executing test's docstring, as an EWS-GNN line naming
    the CP-SPEC-011 G.1 clause that approves it.
  sabotage_states:
    passed: the specific invariant under test was broken and the gate went red
    unavailable: an UPSTREAM SDK invariant makes the bad state unreachable from this deployment; the gate
      is evidenced by the successful path plus that guard, never by a local negative control
    not-required: the gate has nothing to range over on this estate; it SKIPS with that reason rather
      than passing over an empty set
  gates:
  - id: EWS-G01
    statement: a plan with zero operator steps never serves
    spec_clause:
      document: spec/CP-SPEC-011_Credit_Surveillance_Early_Warning.md
      clause: G.1
    test: tests/examples/test_cp_11_output.py::test_ews_g01_the_operator_plan_is_never_empty
    sabotage: make the projection require no operators
    sabotage_state: unavailable
    observed_red:
      result: '**DEPLOYMENT SABOTAGE UNAVAILABLE.** The SDK refuses a divergent operator set during governed
        binding under `D-IMPL-86`, before the deployment can produce an artifact — an ERROR at bind time,
        not a red assertion during execution. Evidenced by the successful path plus that guard, as at
        rungs 9 and 10.'
      date: '2026-09-12'
      commit: e98ca052
  - id: EWS-G02
    statement: served lineage equals the plan's typed operator references; `ProductLineage` is exactly
      three fields
    spec_clause:
      document: spec/CP-SPEC-011_Credit_Surveillance_Early_Warning.md
      clause: G.1
    test: tests/examples/test_cp_11_output.py::test_ews_g02_lineage_is_exactly_the_declared_operator_set
    sabotage: make the plan author an operator set of its own
    sabotage_state: unavailable
    observed_red:
      result: '**DEPLOYMENT SABOTAGE UNAVAILABLE.** Same `D-IMPL-86` bind-time refusal. That it fails
        at BIND rather than at serve is itself the evidence: this deployment is not responsible for policing
        the divergence, because the SDK refuses to let such a product exist. The three-field lineage shape
        is likewise an SDK contract a deployment cannot widen.'
      date: '2026-09-12'
      commit: e98ca052
  - id: EWS-G03
