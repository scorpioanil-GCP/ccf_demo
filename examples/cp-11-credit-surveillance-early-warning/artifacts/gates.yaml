        that would have caught `D-IMPL-334`''s defect had it existed then. **The middle leg is why the
        other two mean anything**: B is exactly as old as A, and a mechanism keyed on elapsed time rather
        than dependence would refuse it too, satisfy the first leg, and be a global clock wearing an invalidation''s
        name.'
