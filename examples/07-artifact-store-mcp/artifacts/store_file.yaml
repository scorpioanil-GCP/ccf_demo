# Store configuration: the file-backed ArtifactStore (CLAUDE.md §7.4).
#
# This artifact — not a code branch — is what selects the persistence
# substrate. `run.py` holds one store factory keyed by `store.type`; the
# workload never mentions a backend. Swapping this file for store_mcp.yaml
# is the entire change between the example's two runs.
#
# The root directory is templated from an environment variable the driver
# sets per run (a scratch directory), so no absolute path is committed.

schema_version: "1.0.0"
artifact_version: "1.0.0"

store:
  type: file
  root_env: CCF_EXAMPLE07_FILE_ROOT
