# Example 07 Control Plane bundle (logistics domain, D-09).
#
# Every number, threshold, version identifier, query string and product-class
# property the workload uses is here. `run.py` holds none of them: MAX_TTL
# has no SDK default (D-IMPL-39), operator parameters are declared artifacts
# with no silent defaults (D-IMPL-38), and every domain value is deployment
# configuration (CLAUDE.md §6.4).

schema_version: "1.0.0"
artifact_version: "1.0.0"

keys:
  resolution_spec: nordhaven-logistics/entity-resolution-spec
  policy_bundle: nordhaven-logistics/policy-bundle/dispatch-desk
  max_ttl: nordhaven-logistics/product/shipment-context-summary/max-ttl

# The policy bundle in force, stamped onto every claim at assembly and
# carried into the product's policy binding and replay dimension 2.
policy_bundle:
  regime: nordhaven-dispatch
  jurisdiction: "NO"
  permitted_classifications:
    - internal

# Per-class TTL ceiling (D-IMPL-39). A value this deployment chose.
max_ttl_seconds: 600

# Declared operator parameter sets (D-IMPL-38). Read as: the dispatcher
# perspective may see internally-classified state; rank routes against the
# rail-corridor query at or above 40%; reconcile to the boundary on both
# temporal axes; expand two hops from shipments over these typed edges.
operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "rail freight corridor hamburg"
    minimum_score_percent: 40
    ranked_entity_classes:
      - route
    index_version: "nordhaven-route-corpus@2026-07-01"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - shipment
    relationship_types:
      - assigned_to
      - originates_at
    depth_limit: 2

# The product class this fabric serves, and the perspective it is served to.
product_class:
  schema_name: nordhaven-logistics.shipment-context-summary
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: nordhaven-logistics.shipment-context-summary.plan
  product_ttl_seconds: 300

perspective:
  principal_id: dispatcher-4407
  role: dispatch-analyst

# The decision's instants. Explicit inputs, never clock reads: both store
# runs replay the identical decision precisely because these are data.
decision:
  temporal_boundary: 2026-07-01T07:00:00Z
  now: 2026-07-01T07:00:05Z

# Artifact classes and names this deployment files its persisted artifacts
# under — deployment vocabulary the stores are told, never assume.
artifacts:
  replay_record_class: decision-replay-record
  product_class: context-product
  product_name: shipment-context-summary

# What the served product should contain, as declared by the deployment that
# authored the events. The driver asserts against these instead of carrying
# domain expectations of its own.
expected:
  entity_classes:
    - depot
    - route
    - shipment
  relationship_types:
    - assigned_to
    - originates_at
  entity_count: 3
