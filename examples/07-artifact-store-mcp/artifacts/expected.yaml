# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# What the served product should contain, as declared by the deployment that
# authored the events (logistics domain, D-09).
#
# This document exists so that `tests/examples/test_artifact_store_output.py`
# has a source for its domain expectations OTHER THAN ITSELF. A value the test
# module authored would be the test agreeing with itself about what this
# deployment's vocabulary says; read from here, the assertion is against the
# deployment's own declaration.
#
# `persisted_artifact_roles` is a domain expectation too: it is this
# deployment's declaration of which §7.4 artifact classes it files through the
# store seam. The test reads it from here rather than inlining the three names,
# so a run that quietly stopped persisting the Control Plane policy bundle
# would FAIL rather than pass a "the two runs' role sets agree" check
# vacuously — two empty sets agree perfectly.
#
# **`role: load` in the manifest.** An expectation is not something the fabric
# is permitted to do, so it has no business in Control Plane state or in replay
# dimension 2.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: nordhaven-logistics.expected-product

declaration:
  # The bonded depot is absent and the shipment it served survives: the policy
  # operator substituted the RESTRICTED node out along with the edge that would
  # otherwise have leaked its existence by absence. The sea route is absent
  # because similarity ranked it out.
  entity_classes:
    - depot
    - route
    - shipment
  relationship_types:
    - assigned_to
    - originates_at
  entity_count: 4

  # The §7.4 artifact classes this deployment files through the store seam.
  persisted_artifact_roles:
    - replay_record
    - product
    - policy_bundle
