# Example 07 event stream — L1 signal envelopes (logistics domain, D-09).
#
# Small, but not a flat happy path: each layer of the fabric has something
# real to do, so "the two stores served the same product" is a statement
# about a product the fabric actually worked for.
#
#   * ev-500 asserts shipment SHP-2201 and its rail route in one envelope
#     -> an `assigned_to` edge from co-occurrence.
#   * ev-501 asserts the SAME shipment from a DIFFERENT source with its
#     origin depot -> one shipment claim whose lineage accumulates by
#     set-union, plus an `originates_at` edge.
#   * ev-502 introduces a sea route the similarity operator must rank out —
#     so "similarity did something" is distinguishable from identity.
#   * ev-503 carries a RESTRICTED bonded depot, which the policy operator
#     must substitute out along with the edge that would otherwise leak its
#     existence by absence.
#
#   * ev-504 asserts a SECOND shipment on the same rail route from a third
#     source system -> the traversal expansion carries two shipments, so
#     the served product's shape depends on real multi-entity assembly.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename

