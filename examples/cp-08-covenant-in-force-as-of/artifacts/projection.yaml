declaration:
  unversioned_note: >-
    These are the covenant terms as they stand TODAY, not as they stood at
    as_of. This estate carries no assertion time and no supersession marker on
    a covenant, so the terms a facility bore on a past date cannot be
    reconstructed from it. The amendment answer above IS historical; these
    terms are not, and the two must not be read as one.
