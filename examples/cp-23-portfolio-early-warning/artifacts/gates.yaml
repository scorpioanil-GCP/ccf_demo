# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DECLARED PRODUCT GATES OF cp-23 — nineteen, `PEW-G01`..`PEW-G19`.
#
# The acceptance authority for every gate is `CP-SPEC-023` §G.1
# (`D-IMPL-326`). Each id is claimed by at least one executing test under
# `tests/examples/`, and no estate figure is pinned anywhere.
#
# `PEW-G05` AND `PEW-G06` ARE SEPARATE BY RULING (Dave, 2026-09-21, `Q2`):
# one proves two orderings of a membership are ONE determination, the other
# proves a different membership is a DIFFERENT one. A canonicalization that
# collapsed everything would pass the first and fail the second.
semver: 1.0.0
class_id: cp-23.product-gates
declaration:
  product: cib.portfolio-early-warning
  test_naming_convention: the gate id appears in the executing test's docstring, as a `Declared product gate` line naming the CP-SPEC clause that approves it.
  # Measured 2026-09-21 against the live estate with `CCF_REQUIRE_ESTATE=1`:
  # ALL NINETEEN observed RED under their own sabotage — fourteen by a single
  # reverting edit with only that gate's test executed, five carrying the
  # sabotage inside the test. None is `unavailable`.
  #
  # FOUR sabotages left their gate green on the first attempt and were
  # corrected rather than swapped (`PEW-F-03`..`PEW-F-05`, `PEW-F-07`), and one
  # gate found a defect in the PRODUCT rather than in a sabotage (`PEW-F-06`).
  sabotage_states:
    passed: the invariant was broken and the gate went red
    unavailable: an upstream SDK invariant makes the bad state unreachable; the guard is named
  gates:
  - id: PEW-G01
    statement: "the SERVED operator set is the class's own declaration — THREE keys, not a fixed four — and the EXECUTED plan in replay dimension 5 runs Policy first"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_the_served_plan_matches_the_declaration_and_runs_policy_first
    sabotage: "drop Policy from the declared operator keys"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — Policy was removed from the declared keys and the served set no longer matched the declaration.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G02
    statement: "every served member declares its book membership as an ENTITY ATTRIBUTE, so per-member supersession reaches the invalidation register"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_sabotage.py::test_the_gate_refuses_a_member_that_does_not_declare_membership
    sabotage: "serve a member whose `in_book` is false (in-test)"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — a member was served without declaring membership and the declared gate refused it by name.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G03
    statement: "the book is served at POPULATION grain: the member count is a served fact agreeing with the roster, and the measures span the set"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_sabotage.py::test_the_gate_refuses_a_member_count_that_disagrees_with_the_population
    sabotage: "state a member count one higher than the population (in-test)"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the stated count and the served population disagreed and the gate refused.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G04
    statement: "`members` NARROWS and never widens; a member outside the book is refused `not-in-book` at the acquisition seam, never dropped"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_a_member_outside_the_book_is_refused_by_name
    sabotage: "stop checking requested members against the roster"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the containment check was removed. The product still refused downstream on the count mismatch, so the gate now asserts the refusal at ITS OWN seam; without that the test could not tell which mechanism fired (`PEW-F-04`).
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G05
    statement: "two orderings of one membership are ONE determination — the same content address AND the same canonical `members` in the effective request"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_two_orderings_of_one_membership_are_one_determination
    sabotage: "remove the deployment's sort, and separately bypass canonicalization entirely"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — BOTH sabotages redden. The payload sorts its own population, so the address alone could not tell whether the REQUEST was canonicalized; the gate now reads the effective request from the replay record, which is where canonicalization has to land (`PEW-F-05`).
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G06
    statement: "and the CONVERSE — a genuinely different membership is a DIFFERENT determination, so `PEW-G05` cannot be satisfied by collapsing everything"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_a_different_membership_is_a_different_determination
    sabotage: "stop passing the canonical members into the request at all"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — membership stopped reaching the request and two different populations collapsed to one address.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G07
    statement: "the payload's SHAPE and POPULATION are a function of the role, never of the book; a role that may not see covenant history carries no empty covenant member"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_the_payload_shape_follows_the_role_not_the_book
    sabotage: "stop narrowing the population for the facility-covered role"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the `product` role received the whole book and its population stopped being smaller than the coverage role's.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G08
    statement: "every tiered signal names the Control Plane artifact version that tiered it, and a severity floor may be RAISED and never lowered"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_every_tier_names_the_artifact_that_assigned_it
    sabotage: "assign every signal the lowest tier regardless of severity"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — every signal collapsed into one tier and the artifact stopped discriminating.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G09
    statement: "freshness is reported PER SIGNAL CLASS with the weakest first; no single portfolio freshness timestamp is minted"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_sabotage.py::test_the_gate_refuses_freshness_with_no_per_class_rows
    sabotage: "empty the per-class rows, and separately add a book-wide timestamp (both in-test)"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the empty-rows sabotage reddens `PEW-G09` directly. The book-wide-timestamp sabotage is caught FIRST by the shape check (`PEW-G07`), so that limb is defence in depth behind a stricter gate; recorded rather than hidden (`PEW-F-03`).
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G10
    statement: "two signal classes with different ages are reported separately and ordered weakest-first, so a fresh class cannot hide a stale one"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_freshness_is_reported_per_class_and_never_as_one_book_number
    sabotage: "order the freshness rows freshest-first"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the ordering inverted and the stale class stopped being the first thing a reader meets.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G11
    statement: "expiry is anchored on the DECISION; the evidence's age lives in the per-class freshness and in `D_c`, never in the TTL"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_expiry_is_anchored_on_the_decision_not_on_the_evidence
    sabotage: "move the TTL anchor to `from_entity_freshness`"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the anchor moved and the declaration no longer matched. A book's evidence has many ages, so none of them can anchor its expiry.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G12
    statement: "population debt is the SDK combinator's PER-FACTOR MINIMUM across members, naming the member each weak factor came from — understandable BY FACTOR"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_population_debt_names_the_member_each_weak_factor_came_from
    sabotage: "name a different portfolio debt law, and separately drop the weakest-member map (both in-test); plus a positive control proving the ruled law differs from `max(member D_c)`"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — both in-test sabotages redden, and the reverting edit that renamed the law reddens the served assertion. THE ESTATE ALONE CANNOT SHOW THE LAWS DIFFER: on this book the member weakest on freshness also sits at the completeness floor, so both laws give 0.88. A positive control with three members each weak on a different factor shows the difference (`PEW-F-01`).
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G13
    statement: "a member the ROLE excluded still counts against completeness — but a member the CALLER narrowed away does not, because narrowing your own question denies you nothing"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_a_member_the_role_excluded_still_counts_against_completeness
    sabotage: "let the narrowed role reach full completeness"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — and this gate found a real defect in the product before it found one in a sabotage: the `product` role originally reached completeness 1.0 and LOWER debt than the coverage role, so the entitlement looked free. Corrected (`PEW-F-06`).
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G14
    statement: "what assembly materialized is a served fact and tracks the POPULATION, not the estate"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_what_assembly_materialized_is_a_served_fact
    sabotage: "report a count that scales with the estate rather than the book"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — asserted against the member count; a count tracking the estate's 1,000 coverage rows fails the relation.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G15
    statement: "utilization is computed from OBSERVED drawdowns and a zero carries its drawdown count, so undrawn and unobserved stay distinguishable"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_an_undrawn_facility_is_distinguishable_from_an_unobserved_one
    sabotage: "stop serving the drawdown count"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the count was emptied and a zero utilization stopped being interpretable.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G16
    statement: "members with no facility remain members, and the facility-covered count is stated"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_members_without_a_facility_remain_members
    sabotage: "drop members with no facility from the utilization member"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the uncovered members vanished and the book's utilization began to read as the whole book's.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G17
    statement: "covenant history states zero active AND the historical/cured breaches; the member is never dropped for being currently quiet"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_zero_active_covenant_pressure_is_not_absent_history
    sabotage: "drop the covenant member (in-test)"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the member was removed and the declared gate refused: zero current state is not absent history.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G18
    statement: "book concentration uses THIS rung's declared threshold artifact and CP-21's regulatory inputs are named nowhere in the tree"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_concentration_uses_only_this_rungs_declared_threshold
    sabotage: "name `limit_definition` as the threshold authority"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the authority changed and the scope-separation assertion failed. The source-side limb additionally reads the three forbidden names out of the modules and the declared tables.
      date: '2026-09-21'
      commit: 'ea9816d5'
  - id: PEW-G19
    statement: "the determination replays from its record; the same book, instant and role hash to the same bytes and a different book does not"
    spec_clause: {document: spec/CP-SPEC-023_Portfolio_Early_Warning_Concentration.md, clause: G.1}
    test: tests/examples/test_cp_23_portfolio.py::test_the_determination_replays_and_identity_holds
    sabotage: "make acquisition ignore the subject and always read one book"
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — two books collapsed to one address. A single-field pin did NOT redden it, because two books differ on many axes; the sabotage that works is one that ignores the subject (`PEW-F-07`, the `ABS-F-09` shape).
      date: '2026-09-21'
      commit: 'ea9816d5'
