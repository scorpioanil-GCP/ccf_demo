# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DECLARED PRODUCT GATES OF cp-18 — `IBO-G01` through `IBO-G18`.
#
# The acceptance authority for every gate is `CP-SPEC-018` §G.1
# (`D-IMPL-326`). Each id is claimed by exactly one executing test under
# `tests/examples/`, and no estate figure is pinned anywhere: every gate is
# directional, structural or relational. `observed_red` records a sabotage
# that was actually run and seen red.
semver: 1.0.0
class_id: cp-18.product-gates
declaration:
  product: cib.opportunity-synthesis
  test_naming_convention: the gate id appears in the executing test's docstring, as a `Declared product gate` line naming the CP-SPEC clause that approves it.
  # Measured 2026-09-21 against the live estate with `CCF_REQUIRE_ESTATE=1`:
  # 17 of 18 gates observed RED — twelve by a single reverting edit with only
  # that gate's test executed, and five (`IBO-G07`, `IBO-G11`, `IBO-G14`,
  # `IBO-G15`, `IBO-G16`) carrying the sabotage inside the test. `IBO-G01` is
  # `unavailable` and its guard is named. THREE sabotages left their gate
  # green on the first attempt and were corrected; the defects were in the
  # proof machinery, not in the product (`IBO-F-06`, `IBO-F-07`).
  sabotage_states:
    passed: the invariant was broken and the gate went red
    unavailable: an upstream SDK invariant makes the bad state unreachable; the guard is named
    not-required: a documentary gate
  gates:
  - id: IBO-G01
    statement: the SERVED product's operator plan names Policy before Similarity — read off the product, never off the configuration
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_the_served_plan_runs_policy_before_similarity
    sabotage: reorder the required operator keys so Similarity precedes Policy and assert the served order is unchanged (CATEGORY_ORDER decides)
    sabotage_state: unavailable
    observed_red:
      result: >-
        not run as a sabotage — UNAVAILABLE. Measured 2026-09-21: the four operator keys were reordered in `ccf_config.yaml` to put Similarity first and Policy last, and the SERVED order did not move (the test passed unchanged). `CATEGORY_ORDER` in the SDK's planner decides the executed order, so a deployment cannot express the forbidden order at all.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G02
    statement: three perspectives, one banker, one instant — three orderings and three content addresses
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_three_perspectives_give_three_orderings_and_three_addresses
    sabotage: >-
      point the weight-vector lookup at one fixed perspective, so all three bankers rank under one vector. The perspective reaches the RANKING through the acquisition seam, not through Pi's `perspective` argument — a first attempt that sabotaged Pi's role left the gate GREEN, because acquisition had already fetched the right vector.
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — with one vector for all three perspectives the three orderings coincided and the test failed on the ordering set. The first sabotage left the gate green and is recorded as `IBO-F-06`: it taught where the perspective actually enters the ranking.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G03
    statement: the ordering differs while the admitted signal-type set does not — the weight vector is the discriminator, not the projection plan
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_the_weight_vector_discriminates_and_the_plan_does_not
    sabotage: key the ranking on the plan's permitted_signal_types instead of the weight vector; the three plans are identical so the orderings collapse
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the weight vector was flattened to one value per signal type; the three orderings collapsed into one while the admitted signal-type set was unchanged, which is exactly the trap the gate guards.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G04
    statement: 'the counterfactual: one prospect in one perspective''s top third and another''s bottom half, from identical signals'
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_one_prospect_ranks_top_for_one_perspective_and_low_for_another
    sabotage: flatten the weight vector to one value per signal type so every perspective prices every signal alike
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the same flattening. The divergence prospect's two ranks converged and the test failed on `(3, 25)` — top-third under one perspective is no longer bottom-half under the other.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G05
    statement: the served product names the weight version that ranked it
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_the_served_product_names_the_weight_version_that_ranked_it
    sabotage: drop weight_version from the payload and assert the declared gate refuses the product
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — `weight_version` was emptied in the payload. The DECLARED GATE refused the product before the test's own assertion was reached: `an invariant the product class declares does not hold for this product`.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G06
    statement: a ranking served under one weight version replays to its served bytes after the Control Plane has moved to a later version
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_replay.py::test_a_ranking_replays_under_the_weight_version_that_served_it
    sabotage: resolve the weight vector at replay time instead of reading it from the recorded snapshot
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the weight vector was stripped from the banker claim, so the snapshot no longer carried what ranked the product. The declared gate refused it, which is the stronger outcome: a ranking whose vector is not in the fabric cannot be served, let alone replayed.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G07
    statement: the same record replayed against a different weight vector DIVERGES rather than quietly agreeing
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_replay.py::test_a_replay_against_a_different_weight_vector_diverges
    sabotage: 'the control IS the sabotage: the replay environment substitutes the other version''s vector'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the test replays the same record with the banker claim's weight vector INVERTED (whatever was cheapest becomes dearest, a real re-pricing rather than a nonsense value) and the engine raises `ReplayDivergence`; the un-sabotaged replay of the same record still agrees byte for byte.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G08
    statement: a restricted prospect REMAINS a candidate; what the restriction bounds is the evidence admitted for it, never its presence
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_a_restricted_prospect_remains_a_candidate_with_bounded_evidence
    sabotage: >-
      aim every banker-local note at a restricted prospect AND remove the bound. The bound alone cannot redden: this banker holds no note on a restricted prospect, so removing the filter changes nothing — measured, and recorded as `IBO-F-07`.
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — with both halves broken a banker-local note reached restricted prospect `0J0XRGZE3PBRFEZ7MV65` and the test named it. The first attempt, removing the bound alone, left the gate GREEN for want of data.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G09
    statement: no prospect outside the banker's own coverage portfolio appears in any served ranking
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_no_prospect_outside_the_portfolio_is_ranked
    sabotage: widen the candidate read past the coverage portfolio and assert the declared gate refuses
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the coverage read was widened past the banker's own portfolio. The served ranking drew on 40 prospects against a portfolio of 14 and the test failed on `assert 40 == 14`.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G10
    statement: a banker's local notes reach that banker's ranking and no other banker's
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_local_notes_reach_their_own_banker_and_no_other
    sabotage: read every banker's notes instead of the asking banker's
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the departmental note read was unbound from the asking banker's id, so every banker's notebook reached the product; the test named the six note ids that crossed. (A first attempt at this sabotage broke the f-string quoting and errored rather than reddening — a broken sabotage is not a sabotage, and it was rewritten.)
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G11
    statement: at least one ranked row's position depends on a local note — removing it moves the row
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_a_local_note_observably_moves_a_ranking
    sabotage: 'the control IS the sabotage: the note evidence is withheld and the ordering compared'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the test withholds every banker-local note at the acquisition seam and compares the two orderings; the ordering moves, and the moved rows intersect the rows a note had reached. A green here would mean the notebook reaches the fabric but not the ranking.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G12
    statement: the payload's member set is a function of the perspective and never of the banker or the request
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_each_perspective_serves_its_declared_member_set
    sabotage: emit one extra member and assert the declared gate refuses
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — Pi emitted one extra member (`sabotage_extra_member`) for every perspective and the declared gate refused the product.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G13
    statement: every ranked row carries at least one contributing signal with its weight, its age and its evidence
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_every_ranked_row_carries_its_contributing_signals
    sabotage: >-
      empty the contributing-signal list on a ranked row. Admitting evidence-free CANDIDATES cannot redden this gate: every prospect in this estate carries at least one signal, so the candidate filter never fires — measured, and recorded as `IBO-F-07`.
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — with the explanation emptied on every ranked row the declared gate refused the product by name. The first attempt, admitting candidates with no evidence, left the gate GREEN because the estate has no such candidate.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G14
    statement: a signal type outside the perspective's plan is REFUSED by name, never silently dropped
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_sabotage.py::test_a_signal_type_outside_the_plan_is_refused_by_name
    sabotage: 'the control IS the sabotage: the request names a type the plan does not carry and must be refused'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the request names a signal type the perspective's plan does not carry and is refused `subject-unavailable` with `signal-type-outside-plan` and the offending type in the record. The positive control, the same request narrowed to a type the plan DOES carry, is served.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G15
    statement: a banker with no coverage portfolio is refused by name, as data, with a replay reference
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_sabotage.py::test_a_banker_with_no_coverage_portfolio_is_refused_by_name
    sabotage: 'the control IS the sabotage: the coverage read is emptied and the refusal asserted rather than an empty ranking served'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the coverage read is emptied and the refusal asserted. It has to be constructed: every one of the estate's forty bankers covers exactly twenty-five prospects, so the empty-portfolio state is unreachable from the data.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G16
    statement: a banker id that exists nowhere is indistinguishable from one whose candidates Policy removed entirely
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_sabotage.py::test_a_policy_emptied_banker_reads_as_a_nonexistent_one
    sabotage: 'the control IS the sabotage: relabel every claim out of the Policy vocabulary and compare the vessels path for path'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the test relabels every acquired claim out of the Policy vocabulary and compares the emptied banker's vessel with a nonexistent banker's path for path; two different nonexistent ids hash identically, and a normally served answer differs from both at `payload` and at `computed_empty`.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G17
    statement: 'a refused or absent optional CP-17 child does NOT refuse the IB product: the ranking is served and the missing context is recorded as named debt'
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_the_absent_optional_child_does_not_refuse_the_product
    sabotage: make the absent optional context a refusal instead of named debt
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the declared gate was made to refuse when the optional child count is zero. The product stopped being served, which is precisely what the ruling forbids: a refused or absent optional child must not refuse the IB product.
      date: '2026-09-21'
      commit: e2e526c9
  - id: IBO-G18
    statement: a served ranking makes visible WHICH rows were ranked without the optional CP-17 contribution — the narrower evidence base is stated, not silent
    spec_clause:
      document: spec/CP-SPEC-018_IB_Opportunity_Synthesis.md
      clause: G.1
    test: tests/examples/test_cp_18_ranking.py::test_the_narrower_evidence_base_is_stated_not_silent
    sabotage: drop optional_context from the payload and assert the declared gate refuses
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — every ranked row was made to claim the optional context HAD contributed. The test named the first row that lied about its own evidence base.
      date: '2026-09-21'
      commit: e2e526c9
