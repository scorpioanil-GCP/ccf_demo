# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DECLARED PRODUCT GATES OF cp-12 — ALL TWENTY-SEVEN CP-SPEC-012 §F NAMES.
#
# `sabotage_state` HAS THREE VALUES AND THEY ARE NOT INTERCHANGEABLE.
# Twenty-four are `passed`. THREE are `unavailable` — the SDK refuses the bad
# state before this deployment can reach it: `D-IMPL-86`'s operator-set
# divergence (FXR-G01, FXR-G02) and the closed `ttl_anchor` vocabulary
# (FXR-G04). NONE is `not-required` at the gate level.
#
# FIVE GATES WERE GREEN UNDER THEIR FIRST SABOTAGE, AND ALL FIVE ARE RECORDED
# AS SUCH. Four were weak SABOTAGES — they broke code the gate never reached.
# ONE (FXR-G12) was a weak TEST: it asserted the declared pip table and the
# pair label, and stayed green while `Estate.pip` was sabotaged to return
# `0.0001` for everything, because it never exercised the lookup. That is
# cp-08's lesson arriving again — a declaration nothing reads is documentation,
# not control — and the repair was to recompute every served variance from the
# raw rates and require it to match.
#
# THE SIX TRAP GATES CARRY AN EXTRA OBLIGATION (§F.1a): each builds the
# DEFECTIVE mechanism in the test, runs it on the same data, and asserts the
# two answers DIFFER. A trap gate that asserted only the correct answer is what
# made cp-10's trap gate 23 and cp-11's trap gate 27 green under their own sabotage.

semver: 1.0.0
class_id: cp-12.product-gates
declaration:
  product: markets.fx-reconciliation
  test_naming_convention: the gate id appears in the executing test's docstring, as an FXR-GNN line naming the CP-SPEC-012
    §F clause that approves it.
  sabotage_states:
    passed: the specific invariant under test was broken and the gate went red
    unavailable: an UPSTREAM SDK invariant makes the bad state unreachable from this deployment; the gate is evidenced
      by the successful path plus that guard, never by a local negative control
    not-required: the gate has nothing to range over on this estate; it SKIPS with that reason rather than passing
      over an empty set
  gates:
  - id: FXR-G01
    statement: a plan with zero operator steps never serves
    test: tests/examples/test_cp_12_output.py::test_fxr_g01_the_operator_plan_is_never_empty
    sabotage: emptied `product_class.required_operator_keys`
    sabotage_state: unavailable
    spec_clause:
      document: spec/CP-SPEC-012_FX_Post_Trade_Reconciliation.md
      clause: F.1
    observed_red:
      result: '**DEPLOYMENT SABOTAGE UNAVAILABLE.** `ValueError: operator set divergence` at load. The SDK refuses
        a product class whose declared operator set disagrees with its `operators:` section before a plan is ever
        built, so an empty plan is unreachable from here.'
      date: '2026-09-12'
      commit: f23e3d4d
  - id: FXR-G02
