    test: tests/examples/test_cp_12_output.py::test_fxr_g02_lineage_is_exactly_the_declared_operator_set
    sabotage: had the plan require an operator the product class does not name
    sabotage_state: unavailable
    spec_clause:
      document: spec/CP-SPEC-012_FX_Post_Trade_Reconciliation.md
      clause: F.1
    observed_red:
      result: '**DEPLOYMENT SABOTAGE UNAVAILABLE.** `ValueError: operator set divergence for plan ... (D-IMPL-86)`
