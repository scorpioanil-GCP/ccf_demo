# THE DEPLOYMENT'S ENVIRONMENT — the second of this tree's two documents
# (`D-IMPL-343`). `ccf_config.yaml` beside it is Control Plane content and never
# carries a DSN, a host, a credential or a URL; this document holds the NAMES
# those values are read from, and the remedy an unset name raises with.
#
# THREE SOURCES, ALL READ-ONLY. Point them at the v2 namespaces — Fluree
# `fibo-v2`, PostgreSQL `ccf_v2`, MongoDB `fibo_v2` — never the v1 names in
# `ccf_dataprep/.env` (CLAUDE.md §9).

config: ccf_config.yaml

# The fabric's own L3 — minted fresh under the caller's scratch for EVERY
# question (`CP03C-F-02`).
substrate:
  setting: database_path
  prefix: cp_13_canonical
  suffix: .sqlite3

sources:
  # THE RELATIONAL LEG — the corpus-entitlement register (principal × scope →
  # permitted document classifications).
  covenant_relational:
    dsn:
      from_env: CCF_CP_13C_POSTGRES_DSN
      remedy: >-
        export CCF_CP_13C_POSTGRES_DSN with a READ-ONLY connection string for
        the covenant estate (host and credentials from ccf_dataprep/.env).
    schema:
      from_env: CCF_CP_13C_POSTGRES_SCHEMA
      remedy: >-
        export CCF_CP_13C_POSTGRES_SCHEMA with the namespace holding the
        corpus_entitlement table (the v2 estate reads `ccf_v2`).
  # THE GRAPH LEG — the evidence anchors, their definition chains and the
  # anchor predicates.
  covenant_graph:
    url:
      from_env: CCF_CP_13C_FLUREE_URL
      remedy: >-
        export CCF_CP_13C_FLUREE_URL with the base URL of a READ-ONLY Fluree
        endpoint; this deployment issues SPARQL through `/v1/fluree/query`.
    ledger:
      from_env: CCF_CP_13C_FLUREE_LEDGER
      remedy: >-
        export CCF_CP_13C_FLUREE_LEDGER with the ledger name to read — the v2
        estate is `fibo-v2`.
  # THE DOCUMENT LEG — passages and their spans, documents and their
  # `governs_from`, memoranda and their embeddings.
  covenant_documents:
    uri:
      from_env: CCF_CP_13C_MONGO_URI
      remedy: >-
        export CCF_CP_13C_MONGO_URI with a READ-ONLY MongoDB connection string
        for the covenant corpus.
    db:
      from_env: CCF_CP_13C_MONGO_DB
      remedy: >-
        export CCF_CP_13C_MONGO_DB with the database holding the document,
        passage and memorandum collections (the v2 estate reads `fibo_v2`).

door:
  credential:
    from_env: CCF_CP_13C_DOOR_TOKEN
    remedy: >-
      export CCF_CP_13C_DOOR_TOKEN with the bearer credential this door is to
      be reached with, or leave it unset to have one minted per boot.
  issuer_url:
    from_env: CCF_CP_13C_DOOR_ISSUER_URL
    remedy: >-
      export CCF_CP_13C_DOOR_ISSUER_URL with the OAuth issuer this door's auth
      settings advertise (any https URL for a development stdio door).
  resource_server_url:
    from_env: CCF_CP_13C_DOOR_RESOURCE_URL
    remedy: >-
      export CCF_CP_13C_DOOR_RESOURCE_URL with the resource-server address
      this door's auth settings advertise (any https URL for a development
      stdio door).
