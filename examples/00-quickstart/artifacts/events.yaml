# ccf-schema: deferred(15-13) multi-artifact bundle — no single SDK artifact
# class accepts this document, so any $schema header would annotate every key
# belonging to the other artifacts as an error. Plan 15-13 splits this file into
# typed per-class documents with a manifest and writes the real header then.
# Quickstart event stream — L1 signal envelopes (banking domain, D-IMPL-52).
#
# A handful of events, but not a flat happy path: the stream is built so the
# fabric has something real to do at each layer.
#
#   * ev-101 asserts the SAME customer as ev-100 from a DIFFERENT source with
#     identical attributes -> one claim whose lineage accumulates by set-union
#     (INV-CH7-17), not a second node.
#   * ev-102 introduces a second, permitted account that the similarity
#     operator must rank out — so "similarity did something" is
#     distinguishable from an identity function.
#   * ev-103 carries a RESTRICTED mandate, which the policy operator must
#     substitute out along with the edge that would otherwise leak its
#     existence by absence.
#   * ev-104 introduces the branch the surviving account is domiciled at —
#     an internally-classified node two hops from the customer, so the
#     bounded traversal has a real second hop to walk.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: everything under `payload:` and every source system id is
# [ADAPT]; the envelope keys (`envelope_id`, `source_system_id`,
# `ingestion_timestamp`, `observed_time`, `payload`) are [MECHANISM].

schema_version: "1.0.0"
artifact_version: "1.0.0"

envelopes:
  - envelope_id: ev-100
    source_system_id: core-banking
    ingestion_timestamp: 2026-06-01T09:00:00Z
    observed_time: 2026-06-01T08:55:00Z
    payload:
      customer_ref: "MB-CUST-000088"
      customer_name: "Alpenrose Logistics GmbH"
      segment: "corporate"
      customer_classification: "internal"
