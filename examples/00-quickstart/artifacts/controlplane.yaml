# Quickstart Control Plane bundle (banking domain, D-IMPL-52).
#
# Every number, threshold, version identifier, query string and product-class
# property the example uses is here. `run.py` holds none of them: MAX_TTL has
# no SDK default (D-IMPL-39), operator parameters are declared artifacts with
# no silent defaults (D-IMPL-38), and every domain value is deployment
# configuration (CLAUDE.md §6.4).
#
# The keys are deployment vocabulary too. The SDK never enumerates Control
# Plane keys; the fabric is told which ones to pin.

schema_version: "1.0.0"
artifact_version: "1.0.0"

keys:
  resolution_spec: meridian-bank/entity-resolution-spec
  policy_bundle: meridian-bank/policy-bundle/payments-analyst
  max_ttl: meridian-bank/product/payment-context-summary/max-ttl
  half_life_table: meridian-bank/half-life/payments-observation-types
  debt_profile: meridian-bank/debt-profile/payment-context-review

# The policy bundle in force. A *version* of it is resolved from the Control
# Plane, stamped onto every claim at assembly, and carried into the product's
# policy binding and the replay record's dimension 2.
policy_bundle:
  regime: meridian-bank-payments
  jurisdiction: DE
  permitted_classifications:
    - internal

# Per-class TTL ceiling (INV-CH7-48, D-IMPL-39). Ten minutes is a value this
# deployment chose, not a recommendation.
max_ttl_seconds: 600

# Declared operator parameter sets (D-IMPL-38). Read as: the payments-analyst
# perspective may see internally-classified state; rank accounts against the
# payments query at or above 40%; reconcile to the boundary on both temporal
# axes; expand two hops from customers over these typed edges.
operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "corporate payments account eur"
    minimum_score_percent: 40
    ranked_entity_classes:
      - account
    index_version: "meridian-bank-account-corpus@2026-06-01"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - customer
    relationship_types:
      - holds
      - authorizes
    depth_limit: 2

# The product class this fabric serves, and the perspective it is served to.
product_class:
  schema_name: meridian-bank.payment-context-summary
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: meridian-bank.payment-context-summary.plan
  product_ttl_seconds: 300

perspective:
  principal_id: analyst-2093
  role: payments-analyst

# The decision's instants. Explicit inputs, never clock reads: the example is
# replayable precisely because these are data.
decision:
  temporal_boundary: 2026-06-01T10:00:00Z
  now: 2026-06-01T10:00:05Z

artifacts:
  replay_record_class: decision-replay-record

# What the served product should contain, as declared by the deployment that
# authored the events above. The driver asserts against these instead of
# carrying domain expectations of its own.
expected:
  entity_classes:
    - customer
    - account
  relationship_types:
    - holds
  entity_count: 2
