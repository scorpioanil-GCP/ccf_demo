# yaml-language-server: $schema=../../docs/schemas/ccf.declared-artifact.json
#
# WHERE THINGS LIVE — as environment-variable NAMES and nothing else.
# No host, no port, no credential, in this file or anywhere in the tree.

semver: "1.0.0"
class_id: cp-10.backend-profiles

declaration:
  profiles:
    sqlite:
      settings:
        database_path:
          prefix: cp-10-migration
          suffix: .sqlite
        writer_lease_lock_dir:
          # Amendment 2026-10-11 (P1 (a), Tuesday GO item 4): a SQLite file writer mints only under a declared identity lock.
          # A private (0o700) directory under the caller's run root.
          lock_directory: .ccf-writer-locks

  sources:
    - name: relational
      capability_class: relational
      holds: >-
        obligor identity, debt-instrument reference with its issue band, the
        three-component spread decomposition, the market OAS series by band,
        and the internal rating scale.
      connection:
        from_env: CCF_CP_10_POSTGRES_DSN
        note: >-
          export CCF_CP_10_POSTGRES_DSN with a READ-ONLY libpq connection
          string. Both spellings work: a `host=… user=… password=…` keyword
          string and a `postgresql://…` URI. Nothing this example runs writes
          to the store it reads, and a role that could write would make that a
          promise rather than a guarantee.
      namespace:
        from_env: CCF_CP_10_POSTGRES_SCHEMA
        note: >-
          the schema holding the v2 estate. NOT the value in `ccf_dataprep`'s
          `.env`, which names v1.

    - name: graph
      capability_class: bitemporal-ledger
      holds: >-
        the internal credit-grade assertion history — both clocks
        (`validFrom`, `assertedAt`), the narrative trigger, and the
        supersession chain.
      connection:
        from_env: CCF_CP_10_FLUREE_URL
        note: >-
          export CCF_CP_10_FLUREE_URL with the base URL of a READ-ONLY Fluree
          instance. The example issues `POST /v1/fluree/query` only. A seeded
          ledger is PERMANENT, which is why read-only is a guarantee here.
      namespace:
        from_env: CCF_CP_10_FLUREE_LEDGER
        note: the ledger name to read — `fibo-v2`, a separate ledger from v1.
