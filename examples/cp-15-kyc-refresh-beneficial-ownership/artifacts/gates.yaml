# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
#
# THE DECLARED PRODUCT GATES OF cp-15 — `UBO-G01` through `UBO-G20`.
#
# The acceptance authority for every gate is `CP-SPEC-015` §G.1
# (`D-IMPL-326`). Each id is claimed by exactly one executing test under
# `tests/examples/`, and no estate figure is pinned anywhere.
#
# SEVEN of the twenty exist only because of this rung's one new coverage
# shape — a governed Context Product handed to an existing HITL workflow
# primitive: `UBO-G09` to `UBO-G13`, `UBO-G19` and `UBO-G20`. `UBO-G20` is
# the construction boundary, which Dave named load-bearing.
semver: 1.0.0
class_id: cp-15.product-gates
declaration:
  product: compliance.beneficial-ownership
  test_naming_convention: the gate id appears in the executing test's docstring, as a `Declared product gate` line naming the CP-SPEC clause that approves it.
  # Measured 2026-09-21 against the live estate with `CCF_REQUIRE_ESTATE=1`:
  # 18 of 20 gates observed RED — twelve by a single reverting edit with only
  # that gate's test executed, and six (`UBO-G07`, `UBO-G12`, `UBO-G13`,
  # `UBO-G16`, `UBO-G17`, `UBO-G18`) carrying the sabotage inside the test.
  # Two are `unavailable` and each names its guard: `UBO-G01` because
  # `CATEGORY_ORDER` decides the executed order, and `UBO-G11` because no
  # deployment seam can set the `hitl_actions` sentinel at all.
  #
  # ONE sabotage left its gate green on the first attempt and was corrected:
  # the cycle member's emptiness cannot distinguish a computed empty from a
  # constant one on an estate with no cycles, so `UBO-G19` reddens against a
  # positive control that injects a cycle in-process (`UBO-F-05`).
  sabotage_states:
    passed: the invariant was broken and the gate went red
    unavailable: an upstream SDK invariant makes the bad state unreachable; the guard is named
    not-required: a documentary gate
  gates:
  - id: UBO-G01
    statement: the SERVED product's operator plan names Policy before Similarity — read off the product, never off the configuration
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_the_served_plan_runs_policy_before_similarity
    sabotage: reorder the required operator keys so Similarity precedes Policy and assert the served order is unchanged (CATEGORY_ORDER decides)
    sabotage_state: unavailable
    observed_red:
      result: >-
        not run as a sabotage — UNAVAILABLE. Measured 2026-09-21: the four operator keys were reordered in `ccf_config.yaml` to put Similarity first and Policy last, and the SERVED order did not move (the test passed unchanged). `CATEGORY_ORDER` in the SDK's planner decides the executed order, so a deployment cannot express the forbidden order at all.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G02
    statement: no person record outside the principal's residency entitlement appears in any served product, and no member, count or marker indicates that one was withheld
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_no_person_outside_the_residency_entitlement_is_served
    sabotage: admit person records regardless of the entitlement, and separately add a withheld count to the payload
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the residency check was removed so every person was admitted regardless of entitlement. The DECLARED GATE refused the product: `an invariant the product class declares does not hold for this product`.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G03
    statement: the entitled principal and an unentitled one, same entity same instant, receive different products at different addresses — and the entitled one's person set is a strict superset
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_the_entitled_principal_sees_a_strict_superset
    sabotage: make the entitlement read return True for every principal so the two products coincide
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the entitlement read was made to return True for every principal; the two products stopped differing and the declared gate refused.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G04
    statement: every person served carries a resolution confidence; none is served without one
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_every_person_carries_a_resolution_confidence
    sabotage: emit a person with no resolution_confidence and assert the declared gate refuses
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — a person was served with an empty resolution confidence and the declared gate refused it by name.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G05
    statement: every reportable owner is at or above the applicable threshold, and every sub-threshold finding is below it
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_the_threshold_partitions_the_chain_in_both_directions
    sabotage: report a person below the threshold and assert the declared gate refuses by name
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — every person in the chain was reported regardless of the threshold; the declared gate refused, which is the stronger outcome than the test's own assertion.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G06
    statement: 'the intent selects the threshold: one entity under two intents yields two applicable thresholds and two different partitions of the SAME person'
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_the_intent_selects_the_threshold
    sabotage: ignore the intent when reading bo_threshold so both intents return one value
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the threshold read was made to ignore the intent. Both intents returned one value and the test failed on `assert Decimal('0') < Decimal('0')`.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G07
    statement: a request below the estate's declared floor for threshold or min_confidence is REFUSED by name, never silently raised to the floor
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_sabotage.py::test_a_request_below_the_declared_floor_is_refused_by_name
    sabotage: 'the control IS the sabotage: the request asks below the floor and must be refused'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the test asks below the estate's declared floor for `min_confidence` and again for `threshold`, and asserts `floor-breached` in the record both times. The positive control, the same request ABOVE the floor, is served.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G08
    statement: a resolution below the confidence floor is a FINDING inside the product, never an absence
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_a_below_floor_resolution_is_a_finding_not_an_absence
    sabotage: drop below-floor resolutions out of the product instead of marking them
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — below-floor resolutions were dropped out of the product instead of being marked. The test failed on the contrast entity having too few resolutions left to move one, which is exactly what dropping them causes.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G09
    statement: every referred finding has a review submission, and every submission names the served product's content address
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_review.py::test_every_referred_finding_names_the_served_content_address
    sabotage: submit with an output_ref that is not the served product's address
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the submission's `output_ref` was given an address that is not the served product's; the test named both addresses side by side.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G10
    statement: the submitted workflow_state_ref is the originating REPLAY-RECORD reference and resolves — not the content address, because identical bytes can participate in different determinations
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_review.py::test_the_workflow_state_ref_is_the_originating_record_reference
    sabotage: submit the product content address as workflow_state_ref instead of the record reference
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the product's content-address URI was submitted as `workflow_state_ref` instead of the originating record reference, and the test refused it: a content address cannot say which governed determination referred the finding.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G11
    statement: the product's own replay record carries NO_HITL_ACTIONS by construction
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_review.py::test_the_products_own_record_carries_no_hitl_actions
    sabotage: 'not reachable from the deployment: the sentinel is written by the SDK''s own recorder and no deployment seam can set it'
    sabotage_state: unavailable
    observed_red:
      result: >-
        not run as a sabotage — UNAVAILABLE. The `NO_HITL_ACTIONS` sentinel is written by the SDK's own record builder (`src/ccf/replay/record.py`, the `hitl_actions` default) and NO deployment seam can set it: `open_product` takes no such argument and the resolver passes none. The bad state — a product record claiming a human action that has not happened — is unreachable from a deployment.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G12
    statement: a human verdict lands on a SECOND record linked to the originating reference and the output ref, and the served product is byte-unchanged by it
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_review.py::test_the_human_verdict_lands_on_a_second_record_and_changes_nothing
    sabotage: 'the control IS the sabotage: the product is hashed before and after the verdict and the second record''s links are asserted'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the test hashes the product and its record before and after a human release and asserts both unchanged, then holds the second record to the four links the ruling requires: the originating reference, the output ref, the reviewer identity and the verdict with its time.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G13
    statement: a reviewer binding that echoes the wrong content hash is refused — the TOCTOU guard, exercised through a product
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_review.py::test_a_reviewer_binding_with_the_wrong_hash_is_refused
    sabotage: 'the control IS the sabotage: the binding echoes a wrong hash and must be refused'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — a reviewer binding echoing a wrong content hash is refused with `ReviewResolutionRefused`, and the positive control with the right hash releases.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G14
    statement: the payload's member set is a function of the perspective and never of the entity or the request
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_each_perspective_serves_its_declared_member_set
    sabotage: emit one extra member and assert the declared gate refuses
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — Pi emitted one extra member (`sabotage_extra_member`) and the declared gate refused the product.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G15
    statement: a KYC declaration contradicting the computed chain is served BESIDE the computed figure, never reconciled into it
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_a_contradicting_declaration_is_served_beside_the_computed_figure
    sabotage: overwrite the computed percentage with the declared one so the contradiction disappears
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the computed percentage was overwritten with the declared one, so the contradiction disappeared. The test named the declaration whose computed figure had been erased.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G16
    statement: the determination replays from its own record to its served bytes
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_replay.py::test_the_determination_replays_to_its_served_bytes
    sabotage: rehydrate with a different applicable threshold and assert the replay diverges
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the same record is replayed against a DIFFERENT applicable threshold, which repartitions the chain, and the engine raises `ReplayDivergence`; the un-sabotaged replay of the same record still agrees byte for byte.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G17
    statement: an entity with no ownership chain is served computed-empty and is indistinguishable from an entity id that was never issued
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_sabotage.py::test_a_policy_emptied_entity_reads_as_a_nonexistent_one
    sabotage: 'the control IS the sabotage: relabel every claim out of the Policy vocabulary and compare the vessels path for path'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the test relabels every acquired claim out of the Policy vocabulary and compares the emptied entity's vessel with a nonexistent entity's path for path; two different nonexistent ids hash identically, and a normally served answer differs from both at `payload` and at `computed_empty`.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G18
    statement: a principal with no jurisdiction grant is refused by name, as data, with a replay reference
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_sabotage.py::test_a_principal_with_no_jurisdiction_grant_is_refused_by_name
    sabotage: 'the control IS the sabotage: the jurisdiction read is emptied and the refusal asserted'
    sabotage_state: passed
    observed_red:
      result: >-
        RED by construction, run 2026-09-21 — the jurisdiction read is emptied and the refusal asserted. It has to be constructed: every registered principal in this estate holds at least one grant, so the ungranted state is unreachable from the data.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G19
    statement: 'the cycle member is served honestly: present and empty, computed rather than constant, no cycle asserted anywhere, and the unrelated findings all survive it so the product stays actionable'
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_ownership.py::test_the_cycle_member_is_served_honestly_empty
    sabotage: >-
      hard-code the cycle member to a constant empty list so it stops being a measurement of the
      served view. It reddens only against the POSITIVE CONTROL that injects a cycle in-process
      (`test_the_cycle_member_reports_a_cycle_when_one_exists`): on an estate with no cycles the
      honest-empty test alone cannot tell a computed empty from a constant one, and a first
      attempt at this sabotage left the gate green for exactly that reason (`UBO-F-05`).
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the cycle computation was replaced with a constant empty list. It reddens against the POSITIVE CONTROL that injects a cycle in-process: `a cycle was present in the view and the product reported none`. A first attempt, run against the honest-empty test alone, left the gate GREEN, because on an estate with no cycles that test cannot tell a computed empty from a constant one. Recorded as `UBO-F-05`.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
  - id: UBO-G20
    statement: 'the construction boundary holds: the product is complete, governed, assessed and immutable before enqueue, and assembling with the review queue never called produces BYTE-IDENTICAL output'
    spec_clause:
      document: spec/CP-SPEC-015_KYC_Refresh_Beneficial_Ownership.md
      clause: G.1
    test: tests/examples/test_cp_15_review.py::test_the_construction_boundary_holds_byte_for_byte
    sabotage: import the review queue into the construction path and let a referral write back into the payload
    sabotage_state: passed
    observed_red:
      result: >-
        RED 2026-09-21 — the review queue was imported into `deployment.py`, the construction path. The test read it off the IMPORT GRAPH and named it: `deployment.py imports the HITL surface into construction: ['ccf.hitl.review_queue']`.
      date: '2026-09-21'
      commit: a8013e97
      commit: PENDING
