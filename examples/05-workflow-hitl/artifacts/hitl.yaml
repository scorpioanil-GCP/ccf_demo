# Workflow-HITL example HITL material (CLAUDE.md §8.2; D-IMPL-20/21;
# D-16; SDK-defined). Every approver identity, authentication statement,
# policy value, routing decision, node output, review item, and drive
# value the example exercises is here. `run.py` holds none of them (§6.4).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename

keys:
  hitl_policy: sterling-mutual/hitl/disbursement-hitl-policy
  # The approver signing key's identifier (D-IMPL-21 reference impl #2).
  # The key material itself is generated at run time in a scratch
  # directory — key bytes are never artifact content, only the name is.
  signing_key_id: sterling-mutual-disbursement-approver-key

# The D-16 Control Plane value: signed principal bindings are REQUIRED at
# the authority path. This is the schema-validated field 08-03 added; the
# transport re-resolves it per submission, so flipping it here flips
# behavior with zero code change.
hitl_policy:
  semver: "1.0.0"
  signed_binding_required: true

# The approver whose identity the door DERIVES from the verified token
# grant (D-IMPL-67): subject_id deliberately equals the active token's
# client_id in tokens.yaml — a submission claiming any other subject is a
# typed 403 subject-conflict refusal before it touches the transport.
approver:
  identity:
    subject_id: disbursement-officer-31
    identity_provider_ref: idp://sterling-mutual/dev-token-file
  authentication:
    method: bearer-token
    assurance_level: dev
    session_ref: session-do-31
  action_time: "2026-06-02T10:15:00+00:00"

# Drive values for the two executions.
drive:
  approval_execution_id: exec-disburse-1
  escalation_execution_id: exec-disburse-2
  approval_action: approve
  resume_decision: disbursed
  expected_gate: disbursement-approval
  # The escalation drive: this step's binding raises during the second
  # execution, and the engine must route to the declared exception ref.
  failing_step: verify-loan-file

# What each node binding answers with — deployment content, mechanism-free.
node_outputs:
  verify-loan-file:
    file_status: complete
    conditions_precedent: satisfied
  assess-disbursement:
    assessment: proceed
    exposure_band: within-limit

# Nominal (non-breaching) debt factors for the agent-node handoff
# assessment (D-IMPL-65 composition-root wiring; INV-CH7-68).
debt_factors:
  freshness: "1.0"
  completeness: "1.0"
  semantic_consistency: "1.0"

# The injected clock's base instant — no wall clock in the example.
clock:
  base: "2026-06-02T10:00:00+00:00"

# ReviewQueue material (CLAUDE.md §8.2; whitepaper §7.10.3): the generated
# disbursement briefing is reviewed asynchronously before release. The
# item pins the reviewed output by versioned URI and carries the
# passage-level lineage the reviewer must see — an item without lineage is
# unconstructible. The reviewer's subject_id deliberately equals the
# ACTIVE `reviewer` token's client_id in tokens.yaml (the D-IMPL-67
# identity convention this example uses everywhere), and the review action
# is signed under the same D-16 policy as the approval.
review:
  event:                                                       # [MECHANISM]
    event_key: sterling-mutual/exec-disburse-1/briefing-review # [ADAPT]
    workflow_state_ref: sterling-mutual/exec-disburse-1        # [ADAPT]
  item:
    output_ref: "ccf-artifact://sterling-mutual/ccf.context-product/disbursement-briefing@1.0.0"
    lineage:
      - source:
          system_id: loan-origination            # [ADAPT]
        envelope_id: env-loan-file-4471          # [ADAPT]
        observed_at: "2026-06-02T08:30:00+00:00"
        passage_anchor:
          kind: document-page                    # [ADAPT]
          locator: "loan-file/SM-LOAN-4471#p3"   # [ADAPT]
  reviewer:
    # Which tokens.yaml entry this reviewer's identity is bound to; the
    # driver asserts the entry is ACTIVE and the subject matches.
    token_label: reviewer                        # [MECHANISM]
    identity:
      subject_id: credit-review-officer-7        # [ADAPT]
      identity_provider_ref: idp://sterling-mutual/dev-token-file
    authentication:
      method: bearer-token
      assurance_level: dev
      session_ref: session-cro-7
    action_time: "2026-06-02T10:25:00+00:00"
  drive:
    # `release` or `reject` — the driver interprets, never decides (§6.4).
    action: release                              # [ADAPT]

# Values for the decision's replay record (whitepaper §7.10.1). The
# workflow and HITL blocks land verbatim from what the engine and the
# authority path serialized; everything else the record needs is declared
# here rather than carried as code constants (§6.4).
replay:
  plan_id: sterling-mutual.loan-context.plan
  schema_name: sterling-mutual.loan-context
  schema_version: "1.0.0"
  operator_key: traversal.typed-neighborhood
  operator_category: traversal
  operator_parameter_hash: sterling-loan-traversal-params-1
  policy_binding_key: sterling-mutual/policy-bundle/lending-operations
  policy_binding_version: "1.0.0"
  temporal_boundary: "2026-06-02T09:00:00+00:00"
  expires_at: "2026-06-02T11:00:00+00:00"
  recorded_at: "2026-06-02T10:20:00+00:00"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  payload:
    loan_ref: SM-LOAN-4471
    disbursement_stage: awaiting-approval
  perspective:
    principal_id: credit-ops-analyst-9
    role: credit-operations-analyst
