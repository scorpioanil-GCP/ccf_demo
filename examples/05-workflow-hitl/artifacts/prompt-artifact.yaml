# yaml-language-server: $schema=../../../docs/schemas/ccf.prompt-artifact.json
# Workflow-HITL prompt artifact (CLAUDE.md §6.2 axis 6; D-IMPL-28).
#
# The template text and its declared parameters live here, never in code — a
# prompt string literal in `run.py` would be the No-Hardcoding Rule (§6.4)
# firing, and CINV-01 lints `/examples` for exactly that.
#
# **Not addressable by the manifest**, for the same reason as the agent
# definition: `ccf.prompt-artifact` is author-versioned and registers through the
# D-05 bump check, which `load_and_boot` does not run. `run.py` registers it under
# the key `agent-registration.yaml` names — the key the agent definition's axis-6
# ref resolves against.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `name`, `tenant`, `declared_parameters` and the template text are
# [ADAPT]; the keys `schema_version`, `artifact_version`, `name`, `tenant`,
# `declared_parameters` and `template` are [MECHANISM].

schema_version: "1.0.0"
artifact_version: "1.0.0"
name: disbursement-briefing
tenant: sterling-mutual
declared_parameters: [loan_ref, as_of]
template: |
  Brief the disbursement officer on loan {{ loan_ref }} as of {{ as_of }}:
  verified file completeness, assessed conditions precedent, and whether
  the disbursement can proceed under the lending-operations regime.
