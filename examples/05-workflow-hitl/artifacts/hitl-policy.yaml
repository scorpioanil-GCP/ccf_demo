# yaml-language-server: $schema=../../../docs/schemas/ccf.hitl-policy.json
# The D-16 Control Plane value governing every human action at the authority path
# (CLAUDE.md §8.2; D-IMPL-20/21).
#
# `signed_binding_required: true` means a submission without a verifiable
# `SignedPrincipalBinding` is refused before it lands. The transport re-resolves
# this policy per submission, so flipping the value here flips behaviour with
# zero code change — which is the point of it being an artifact rather than a
# constructor argument.
#
# **Not addressable by the manifest.** `ccf.hitl-policy` is an SDK-owned class
# that is absent from `SDK_ARTIFACT_CLASSES`, so a manifest entry naming it would
# resolve to the open `DeclaredArtifact` envelope — and the transport, which
# reads its real contract back off the Control Plane by key, would find the wrong
# type there. `run.py` registers it itself.
#
# `role: register` in spirit and in fact: a HITL policy is the standing statement
# of what a human was permitted to do. The RUN's human actions are separate, and
# they are `hitl-drive.yaml`, which is `role: load`.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the VALUE of `signed_binding_required` is [ADAPT]; the keys
# `semver` and `signed_binding_required` are [MECHANISM].

semver: "1.0.0"
signed_binding_required: true
