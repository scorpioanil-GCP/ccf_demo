# Workflow-HITL example prompt artifact (CLAUDE.md §6.2 axis 6; D-IMPL-28).
#
# The template text and its declared parameters live here, never in code —
# a prompt string literal in `run.py` would be the No-Hardcoding Rule
# (§6.4) firing, and CINV-01 lints `/examples` for exactly that.

keys:
  prompt_artifact: sterling-mutual/prompt/disbursement-briefing

prompt_artifact:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: disbursement-briefing
  tenant: sterling-mutual
  declared_parameters: [loan_ref, as_of]
  template: |
    Brief the disbursement officer on loan {{ loan_ref }} as of {{ as_of }}:
    verified file completeness, assessed conditions precedent, and whether
    the disbursement can proceed under the lending-operations regime.
