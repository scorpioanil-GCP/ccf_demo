# Workflow-HITL example workflow definition (CLAUDE.md §8.1; D-IMPL-28;
# SDK-defined). Wraps the pinned loan-disbursement task and adds ONLY
# routing: transitions, terminal states, the per-node exception ref that
# drives the ExceptionEscalation path, and the per-gate approval-policy
# binding. Every routing value lives here, never in code (§6.4; CINV-01).

keys:
  workflow_definition: sterling-mutual/workflows/loan-disbursement
  # The wrapped task resolves through Control Plane resolution at the
  # URI-derived key {tenant}/{artifact_class}/{name} (DESIGN.md §3.5).
  task_definition: sterling-mutual/ccf.task-definition/loan-disbursement

referenced_artifacts:
  loan_file_exception_handler:
    key: sterling-mutual/exception-handler/loan-file-fetch-failed
    class_id: exception-handler
    semver: "1.0.0"
    declaration:
      routes_to: loan-operations-desk
  disbursement_officer_policy:
    key: sterling-mutual/approval-policy/disbursement-officer
    class_id: approval-policy
    semver: "1.0.0"
    declaration:
      approver_role: disbursement-officer
      quorum: "1"

workflow_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: loan-disbursement-workflow
  tenant: sterling-mutual

  task_definition_ref: "ccf-artifact://sterling-mutual/ccf.task-definition/loan-disbursement@1.0.0"

  start: verify-loan-file
  transitions:
    - source: verify-loan-file
      target: assess-disbursement
    - source: assess-disbursement
      target: disbursement-approval
    - source: disbursement-approval
      target: disbursed
    - source: disbursement-approval
      target: declined
  terminal_states: [disbursed, declined]

  # The ExceptionEscalation path (D-IMPL-61): a failure in the loan-file
  # verification step is a first-class recorded transition to this handler.
  exception_refs:
    verify-loan-file: "ccf-artifact://sterling-mutual/exception-handler/loan-file-fetch-failed@1.0.0"

  gate_policies:
    disbursement-approval: "ccf-artifact://sterling-mutual/approval-policy/disbursement-officer@1.0.0"
