# Workflow-HITL example agent definition — a declared, versioned Control
# Plane artifact (CLAUDE.md §6.1/§6.2; D-IMPL-28). The workflow's agent
# node invokes this definition by pinned versioned URI; no agent exists in
# example code (§6.1 — "any agent found in library code is a defect").
# Instruction bindings are versioned-URI refs only (§6.4).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename

keys:
  agent_definition: sterling-mutual/agents/disbursement-analytics

referenced_artifacts:
  policy_regime:
    key: sterling-mutual/policy-bundle/lending-operations
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: lending-operations
      permitted_classifications: [internal]
  halflife_debt_profile:
    key: sterling-mutual/debt-profile/disbursement-review
    class_id: debt-profile
    semver: "1.0.0"
    declaration:
      review_cycle: per-decision
      risk_sensitivity: "1.1"
      forced_llm_threshold: "0.35"
      fail_closed_threshold: "0.80"

agent_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: disbursement-analytics
  tenant: sterling-mutual

  # axis 1 — ordered archetype list (D-IMPL-19)
  archetypes: [analytics_insights]

  # axis 2 — context contract
  context_contract:
    consumes:
      - product_class: sterling-mutual.loan-context
        schema_version: "1.0.0"

  # axis 3 — perspective (Π role-conditioning)
  perspective:
    role: credit-operations-analyst
    selection_params:
      book: retail-lending

  # axis 4 — policy regime (versioned-URI ref, never inline)
  policy_regime:
    ref: "ccf-artifact://sterling-mutual/policy-bundle/lending-operations@1.0.0"

  # axis 5 — half-life and debt profile (versioned-URI ref)
  halflife_debt_profile:
    ref: "ccf-artifact://sterling-mutual/debt-profile/disbursement-review@1.0.0"

  # axis 6 — instruction bindings: refs plus declared parameter names
  instruction_bindings:
    - prompt: "ccf-artifact://sterling-mutual/prompt/disbursement-briefing@1.0.0"
      parameters: [loan_ref, as_of]
