# Workflow-HITL example task definition (CLAUDE.md §6.4/§8.1; D-IMPL-28;
# SDK-defined). Banking domain per D-09 — approval workflows under
# regulatory pressure are the canonical HITL case; non-adjacent reuse of
# the example-00 banking domain is permitted by D-06. Authored fresh:
# tenant, steps, and every identifier are distinct from both the test
# payment-release fixture and examples/00-quickstart.
#
# Three steps: one skill invocation, one agent invocation, one hitl-gate
# (CLAUDE.md §8.1 — every step is one of exactly those three kinds). Every
# step value lives here, never in code (No-Hardcoding Rule §6.4); refs are
# pinned versioned URIs (D-IMPL-26); the hitl-gate step carries no ref by
# schema — its approval-policy binding lives on the workflow wrapper.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename

keys:
  task_definition: sterling-mutual/tasks/loan-disbursement
  # The agent step's reference resolves through Control Plane resolution at
  # the URI-derived key {tenant}/{artifact_class}/{name} (DESIGN.md §3.5);
  # run.py registers the agent.yaml definition there.
  referenced_agent_definition: sterling-mutual/ccf.agent-definition/disbursement-analytics

referenced_artifacts:
  verify_loan_file_skill:
    key: sterling-mutual/skill/verify-loan-file
    class_id: skill
    semver: "1.0.0"
    declaration:
      capability: verify-loan-file
      source: loan-origination-system

task_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: loan-disbursement
  tenant: sterling-mutual

  steps:
    - kind: skill
      name: verify-loan-file
      ref: "ccf-artifact://sterling-mutual/skill/verify-loan-file@1.0.0"
    - kind: agent
      name: assess-disbursement
      ref: "ccf-artifact://sterling-mutual/ccf.agent-definition/disbursement-analytics@1.0.0"
    - kind: hitl-gate
      name: disbursement-approval

  # Instruction bindings by versioned ref only (axis-6 discipline; §6.4).
  instruction_bindings:
    - prompt: "ccf-artifact://sterling-mutual/prompt/disbursement-briefing@1.0.0"
      parameters: [loan_ref, as_of]
