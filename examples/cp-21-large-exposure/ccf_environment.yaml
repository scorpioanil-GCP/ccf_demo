# yaml-language-server: $schema=../../docs/schemas/ccf.deployment-environment.json
#
# THE DEPLOYMENT DOCUMENT — every value read from the environment by NAME.

config: ccf_config.yaml

substrate:
  setting: database_path
  prefix: cp_21
  suffix: .sqlite3

sources:
  relational:
    dsn:
      from_env: CCF_CP_21_POSTGRES_DSN
      remedy: >-
        export CCF_CP_21_POSTGRES_DSN with a READ-ONLY connection string for
        the estate (host and credentials from ccf_dataprep/.env).
    schema:
      from_env: CCF_CP_21_POSTGRES_SCHEMA
      remedy: >-
        export CCF_CP_21_POSTGRES_SCHEMA with the namespace holding
        bank_capital, limit_definition, exposure_proposal, guarantee_terms,
        reporting_bank, legal_entity, facility and drawdown (the v2 estate
        reads `ccf_v2`).
  graph:
    url:
      from_env: CCF_CP_21_FLUREE_URL
      remedy: >-
        export CCF_CP_21_FLUREE_URL with the base URL of a READ-ONLY Fluree
        endpoint; this deployment reads the ledger watermark only.
    ledger:
      from_env: CCF_CP_21_FLUREE_LEDGER
      remedy: export CCF_CP_21_FLUREE_LEDGER with the ledger name — the v2 estate is `fibo-v2`.

  # THE RULEBOOK TEXT. A limit that cites a provision must be able to show that
  # provision's own words, so the regime's cited passages are resolved here and
  # served quoted (`LEX-G08`). No hash is minted: these passages carry none.
  documents:
    uri:
      from_env: CCF_CP_21_MONGO_URI
      remedy: >-
        export CCF_CP_21_MONGO_URI with a READ-ONLY MongoDB connection string
        for the regulatory corpus.
    db:
      from_env: CCF_CP_21_MONGO_DB
      remedy: >-
        export CCF_CP_21_MONGO_DB with the database holding the `document` and
        `passage` collections — the v2 estate reads `fibo_v2`.

  # The estate carries no register of supervisory or committee principals, so
  # this deployment declares the credential -> principal chain itself and maps
  # each principal to one declared rendering of the determination.
  credentials:
    PRIN-CO-001:
      from_env: CCF_CP_21_TOKEN_CREDITOFFICER
      remedy: export CCF_CP_21_TOKEN_CREDITOFFICER with the credit officer's bearer credential.
    PRIN-CM-002:
      from_env: CCF_CP_21_TOKEN_COMMITTEE
      remedy: export CCF_CP_21_TOKEN_COMMITTEE with the credit committee's bearer credential.
    PRIN-EX-003:
      from_env: CCF_CP_21_TOKEN_EXAMINER
      remedy: export CCF_CP_21_TOKEN_EXAMINER with the examiner's bearer credential.
    PRIN-UNG-004:
      from_env: CCF_CP_21_TOKEN_UNGRANTED
      remedy: >-
        export CCF_CP_21_TOKEN_UNGRANTED with a recognized credential this
        deployment grants nothing — the negative control.

door:
  credential:
    from_env: CCF_CP_21_DOOR_TOKEN
    remedy: export CCF_CP_21_DOOR_TOKEN with the bearer the standard door's default principal presents.
  issuer_url:
    from_env: CCF_CP_21_DOOR_ISSUER_URL
    remedy: export CCF_CP_21_DOOR_ISSUER_URL with the door's declared issuer URL.
  resource_server_url:
    from_env: CCF_CP_21_DOOR_RESOURCE_URL
    remedy: export CCF_CP_21_DOOR_RESOURCE_URL with the door's declared resource-server URL.
