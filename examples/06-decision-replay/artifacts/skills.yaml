# Decision-replay example skill material (CLAUDE.md §6.2 channel 2;
# D-IMPL-12/29; energy/grid-ops domain). One catalog entry inside the
# agent's governance envelope (agent.yaml permits `telemetry-read`) and
# the grant that binds it — so the recorded decision's dimension 4 carries
# a real, non-empty skill-set in force, resolvable from the ArtifactStore
# at replay time.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename

skills:
  feeder_load_metrics:
    schema_version: "2.0.0"
    artifact_version: "1.0.0"
    name: feeder-load-metrics
    tenant: boreal-grid
    skill_type: local_callable
    description: >-
      Compute sustained-load metrics for a named feeder from the served
      feeder-load context — load percent, overload duration band, and
      shed-candidacy flag.
    argument_schema:
      properties:
        feeder_ref:
          type: string
          description: The feeder to compute sustained-load metrics for.
      required: [feeder_ref]
    binding:
      callable_ref: feeder-load-metrics
    requirements:
      required_scopes: [telemetry-read]
      required_context_products: [boreal-grid.feeder-load-context]

# The grant document. agent_definition_hash is derived identity, computed
# by mechanism at request time — a hash is never an artifact value
# (D-IMPL-26).
grant:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: load-analytics-telemetry
  tenant: boreal-grid
  skill_name: feeder-load-metrics
  skill_version: "1.0.0"

# The composition-root callable binding (D-19) and its deterministic
# output record — content here, mechanism in code.
callable:
  registered_key: feeder-load-metrics
  output_record:
    computed: sustained-load
    load_percent: "104"
    overload_band: "sustained-30min"
    shed_candidate: "yes"

dispatch:
  arguments:
    feeder_ref: BG-FDR-114-2
  expected_output:
    computed: sustained-load
    load_percent: "104"
    overload_band: "sustained-30min"
    shed_candidate: "yes"
    feeder_ref: BG-FDR-114-2

actors:
  requesting_actor: grid-platform-operator
