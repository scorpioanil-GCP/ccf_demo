# Decision-replay example event stream — L1 signal envelopes
# (energy/grid-ops domain, D-IMPL-52). Not a flat happy path:
#
#   * gd-301 asserts the SAME substation as gd-300 from a DIFFERENT source
#     with identical attributes -> one claim whose lineage accumulates by
#     set-union, not a second node.
#   * gd-302 introduces a routine-load feeder the similarity operator must
#     rank out — "similarity did something" is distinguishable from an
#     identity function.
#   * gd-303 carries a RESTRICTED feeder (a defense-site spur) the policy
#     operator must substitute out along with its `fed_from` edge.
#
# Payload keys are the source systems' vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename

