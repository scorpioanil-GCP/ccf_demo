# Decision-replay example workflow definition (CLAUDE.md §8.1;
# D-IMPL-28). Wraps the pinned load-shed task and adds ONLY routing: the
# operator's decision at the gate authorizes or withholds the shed. Every
# routing value lives here, never in code (§6.4; CINV-01).

keys:
  workflow_definition: boreal-grid/workflows/load-shed-authorization
  task_definition: boreal-grid/ccf.task-definition/load-shed-authorization

referenced_artifacts:
  shift_supervisor_policy:
    key: boreal-grid/approval-policy/shift-supervisor
    class_id: approval-policy
    semver: "1.0.0"
    declaration:
      approver_role: shift-supervisor
      quorum: "1"

workflow_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: load-shed-authorization-workflow
  tenant: boreal-grid

  task_definition_ref: "ccf-artifact://boreal-grid/ccf.task-definition/load-shed-authorization@1.0.0"

  start: collect-telemetry
  transitions:
    - source: collect-telemetry
      target: load-shed-authorization
    - source: load-shed-authorization
      target: authorized
    - source: load-shed-authorization
      target: withheld
  terminal_states: [authorized, withheld]

  gate_policies:
    load-shed-authorization: "ccf-artifact://boreal-grid/approval-policy/shift-supervisor@1.0.0"
