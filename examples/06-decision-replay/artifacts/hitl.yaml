# Decision-replay example HITL material (CLAUDE.md §8.2; D-IMPL-20/21;
# D-16; D-14 replay leg). The recorded decision includes an AUTH-BOUND
# approval: the D-16 policy requires a signed principal binding, and the
# approver principal is derived from the verified token grant — so the
# hardened HITL surface is demonstrated *in replay*, reproduced from the
# record alone. The decision also crosses an OverrideBoundary: the shift
# supervisor substitutes the agent's shed determination, and BOTH the
# original and the override land in the replay record (CLAUDE.md §8.2).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename

keys:
  hitl_policy: boreal-grid/hitl/load-shed-hitl-policy
  signing_key_id: boreal-grid-shift-supervisor-key

hitl_policy:
  semver: "1.0.0"
  signed_binding_required: true

# subject_id deliberately equals the active token's client_id in
# tokens.yaml (D-IMPL-67 derivation + subject-conflict refusal).
approver:
  identity:
    subject_id: shift-supervisor-8
    identity_provider_ref: idp://boreal-grid/dev-token-file
  authentication:
    method: bearer-token
    assurance_level: dev
    session_ref: session-ss-8
  action_time: "2026-06-10T06:10:00+00:00"

drive:
  execution_id: exec-shed-1
  approval_action: approve
  resume_decision: authorized
  expected_gate: load-shed-authorization

node_outputs:
  collect-telemetry:
    telemetry_window: "30min"
    feeders_reported: "3"

debt_factors:
  freshness: "1.0"
  completeness: "1.0"
  semantic_consistency: "1.0"

clock:
  base: "2026-06-10T06:05:00+00:00"

# OverrideBoundary material (CLAUDE.md §8.2): the agent's shed
# determination is surfaced at a typed boundary and the shift supervisor
# substitutes a shallower, longer shed. The original value and the
# substitute are BOTH declared here and BOTH must land in the replay
# record — losing the original would make the override unrepudiable
# (T-07-16). The overrider's subject_id equals the active token's
# client_id in tokens.yaml (D-IMPL-67 convention), and the resolution is
# signed under the same D-16 policy as the approval.
override:
  event:                                                 # [MECHANISM]
    event_key: boreal-grid/exec-shed-1/shed-scope-override  # [ADAPT]
    workflow_state_ref: boreal-grid/exec-shed-1             # [ADAPT]
  overrider:
    # Which tokens.yaml entry this overrider's identity is bound to.
    token_label: approver                                # [MECHANISM]
    identity:
      subject_id: shift-supervisor-8                     # [ADAPT]
      identity_provider_ref: idp://boreal-grid/dev-token-file
    authentication:
      method: bearer-token
      assurance_level: dev
      session_ref: session-ss-8-override
    action_time: "2026-06-10T06:12:00+00:00"
  # The agent's output at the boundary (quoted decimals — artifact
  # numbers with a decimal point are strings, parsed by mechanism).
  original:                                              # [ADAPT]
    feeder_ref: boreal-grid/entity/feeder-fdr-207
    shed_megawatts: "12.5"
    duration_minutes: "30"
  # The human's substitution: shed less load for longer.
  substitute:                                            # [ADAPT]
    feeder_ref: boreal-grid/entity/feeder-fdr-207
    shed_megawatts: "9.0"
    duration_minutes: "45"
  drive:
    # `override` substitutes; `confirm` keeps the agent value — either
    # way a recorded action, never an absence (§8.2).
    action: override                                     # [ADAPT]
