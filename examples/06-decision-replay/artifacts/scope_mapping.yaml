# Decision-replay example scope mapping (HARD-04; D-IMPL-68; Phase 10 D-16).
#
# The deployment's authorization statement: which token scopes reach which
# tenants and which door-declared actions. Every value here — scope
# strings, tenant patterns, action identifiers, the registry key — is
# deployment data (CINV-01; CLAUDE.md §6.4); the SDK ships the grammar
# interpreter only.
#
# The `hitl` scope (the shift supervisor's token scope in tokens.yaml)
# reaches the example's tenant for both HITL door actions. The `metering`
# scope (the unauthorized token's scope) is deliberately ABSENT from the
# mapping: deny-by-default means an unmapped scope grants nothing, and the
# driver demonstrates the resulting typed 403 (`tenant-unauthorized`).
#
# Adapt-first: change `tenant_patterns` (exact match or single trailing
# `*` prefix glob — the D-01 grammar) and the scope names to your own
# deployment's vocabulary.

keys:
  scope_mapping: boreal-grid/scope-mapping

scope_mapping:
  semver: "1.0.0"
  scopes:
    hitl:
      tenant_patterns: [boreal-grid]
      action_ids: [hitl.queue.read, hitl.action.submit]
