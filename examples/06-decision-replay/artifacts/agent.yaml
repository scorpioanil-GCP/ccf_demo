# Decision-replay example agent definition — a declared, versioned Control
# Plane artifact (CLAUDE.md §6.1/§6.2; D-IMPL-28). Energy/grid-ops domain.
#
# The axis-4 policy regime carries the D-IMPL-29 `skill_governance`
# envelope: `telemetry-read` is the one scope agents under this regime may
# bind, which is what admits the skills.yaml grant through the tier-1
# check. The replay record must carry BOTH this definition's version and
# the grant-set in force (dimension 4) — the decision replays against the
# skills the agent actually had.

keys:
  agent_definition: boreal-grid/agents/grid-load-analytics

referenced_artifacts:
  policy_regime:
    key: boreal-grid/policy-bundle/grid-operations-regime
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: grid-operations-regime
      permitted_classifications: [internal]
      skill_governance:
        permitted_scopes: [telemetry-read]
        grant_requires_approval: false
  halflife_debt_profile:
    key: boreal-grid/debt-profile/load-shed-review
    class_id: debt-profile
    semver: "1.0.0"
    declaration:
      review_cycle: per-event
      risk_sensitivity: "1.3"
      forced_llm_threshold: "0.30"
      fail_closed_threshold: "0.70"

agent_definition:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: grid-load-analytics
  tenant: boreal-grid

  # axis 1 — ordered archetype list (D-IMPL-19)
  archetypes: [analytics_insights]

  # axis 2 — context contract: the product class this fabric serves
  context_contract:
    consumes:
      - product_class: boreal-grid.feeder-load-context
        schema_version: "1.0.0"

  # axis 3 — perspective (Π role-conditioning)
  perspective:
    role: grid-operations-analyst
    selection_params:
      interconnect: north

  # axis 4 — policy regime (versioned-URI ref, never inline)
  policy_regime:
    ref: "ccf-artifact://boreal-grid/policy-bundle/grid-operations-regime@1.0.0"

  # axis 5 — half-life and debt profile (versioned-URI ref)
  halflife_debt_profile:
    ref: "ccf-artifact://boreal-grid/debt-profile/load-shed-review@1.0.0"

  # axis 6 — instruction bindings: refs plus declared parameter names
  instruction_bindings:
    - prompt: "ccf-artifact://boreal-grid/prompt/load-shed-briefing@1.0.0"
      parameters: [feeder_ref, as_of]
