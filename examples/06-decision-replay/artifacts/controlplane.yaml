# Decision-replay example Control Plane bundle (energy/grid-ops domain,
# D-IMPL-52). Every number, threshold, version identifier, query string
# and product-class property the example uses is here; `run.py` holds
# none of them (CLAUDE.md §6.4; D-IMPL-38/39).

schema_version: "1.0.0"
artifact_version: "1.0.0"

keys:
  resolution_spec: boreal-grid/entity-resolution-spec
  policy_bundle: boreal-grid/policy-bundle/grid-operations
  max_ttl: boreal-grid/product/feeder-load-context/max-ttl

policy_bundle:
  regime: grid-operations
  jurisdiction: north-interconnect
  permitted_classifications:
    - internal

max_ttl_seconds: 900

operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "feeder overload load shed urgent"
    minimum_score_percent: 40
    ranked_entity_classes:
      - feeder
    index_version: "boreal-feeder-corpus@2026-06-01"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - feeder
    relationship_types:
      - fed_from
    depth_limit: 2

product_class:
  schema_name: boreal-grid.feeder-load-context
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: boreal-grid.feeder-load-context.plan
  product_ttl_seconds: 600

perspective:
  principal_id: grid-operator-52
  role: grid-operations-analyst

# The decision's instants. Explicit inputs, never clock reads.
decision:
  temporal_boundary: 2026-06-10T06:00:00Z
  now: 2026-06-10T06:00:05Z

# Artifact-class identifiers and names for what the record phase persists
# into the ArtifactStore and the replay phase resolves back at exact
# versions (CLAUDE.md §7.4; D-IMPL-26).
artifacts:
  replay_record_class: decision-replay-record
  agent_definition_class: ccf.agent-definition
  skill_grant_class: ccf.skill-grant
  skill_grant_name: load-analytics-telemetry
  # The name the version-mutated COPY is stored under in the negative
  # test — never the canonical record's name.
  mutated_record_name: mutated-copy
  # A version string that was never registered, used to prove the audit
  # record is version-sensitive: substituting it into a COPY of the
  # record makes reproduction refuse.
  unregistered_policy_version: "9.9.9"

expected:
  entity_classes:
    - feeder
    - substation
  relationship_types:
    - fed_from
  entity_count: 2
