# yaml-language-server: $schema=../../../docs/schemas/ccf.operator-parameters.similarity.json
# Similarity category parameters (whitepaper §7.4; energy/grid-ops domain,
# D-IMPL-52).
#
# Read as: rank feeders against the overload query at or above 40%. The
# routine-load feeder in `events.yaml` is the distractor this operator ranks
# out, which is what makes "similarity did something" distinguishable from an
# identity function.
#
# `similarity_corpus_attribute_by_class` lives HERE rather than in the
# resolution spec: one artifact, one consumer (D-03). Two rules govern it and
# they get opposite answers (plan 15-11):
#
#   * a class ABSENT from this map contributes no corpus entry, silently — the
#     map is this deployment's statement of which classes are rankable, and
#     `substation` is deliberately absent;
#   * an entity of a class this map NAMES that carries no such attribute is
#     REFUSED at registry-build time. Refuse, never repair.
#
# The corpus's version identity is not here. It is a property of the graph state
# at a named boundary, not of these parameters, so the deployment assigns it
# alongside the boundary (see `product-governance.yaml`) — INV-CH7-27.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the query text, the threshold, every entity class name and the
# attribute name are [ADAPT]; the keys `semver`, `query`,
# `minimum_score_percent`, `ranked_entity_classes` and
# `similarity_corpus_attribute_by_class` are [MECHANISM].

semver: "1.0.0"

query: "feeder overload load shed urgent"
minimum_score_percent: 40
ranked_entity_classes:
  - feeder

similarity_corpus_attribute_by_class:
  feeder: load_summary
