# Banking fixture A2A federation values — the cross-process exchange's
# user-declared vocabulary.
#
# EVERYTHING here is a *value*. There is no peer name, key identifier, producer
# hash, ceiling, endpoint path or federation entity class anywhere in `/src` or
# `/runtime` (CLAUDE.md §6.4 No-Hardcoding Rule, §11; CINV-01). The test code
# that loads this file is thin: it maps these declarations onto SDK mechanism
# and asserts. Delete this file and `tests/crossproc/test_peering_exchange.py` has
# nothing to run.
#
# No key *material* is here: keys are generated per test into a temp directory
# and never committed. What is declared is which identifiers a peer is entitled
# to sign under, which is policy rather than secret.

# The consuming fabric's own federation identity and its trust-policy lane.
consumer:
  peer_id: acme-bank-consumer
  semver: "1.0.0"
  # Defence in depth at the transport, and the authoritative Control Plane
  # ceiling the gate applies. Both are this fixture's numbers, not
  # recommendations (D-IMPL-38: the SDK ships neither).
  inbound_payload_ceiling_bytes: 65536
  max_request_bytes: 262144
  # How many received carriages either transport holds before the consumer
  # drains them (SEC-021, D-IMPL-369). At the bound the newcomer is refused and
  # nothing queued is evicted. This fixture's number, not a recommendation: the
  # SDK ships no default (Q13).
  max_pending: 64
  # The route this deployment mounts its federation endpoint at. A deployment's
  # URL space is the deployment's; the SDK holds no default.
  receive_path: /ccf/a2a/inbound

# The LF A2A leg's own deployment values (D-IMPL-14's default wire). Separate
# from `consumer` above because they describe the *transport*, not the peer: the
# peer identity, its entitlements and its ceilings are identical whichever wire
# carries the product, which is the substitution claim this file's two legs
# exist to make checkable.
#
# The Agent Card fields are this deployment's statement about itself. They are
# discovery values, never trust values — what binds a product to a principal is
# the detached-JWS `kid` against the `peers` entries above, and no field here
# contributes to that.
lf_a2a:
  rpc_path: /ccf/a2a/jsonrpc
  card:
    name: acme-bank-federation-peer
    version: "1.0.0"
    description: Acme Bank's CCF federation endpoint

# Two peers, with different keys and different entitlements (D-23). Two, and
# not one, because a single-principal proof passes against a gate that checks
# signatures over every key it holds — which is exactly the defect the two-peer
# case exists to catch.
#
# Each peer's issuance window (SEC-022): how long before the consumer's
# admission instant its envelope may have been issued, and how far after. This
# fixture's numbers, not recommendations: the SDK ships no default (Q14).
# Different per peer on purpose — the window is a per-peer entitlement.
peers:
  first:
    peer_id: zenith-bank
    key_id: zenith-bank-a2a-1
    producer_hash: "sha256:zenith-exposure-assembler"
    signature_max_age_seconds: 300
    permitted_clock_skew_seconds: 30
  second:
    peer_id: northwind-trust
    key_id: northwind-trust-a2a-1
    producer_hash: "sha256:northwind-exposure-assembler"
    signature_max_age_seconds: 600
    permitted_clock_skew_seconds: 60

# How an admitted federated product becomes L1 signal on the consumer's side.
#
# This is the consumer's own ontology extension, not the producer's: the
# producer's entities arrive as *claims about another fabric's graph*, so they
# resolve into their own entity class rather than being merged into the
# consumer's counterparty/facility/covenant vocabulary. Merging them would
# assert that the consumer had independently observed what a peer told it.
federation:
  system_id: acme-bank-a2a-federation
  # How this deployment reads an admitted product into L1 envelopes, for
  # `AssemblyWorker.ingest_admitted` (Dave, 2026-07-27). Which payload member
  # carries the peer's records, and how the peer's key names map onto this
  # consumer's own vocabulary, are this deployment's statements — the SDK ships
  # neither a default key name nor a default correspondence.
  payload_records_key: entities
  record_key_aliases:
    entity_uri: federated_entity_uri
    entity_class: federated_entity_class
  entity_rule:
    match_key: federated_entity_uri
    entity_class: federated_entity
    identity_keys: [federated_entity_uri]
    attribute_keys: [federated_entity_class]
