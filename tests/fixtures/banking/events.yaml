# Banking fixture event stream — L1 signal envelopes for the proto-quickstart.
#
# Deliberately not a happy path. The stream is constructed so that a broken
# invariant shows up as a failing assertion (D-02, "would this slice catch a
# broken invariant?"):
#
#   * env-002 asserts the SAME counterparty as env-001 from a DIFFERENT source,
#     with identical attributes and the same observed time -> ONE claim whose
#     lineage accumulates by set-union (INV-CH7-17). An implementation that
#     overwrote lineage would still look idempotent and would fail here.
#   * env-002-redelivery is env-002 verbatim, re-delivered -> nothing
#     accumulates. An implementation that appended lineage unconditionally
#     would pass the previous case and fail this one.
#   * env-004 re-asserts the counterparty at a LATER observed time -> a new
#     claim that supersedes, with the prior claim and its two-source lineage
#     still readable. Corroboration and supersession are different events and
#     the stream contains both.
#   * env-006 carries a RESTRICTED covenant, which the policy operator must
#     substitute out along with the edge that would otherwise leak its
#     existence by absence.
#   * FAC-200 is a real, permitted facility that the similarity operator must
#     rank out — so "similarity did something" is distinguishable from
#     "similarity was an identity function".
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.

envelopes:
  - envelope_id: env-001
    source_system_id: core-banking
    ingestion_timestamp: 2026-03-01T09:00:00Z
    observed_time: 2026-03-01T08:55:00Z
    payload:
      counterparty_lei: "5493001KJTIIGC8Y1R12"
