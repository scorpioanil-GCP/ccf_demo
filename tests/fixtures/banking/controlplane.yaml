# Banking fixture Control Plane artifacts for the proto-quickstart.
#
# Every number, threshold, version identifier, query string and product-class
# property the slice uses is here. `/src` holds none of them: MAX_TTL has no SDK
# default (D-IMPL-39), operator parameters are declared artifacts with no
# silent defaults (D-IMPL-38), and the whitepaper's illustrative figures are
# illustrative (DESIGN.md Appendix B F-1).
#
# The keys are deployment vocabulary too. The SDK never enumerates Control Plane
# keys; the fabric is told which ones to pin.

keys:
  resolution_spec: acme-bank/entity-resolution-spec
  policy_bundle: acme-bank/policy-bundle/credit-analyst
  max_ttl: acme-bank/product/exposure-summary/max-ttl
  operator_parameters: acme-bank/operator-parameters/exposure-summary

# The policy bundle in force. Its schema belongs to the policy subsystem plan;
# what this slice owes is that a *version* of it is resolved from the Control
# Plane, stamped onto every claim at assembly, and carried into the product's
# policy binding and the replay record's dimension 2.
policy_bundle:
  regime: acme-bank-credit
  jurisdiction: NL
  permitted_classifications:
    - internal

# Per-class TTL ceiling (INV-CH7-48, D-IMPL-39). Fifteen minutes is a fixture
# value chosen by this fixture, not a recommendation.
max_ttl_seconds: 900

# Declared operator parameter sets (D-IMPL-38). Read as: the credit-analyst
# perspective may see internally-classified state; rank facilities against the
# revolving-credit query at or above 30%; reconcile to the boundary on both
# temporal axes; expand two hops from counterparties over these typed edges.
operator_parameters:
  policy:
    permitted_classifications:
      - internal
  similarity:
    query: "revolving credit facility usd"
    minimum_score_percent: 30
    ranked_entity_classes:
      - facility
    index_version: "acme-bank-facility-corpus@2026-03-01"
  temporal:
    require_valid_at_boundary: true
  traversal:
    seed_entity_classes:
      - counterparty
    relationship_types:
      - obligor_of
      - guarantees
      - governs
    depth_limit: 2

# The product class this fabric serves, and the perspective it is served to.
product_class:
  schema_name: acme-bank.credit-exposure-summary
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  plan_id: acme-bank.credit-exposure-summary.plan
  product_ttl_seconds: 300

perspective:
  principal_id: analyst-4471
  role: credit-analyst

# The decision's instants. Explicit inputs, never clock reads: the whole slice
# is replayable precisely because these are data.
decision:
  temporal_boundary: 2026-03-01T10:00:00Z
  now: 2026-03-01T10:00:05Z

artifacts:
  replay_record_class: decision-replay-record
