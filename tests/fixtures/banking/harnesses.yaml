# Per-harness drive values for the HarnessAdapterProtocol conformance suite
# (CLAUDE.md §7.3; D-IMPL-24; D-09).
#
# Every value here is a *deployment* value, which is why none of it lives in
# test code or in `/src`: a model identifier, an MCP server name, and the
# fields a harness reports back are the deployment's and the vendor's, never
# the SDK's (No-Hardcoding Rule §6.4). The suite asserts against these rather
# than against literals it authored itself — a test comparing a literal to the
# same literal proves only that the file was read.
#
# 06-13 (LangGraph) and 06-14 (Google ADK) add a block each, keyed by the same
# param name they add to the `harness_leg` fixture. All three are now present,
# which completes D-IMPL-24's harness set.

claude-agent:
  # Bound onto ClaudeAgentOptions.model. Never invoked: the suite drives SDK
  # objects in-process with no model and no `claude` CLI (D-09), and an
  # autouse fixture fails the run if anything opens a socket.
  model: claude-sonnet-4-5
  # Determines the mcp__{server}__{tool} namespace the harness sees, so it is
  # part of this deployment's tool vocabulary.
  mcp_server_name: ccf-skills
  mcp_server_version: "1.0.0"
  # What the harness reports back at the replay-hooks seam. The reported model
  # is deliberately *not* the configured `model` above: the fabric records what
  # it invoked and the harness records what it invoked, and a suite that used
  # one value for both could not tell the two apart (T-06-62).
  reported_model: claude-sonnet-4-5-20250929
  session_id: 5f6e1b2c-7a41-4f6d-9c33-2b0d4a8e11f7
  result_subtype: success
  input_tokens: 1234
  output_tokens: 567

langgraph:
  # Bound onto the run configuration this deployment invokes its graph with.
  # Never invoked: the adapter's topology is plain-function nodes end to end,
  # so the graph runs with no model and no network (D-09).
  model: gpt-4.1-mini
  # LangGraph's own run-correlation identifier, resolved under the run
  # configuration's `configurable` mapping. A deployment value: which unit of
  # work a run belongs to is the deployment's statement, not the SDK's.
  thread_id: 8c1d05a7-3e42-4b19-9f6a-71c2d8e0b334
  run_tags:
    - ccf-conformance
  # What the *harness* reports back during a run, propagated through the run
  # configuration's metadata under LangChain's own tracing keys. Deliberately
  # not the configured `model` above, for the same reason as the Claude block:
  # a suite that used one value for both could not tell a governed claim from
  # a harness-reported one (T-06-62).
  reported_model: gpt-4.1-mini-2025-04-14
  input_tokens: 4321
  output_tokens: 765

adk:
  # Bound onto the LlmAgent this deployment configures. Never invoked: the
  # adapter's execution vehicle is a BaseAgent subclass yielding events, so a
  # real Runner drives it with no model and no network (D-09).
  model: gemini-2.5-flash
  # What ADK calls this deployment's agent. ADK requires an identifier, which
  # a CCF agent key is not obliged to be, so it is the deployment's own name
  # for the agent rather than anything derived from the definition.
  agent_name: ccf_covenant_analytics
  # ADK's own run-correlation identifier — the session a run belongs to.
  # Resolved by ADK's session service and read back at the replay-hooks seam
  # only because the harness carried it there.
  session_id: 2f7b6c40-91ad-4d5e-a0e7-6c3f8b1d2e59
  app_name: ccf-conformance
  user_id: platform-operator
  # What the *harness* reports back during a run, carried into the run on
  # ADK's own session state. Deliberately not the configured `model` above,
  # for the same reason as the other two blocks: a suite that used one value
  # for both could not tell a governed claim from a harness-reported one
  # (T-06-62).
  reported_model: gemini-2.5-flash-002
  input_tokens: 2468
  output_tokens: 135
