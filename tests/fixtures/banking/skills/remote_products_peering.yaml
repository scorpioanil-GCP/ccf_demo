# Banking fixture skill catalog entry — peering type (CLAUDE.md §6.2 channel 2;
# D-IMPL-12; D-08 — the last transport bound, in 06-10).
#
# All values live here, none in `/src` or test code (No-Hardcoding Rule §6.4).
#
# The point this fixture exists to make: `binding.endpoint` is a **logical
# endpoint name**, not an address. Dispatch resolves it through the deployment
# block below to a transport the composition root already wired against its own
# trust-policy artifact. A hostile artifact naming `https://attacker.example/`
# resolves to no registration and is refused without a socket being opened
# (T-06-57).
#
# Versioning (D-IMPL-59 part 1; D-IMPL-28's independent lanes). The skill type
# token moved `a2a` -> `peering`: a *schema* change, and a breaking one, since
# the retired member is refused rather than migrated. Both lanes take a major
# bump — strictly larger than the D-IMPL-54 / D-05 precedent, where a binding
# *value* change moved `artifact_version` a minor step only.

# schema_version 3.0.0 on live entries: the 2.0.0 lane was the a2a->peering
# token retirement; D-IMPL-56 then added required `description` and
# `argument_schema` — another breaking schema-lane change.
entry:
  schema_version: "3.0.0"
  artifact_version: "2.0.0"
  name: remote-exposure-products
  tenant: acme-bank
  skill_type: peering
  description: >-
    Read credit-exposure Context Products the Zenith federation peer fabric
    has published to this bank, for treasury analysis.
  argument_schema:
    properties:
      requested_by:
        type: string
        description: >-
          The role or analyst the peer read is recorded against.
    required: [requested_by]
  binding:
    endpoint: zenith-federation
  requirements:
    required_scopes: [portfolio-read]
    required_context_products: []

# What this deployment's composition root registers for the logical endpoint
# the binding above selects. Swapping this block redirects the skill; editing
# the artifact cannot.
deployment:
  endpoint: zenith-federation
  # An endpoint the deployment did NOT register, for the unresolvable case —
  # written as a URL on purpose, to show that a URL-shaped artifact value buys
  # an attacker nothing, because it is matched as a name and never dialled.
  unregistered_endpoint: https://attacker.example/covenant-metrics

# The typed arguments a caller carries alongside. Recorded in the invocation and
# never transmitted: reading what a peer has already sent takes no parameters.
dispatch:
  arguments:
    requested_by: treasury-analyst

# What the bound transport has already received, as the dispatch suite's double
# will yield it. The three envelope members are opaque placeholders on purpose:
# dispatch never decodes, verifies, or admits them, and a suite that had to
# supply a *valid* signature here would be asserting that it did. The genuine
# signed exchange is proven end to end in
# `tests/crossproc/test_peering_exchange.py`, against both wires.
inbound:
  peer_id: zenith-bank
  tenant_id: acme-bank
  payload: cGxhY2Vob2xkZXItcGF5bG9hZA
  protected: cGxhY2Vob2xkZXItaGVhZGVy
  signature: cGxhY2Vob2xkZXItc2lnbmF0dXJl

# A grant naming this entry. Requested against the `auto` policy regime in
# grants.yaml — which permits `portfolio-read` — so it is granted and the skill
# becomes dispatchable. Its `denied` twin below asks for a scope that regime
# does not permit, which is the governance-ahead-of-the-network material: the
# refused skill never reaches dispatch, so the transport is never touched.
#
# Re-pinned to the entry's new version, as D-IMPL-54 did. The grant's own
# `schema_version` does not move — the grant class's shape is untouched.
grant:
  schema_version: "1.0.0"
  artifact_version: "1.1.0"
  name: treasury-remote-products
  tenant: acme-bank
  skill_name: remote-exposure-products
  skill_version: "2.0.0"

denied:
  entry:
    schema_version: "3.0.0"
    artifact_version: "2.0.0"
    name: remote-privileged-products
    tenant: acme-bank
    skill_type: peering
    description: >-
      Read privileged counterparty write-side products from the Zenith
      federation peer fabric — deliberately over-scoped so the auto regime
      refuses the grant.
    argument_schema:
      properties:
        requested_by:
          type: string
          description: >-
            The role or analyst the peer read is recorded against.
      required: [requested_by]
    binding:
      endpoint: zenith-federation
    requirements:
      required_scopes: [counterparty-write]
      required_context_products: []
  grant:
    schema_version: "1.0.0"
    artifact_version: "1.1.0"
    name: treasury-remote-privileged
    tenant: acme-bank
    skill_name: remote-privileged-products
    skill_version: "2.0.0"
  expected_excess_scopes: [counterparty-write]

# A SECOND peering entry, scoped inside what the fixture agent's regime permits,
# so it can be granted and invoked *through an agent* — the same shape
# `document_fetch_mcp.yaml`'s `agent_invocable` block takes, matching its MCP
# sibling rather than diverging from it. The `denied` entry above cannot serve
# this case: it is over-scoped on purpose. Same logical endpoint; the deployment
# block registers the transport and this entry names no address either.
agent_invocable:
  entry:
    schema_version: "3.0.0"
    artifact_version: "2.0.0"
    name: portfolio-remote-products
    tenant: acme-bank
    skill_type: peering
    description: >-
      Read credit-exposure Context Products the Zenith federation peer fabric
      has published to this bank, scoped for portfolio analysts.
    argument_schema:
      properties:
        requested_by:
          type: string
          description: >-
            The role or analyst the peer read is recorded against.
      required: [requested_by]
    binding:
      endpoint: zenith-federation
    requirements:
      required_scopes: [portfolio-read]
      required_context_products: []
  grant:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: covenant-analytics-portfolio-remote-products
    tenant: acme-bank
    skill_name: portfolio-remote-products
    skill_version: "2.0.0"
  arguments:
    requested_by: covenant-analyst
  requesting_actor: platform-operator
  approver_id: risk-officer-7

# The retired token, as a value rather than a test literal (§6.4). An artifact
# still declaring `skill_type: a2a` is refused *by name* — the same closed-world
# refusal an unknown type takes — never reinterpreted as `peering`. A grant
# quietly honoured under the new token would be a governance failure (T-06-106).
retired_token:
  token: a2a
  entry:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: remote-exposure-products
    tenant: acme-bank
    skill_type: a2a
    description: >-
      Read credit-exposure Context Products from the Zenith federation peer —
      declared under the retired a2a token, so the entry is refused by name.
    argument_schema:
      properties:
        requested_by:
          type: string
          description: >-
            The role or analyst the peer read is recorded against.
      required: [requested_by]
    binding:
      endpoint: zenith-federation
    requirements:
      required_scopes: [portfolio-read]
      required_context_products: []
