# Banking fixture skill catalog entry — mcp type (CLAUDE.md §6.2 channel 2;
# D-IMPL-12; AGNT-03; D-08 — mcp entries register in 05-05, dispatch is 05-06).
#
# All values live here, none in `/src` or test code (No-Hardcoding Rule §6.4).
# Requirement identifiers are opaque to the SDK (05-RESEARCH.md Pitfall 4);
# `required_context_products` is deliberately empty — an explicit statement
# that this skill reads no Context Product, not a defaulted omission
# (D-IMPL-38 discipline: the author declares, the SDK never assumes).

entry:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: document-fetch
  tenant: acme-bank
  skill_type: mcp
  binding:
    server: acme-bank-documents
    resource: loan-agreements
  requirements:
    required_scopes: [document-read]
    required_context_products: []

# What this deployment's composition root registers for the logical server the
# binding above selects. The URI lives HERE, not in the entry: a skill
# artifact names a server and a resource, never an address, so a hostile or
# mistaken artifact has no way to steer the fabric at a host of its choosing
# (T-06-24). Swapping this deployment block redirects the skill; editing the
# artifact cannot.
deployment:
  server: acme-bank-documents
  resources:
    loan-agreements: "documents://acme-bank/loan-agreements"
  # A resource the deployment did NOT register, for the unresolvable case.
  unregistered_resource: covenant-schedules

# The text the fixture server returns for that resource, and the arguments a
# caller carries alongside. The arguments are recorded in the invocation and
# never transmitted — an MCP resource read is addressed by its binding.
dispatch:
  contents: '{"agreement_id": "LN-4471", "pages": 38}'
  arguments:
    requested_by: treasury-analyst

# A grant naming this entry. Requested against the `auto` policy regime in
# grants.yaml — which permits `portfolio-read` and nothing else — so tier 1
# refuses it, naming `document-read` as the excess. That refusal is the
# governance-ahead-of-the-network material: an ungranted mcp skill never
# reaches dispatch, so no socket opens.
grant:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: treasury-document-fetch
  tenant: acme-bank
  skill_name: document-fetch
  skill_version: "1.0.0"
expected_excess_scopes: [document-read]
