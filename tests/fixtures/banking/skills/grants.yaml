# Banking fixture material for the two-tier grant machinery (CLAUDE.md §6.2
# channel 2; D-IMPL-29; D-09; AGNT-03).
#
# Every policy-regime allowance, requirement identifier, grant value, approver
# id, and clock instant the grants suite exercises is here. `/src` holds none
# of them: the SDK ships the tier-1 structural check, the state machine, and
# the ApprovalSink Protocol — never a scope vocabulary, an approval rule, or
# an approver (No-Hardcoding Rule §6.4; 05-RESEARCH.md Pitfall 4).
#
# The `skill_governance` block inside each policy-regime declaration is the
# mechanism-schema envelope the SDK reads (PolicyRegimeGovernance); which
# scopes it permits and whether grants need approval are this deployment's
# statements. Tier-2 requirement is a flag in this fixture data, never code
# (D-IMPL-29).

policy_regimes:
  auto:
    key: acme-bank/policy-bundle/treasury-auto
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: treasury-auto
      skill_governance:
        permitted_scopes: [portfolio-read]
        grant_requires_approval: false
  gated:
    key: acme-bank/policy-bundle/treasury-gated
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: treasury-gated
      skill_governance:
        permitted_scopes: [portfolio-read]
        grant_requires_approval: true
  # A regime that declares no skill_governance block at all: an agent bound
  # to it cannot be granted anything (no silent defaults, D-IMPL-38).
  ungoverned:
    key: acme-bank/policy-bundle/treasury-ungoverned
    class_id: policy-bundle
    semver: "1.0.0"
    declaration:
      regime: treasury-ungoverned

# Minimal six-axis agent definitions for the grants suite. Instruction
# bindings are deliberately empty (an allowed author statement) so the suite
# needs no prompt artifacts; the ledger resolves only the policy regime.
agents:
  auto:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-analytics-auto
    tenant: acme-bank
    archetypes: [analytics_insights]
    context_contract:
      consumes:
        - product_class: acme-bank.credit-exposure-summary
          schema_version: "1.0.0"
    perspective:
      role: treasury-analyst
      selection_params:
        desk: rates
    policy_regime:
      ref: "ccf-artifact://acme-bank/policy-bundle/treasury-auto@1.0.0"
    halflife_debt_profile:
      ref: "ccf-artifact://acme-bank/debt-profile/annual-credit-review@1.0.0"
    instruction_bindings: []
  gated:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-analytics-gated
    tenant: acme-bank
    archetypes: [analytics_insights]
    context_contract:
      consumes:
        - product_class: acme-bank.credit-exposure-summary
          schema_version: "1.0.0"
    perspective:
      role: treasury-analyst
      selection_params:
        desk: rates
    policy_regime:
      ref: "ccf-artifact://acme-bank/policy-bundle/treasury-gated@1.0.0"
    halflife_debt_profile:
      ref: "ccf-artifact://acme-bank/debt-profile/annual-credit-review@1.0.0"
    instruction_bindings: []
  ungoverned:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-analytics-ungoverned
    tenant: acme-bank
    archetypes: [analytics_insights]
    context_contract:
      consumes:
        - product_class: acme-bank.credit-exposure-summary
          schema_version: "1.0.0"
    perspective:
      role: treasury-analyst
      selection_params:
        desk: rates
    policy_regime:
      ref: "ccf-artifact://acme-bank/policy-bundle/treasury-ungoverned@1.0.0"
    halflife_debt_profile:
      ref: "ccf-artifact://acme-bank/debt-profile/annual-credit-review@1.0.0"
    instruction_bindings: []
  # A definition whose policy regime is never registered: tier 1 must refuse
  # rather than default (D-IMPL-38).
  unresolvable:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-analytics-unresolvable
    tenant: acme-bank
    archetypes: [analytics_insights]
    context_contract:
      consumes:
        - product_class: acme-bank.credit-exposure-summary
          schema_version: "1.0.0"
    perspective:
      role: treasury-analyst
      selection_params:
        desk: rates
    policy_regime:
      ref: "ccf-artifact://acme-bank/policy-bundle/never-registered@1.0.0"
    halflife_debt_profile:
      ref: "ccf-artifact://acme-bank/debt-profile/annual-credit-review@1.0.0"
    instruction_bindings: []

# Skill catalog entries whose requirements exceed the fixture regimes — the
# tier-1 excess material. Entries in their own right, same schema as
# covenant_metrics_tool.yaml.
skills:
  writeback:
    schema_version: "2.0.0"
    artifact_version: "1.0.0"
    name: covenant-writeback
    tenant: acme-bank
    skill_type: tool
    description: >-
      Write covenant assessment outcomes back to the bank's covenant system
      of record for a named counterparty.
    argument_schema:
      properties:
        entity_name:
          type: string
          description: The counterparty entity the writeback applies to.
      required: [entity_name]
    binding:
      command: covenant-writeback-cli
    requirements:
      required_scopes: [portfolio-read, covenant-write]
      required_context_products: [acme-bank.credit-exposure-summary]
  offcontract:
    schema_version: "2.0.0"
    artifact_version: "1.0.0"
    name: covenant-offcontract
    tenant: acme-bank
    skill_type: tool
    description: >-
      Compute covenant metrics against the bank's liquidity summary — a
      product outside the fixture agent's context contract, so the grant is
      refused at tier 1.
    argument_schema:
      properties:
        entity_name:
          type: string
          description: The counterparty entity to compute metrics for.
      required: [entity_name]
    binding:
      command: covenant-offcontract-cli
    requirements:
      required_scopes: [portfolio-read]
      required_context_products: [acme-bank.liquidity-summary]
  # Another tenant's entry — tenant-coherence refusal material (WR-02): a
  # grant naming it can never bind to an acme-bank agent.
  crosstenant:
    schema_version: "2.0.0"
    artifact_version: "1.0.0"
    name: covenant-metrics-foreign
    tenant: other-bank
    skill_type: tool
    description: >-
      Compute covenant compliance metrics for a named counterparty — offered
      by another tenant, so a grant naming it can never bind here (WR-02).
    argument_schema:
      properties:
        entity_name:
          type: string
          description: The counterparty entity to compute metrics for.
      required: [entity_name]
    binding:
      command: covenant-metrics-foreign-cli
    requirements:
      required_scopes: [portfolio-read]
      required_context_products: [acme-bank.credit-exposure-summary]
  # A second version of covenant-metrics for the same-name collision case
  # (WR-05): two effective grants binding one skill_name is a governance
  # defect the ledger must raise on, never a hash-lottery.
  metrics_upgrade:
    schema_version: "2.0.0"
    artifact_version: "1.1.0"
    name: covenant-metrics
    tenant: acme-bank
    skill_type: tool
    description: >-
      Compute covenant compliance metrics for a named counterparty — the v2
      CLI offering of covenant-metrics, for the same-name collision case.
    argument_schema:
      properties:
        entity_name:
          type: string
          description: The counterparty entity to compute covenant metrics for.
      required: [entity_name]
    binding:
      command: covenant-metrics-cli-v2
    requirements:
      required_scopes: [portfolio-read]
      required_context_products: [acme-bank.credit-exposure-summary]

# Entries deliberately NOT registered at world construction: the wedged-state
# regression (WR-04) requests against a missing entry first, registers the
# entry, then proves the same grant content hash is re-requestable.
late_skills:
  latecomer:
    schema_version: "2.0.0"
    artifact_version: "1.0.0"
    name: covenant-latecomer
    tenant: acme-bank
    skill_type: tool
    description: >-
      Compute covenant compliance metrics for a named counterparty —
      registered late, for the wedged-state regression (WR-04).
    argument_schema:
      properties:
        entity_name:
          type: string
          description: The counterparty entity to compute covenant metrics for.
      required: [entity_name]
    binding:
      command: covenant-latecomer-cli
    requirements:
      required_scopes: [portfolio-read]
      required_context_products: [acme-bank.credit-exposure-summary]

# Grant documents. The agent_definition_hash is derived identity (content
# hash of the parsed definition), computed by mechanism at request time —
# a hash is never a fixture value (D-IMPL-26).
grants:
  metrics_tool:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-covenant-metrics
    tenant: acme-bank
    skill_name: covenant-metrics
    skill_version: "1.0.0"
  metrics_local:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-covenant-metrics-local
    tenant: acme-bank
    skill_name: covenant-metrics-local
    # Re-pinned to 1.2.0 with the D-19 callable_ref key migration: a grant
    # names an exact entry version, so a content bump upstream is a re-pin
    # here, never a silent follow.
    skill_version: "1.2.0"
  writeback:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-covenant-writeback
    tenant: acme-bank
    skill_name: covenant-writeback
    skill_version: "1.0.0"
  offcontract:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-covenant-offcontract
    tenant: acme-bank
    skill_name: covenant-offcontract
    skill_version: "1.0.0"
  crosstenant:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-covenant-foreign
    tenant: other-bank
    skill_name: covenant-metrics-foreign
    skill_version: "1.0.0"
  metrics_upgrade:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-covenant-metrics-upgrade
    tenant: acme-bank
    skill_name: covenant-metrics
    skill_version: "1.1.0"
  latecomer:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    name: treasury-covenant-latecomer
    tenant: acme-bank
    skill_name: covenant-latecomer
    skill_version: "1.0.0"

# The tier-1 excess identifiers the refusal must name — fixture statements of
# expected outcomes, kept beside the entries that produce them.
expected_excess:
  scopes: [covenant-write]
  context_products: [acme-bank.liquidity-summary]

# ApprovalSink double values: the sink supplies an approver id string only —
# identity binding is D-IMPL-21 (I.4), documented on the sink (T-05-19).
approval:
  approver_id: risk-officer-7
  requesting_actor: platform-operator

# Injected clock instant for audit events (time is injected, never read).
clock:
  start: "2026-07-26T12:00:00+00:00"
