# How a row's fields are named once inside the fabric — this deployment's own
# vocabulary, and all that is left of it.
#
# NOT a Control Plane artifact and NOT registered. It exists so `projection.py`
# is an interpreter over documents rather than a module carrying values. The
# No-Hardcoding Rule (CLAUDE.md §6.4) scopes to `tests/` —
# `tools/lints/__main__.py::RULE_TREE_SCOPE` gives `no-hardcoding` the tree
# tuple `("src", "runtime", "examples", "tests")` — so a threshold or a field
# name spelled as a Python constant next door would be that rule firing here
# exactly as it would in `src/`.
#
# **This document used to carry five more sections** — the question vocabulary,
# the TTL pair, the artifact classes, the Control Plane keys and the storage
# paths. `D-IMPL-141`'s ruling moved every one of them into `binding.yaml` as
# data, which is what let `resolver.py` shrink to `projection.py`. What remains
# is the one thing the projection reads and the binding document has no business
# knowing: how this deployment's rows are keyed.

# These match `attribute_keys` in `ccf_config.yaml`'s `resolution:` section.
attributes:
  reference: widget_ref
  name: widget_name
  score: widget_score
