# THE CONSUMING DEPLOYMENT on the paved road — a fixture composite that
# REQUIRES `credit-risk.collateral-coverage` and reaches the canonical
# collateral producer in ANOTHER process through its registered door
# (`D-IMPL-340`, `D-IMPL-343`). Four declarations and one Python mapping.
semver: "1.0.0"
tenant_id: tenant-fixture
backend: sqlite
product_class:
  schema_name: fixture.replay-binding-product
  schema_version: "1.0.0"
  ttl_anchor: from_decision
  assembly_mode: algorithmic
  max_ttl_key: fixture/max-ttl
  required_operator_keys: [traversal.typed-neighborhood]
  requires:
    - {product_class: credit-risk.collateral-coverage, required: true, compatible_from: "1.0.0"}
  # `D-IMPL-378` P2 (c): opened with `tests/products/paved_fixture.py::plan_factory`, whose
  # projection never raises the withheld signal, so the composite states it never withholds.
  subject_withholding: never
operators:
  traversal.typed-neighborhood:
    seed_entity_classes: [account]
    relationship_types: [fixture-relates-to]
    depth_limit: 2
request_contract:
  class_id: fixture.request-contract
  role: load
  registration: typed
  schema_name: fixture.replay-binding-product
  schema_version: "1.0.0"
  arguments:
    properties:
      revenue_threshold: {type: number, description: "Fixture parameter; no default anywhere."}
    required: [revenue_threshold]
resolution:
  entity_rules:
    - {match_key: account_ref, entity_class: account, identity_keys: [account_ref], attribute_keys: [classification, label]}
half_life:
  account:
    half_life_seconds: 3600
    decay_driver: the fixture's nominal restatement cycle
    supersession_event: a newer observation restating the row
debt_profile:
  key: tenant-fixture/ccf.debt-profile/cp-06-canonical-paved-consumer
  risk_sensitivity: "1"
  forced_llm_threshold: "0.30"
  fail_closed_threshold: "0.70"
policy:
  class_id: fixture.policy-bundle
  role: register
  registration: typed
  key: tenant-fixture/policy-bundle/cp-06-canonical-paved-consumer
  permitted_classifications: [fixture-open]
  skill_governance: {grant_requires_approval: false, permitted_scopes: []}
default_perspective:
  principal_id: principal-fixture
  role: role-fixture
replay:
  record_class: ccf.replay-record
  query_pin_class: ccf.graph-query
  store_dirname: artifact-store
ttl:
  max_ttl_seconds: 3600
  product_ttl_seconds: 600
producers:
  collateral:
    server: canonical-collateral-producer
    producer_id: cp-06-canonical-collateral-and-setoff-coverage-egress
    producer_tenant: cp-06-canonical-demo
    endpoint_from_env: CCF_TEST_CP06C_PRODUCER_URL
    credential_from_env: CCF_TEST_CP06C_PRODUCER_TOKEN
    offers:
      - {product_class: credit-risk.collateral-coverage, versions_from: "1.0.0"}
skills:
  collateral-ask:
    schema_version: "1.0.0"
    artifact_version: "1.0.0"
    description: asks the registered canonical collateral producer a question
    produces: credit-risk.collateral-coverage
    requirements: {required_scopes: [], required_context_products: []}
agent:
  schema_version: "1.0.0"
  artifact_version: "1.0.0"
  name: cp-06-canonical-consumer
  archetypes: [context_assembly]

# THE ONE GRANT THIS CONSUMER'S AGENT NEEDS (added 2026-10-11, round 3;
# examples/AMENDMENTS-2026-10-11.md). Since D-IMPL-353 the paved road cannot
# grant a skill on its own authority, so this fixture's open refused
# `GrantNotInForce`. The deployment now DECLARES the grant (SDK round item 3,
# fragment for `grants:`); `open_product` requests it through the grant ledger
# at composition — the regime's tier-1 compatibility check against
# `skill_governance` above, the audit and grant-state records — and a skill in
# `skills:` that is not listed here is still refused `GrantNotInForce`.
grants: [collateral-ask]

# HOW FAR INTO THE PAST THIS CONSUMER ANSWERS FOR (`D-IMPL-358` ruling 11; added
# 2026-10-11, round 3). Every governed serve consults this declaration and an
# undeclared boundary refuses every question (`temporal-boundary-undeclared`).
# The hw1-companies-over-revenue values: a question asked more than an hour
# before the serve instant is refused (`asked-at-outside-temporal-bound`).
temporal_boundary:
  max_past_seconds: 3600
  permitted_clock_skew_seconds: 0
