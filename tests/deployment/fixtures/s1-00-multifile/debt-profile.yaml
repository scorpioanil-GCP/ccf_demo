# yaml-language-server: $schema=../../../../docs/schemas/ccf.debt-profile.json
# Where the D_c bands sit for this decision class, and how hard the freshness
# budget is squeezed.
#
# D_c = 1 − (F · C · S). Above 0.20 the answer is routed to Forced-LLM; above
# 0.60 it is Fail-Closed. With the seeded rows and a one-year λ_c the default
# run lands in Forced-LLM — the fabric telling you not to act on this
# algorithmically alone, which is precisely what a row count cannot tell you.
semver: "1.0.0"
risk_sensitivity: "1.0"
forced_llm_threshold: "0.20"
fail_closed_threshold: "0.60"
