# WHICH QUESTIONS this class answers. The threshold lives here and nowhere
# else — there is no default for it anywhere in this example.
#
# `revenue_threshold` is REQUIRED, because a threshold nobody supplied is not a
# question this class answers. A request omitting it is refused with
# `missing-required-parameter` before the graph is touched. D-IMPL-133 is what
# makes the honest shape available: both parameterised doors carry
# client-supplied parameters, so nothing here is bent around a door defect.
semver: "1.0.0"
class_id: hw1.request-contract
declaration:
  schema_name: hw1.companies-over-revenue
  schema_version: "1.0.0"
  arguments:
    properties:
      revenue_threshold:
        type: number
        description: Return companies whose revenue exceeds this amount.
    required: [revenue_threshold]
