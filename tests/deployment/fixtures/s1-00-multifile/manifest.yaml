# yaml-language-server: $schema=../../../../docs/schemas/ccf.deployment-manifest.json
# The one document naming what this deployment puts in force. Eight entries,
# and each is here because a refusal demanded it — see ../../MEASUREMENT.md.
#
# ONE OPERATOR CATEGORY IS DECLARED. Traversal, Policy and Similarity are
# deliberately absent (D-IMPL-132: "Operators help me assemble it but I should
# not be forced into a single format"). This question is about a SET, not a
# path, so there is no walk to seed; it admits one policy bundle by pin rather
# than by filtering a graph; and it matches no text. Gate 1 refuses an EMPTY
# operator set, so one is the floor — measured, not assumed.
#
# NO `projection-requirements.yaml`: design E2's divergence guard compares two
# independently authored operator sets, and this deployment authors one. An
# unused guard is not a missing one.
#
# `backends.yaml` is deliberately NOT listed. A connection value is deployment
# environment, not Control Plane state, and has no business in replay
# dimension 2 — so the backend is declared here as a KIND only.
semver: "1.0.0"

tenant_id: hw1-demo
backend: postgres

resolution_spec_key: resolution-spec
policy_bundle_key: policy-bundle

artifacts:
  - path: resolution-spec.yaml
    key: resolution-spec
    class_id: ccf.resolution-spec
    role: register
    registration: typed

  - path: policy-bundle.yaml
    key: policy-bundle
    class_id: hw1.policy-bundle
    role: register
    registration: typed

  - path: perspective.yaml
    key: perspective
    class_id: ccf.perspective
    role: register
    registration: typed

  - path: product-class.yaml
    key: product-class
    class_id: ccf.product-class
    role: register
    registration: typed

  - path: half-life-table.yaml
    key: half-life-table
    class_id: ccf.half-life-table
    role: register
    registration: typed

  - path: operator-parameters-temporal.yaml
    key: temporal
    class_id: ccf.operator-parameters.temporal
    role: register
    registration: typed

  - path: debt-profile.yaml
    key: debt-profile
    class_id: ccf.debt-profile
    role: register
    registration: typed

  - path: request-contract.yaml
    key: request-contract
    class_id: hw1.request-contract
    role: load
    registration: typed
