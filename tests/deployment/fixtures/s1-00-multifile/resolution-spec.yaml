# How a source row becomes an entity in the graph. One rule, because this
# example has one kind of thing in it.
#
# `last_updated` is NOT an attribute here: it arrives as the envelope's
# `observed_time` and becomes the claim's `observed_at`, which is what the
# half-life curve reads. That is why a column nobody projects still drives D_c.
semver: "1.0.0"
entity_rules:
  - match_key: company_ref
    entity_class: company
    identity_keys: [company_ref]
    attribute_keys: [company_name, company_revenue]
