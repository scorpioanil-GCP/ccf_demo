# Performance-battery task definition fixture (CLAUDE.md §6.4/§8.1;
# D-IMPL-28). Registered by the micro suite so the WorkflowFactory
# construction path can be benchmarked (D-23: "task factory construction").
# Three steps — one of each step kind — so the constructed handle exercises
# the full semantic-validation surface. Neutral perf vocabulary (D-09).

keys:
  task_definition: perf-tenant/tasks/panel-cycle
  referenced_agent_definition: perf-tenant/ccf.agent-definition/panel-insights

referenced_artifacts:
