  name: panel-cycle
  tenant: perf-tenant

  steps:
    - kind: skill
      name: sample-panel
      ref: "ccf-artifact://perf-tenant/skill/sample-panel@1.0.0"
    - kind: agent
      name: assess-panel
      ref: "ccf-artifact://perf-tenant/ccf.agent-definition/panel-insights@1.0.0"
    - kind: hitl-gate
      name: panel-review

  instruction_bindings:
