# perf/ is its own pytest rootdir (Phase 11 D-04): benchmarks run only via
# `make perf` / the opt-in perf workflow, never in the always-on suite.
#
# The default run already excludes this tree — pyproject.toml pins
# `[tool.pytest.ini_options] testpaths = ["tests"]` — this file makes the
# separation explicit and gives `pytest perf/` a stable rootdir of its own.
[pytest]
testpaths = suites
