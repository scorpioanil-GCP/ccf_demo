[project]
name = "ccf-dataprep"
version = "0.2.0"
description = "Source data supply chain for the CCF Context Product catalog — five partitioned datastores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.2.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pymongo>=4.17.0",
    "pypdf>=6.1.3",
    "python-dotenv>=1.2.3",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccf"]
