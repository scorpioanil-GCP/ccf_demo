name: release-stamp
on:
  push:
    tags: ["v*"]
# SEC-015 (D-IMPL-369): the token is read-only for every job. No job here
# needs a write grant; one that ever does names it on the job, never here.
permissions:
  contents: read

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0        # setuptools_scm and `git describe` need the tags
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "."
      - run: python tools/check_version_stamp.py
