# CCF SDK continuous integration — D-09 (GitHub Actions: lint job + test matrix,
# Postgres as a service container). Lints are blocking from the first fabric
# commit per D-07; they are never report-only.
#
# NOTE: the `python -m tools.lints` runner lands in plan 04-02. Until it does,
# the lint job on this branch fails by design — D-07 forbids making the step
# non-blocking to paper over the gap.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    name: lint (CINV-01..03) + strict types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      # The checkers are the enforcement mechanism for three named invariants,
      # so they are themselves tested in CI. `pytest tests` in the test job does
      # not cover them (testpaths is the shipped suite); run them here, before
      # the gate they implement.
      - name: Lint checker unit tests (CINV-01/02/03 + citations)
        run: pytest tools/lints/tests -q

      - name: CCF invariant lints (No-Hardcoding, harness imports, @algorithmic, citations)
        run: python -m tools.lints --all

      # No explicit paths: `[tool.mypy] files` is the single source of truth for what
      # is type-checked, and it now covers `src` *and* `runtime` (06-RESEARCH.md B2).
      # Passing `src` here would have quietly excluded every harness adapter, transport,
      # and MCP server this phase adds.
      - name: mypy --strict (src + runtime)
        run: mypy

  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccf
          POSTGRES_PASSWORD: ccf_test_password
          POSTGRES_DB: ccf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccf -d ccf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Plan 15.2-12: the neo4j differential leg's server. The image pins the
      # 5-community line — the exact pairing the driver pin was verified
      # against (research assumption A1: neo4j==6.2.0 <-> server 5.26.x over
      # Bolt); re-verify A1 before moving either side.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ccf_test_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ccf_test_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15
      # Plan 15.2-13: the mongo differential leg's server. The image pins the
      # 7 line — the exact pairing the driver pin was verified against
      # (pymongo==4.17.0 <-> server 7.0.x with a live round trip at plan
      # 15.2-13 execution); re-verify before moving either side. Deliberately
      # a plain standalone server rather than a replica set: a service block
      # cannot pass `--replSet`, which is exactly why `_MongoTxn` is the
      # buffered/batched implementation of the write seam (D-IMPL-88) instead
      # of one depending on multi-document transactions.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15

    env:
      # Consumed by the D-16 parametrized Protocol conformance suite.
      CCF_TEST_POSTGRES_DSN: postgresql://ccf:ccf_test_password@localhost:5432/ccf_test
      # In CI, "no Postgres available" is a failure, not a skip. Without this
      # the postgres leg below would go green by collecting real tests and then
      # skipping every one of them (D-10 requires the same suite on the real
      # substrate, not the option of it).
      CCF_REQUIRE_POSTGRES: "1"
      # Consumed by the neo4j leg of the substrate differential suite
      # (plan 15.2-12). Same rule as Postgres: in CI a skipped neo4j leg is a
      # failure, not a minimal environment.
      CCF_TEST_NEO4J_URI: neo4j://neo4j:ccf_test_password@localhost:7687
      CCF_REQUIRE_NEO4J: "1"
      # Consumed by the mongo leg of the substrate differential suite
      # (plan 15.2-13). Same rule as Postgres and Neo4j: in CI a skipped
      # mongo leg is a failure, not a minimal environment.
      CCF_TEST_MONGO_URI: mongodb://localhost:27017/ccf_test
      CCF_REQUIRE_MONGO: "1"
      # Same rule, applied to the three harness adapters (06-16). `[dev]`
      # composes `[harnesses]`, so all three SDKs are installed in CI and a
      # skipped harness leg means the extra broke, not that the environment is
      # minimal. Without this the conformance suite would collect all three
      # legs, skip every one, and report green over the *only* evidence there
      # is for the CLAUDE.md §7.3 portability claim.
      CCF_REQUIRE_HARNESSES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The neo4j and mongo extras join dev here because this job RUNS both
      # legs against the service containers above; the lint job stays dev-only
      # (the extras are absent there, closed by the pyproject mypy overrides —
      # the chromadb posture).
      - name: Install package with dev extras + the neo4j and mongo drivers
        run: python -m pip install -e ".[dev,neo4j,mongo]"

      - name: Quick suite (no external substrates)
        run: pytest tests -q -m "not postgres and not chroma and not neo4j and not mongo" -rs

      # The harness legs, asserted rather than assumed. `-rs` prints any skip;
      # `CCF_REQUIRE_HARNESSES` above turns one into a failure, so this step
      # cannot go green over a harness that did not run. Deliberately NOT
      # `continue-on-error`: per the I.1 D-07 precedent, a step made
      # non-blocking to hide a gap is worse than the gap.
      - name: Harness adapter conformance (all three legs must run)
        run: pytest tests/conformance -q -rs

      # The same twelve GraphStore conformance semantics the quick suite runs
      # on SQLite, run again on the service container through the `postgres`
      # param of the `graph_backend` fixture (D-11/D-16). `-rs` surfaces any
      # skip in the log; CCF_REQUIRE_POSTGRES above makes one fail the job.
      - name: Postgres leg (service container)
        run: pytest tests -q -m postgres -rs

      # The substrate differential suite against a real graph-native engine
      # (plan 15.2-12): Cypher traversal held byte-identical to the audited
      # fallback, `allowed_entities` shapes included. `-rs` surfaces any
      # skip; CCF_REQUIRE_NEO4J above turns one into a failure.
      - name: Neo4j leg (service container)
        run: pytest tests -q -m neo4j -rs

      # The substrate differential suite against a document store (plan
      # 15.2-13): the phase's hardest differential target, held byte-identical
      # to the audited fallback over the whole corpus, `allowed_entities`
      # shapes included. `-rs` surfaces any skip; CCF_REQUIRE_MONGO above
      # turns one into a failure.
      - name: MongoDB leg (service container)
        run: pytest tests -q -m mongo -rs

      # Coverage is informational only — D-17 sets no numeric gate.
      - name: Coverage (informational)
        run: pytest tests -q -m "not postgres and not chroma and not neo4j and not mongo" --cov=ccf --cov-report=term

  # The v0 examples suite is the adoption contract (CLAUDE.md §9): a broken
  # example is a broken build. Always-on per D-10 — the same `make examples`
  # a developer runs locally, command-for-command. Example 03 runs its
  # deterministic leg here; the live legs are opt-in in live-legs.yml (D-11).
  # Deliberately NOT `continue-on-error` — per the I.1 D-07 precedent, a step
  # made non-blocking to hide a gap is worse than the gap.
  examples:
    name: examples suite (00–07, reference backends)
    runs-on: ubuntu-latest
    # Subprocess-spawning examples (04 cross-process, 07 MCP child) must not
    # be able to hang the runner (review consensus concern 5).
    timeout-minutes: 20

    env:
      # A skipped harness leg in example 03's deterministic run is a failure,
      # not a minimal environment — same rule as the test job.
      CCF_REQUIRE_HARNESSES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      # The Makefile targets use .venv/bin/python; provide the venv the same
      # editable install the job already has, so CI and local runs execute the
      # identical `make examples` command string (D-10).
      - name: Provision .venv for the Makefile command surface
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Run all eight examples (make examples)
        run: make examples

  # The documentation site is built as an Actions artifact and never hosted
  # (D-IMPL-71) — the upload below is how adopters actually read it. The job is
  # always-on because D-IMPL-72 composes the docs gate into the same pipeline as
  # lint, test and examples, and the publish scan is part of that gate rather
  # than a follow-up step (D-02): `make docs-strict` runs the pre-build scan,
  # the strict build and the site scan as one blocking command, so there is no
  # path on which the build succeeds and the scan never runs.
  #
  # Deliberately NOT `continue-on-error` — per the I.1 D-07 precedent, a step
  # made non-blocking to hide a gap is worse than the gap. A softened docs job
  # would silently retire the never-publish guarantee this phase exists to
  # enforce.
  docs:
    name: docs gate (strict build + publish scan, D-IMPL-72)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      # The Makefile targets use .venv/bin/python; provide the venv the same
      # editable install the job already has, so CI and local runs execute the
      # identical `make docs-strict` command string (D-10).
      - name: Provision .venv for the Makefile command surface
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      # The docs checkers are the enforcement mechanism for the publish gate,
      # so they are themselves tested in CI. `pytest tests` in the test job does
      # not reach them (testpaths is the shipped suite and stops at `tests`);
      # run them here, before the gate they implement. Same precedent as the
      # lint job's checker unit tests.
      - name: Docs-gate checker unit tests (publish scan + docs gates)
        run: pytest tools/publish_scan_tests tools/docs_tests -q

      - name: Docs gate (make docs-strict)
        run: make docs-strict

      # D-05 default retention. The upload runs only after the gate passes: a
      # nonzero exit from the step above fails the job and nothing ships.
      - uses: actions/upload-artifact@v4
        with:
          name: ccf-docs-site
          path: site/
