# THE TWO LIVE HARNESS-PORTABILITY JOBS WERE REMOVED IN PHASE 23 and this file
# now carries the D-09 fluree upstream-drift detector alone. Each ran a `make`
# target that no longer exists: both were deleted with the tree they ran
# (D-04, D-IMPL-193, D-IMPL-195 ruling 1), because
# `archive/examples/03-harness-portability` is no longer the teaching path.
# Dave's reason for deleting rather than re-pointing is on the record —
# *"Re-pointing into archive keeps CI load on unsupported trees."* A deleted
# target with a live workflow still calling it is a broken workflow, not a
# retirement, so the jobs went with the targets.
#
# The file KEEPS its name and path. Five documents outside this phase's scope
# reference `.github/workflows/live-legs.yml` by path (README.md, the Makefile,
# docs/PHASE_I5_GATE.md, docs/09-ruling-batch-minicycle.md and the coupling
# report), and renaming it to match its remaining contents would trade one
# stale reference for five.
name: live-legs

on:
  workflow_dispatch:
  # THE WEEKLY `schedule:` CRON WAS REMOVED 2026-08-25 by Dave's ruling on
  # packet item #11 (`D-IMPL-200`, Phase 23.1). Verbatim: *"Nobody
  # commissioned it; it bills live services."* The block removed was
  # `schedule:` with `- cron: "0 7 * * 1"` (weekly, Mondays 07:00 UTC), added
  # by plan 15.3-05 under `D-09`.
  #
  # WHAT THE REMOVAL DOES NOT CHANGE. The `D-09` upstream-drift detector below
  # still exists and still runs — on `workflow_dispatch` only, which is the
  # trigger surface this workflow had before 15.3-05 widened it. `D-09`'s
  # reasoning survives as the reason to DISPATCH it (12 v4 releases Apr–Jul
  # 2026, and 4.1.3 shipped a documented breaking change INSIDE a minor, so
  # ci.yml pins `4.1.4` exactly while this pins the floating `4.1`); what does
  # not survive is the unasked-for cadence that billed for it weekly.
  #
  # NO JOB REFERENCED THE REMOVED TRIGGER. `fluree-drift` is the only job here
  # and deliberately carries no `if:` guard — it answered both triggers and now
  # answers the one that remains. The two live harness-portability legs that
  # DID carry `if: github.event_name == 'workflow_dispatch'` were deleted in
  # Phase 23 (see the file header). Threat `T-15.3-19` accepted the weekly
  # Actions-minute cost on the record; with the cadence gone, that accepted
  # cost is no longer being incurred.

# SEC-015 (D-IMPL-369): the token is read-only for every job. No job here
# needs a write grant; one that ever does names it on the job, never here.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # The D-09 upstream-drift detector (plan 15.3-05).
  #
  # This runs the SAME fluree differential leg that ci.yml runs, against a
  # DIFFERENT image tag: ci.yml pins `4.1.4` exactly, this pins the floating
  # `4.1`. The pair is the whole mechanism — the exact pin is what makes the
  # phase's conformance evidence reproducible, and the floating tag is what
  # notices when upstream moves underneath it. Swapping them would defeat
  # both, so `4.1.4` must never appear in this file.
  #
  # This job is allowed to FAIL LOUDLY, and no non-blocking escape hatch is
  # configured for it anywhere in this file. Phase 4's D-07 forbids that dodge,
  # and a drift detector that cannot go red detects nothing.
  #
  # TWO HONEST LIMITATIONS, recorded as facts rather than as reconsiderations
  # of D-09:
  #
  #   1. `4.1` resolves to the same image as the exact pin TODAY (4.1.4 is the
  #      current release as of 2026-08-08). The job is therefore a NO-OP until
  #      4.1.5 ships, and a first green run proves that the job works — not
  #      that no drift exists. Read it that way until a 4.1.x lands.
  #   2. `4.1` tracks the PATCH stream only. A `4.2.0` would pass here
  #      unnoticed; the `4` tag would have caught it. D-09 says `4.1`, so
  #      `4.1` is implemented — and the gap is made visible rather than
  #      assumed away.
  fluree-drift:
    name: fluree upstream-drift detector (floating 4.1 — D-09)
    runs-on: ubuntu-24.04
    # Generous vs. the leg's real cost (37 tests, seconds): the budget is for
    # the image pull on a cold runner, not for the tests.
    timeout-minutes: 20

    services:
      fluree:
        image: fluree/server:4.1
        ports:
          - 8090:8090
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:8090/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s

    env:
      # Identical to ci.yml. A skipped leg here is a failure, not a minimal
      # environment — a drift job that silently skips is the same nothing as
      # one that cannot go red.
      CCF_TEST_FLUREE_URL: http://localhost:8090
      CCF_REQUIRE_FLUREE: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # The same two lines as ci.yml's install step (SEC-028, D-IMPL-369), and
      # deliberately without a fluree extra: httpx is a core pin, so this
      # substrate needs no packaging accommodation at all (SUBQ-14 evidence,
      # visible here as an absence).
      - name: Install the locked dependency set, then the package
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Fluree leg against the floating 4.1 tag
        run: pytest tests -q -m fluree -rs
