version: 1
purpose: "Machine-readable Phase 1C.2 lineage for the approved CP-00 through CP-12 ladder."
release_authority:
  ccf_code:
    repository: drcastillo/ccf_code
    branch: main
    commit: 1a04e565504f712350b51777cfe398be46d5e157
    latest_approved_rung: cp-12
  rule: "Specification lifecycle/Gate wording is historical authoring metadata; current release status comes from the approved SDK baseline and gate history."
