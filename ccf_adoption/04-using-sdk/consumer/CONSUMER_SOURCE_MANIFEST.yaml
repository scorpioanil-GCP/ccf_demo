    teaches:
      - one product class
      - one question
      - governed refusal branch
      - debt
      - content address
      - replay reference
      - expiry
      - binding-independent caller logic
  mcp_harness_neutral:
    path: examples/hw1-harness-clients
    reader_files:
      - examples/hw1-harness-clients/client_adk.py
      - examples/hw1-harness-clients/client_anthropic.py
      - examples/hw1-harness-clients/client_langgraph.py
    teaches:
      - same product
      - same MCP door
      - harness as variable
      - no ccf import in reader-visible harness clients
      - MCP request wire shape is a documentation obligation

consumer_rules:
  - A governed refusal is a Result value, not a transport exception.
  - Producer-side deployment, manifest, graph, Control Plane, and assembly types stay outside the beginner consumer path.
  - Binding resolution is explicit binding, then CCF_BINDING, then BindingError.
  - Transport choice is operational; product question is application logic.
  - Served-only fields are guarded on refused results.
  - replay_ref may be readable on either served or refused outcomes when emitted by the producer.
  - Current shipped adapters resolve as_of=None client-side; served lineage records the graph snapshot actually used.
  - MCP-capable harnesses can consume through the door without importing CCF in the harness-side client program.

