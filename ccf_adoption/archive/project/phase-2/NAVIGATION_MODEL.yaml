publication_rules:
  - Consumer paths do not require assembler internals.
  - Assembler paths begin with the business decision and specification, not code.
  - Data-estate setup is visible before any tutorial that assumes loaded data.
  - Financial Services pages open with the business problem and decision.
  - Controls and governance are first-class personas and page content.
  - Tutorials link to reference rather than duplicating API definitions.
  - Financial Services examples link to small SDK lessons rather than teaching primitives from scratch.
  - Reference material is pinned to an approved SDK evidence baseline.
  - Superseded examples are not normal navigation targets.
  - Security assurance is distinct from CP-ladder control evidence.
