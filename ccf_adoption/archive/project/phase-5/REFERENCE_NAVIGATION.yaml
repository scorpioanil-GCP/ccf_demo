publication_rule:
  - Consumption comes before production.
  - Production examples use completed specs; learners do not recreate them.
  - Decision Replay follows CP-24 as a capability path, not additional CP rungs.
  - New-product spec authoring is taught only in Create Your Own.
  - Exact API material is reference, not the learning-path front door.
  - Qualified current code/tests/examples outrank stale explanatory prose.
