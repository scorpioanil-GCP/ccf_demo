    - examples/dr-02-package-a-context-product
  canonical_preference:
    cp-03: examples/cp-03-canonical-obligor-financial-spread
    cp-04: examples/cp-04-canonical-corporate-family-tree
    cp-06: examples/cp-06-canonical-collateral-and-setoff-coverage
    cp-13: examples/cp-13-canonical-covenant-cross-reference

replay:
  status: qualified_complete
  environment: ccf.replay.environment.RecordedEnvironment
  served_entrypoint: ccf.replay.engine.replay
  refusal_entrypoint: ccf.replay.engine.replay_refusal
  mode_2_example: examples/dr-02-package-a-context-product

specification_sources:
  standard: public/reference/specifications/Context_Product_Specification_Standard_v0-3.md
  generation_recipe: public/reference/specifications/spec_generation.md
  delivery_recipe: public/reference/specifications/example_delivery.md
