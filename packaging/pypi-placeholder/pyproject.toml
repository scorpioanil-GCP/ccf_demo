# Name-reservation placeholder: no packages, no modules, no dependencies, no
# entry points, and no Python 3 installer can select it (requires-python).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf-sdk"
version = "0.0.0"
description = "Reserved name for the Cognitive Context Fabric SDK. This package contains no code."
readme = "README.md"
requires-python = "<3"
dependencies = []

[tool.setuptools]
packages = []
py-modules = []
include-package-data = false
