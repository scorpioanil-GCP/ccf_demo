# at the demonstration instant (examples/cp-06-canonical-collateral-and-setoff-coverage/run.py defaults).
tenant: cp-06-canonical-demo
product_class: credit-risk.collateral-coverage
version: "1.0.0"
subject: FAC-5B8418
intent: lgd-assessment
freshness: as-filed
asked_at: "2026-09-07T12:00:00+00:00"
parameters:
  facility_id: FAC-5B8418
  borrower_scope: [2549001IGRCG4F0RLD36]
# A tenant this instance does not serve: the call must be refused.
foreign_tenant: another-bank-tenant

# SEC-020 Parts 1-3 (Dave, 2026-10-16 21:32 GO). The existence probe: an existing facility asked under a borrower
# that is not its own, and an id verify.py ASSUMES is not a facility (it cannot prove an absence; it says so).
# After the fix both must get one answer, byte for byte, apart from the replay digest and the echoed id.
existence_probe:
  outside_scope:
    facility_id: FAC-5B8418                    # the served question's own facility (it exists: that answer serves)
    borrower_scope: [529900E95812SYWMCE44]     # another borrower's identifier
  unknown_facility: FAC-01A702                 # same length as the facility above
  control_unknown_facility: FAC-0D0E2D         # the timing control's second unknown id

# The timing rule, FIXED BEFORE the remedy was run (SEC-020-PARTS-1-3-BRIEF.md §4). `verify.py --timing` only.
# Each pair: d = (existing arm) - (unknown arm). PASS needs both: P(d>0) + 0.5 P(d=0) inside `band`, and
# |median d| <= `median_bound_ms`. A run is valid only if the A/A control (two unknown ids) passes the same rule in
# the same session with no failures; two INVALID runs are reported as "don't know", never as a pass.
timing:
  pairs: 100
  warmup_pairs: 2
  band: [0.35, 0.65]
  median_bound_ms: 15
  control_iqr_ceiling_ms: 58                   # above this, the calibration figures in the brief do not apply
  bootstrap: {resamples: 2000, seed: 20261016}
  population_scope: 2549001IGRCG4F0RLD36       # `--population`: every other facility is outside this scope
