# yaml-language-server: $schema=../../../../docs/schemas/ccf.projection-requirements.json
# The operator set THIS PROJECTION requires (design E2; D-IMPL-86, Dave,
# 2026-08-05, and its correction of the same date; field-service domain,
# D-IMPL-52).
#
# **Two documents, one per side, and that is the whole point.** This one is the
# PROJECTION's own declaration: `run.py` builds its `FieldServicePlan` from the
# keys below, so `plan.required_operators()` traces here and nowhere else.
# `product-class.yaml`'s `required_operator_keys` is a different statement
# about a different thing — the PRODUCT's claim, the value that fills
# `lineage.operators_invoked` in the Context Product Contract that is served.
#
# **What holds the two together.** `run.py` calls
# `ccf.deployment.refuse_operator_set_divergence(declared=…, plan=…)` in the
# statement between constructing the plan and calling
# `ProjectionEngine.execute`. If the two documents disagree on so much as one
# key, that call raises and no product is assembled. It REFUSES and never
# repairs: only the author of these two documents knows which of them they
# meant, and an SDK that silently preferred one would leave your declared
# operator set depending on which document it happened to trust.
#
# **Why this is a second document rather than a second field.** With one
# authored operator set the two sides of Gate 2 (lineage strict equality,
# INV-CH7-47) are not merely equal in practice — they are one value arriving by
# two paths, so nothing you could author would make them differ and the gate
# could not fail. Splitting the statement in two is what makes drift REACHABLE
# by editing an artifact; the binder is what makes it FATAL. The corollary is a
# rule for you rather than for the SDK: author these keys, do not copy them out
# of `product-class.yaml`. A deployment that reads one document into the other
# hands the binder the same value twice and is back where this started.
#
# Order is not significant on either side. The engine imposes the dependency
# order (INV-CH7-28), and the binder compares the two sets as sets.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `plan_id` and the operator key names are [ADAPT]; the keys
# `semver`, `plan_id` and `required_operator_keys` are [MECHANISM].

semver: "1.0.0"

# The projection these requirements govern — the identity the served product
# carries as `plan_id` and replay dimension 5 records. Authored HERE and only
# here: it used to sit in `product-governance.yaml` as well, and a value with
# two authored homes is a value that can drift between them.
plan_id: cascadia-fieldworks.work-order-context.plan

required_operator_keys:
  - traversal.typed-neighborhood
  - temporal.as-of-boundary
  - policy.principal-subgraph
  - similarity.corpus-select
