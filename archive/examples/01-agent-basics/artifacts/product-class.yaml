# yaml-language-server: $schema=../../../../docs/schemas/ccf.product-class.json
# The product class this fabric serves (whitepaper §7.6; D-IMPL-31 for the TTL
# anchor, INV-CH7-55 for the assembly mode, INV-CH7-49 for the per-class schema
# lane; field-service domain, D-IMPL-52).
#
# This is the SAME class the agent definition names in its axis-2 context
# contract, which is what makes the agent's consumption of the served product a
# contract admission rather than a coincidence.
#
# `required_operator_keys` is the AUTHORED declared side of the lineage
# strict-equality gate (Gate 2, INV-CH7-47) — the Control Plane CLAIM that
# fills `lineage.operators_invoked`. It is NOT the set the projection reads:
# that is the separate `projection-requirements.yaml`, and
# `refuse_operator_set_divergence` compares the two and refuses a disagreement
# before the engine runs. THAT is where drift an author could introduce fails.
# Gate 2 itself verifies ASSEMBLY-PATH INTEGRITY: the engine transcribes the
# plan faithfully rather than witnessing it independently — it builds its
# invoked set and its steps in one loop over the same operator plan — so it
# cannot catch a misdeclaration (D-IMPL-86). A projection that returned the
# operator registry's own keys would collapse the plan into the engine's own
# configuration. At least one key is required, on the whitepaper's own
# posture: the empty-operator guard treats a
# resolved set of zero as a misconfiguration rather than a trivial success.
#
# `max_ttl_version` is deliberately ABSENT. That pin is minted by *registering*
# the MaxTTL value and is a content hash of what was registered, so an artifact
# declaring it would be authoring a hash of something it does not contain.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the schema name, its lane, the MAX_TTL key and the operator key
# names are [ADAPT]; the keys `schema_name`, `schema_version`, `ttl_anchor`,
# `assembly_mode`, `max_ttl_key` and `required_operator_keys`, and the
# `ttl_anchor`/`assembly_mode` enum values, are [MECHANISM].

semver: "1.0.0"

schema_name: cascadia-fieldworks.work-order-context
schema_version: "1.0.0"
ttl_anchor: from_decision
assembly_mode: algorithmic

# The Control Plane key this class's MAX_TTL ceiling is registered under. The
# key is authored; the version pinning it is not.
max_ttl_key: cascadia-fieldworks/product/work-order-context/max-ttl

required_operator_keys:
  - traversal.typed-neighborhood
  - temporal.as-of-boundary
  - policy.principal-subgraph
  - similarity.corpus-select
