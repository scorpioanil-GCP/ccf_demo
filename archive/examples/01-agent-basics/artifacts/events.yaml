# yaml-language-server: $schema=../../../../docs/schemas/ccf.signal-batch.json
# Agent-basics event stream — L1 signal envelopes (field-service domain,
# D-IMPL-52). A handful of events, but not a flat happy path:
#
#   * fs-201 asserts the SAME technician as fs-200 from a DIFFERENT source
#     with identical attributes -> one claim whose lineage accumulates by
#     set-union (INV-CH7-17), not a second node.
#   * fs-202 introduces a second, permitted work order the similarity operator
#     must rank out — so "similarity did something" is distinguishable from an
#     identity function.
#   * fs-203 carries a RESTRICTED site (a defence-sector depot), which the
#     policy operator must substitute out along with the `located_at` edge that
#     would otherwise leak its existence by absence.
#
# The document adopts the SDK's OWN envelope vocabulary — `source: {system_id}`,
# `raw_payload:` — rather than a flat shape a loader would have to translate. A
# translation removed is one that cannot drift.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: everything under `raw_payload:` and every source system id is
# [ADAPT]; the envelope keys (`envelope_id`, `tenant_id`, `source`,
# `system_id`, `ingestion_timestamp`, `observed_time`, `raw_payload`) are
# [MECHANISM].

semver: "1.0.0"

tenant_id: cascadia-fieldworks

envelopes:
  - envelope_id: fs-200
    tenant_id: cascadia-fieldworks
    source:
      system_id: dispatch-desk
    ingestion_timestamp: 2026-05-11T07:00:00Z
    observed_time: 2026-05-11T06:50:00Z
    raw_payload:
      technician_ref: "CFW-TECH-0417"
      technician_name: "R. Okafor"
      trade: "refrigeration"
      technician_classification: "internal"
      work_order_ref: "WO-88213"
      priority: "urgent"
      work_order_summary: "walk-in cooler compressor fault urgent repair"
      work_order_classification: "internal"

  - envelope_id: fs-201
    tenant_id: cascadia-fieldworks
    source:
      system_id: workforce-roster
    ingestion_timestamp: 2026-05-11T07:05:00Z
    observed_time: 2026-05-11T06:50:00Z
    raw_payload:
      technician_ref: "CFW-TECH-0417"
      technician_name: "R. Okafor"
      trade: "refrigeration"
      technician_classification: "internal"

  - envelope_id: fs-202
    tenant_id: cascadia-fieldworks
    source:
      system_id: dispatch-desk
    ingestion_timestamp: 2026-05-11T07:10:00Z
    observed_time: 2026-05-11T07:02:00Z
    raw_payload:
      technician_ref: "CFW-TECH-0417"
      technician_name: "R. Okafor"
