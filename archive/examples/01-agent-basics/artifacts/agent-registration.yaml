# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# Where this deployment registers its two author-versioned artifacts
# (field-service domain, D-IMPL-52).
#
# `agent-definition.yaml` and `prompt-artifact.yaml` are absent from the
# manifest on purpose. Both carry D-IMPL-28 two-field versioning and must
# register through `ControlPlaneRegistry.register_versioned`, which holds the
# author's `artifact_version` claim against content identity (the D-05 bump
# check); `load_and_boot` registers through `register_typed`, which does not.
# Routing them through the manifest would silently drop that check, so `run.py`
# registers them itself — and reads the keys from here rather than carrying
# them as literals (§6.4).
#
# The axis-4 and axis-5 keys below are also the manifest keys those documents
# are registered under, which is how `run.py` and the test module reach the
# agent's own regime and profile without naming a long string in code.
#
# **`role: load` in the manifest.** A pointer to where something will be
# registered is not itself a permission; the registration is.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every key path is [ADAPT]; the keys `semver`,
# `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: cascadia-fieldworks.agent-registration

declaration:
  agent_definition_key: cascadia-fieldworks/agents/response-time-analytics
  prompt_artifact_key: cascadia-fieldworks/prompt/work-order-briefing
  policy_regime_key: cascadia-fieldworks/policy-bundle/field-operations
  halflife_debt_profile_key: cascadia-fieldworks/debt-profile/dispatch-window-review
