# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# Where the documents `run.py` registers itself file in the Control Plane
# (energy/grid-ops domain, D-IMPL-52).
#
# Seven documents in this directory are registered by the driver rather than by
# the manifest — `manifest.yaml` enumerates the same seven and says why for
# each. Five are AUTHOR-VERSIONED SDK classes, which a manifest COULD name as
# `registration: versioned` and which this example keeps at the call site so the
# D-05 bump check is visible there; two more are SDK classes a manifest cannot
# address at all (D-IMPL-84 refuses an entry naming either). Every one of the
# seven has a document root that must BE the artifact, so that each can carry an
# honest `$schema` header and be validated against its own contract — which
# leaves nowhere in those files for the Control Plane key they register under.
# A key is where a document is FILED, not part of what it says. This document is
# that filing information, and nothing else.
#
# It is `role: load`: which key an artifact files under is wiring the driver
# reads, and putting it in force would content-hash the deployment's filing
# scheme into replay dimension 2 alongside the artifacts it files.
#
# The skill catalog entry's key is deliberately ABSENT: `SkillCatalog` derives
# it from the entry's own tenant and name, so authoring one here would be a
# second, drifting statement of a value mechanism already owns.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: boreal-grid.agent-registration

declaration:
  agent_definition_key: boreal-grid/agents/grid-load-analytics
  prompt_artifact_key: boreal-grid/prompt/load-shed-briefing
  # The key the workflow definition's `task_definition_ref` resolves against.
  task_definition_key: boreal-grid/ccf.task-definition/load-shed-authorization
  workflow_definition_key: boreal-grid/workflows/load-shed-authorization
  hitl_policy_key: boreal-grid/hitl/load-shed-hitl-policy
  scope_mapping_key: boreal-grid/scope-mapping
