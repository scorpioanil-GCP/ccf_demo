# The feeder-load-metrics skill's catalog entry (CLAUDE.md §6.2 channel 2;
# D-IMPL-12/29). Energy/grid-ops domain.
#
# One catalog entry, inside the agent's governance envelope:
# `agent-policy-regime.yaml` permits the scope `telemetry-read`, which is what
# admits this skill's grant through the tier-1 compatibility check. The grant
# that binds it is completed in `skill-dispatch.yaml`, and the resulting
# grant-set hash is what replay dimension 4 carries — so the decision replays
# against the skills the agent actually had.
#
# Author-versioned, and kept at the call site rather than in the manifest: a
# manifest may name it as `registration: versioned`, and declaring `typed` for
# it is refused at preflight (D-IMPL-85) — see `agent-definition.yaml`'s header
# for the D-05 reasoning. `SkillCatalog.register` is the call, and it takes the
# versioned path unconditionally.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the name, tenant, description, every argument name and the
# requirement values are [ADAPT]; the keys `schema_version`,
# `artifact_version`, `name`, `tenant`, `skill_type`, `description`,
# `argument_schema`, `binding` and `requirements`, and the `skill_type` enum
# value, are [MECHANISM].

schema_version: "2.0.0"
artifact_version: "1.0.0"
name: feeder-load-metrics
tenant: boreal-grid
skill_type: local_callable
description: >-
  Compute sustained-load metrics for a named feeder from the served
  feeder-load context — load percent, overload duration band, and
  shed-candidacy flag.
argument_schema:
  properties:
    feeder_ref:
      type: string
      description: The feeder to compute sustained-load metrics for.
  required: [feeder_ref]
binding:
  callable_ref: feeder-load-metrics
requirements:
  required_scopes: [telemetry-read]
  required_context_products: [boreal-grid.feeder-load-context]
