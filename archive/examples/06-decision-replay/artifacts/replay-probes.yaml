# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# The two negative probes this example runs, and the artifact-class names the
# forensic replay resolves against (CLAUDE.md §7.4; D-IMPL-26/38;
# energy/grid-ops domain, D-IMPL-52).
#
# A replay demonstration that only shows the happy path shows nothing: an engine
# that resolved "latest" and reproduced *something* would pass it. These values
# are what make the two refusals executable rather than asserted in prose.
#
# `role: load`. A probe is not a permission — it is what this run does to
# demonstrate that the audit record refuses. Putting it in force would say the
# fabric was permitted to resolve an unregistered version, which is the opposite
# of what the probe proves.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: boreal-grid.replay-probes

declaration:
  # Where the agent definition and the completed grant are filed in the
  # ArtifactStore, so the replay leg can resolve them back content-addressed.
  agent_definition_class: ccf.agent-definition
  skill_grant_class: ccf.skill-grant
  skill_grant_name: load-analytics-telemetry

  # The name the version-mutated COPY of the record is stored under — never the
  # canonical record's name. Mutating the canonical record would destroy the
  # thing the example exists to reproduce.
  mutated_record_name: mutated-copy

  # A version string that was never registered. Substituting it into a COPY of
  # the record must make reproduction refuse, which is what proves the audit
  # record is version-sensitive rather than merely descriptive.
  unregistered_policy_version: "9.9.9"
