# yaml-language-server: $schema=../../../../docs/schemas/ccf.resolution-spec.json
# Decision-replay entity-resolution spec — the deployment's declared vocabulary
# (energy/grid-operations domain, D-IMPL-52). Everything here is a *value*:
# entity classes, relationship types, attribute names. None of it exists in
# `/src`, and none of it exists in `run.py` (CLAUDE.md §6.4).
#
# This document is closed-world over resolution rules only (D-03). The two
# attribute maps that used to sit beside them in `ontology.yaml` now live with
# the operator whose construction reads them —
# `classification_attribute_by_class` in `operator-parameters-policy.yaml`,
# `similarity_corpus_attribute_by_class` in the similarity one — because one
# artifact serves one consumer. `tenant_id` moved onto the manifest, which is
# where this deployment's own identity already is.
#
# Substations, feeders, and the edges between them: the operational state a
# load-shed authorization is decided against.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, match key, attribute name and
# relationship type is [ADAPT]; the keys `semver`, `entity_rules`, `match_key`,
# `entity_class`, `identity_keys`, `attribute_keys`, `relationship_rules`,
# `relationship_type`, `subject_entity_class` and `object_entity_class` are
# [MECHANISM].

semver: "1.0.0"

entity_rules:
  - match_key: substation_ref
    entity_class: substation
    identity_keys: [substation_ref]
    attribute_keys:
      - substation_name
      - region
      - substation_classification

  - match_key: feeder_ref
    entity_class: feeder
    identity_keys: [feeder_ref]
    attribute_keys:
      - load_percent
      - load_summary
      - feeder_classification

relationship_rules:
  - relationship_type: fed_from
    subject_entity_class: feeder
    object_entity_class: substation
