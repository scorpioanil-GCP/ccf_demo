# yaml-language-server: $schema=../../../../docs/schemas/ccf.workflow-definition.json
# Decision-replay workflow definition (CLAUDE.md §8.1; D-IMPL-28). Wraps the
# pinned load-shed task and adds ONLY routing: the operator's decision at the
# gate authorizes or withholds the shed. Every routing value lives here, never
# in code (§6.4; CINV-01).
#
# The engine's step sequence for this workflow lands verbatim in replay
# dimension 5, so re-authoring the transitions moves the recorded trace.
#
# Author-versioned, and kept at the call site rather than in the manifest: a
# manifest may name it as `registration: versioned`, and declaring `typed` for
# it is refused at preflight (D-IMPL-85) — see `agent-definition.yaml`'s header
# for the D-05 reasoning. The document root IS the artifact; the Control Plane
# key it registers under lives in `agent-registration.yaml`.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the name, tenant, state names, terminals and refs are [ADAPT];
# the keys `schema_version`, `artifact_version`, `name`, `tenant`,
# `task_definition_ref`, `start`, `transitions`, `source`, `target`,
# `terminal_states` and `gate_policies` are [MECHANISM].

schema_version: "1.0.0"
artifact_version: "1.0.0"
name: load-shed-authorization-workflow
tenant: boreal-grid

task_definition_ref: "ccf-artifact://boreal-grid/ccf.task-definition/load-shed-authorization@1.0.0"

start: collect-telemetry
transitions:
  - source: collect-telemetry
    target: load-shed-authorization
  - source: load-shed-authorization
    target: authorized
  - source: load-shed-authorization
    target: withheld
terminal_states: [authorized, withheld]

gate_policies:
  load-shed-authorization: "ccf-artifact://boreal-grid/approval-policy/shift-supervisor@1.0.0"
