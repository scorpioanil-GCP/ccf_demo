# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# Decision-replay token table (D-26; D-14; T-08-20 accepted).
#
# SYNTHETIC tokens for a runnable demonstration — illustrative values, never
# production credentials. One ACTIVE entry (client_id equals the approver
# subject in `hitl-drive.yaml`), one EXPIRED entry, and one ACTIVE entry whose
# scope the scope-mapping artifact does not map (the 403 tenant-unauthorized
# path, Phase 10 D-16): token lifecycle and authorization reach are artifact
# data, never a hardcoded bad-token string.
#
# `role: load`. A token table is not a statement of what the fabric may do — the
# scope mapping is, and that one is registered. Registering the tokens would
# additionally content-hash credential material into the audit plane.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: boreal-grid.token-table

declaration:
  tokens:
    - label: approver
      token: bg-shift-token-2026
      client_id: shift-supervisor-8
      scopes: [hitl]
      status: active
    - label: expired
      token: bg-shift-token-2024
      client_id: shift-supervisor-8
      scopes: [hitl]
      status: expired
    - label: unauthorized
      token: bg-metering-token-2026
      client_id: metering-analyst-3
      scopes: [metering]
      status: active
