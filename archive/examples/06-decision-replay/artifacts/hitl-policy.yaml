# yaml-language-server: $schema=../../../../docs/schemas/ccf.hitl-policy.json
# The D-16 HITL policy in force at the load-shed gate (CLAUDE.md §8.2;
# D-IMPL-20/21; energy/grid-ops domain, D-IMPL-52).
#
# `signed_binding_required: true` is what makes the approval AUTH-BOUND: the
# transport refuses a submission that carries no signed principal binding, and
# the binding is what the replay leg verifies from the record alone. This is the
# whole point of the example's hardened-HITL dimension — a human action that
# cannot be reproduced from the record is not an audit record.
#
# Registered by `run.py` rather than by the manifest, because `ccf.hitl-policy`
# is in neither of the SDK's manifest-addressable mappings and the `ccf.` prefix
# is reserved (D-IMPL-84) — a manifest entry naming it is REFUSED at load. What
# the refusal protects is real: the transport reads a real `HitlPolicy` back off
# the Control Plane by key, and the open `DeclaredArtifact` envelope this used
# to resolve to would have given it the wrong type without saying so.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the value is [ADAPT]; the keys `semver` and
# `signed_binding_required` are [MECHANISM].

semver: "1.0.0"
signed_binding_required: true
