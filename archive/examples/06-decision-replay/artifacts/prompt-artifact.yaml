# yaml-language-server: $schema=../../../../docs/schemas/ccf.prompt-artifact.json
# Decision-replay prompt artifact (CLAUDE.md §6.2 axis 6; §6.4). Template text
# and declared parameters live here, never in code — a prompt string literal in
# `run.py` would be the No-Hardcoding Rule firing, and CINV-01 lints
# `/examples` for exactly that.
#
# The replay leg resolves this artifact content-addressed out of the store and
# checks it against the version the agent definition's instruction binding
# pins — so "the prompt in force at decision time" is answerable from the record
# alone.
#
# Like `agent-definition.yaml`, this class is author-versioned and therefore
# registers through `register_versioned` and its D-05 bump check, which
# `register_typed` does not run — see that file's header for the reasoning, and
# `manifest.yaml`'s for why the driver keeps the call at the call site. The
# document root IS the artifact; the Control Plane key it registers under lives
# in `agent-registration.yaml`.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the name, tenant, parameter names and the template text are
# [ADAPT]; the keys `schema_version`, `artifact_version`, `name`, `tenant`,
# `declared_parameters` and `template` are [MECHANISM].

schema_version: "1.0.0"
artifact_version: "1.0.0"
name: load-shed-briefing
tenant: boreal-grid
declared_parameters: [feeder_ref, as_of]
template: |
  Brief the on-shift grid operator on feeder {{ feeder_ref }} as of
  {{ as_of }}: sustained load level, shed candidacy, and which substation
  absorbs the transferred load if the shed is authorized.
