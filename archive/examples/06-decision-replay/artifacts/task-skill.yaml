# The telemetry-collection skill the task definition's first step pins by
# versioned-URI ref (CLAUDE.md §8.1; energy/grid-ops domain, D-IMPL-52).
#
# `register`, because what capability a workflow step is permitted to invoke is
# a standing statement of what the fabric may do. The manifest registers it
# under the key the task definition's ref names.
#
# Its shape is the deployment's, not the SDK's — a workflow step ref resolves to
# whatever the deployment filed there — so it takes the open envelope.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: skill

declaration:
  capability: collect-feeder-telemetry
  source: scada-historian
