# yaml-language-server: $schema=../../../docs/schemas/ccf.scope-mapping.json
# Decision-replay scope mapping (HARD-04; D-IMPL-68; Phase 10 D-16).
#
# The deployment's authorization statement: which token scopes reach which
# tenants and which door-declared actions. Every value here — scope strings,
# tenant patterns, action identifiers — is deployment data (CINV-01; CLAUDE.md
# §6.4); the SDK ships the grammar interpreter only.
#
# The `hitl` scope (the shift supervisor's token scope in `tokens.yaml`) reaches
# this example's tenant for both HITL door actions. The `metering` scope (the
# unauthorized token's scope) is deliberately ABSENT: deny-by-default means an
# unmapped scope grants nothing, and the driver demonstrates the resulting typed
# 403 (`tenant-unauthorized`).
#
# Adapt-first: change `tenant_patterns` (exact match or single trailing `*`
# prefix glob — the D-01 grammar) and the scope names to your own deployment's
# vocabulary.
#
# Registered by `run.py` rather than by the manifest, for the same reason as
# `hitl-policy.yaml`: the authorizer reads a real `ScopeMappingArtifact` back
# off the Control Plane by key.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every scope name, tenant pattern and action id is [ADAPT]; the
# keys `semver`, `scopes`, `tenant_patterns` and `action_ids` are [MECHANISM].

semver: "1.0.0"
scopes:
  hitl:
    tenant_patterns: [boreal-grid]
    action_ids: [hitl.queue.read, hitl.action.submit]
