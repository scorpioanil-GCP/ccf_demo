# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# The policy bundle the *fabric* boots under (e-commerce domain, D-IMPL-52).
#
# A *version* of this bundle is resolved from the Control Plane, stamped onto
# every claim at assembly, and carried into the product's policy binding and
# into replay dimension 2. The *agent's* axis-4 policy regime is a separate
# declared artifact under `agents/`; the two are deliberately not the same
# thing.
#
# A policy bundle's SCHEMA is the deployment's, not the SDK's — the SDK never
# invents a policy-bundle schema on a user's behalf (CLAUDE.md §11). So this
# document uses the open `DeclaredArtifact` envelope: the SDK fixes `semver`,
# `class_id` and canonical serializability, and everything under `declaration:`
# is this deployment's own. The `$schema` header above names that envelope,
# which is the only schema the SDK owns here; `class_id` below is what says
# what kind of thing this actually is, and the manifest entry must agree with
# it.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: atlas-commerce.policy-bundle

declaration:
  regime: atlas-order-experience
  jurisdiction: US-OR
  permitted_classifications:
    - internal
