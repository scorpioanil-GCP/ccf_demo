# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# What the served product should contain, as declared by the deployment that
# authored the events (e-commerce domain, D-IMPL-52).
#
# This document exists so that
# `tests/examples/test_harness_portability_output.py` has a source for its
# domain expectations OTHER THAN ITSELF. A value the test module authored would
# be the test agreeing with itself about what this deployment's vocabulary
# says; read from here, the assertion is against the deployment's own
# declaration.
#
# **`role: load` in the manifest.** An expectation is not something the fabric
# is permitted to do, so it has no business in Control Plane state or in replay
# dimension 2.
#
# Only DOMAIN expectations live here. `harness_leg_count` is a domain
# expectation too — it is this deployment's declaration of how many harness
# bindings it stands up, and the test reads it from here rather than inlining
# `3`, so the count and the bindings document cannot silently disagree.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: atlas-commerce.expected-product

declaration:
  # The age-gated catalog item is absent and the order that included it
  # survives: the policy operator substituted the RESTRICTED node out along
  # with the `includes` edge that would otherwise have leaked its existence by
  # absence. The second order is absent because similarity ranked it out.
  entity_classes:
    - customer
    - order
    - shipment
  relationship_types:
    - placed_by
    - shipped_via
  entity_count: 3

  # One agent definition, this many harness legs (CLAUDE.md §7.3). The
  # portability claim is about the legs being MORE THAN ONE and the results
  # being equal; a suite that stopped standing up three legs would still pass
  # an "all legs agree" assertion vacuously, so the count is declared.
  harness_leg_count: 3
