# yaml-language-server: $schema=../../../../docs/schemas/ccf.resolution-spec.json
# Harness-portability entity-resolution spec — the deployment's declared
# vocabulary (e-commerce domain, D-IMPL-52). Everything here is a *value*:
# entity classes, relationship types, attribute names. None of it exists in
# `/src`, and none of it exists in `run.py` or `legs/` (CLAUDE.md §6.4, the
# No-Hardcoding Rule).
#
# This document is closed-world over resolution rules only (D-03). The two
# attribute maps that used to sit beside them in `ontology.yaml` now live with
# the operator whose construction reads them —
# `classification_attribute_by_class` in the policy parameters document,
# `similarity_corpus_attribute_by_class` in the similarity one — because one
# artifact serves one consumer. `tenant_id` moved onto the manifest, which is
# where the deployment's own identity already is.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, match key, attribute name and
# relationship type is [ADAPT]; the keys `entity_rules`, `match_key`,
# `entity_class`, `identity_keys`, `attribute_keys`, `relationship_rules`,
# `relationship_type`, `subject_entity_class` and `object_entity_class` are
# [MECHANISM].

semver: "1.0.0"

# Source payload vocabulary -> E nodes. `identity_keys` mint the canonical
# URI, so the same customer arriving from two source systems converges on one
# node without either system knowing about the other.
entity_rules:
  - match_key: customer_ref
    entity_class: customer
    identity_keys: [customer_ref]
    attribute_keys:
      - customer_name
      - loyalty_tier
      - customer_classification

  - match_key: order_ref
    entity_class: order
    identity_keys: [order_ref]
    attribute_keys:
      - order_status
      - order_summary
      - order_classification

  - match_key: catalog_item_ref
    entity_class: catalog_item
    identity_keys: [catalog_item_ref]
    attribute_keys:
      - category
      - catalog_item_classification

  - match_key: shipment_ref
    entity_class: shipment
    identity_keys: [shipment_ref]
    attribute_keys:
      - carrier_name
      - shipment_status
      - shipment_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence.
relationship_rules:
  - relationship_type: placed_by
    subject_entity_class: order
    object_entity_class: customer

  - relationship_type: includes
    subject_entity_class: order
    object_entity_class: catalog_item

  - relationship_type: shipped_via
    subject_entity_class: order
    object_entity_class: shipment
