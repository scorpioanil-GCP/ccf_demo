# yaml-language-server: $schema=../../../docs/schemas/ccf.operator-parameters.traversal.json
# Traversal category parameters (whitepaper §7.4; e-commerce domain,
# D-IMPL-52).
#
# Read as: expand two hops from orders over these typed edges. No field carries
# a default — `depth_limit` in particular is the operator's entire correctness
# claim (INV-CH7-24), and a default bound is one nobody chose (D-IMPL-38).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, relationship type and the depth value
# are [ADAPT]; the keys `seed_entity_classes`, `relationship_types` and
# `depth_limit` are [MECHANISM].

semver: "1.0.0"

seed_entity_classes:
  - order
relationship_types:
  - placed_by
  - includes
  - shipped_via
depth_limit: 2
