# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# The AGENT's axis-5 half-life and debt profile (CLAUDE.md §6.2 channel 1,
# axis 5): what staleness this agent tolerates, and what D_c threshold trips
# Forced LLM or Fail-Closed for it.
#
# Its `class_id` is the unqualified `debt-profile`, not the SDK's own
# `ccf.debt-profile`: this document is the agent's declared profile, addressed
# through Control Plane resolution by the versioned URI
# `agent-definition.yaml`'s axis-5 ref pins, and it carries a `review_cycle`
# field the SDK's class does not define. An SDK-owned class id here would claim
# a schema this document does not satisfy.
#
# Decimals are QUOTED so they parse as text: the canonical serializer refuses
# floats, and the artifact loader refuses a YAML float rather than silently
# converting one.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM]. `semver` must
# equal the version the referencing ref pins.

semver: "1.0.0"
class_id: debt-profile

declaration:
  review_cycle: per-shift
  risk_sensitivity: "1.1"
  forced_llm_threshold: "0.35"
  fail_closed_threshold: "0.80"
