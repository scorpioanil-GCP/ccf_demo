# yaml-language-server: $schema=../../../../docs/schemas/ccf.signal-batch.json
# Harness-portability event stream — L1 signal envelopes (e-commerce domain,
# D-IMPL-52). A handful of events, but not a flat happy path:
#
#   * ec-101 asserts the SAME customer as ec-100 from a DIFFERENT source with
#     identical attributes -> one claim whose lineage accumulates by set-union
#     (INV-CH7-17), not a second node.
#   * ec-102 introduces a second, permitted order the similarity operator must
#     rank out — so "similarity did something" is distinguishable from an
#     identity function.
#   * ec-103 carries a RESTRICTED catalog item (an age-gated listing), which
#     the policy operator must substitute out along with the `includes` edge
#     that would otherwise leak its existence by absence.
#   * ec-104 attaches the delayed shipment behind ORD-5521's trouble, so the
#     two-hop traversal has a second typed edge (`shipped_via`) to expand — and
#     the byte-identical equivalence across the three harnesses covers three
#     entity classes, not two.
#
# The document adopts the SDK's OWN envelope vocabulary — `source: {system_id}`,
# `raw_payload:` — rather than a flat shape the loader would have to translate.
# A translation removed is one that cannot drift.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: everything under `raw_payload:` and every source system id is
# [ADAPT]; the envelope keys (`envelope_id`, `tenant_id`, `source`,
# `system_id`, `ingestion_timestamp`, `observed_time`, `raw_payload`) are
# [MECHANISM].

semver: "1.0.0"

tenant_id: atlas-commerce

envelopes:
  - envelope_id: ec-100
    tenant_id: atlas-commerce
    source:
      system_id: order-management
    ingestion_timestamp: 2026-06-02T09:00:00Z
    observed_time: 2026-06-02T08:45:00Z
    raw_payload:
      customer_ref: "ATL-CUST-3308"
      customer_name: "M. Duarte"
      loyalty_tier: "gold"
      customer_classification: "internal"
      order_ref: "ORD-5521"
      order_status: "delayed"
      order_summary: "delayed shipment refund request expedited courier"
      order_classification: "internal"

  - envelope_id: ec-101
    tenant_id: atlas-commerce
    source:
      system_id: crm-profile
    ingestion_timestamp: 2026-06-02T09:05:00Z
    observed_time: 2026-06-02T08:45:00Z
    raw_payload:
      customer_ref: "ATL-CUST-3308"
      customer_name: "M. Duarte"
      loyalty_tier: "gold"
      customer_classification: "internal"

  - envelope_id: ec-102
    tenant_id: atlas-commerce
    source:
      system_id: order-management
    ingestion_timestamp: 2026-06-02T09:10:00Z
    observed_time: 2026-06-02T09:02:00Z
    raw_payload:
      customer_ref: "ATL-CUST-3308"
      customer_name: "M. Duarte"
      loyalty_tier: "gold"
      customer_classification: "internal"
      order_ref: "ORD-5610"
      order_status: "scheduled"
      order_summary: "standing pantry subscription replenishment routine"
      order_classification: "internal"

  - envelope_id: ec-103
    tenant_id: atlas-commerce
    source:
      system_id: catalog-registry
    ingestion_timestamp: 2026-06-02T09:15:00Z
    observed_time: 2026-06-02T09:12:00Z
    raw_payload:
      catalog_item_ref: "SKU-AGE-0771"
      category: "age-gated"
      catalog_item_classification: "restricted"
      order_ref: "ORD-5521"
      order_status: "delayed"
      order_summary: "delayed shipment refund request expedited courier"
      order_classification: "internal"

  - envelope_id: ec-104
    tenant_id: atlas-commerce
    source:
      system_id: logistics-tracking
    ingestion_timestamp: 2026-06-02T09:20:00Z
    observed_time: 2026-06-02T09:18:00Z
    raw_payload:
      shipment_ref: "SHP-88410"
      carrier_name: "Cascadia Parcel"
      shipment_status: "stalled-at-hub"
      shipment_classification: "internal"
      order_ref: "ORD-5521"
      order_status: "delayed"
      order_summary: "delayed shipment refund request expedited courier"
      order_classification: "internal"
