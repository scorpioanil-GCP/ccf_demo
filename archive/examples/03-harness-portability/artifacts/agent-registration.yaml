# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# The Control Plane keys the agent's four documents are registered under, and
# the class each is registered against (CLAUDE.md §6.4; D-IMPL-28).
#
# Why this document exists at all. Reshaping the agent's documents so each is
# one artifact class at its root — which is what makes an honest `$schema`
# header possible — left the `keys:` blocks that used to wrap them with nowhere
# to live. They are not part of any of those classes: a key is where a
# deployment files an artifact, not a property of the artifact. So they land
# here, in one deployment-authored document, where `run.py` reads them as this
# deployment's own vocabulary rather than as code literals (§6.4).
#
# `role: load` in the manifest, and that is the point of enumerating it: the
# manifest is where an auditor reads what documents this deployment has, and a
# registration table that lived outside it would be a set of Control Plane keys
# no artifact recorded. Registering *this* document would be wrong for the
# usual reason — it is a naming table, not a permission.
#
# The two `agents/` entries whose refs are pinned in `agents/agent-definition.yaml`
# carry the semver the ref pins. The registration and the ref are two
# independent statements of one version, authored in two files, and the factory
# refuses to resolve a ref whose pinned version is not what was registered.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every key path, path and class id under
# `declaration:` is [ADAPT]; the keys `semver`, `class_id`, `declaration`,
# `agent_definition`, `prompt_artifact`, `referenced` and the per-entry `key` /
# `path` / `class_id` / `semver` names are [MECHANISM].

semver: "1.0.0"
class_id: atlas-commerce.agent-registration

declaration:
  # The ONE agent definition, and the prompt its axis-6 binding names. Both
  # register against their real SDK-owned typed classes, through
  # `register_versioned`'s D-05 hash-verified bump check.
  agent_definition:
    key: atlas-commerce/agents/order-experience-insights
    path: agents/agent-definition.yaml
  prompt_artifact:
    key: atlas-commerce/prompt/order-experience-briefing
    path: prompt.yaml

  # The artifacts the definition's axis-4 and axis-5 refs resolve to, so the
  # factory reaches them through Control Plane resolution and never through raw
  # storage (DESIGN.md §3.5). Keys mirror the versioned URIs:
  # {tenant}/{artifact_class}/{name}.
  referenced:
    - key: atlas-commerce/policy-bundle/order-operations
      path: agents/policy-regime.yaml
      class_id: policy-bundle
      semver: "1.0.0"
    - key: atlas-commerce/debt-profile/order-window-review
      path: agents/debt-profile.yaml
      class_id: debt-profile
      semver: "1.0.0"
