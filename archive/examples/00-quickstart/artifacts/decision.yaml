# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# This decision's inputs (banking domain, D-IMPL-52).
#
# Explicit inputs, never clock reads: the example is replayable precisely
# because these are data.
#
# **This document is `role: load` in the manifest, and that is a decision, not
# an oversight.** Registering it would content-hash "what instant this run
# asked about" into Control Plane state and therefore into replay dimension 2 —
# but dimension 2 records what the fabric was PERMITTED TO DO, not what any one
# run asked of it. Re-running at a different boundary would otherwise look like
# a governance change. Compare `events.yaml`, which is `role: load` for the
# same reason and additionally has that role FIXED by the SDK (D-IMPL-80); this
# document's class is the deployment's, so the role here is the deployment's
# call, made deliberately.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM]. Every timestamp
# states its zone — the loader refuses a zone-less one rather than guessing
# (D-IMPL-38).

semver: "1.0.0"
class_id: meridian-bank.decision-inputs

declaration:
  temporal_boundary: 2026-06-01T10:00:00Z
  now: 2026-06-01T10:00:05Z

  # The observation the example evaluates for freshness at `now` — a dated,
  # typed observation whose vocabulary belongs to the λ_c table, not the SDK.
  freshness_demonstration:
    observation_type: customer-segmentation
    observed_at: 2026-06-01T08:55:00Z
