# yaml-language-server: $schema=../../../docs/schemas/ccf.resolution-spec.json
# Quickstart entity-resolution spec — the deployment's declared vocabulary
# (banking domain, D-IMPL-52). Everything here is a *value*: entity classes,
# relationship types, attribute names. None of it exists in `/src`, and none of
# it exists in `run.py` (CLAUDE.md §6.4, the No-Hardcoding Rule).
#
# This document is closed-world over resolution rules only (D-03). The two
# attribute maps that used to live beside them now sit with the operator whose
# construction reads them — `classification_attribute_by_class` in the policy
# parameters document, `similarity_corpus_attribute_by_class` in the similarity
# one — because one artifact serves one consumer. `tenant_id` moved onto the
# manifest, which is where the deployment's own identity already is.
#
# It mirrors the *shape* the assembly worker accepts (whitepaper §7.3:
# identity_keys mint the canonical entity URI, INV-CH7-18).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, match key, attribute name and
# relationship type is [ADAPT]; the keys `entity_rules`, `match_key`,
# `entity_class`, `identity_keys`, `attribute_keys`, `relationship_rules`,
# `relationship_type`, `subject_entity_class` and `object_entity_class` are
# [MECHANISM].

semver: "1.0.0"

# Source payload vocabulary -> E nodes. `match_key` selects a rule by
# presence; `identity_keys` mint the canonical URI, so the same customer
# arriving from two source systems converges on one node without either
# system knowing about the other.
entity_rules:
  - match_key: customer_ref
    entity_class: customer
    identity_keys: [customer_ref]
    attribute_keys:
      - customer_name
      - segment
      - customer_classification

  - match_key: account_number
    entity_class: account
    identity_keys: [account_number]
    attribute_keys:
      - account_type
      - currency
      - account_description
      - account_classification

  - match_key: mandate_id
    entity_class: mandate
    identity_keys: [mandate_id]
    attribute_keys:
      - mandate_scheme
      - mandate_classification

  - match_key: branch_code
    entity_class: branch
    identity_keys: [branch_code]
    attribute_keys:
      - branch_name
      - branch_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence.
relationship_rules:
  - relationship_type: holds
    subject_entity_class: customer
    object_entity_class: account

  - relationship_type: authorizes
    subject_entity_class: mandate
    object_entity_class: account

  - relationship_type: domiciled_at
    subject_entity_class: account
    object_entity_class: branch
