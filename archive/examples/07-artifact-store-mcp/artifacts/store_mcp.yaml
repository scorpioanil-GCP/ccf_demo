# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# Store configuration: the MCP-backed reference ArtifactStore (CLAUDE.md §7.4;
# whitepaper §8.3 Pattern 3).
#
# Same shape as `store_file.yaml`, different declared `type` — that is the
# whole demonstration. The endpoint is templated from an environment variable
# the driver sets after the server child's READY handshake (no fixed ports).
#
# **Not a manifest entry, deliberately** — see `store_file.yaml` for why. Both
# runs load the SAME `manifest.yaml`; only which of these two documents is
# bound at the call site differs.
#
# The auth block is the deployment's: the artifact server the SDK ships is
# authenticated by construction (both verifier and settings are required,
# together), and both sides of this example — the server child and the client
# factory — read the SAME block, so the credential cannot drift into two
# values. The token below is a per-run example credential that authorizes
# nothing but a temporary directory; the `.invalid` TLD on the
# issuer/resource identities is reserved precisely so a stray resolution cannot
# succeed (metadata only — nothing dials them).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id`, `declaration`, `type`, `endpoint_env` and `auth`
# are [MECHANISM].

semver: "1.0.0"
class_id: nordhaven-logistics.artifact-store-config

declaration:
  type: mcp
  endpoint_env: CCF_EXAMPLE07_MCP_ENDPOINT
  auth:
    token: nordhaven-example07-dev-token
    client_id: nordhaven-example07-client
    scope: ccf:artifact
    server_name: nordhaven-artifact-store
    issuer_url: "https://issuer.invalid"
    resource_server_url: "https://artifact-server.invalid/mcp"
