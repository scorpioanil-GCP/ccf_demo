# yaml-language-server: $schema=../../../../docs/schemas/ccf.operator-parameters.similarity.json
# Similarity category parameters (whitepaper §7.4; logistics domain, D-09).
#
# Read as: rank routes against the rail-corridor query at or above 40%.
#
# `similarity_corpus_attribute_by_class` lives HERE rather than in the
# resolution spec: one artifact, one consumer (D-03). Two rules govern it and
# they get opposite answers (plan 15-11):
#
#   * a class ABSENT from this map contributes no corpus entry, silently — the
#     map is this deployment's statement of which classes are rankable, so
#     `shipment` and `depot` are simply not ranked;
#   * an entity of a class this map NAMES that carries no such attribute is
#     REFUSED at registry-build time. Refuse, never repair.
#
# The corpus's version identity is not here. It is a property of the graph
# state at a named boundary, not of these parameters, so the deployment assigns
# it alongside the boundary (see `product-governance.yaml`) — INV-CH7-27.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the query text, the threshold, every entity class name and the
# attribute name are [ADAPT]; the keys `query`, `minimum_score_percent`,
# `ranked_entity_classes` and `similarity_corpus_attribute_by_class` are
# [MECHANISM].

semver: "1.0.0"

query: "rail freight corridor hamburg"
minimum_score_percent: 40
ranked_entity_classes:
  - route

# The attribute the similarity corpus is built from, per ranked class.
similarity_corpus_attribute_by_class:
  route: route_description

# `24.11-02b` (`D-IMPL-292`): the SDK moved the corpus's version identity onto
# THIS document, where it is read at index construction, and made it required.
# This archived example declared it in `product-governance.yaml` — the
# adopter-namespaced pattern every deployment reproduced because the SDK had no
# declarative home for it. The value below is that same declaration, moved so
# the document still parses under the class its `$schema` header names. Nothing
# else in this retired program is retrofitted (`D-07`, `D-IMPL-265`).
index_version: "nordhaven-route-corpus@2026-07-01"
