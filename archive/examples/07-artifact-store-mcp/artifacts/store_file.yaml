# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# Store configuration: the file-backed ArtifactStore (CLAUDE.md §7.4).
#
# This artifact — not a code branch — is what selects the persistence
# substrate. `run.py` holds one store factory keyed by `declaration.type`; the
# workload never mentions a backend. Swapping this file for `store_mcp.yaml` is
# the entire change between the example's two runs.
#
# **Not a manifest entry, deliberately.** A store is a deployment ENVIRONMENT
# choice, the same kind of thing as a database DSN (D-08), so it is bound at
# the call site rather than registered. A `store:` field on the manifest would
# content-hash the substrate choice into replay dimension 2 and would make the
# example's two runs differ in *what was in force* — which is precisely the
# claim the example exists to refute.
#
# The root directory is templated from an environment variable the driver sets
# per run (a scratch directory), so no absolute path is committed.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id`, the `root_env` variable name and the `type` value
# are [ADAPT]; the keys `semver`, `class_id`, `declaration`, `type` and
# `root_env` are [MECHANISM].

semver: "1.0.0"
class_id: nordhaven-logistics.artifact-store-config

declaration:
  type: file
  root_env: CCF_EXAMPLE07_FILE_ROOT
