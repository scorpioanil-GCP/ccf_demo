# yaml-language-server: $schema=../../../../../docs/schemas/ccf.resolution-spec.json
# Hello-context entity-resolution spec — the deployment's declared vocabulary
# (financial-services domain, D-IMPL-52; deliberately small: one borrower, one
# credit facility, a handful of financial signals — authored 100% fresh,
# nothing ported from any prior example or system).
#
# Everything here is a *value*: entity classes, relationship types, attribute
# names. None of it exists in `/src`, and none of it exists in `serve.py`
# (CLAUDE.md §6.4, the No-Hardcoding Rule) — the server is thin
# loading-and-serving logic over these artifacts.
#
# This document is closed-world over resolution rules only (D-03). The two
# attribute maps that used to sit beside them in `ontology.yaml` now live with
# the operator whose construction reads them —
# `classification_attribute_by_class` in the policy parameters document,
# `similarity_corpus_attribute_by_class` in the similarity one — because one
# artifact serves one consumer. `tenant_id` moved onto the manifest, which is
# where the deployment's own identity already is.
#
# It mirrors the *shape* the assembly worker accepts (whitepaper §7.3:
# identity_keys mint the canonical entity URI, INV-CH7-18).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, match key, attribute name and
# relationship type is [ADAPT]; the keys `entity_rules`, `match_key`,
# `entity_class`, `identity_keys`, `attribute_keys`, `relationship_rules`,
# `relationship_type`, `subject_entity_class` and `object_entity_class` are
# [MECHANISM].

semver: "1.0.0"

# Source payload vocabulary -> E nodes. `match_key` selects a rule by
# presence; `identity_keys` mint the canonical URI, so the same borrower
# arriving from two source systems converges on one node without either
# system knowing about the other.
entity_rules:
  - match_key: borrower_ref
    entity_class: borrower
    identity_keys: [borrower_ref]
    attribute_keys:
      - borrower_name
      - borrower_sector
      - borrower_classification

  - match_key: facility_ref
    entity_class: credit_facility
    identity_keys: [facility_ref]
    attribute_keys:
      - facility_kind
      - facility_limit
      - facility_classification

  - match_key: signal_ref
    entity_class: financial_signal
    identity_keys: [signal_ref]
    attribute_keys:
      - signal_kind
      - signal_summary
      - signal_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence. Subjects are
# chosen so the traversal walks forward from the borrower seed.
relationship_rules:
  - relationship_type: holds
    subject_entity_class: borrower
    object_entity_class: credit_facility

  - relationship_type: evidenced_by
    subject_entity_class: credit_facility
    object_entity_class: financial_signal
