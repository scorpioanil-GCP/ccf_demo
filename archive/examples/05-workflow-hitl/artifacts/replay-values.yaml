# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# Values for the decision's replay record (whitepaper §7.10.1; banking/lending
# domain, D-IMPL-52).
#
# The workflow and HITL blocks on dimensions 2 and 5 land VERBATIM from what the
# engine and the authority path serialized — nothing here declares them. What is
# here is everything else the record needs: the product envelope, the perspective
# conditioning, the policy binding, and the operator step the projection stage
# stands in for.
#
# **Why an operator step is declared rather than executed.** This example's
# subject is the Orchestration Layer and the HITL primitives. The L1–L6 pipeline
# it suspends over is real — the fabric boots, ingests, and the graph view below
# is read from it at the declared boundary — but the projection stage is
# fixture-shaped, because a fourth full pipeline in the suite would teach nothing
# examples 00 and 06 do not already teach. `examples/06-decision-replay` is where
# the record is produced by a real projection AND reproduced from its own address.
#
# `role: load`. What one run's record was shaped from is not a permission.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

