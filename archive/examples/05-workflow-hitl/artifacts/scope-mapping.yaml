# yaml-language-server: $schema=../../../docs/schemas/ccf.scope-mapping.json
# Workflow-HITL scope mapping (HARD-04; D-IMPL-68; Phase 10 D-16).
#
# The deployment's authorization statement: which token scopes reach which
# tenants and which door-declared actions. Every value here — scope strings,
# tenant patterns, action identifiers — is deployment data (CINV-01; CLAUDE.md
# §6.4); the SDK ships the grammar interpreter only.
#
# The `hitl` scope (the approver token's scope in `tokens.yaml`) reaches this
# example's tenant for both HITL door actions. The `reporting` scope (the
# unauthorized token's scope) is deliberately ABSENT: deny-by-default means an
# unmapped scope grants nothing, and the example demonstrates the resulting typed
# 403 (`tenant-unauthorized`).
#
# **Not addressable by the manifest, and this one really is not.**
# `ccf.scope-mapping` is an SDK-owned class absent from BOTH SDK mappings, and
# the `ccf.` prefix is reserved — so a manifest entry naming it is REFUSED at
# load (D-IMPL-84), where it used to resolve to the open `DeclaredArtifact`
# envelope while the authorizer read its real contract back off the Control
# Plane by key. `run.py` registers it itself.
#
# Adapt-first: change `tenant_patterns` (exact match or single trailing `*`
# prefix glob — the D-01 grammar) and the scope names to your own vocabulary.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the scope names, `tenant_patterns` and `action_ids` values are
# [ADAPT]; the keys `semver`, `scopes`, `tenant_patterns` and `action_ids` are
# [MECHANISM].

semver: "1.0.0"
scopes:
  hitl:
    tenant_patterns: [sterling-mutual]
    action_ids: [hitl.queue.read, hitl.action.submit]
