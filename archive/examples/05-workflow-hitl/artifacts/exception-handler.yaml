# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# Where a failing loan-file verification routes (CLAUDE.md §8.1; D-IMPL-61;
# banking/lending domain, D-IMPL-52).
#
# The ExceptionEscalation target. An exception path is a first-class state
# transition, not error handling glued on after the fact — so its destination is
# a registered Control Plane artifact like any other routing value, and the
# workflow definition reaches it by versioned-URI ref.
#
# `role: register`: who a failure escalates to is precisely a standing statement
# of what the fabric was permitted to do with it.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and everything under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: exception-handler

declaration:
  routes_to: loan-operations-desk
