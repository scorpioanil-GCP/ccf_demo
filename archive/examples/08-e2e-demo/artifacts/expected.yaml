# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# What the demo must produce, as declared by the deployment that authored the
# scenario (banking domain, D-IMPL-52; Phase 12 CONTEXT D-11).
#
# BOTH outcomes are pinned, which is the demo's honesty commitment: the headline
# claim — *an agent solves a problem it could not solve from the raw data
# alone* — is executed rather than asserted, so the zero the baseline finds is
# as much a pinned expectation as the one the governed pass finds.
#
# **This document is `role: load`.** An expectation is not a permission: nothing
# here changes what the fabric may do, so putting it in force and content-hashing
# it into replay dimension 2 would be recording a test oracle as governance.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: meridian-bank.expected-outcomes

declaration:
  # Executed baseline over raw per-source rows: with no entity resolution the
  # ring's wire aliases resolve to no known counterparty, and the noise that
  # does resolve forms no structured cycle.
  baseline_cycles: 0
  # Governed pass over the typed Context Product: exactly the planted ring.
  governed_cycles: 1
  cycle_members:
    - "Bluegate Trading Company S.A."
    - "Harrow Point Consulting Pte. Ltd."
    - "Kestrel Marine Supply GmbH"
    - "Northquay Advisory Limited"
    - "Palmera Logistics S.L."

  # The gated product's payload shape at the boundary.
  entity_count: 4458
  entity_count_by_class:
    counterparty: 1205
    site: 1188
    account: 1160
    transfer: 905
  relationship_count_by_type:
    holds: 1160
    registered_at: 1205
    delivered_at: 905

  # L1/L2 banner facts: envelopes ingested and canonical counterparties resolved
  # (1160 ledger holders + 1205 registry entries converge on 1205 nodes — the
  # tax reference is the evidence).
  envelopes_ingested: 6870
  resolved_seed_entities: 1205
