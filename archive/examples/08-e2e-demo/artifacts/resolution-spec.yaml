# yaml-language-server: $schema=../../../docs/schemas/ccf.resolution-spec.json
# E2E-demo entity-resolution spec — the deployment's declared vocabulary
# (banking domain, D-IMPL-52; Phase 12 CONTEXT D-01/D-02). Everything here is a
# *value*: entity classes, identity keys, attribute names, relationship types.
# None of it exists in `/src` and none of it exists in `run.py` (CLAUDE.md §6.4,
# the No-Hardcoding Rule).
#
# This document is where the demo's hero lives. The rules below are what link
# the three source systems' GENUINELY DISJOINT identifiers (scenario.yaml,
# RESEARCH Pitfall 4) into one canonical graph:
#
#   * the ledger account and the KYC registry entry converge on ONE
#     `counterparty` node because both carry the same tax reference
#     (identity_keys mint the canonical URI, whitepaper §7.3 / INV-CH7-18);
#   * the wire transfer and the KYC registry entry converge on ONE `site` node
#     because both carry the same registered address — which is the only
#     evidence tying a wire alias back to a registered counterparty.
#
# No single source contains both links. That is why the baseline pass over raw
# rows finds nothing and the governed pass finds the ring (D-11).
#
# Closed-world over resolution rules only (D-03). The two attribute maps that
# used to sit beside them now live with the operator whose construction reads
# them — `classification_attribute_by_class` in the policy parameters document,
# `similarity_corpus_attribute_by_class` in the similarity one. `tenant_id`
# moved onto the manifest, and the L1 ingest mapping onto `ingest-spec.yaml`.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, match key, attribute name and
# relationship type is [ADAPT]; the keys `entity_rules`, `match_key`,
# `entity_class`, `identity_keys`, `attribute_keys`, `relationship_rules`,
# `relationship_type`, `subject_entity_class` and `object_entity_class` are
# [MECHANISM].

semver: "1.0.0"

# Source payload vocabulary -> E nodes. `match_key` selects a rule by presence;
# `identity_keys` mint the canonical URI, so the same counterparty arriving from
# two source systems converges on one node without either system knowing about
# the other.
entity_rules:
  - match_key: party_tax_ref
    entity_class: counterparty
    identity_keys: [party_tax_ref]
    attribute_keys:
      - party_display_name
      - party_jurisdiction
      - record_classification

  - match_key: site_address
    entity_class: site
    identity_keys: [site_address]
    attribute_keys:
      - record_classification

  - match_key: account_ref
    entity_class: account
    identity_keys: [account_ref]
    attribute_keys:
      - account_currency
      - record_classification

  - match_key: transfer_ref
    entity_class: transfer
    identity_keys: [transfer_ref]
    attribute_keys:
      - origin_party_name
      - beneficiary_party_name
      - transfer_amount
      - transfer_currency
      - transfer_sent_at
      - transfer_purpose
      - record_classification

  - match_key: movement_ref
    entity_class: movement
    identity_keys: [movement_ref]
    attribute_keys:
      - movement_amount
      - movement_memo
      - record_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence.
relationship_rules:
  - relationship_type: holds
    subject_entity_class: counterparty
    object_entity_class: account

  - relationship_type: registered_at
    subject_entity_class: counterparty
    object_entity_class: site

  - relationship_type: delivered_at
    subject_entity_class: transfer
    object_entity_class: site
