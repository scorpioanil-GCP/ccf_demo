# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# `--live` provider configuration (Phase 12 CONTEXT D-10/D-12; banking domain,
# D-IMPL-52).
#
# Deployment values, never code constants. Environment variables override the
# recorded defaults, because an endpoint and a model name are deployment
# ENVIRONMENT rather than deployment declaration:
#
#   CCF_OLLAMA_BASE_URL overrides providers.ollama.default_base_url
#   CCF_OLLAMA_MODEL    overrides providers.ollama.default_model
#
# Split out of the prompt artifact because a `ccf.prompt-artifact` document's
# root must be the prompt — one class, one document. The two were never the same
# thing anyway: the template is what the model is asked, this is which model is
# asked and how long to wait.
#
# `--live` is narration-only and never runs in always-on CI (D-10/D-12).
# Detection is deterministic and identical in both modes; nothing about the
# model's text is ever asserted.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: meridian-bank.live-narration

declaration:
  providers:
    ollama:
      default_base_url: "http://localhost:11434"
      default_model: "qwen3-vl:8b"
  runner:
    timeout_seconds: 120
    max_tokens: 512
