# yaml-language-server: $schema=../../../docs/schemas/ccf.declared-artifact.json
# Where the author-versioned documents file in the Control Plane (banking
# domain, D-IMPL-52).
#
# `agent-definition.yaml`, `prompt-artifact.yaml` and `skill-catalog-entry.yaml`
# are SDK-owned classes whose document root must BE the artifact, so that each
# can carry an honest `$schema` header and be validated against its own
# contract. That leaves nowhere in those files for the Control Plane key they
# register under — a key is where a document is FILED, not part of what it says.
# This document is that filing information, and nothing else.
#
# It is `role: load`: which key an artifact files under is wiring the driver
# reads, and putting it in force would content-hash the deployment's filing
# scheme into replay dimension 2 alongside the artifacts it files.
#
# The skill catalog entry's key is deliberately ABSENT: `SkillCatalog` derives
# it from the entry's own tenant and name, so authoring one here would be a
# second, drifting statement of a value mechanism already owns.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every value under `declaration:` is [ADAPT]; the
# keys `semver`, `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: meridian-bank.agent-registration

declaration:
  agent_definition_key: meridian-bank/agents/payment-ring-analytics
  prompt_artifact_key: meridian-bank/prompt/ring-investigation-summary
