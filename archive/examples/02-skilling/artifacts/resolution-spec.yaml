# yaml-language-server: $schema=../../../../docs/schemas/ccf.resolution-spec.json
# Skilling-example entity-resolution spec — the deployment's declared
# vocabulary (clinical-trials-operations domain, D-IMPL-52). Everything here is
# a *value*: entity classes, relationship types, attribute names. None of it
# exists in `/src`, and none of it exists in `run.py` (CLAUDE.md §6.4).
#
# Closed-world over resolution rules only (D-03): the classification attribute
# map moved to the policy parameters document, beside the operator that reads
# it, and `tenant_id` moved onto the manifest.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: every entity class name, match key, attribute name and
# relationship type is [ADAPT]; the keys `entity_rules`, `match_key`,
# `entity_class`, `identity_keys`, `attribute_keys`, `relationship_rules`,
# `relationship_type`, `subject_entity_class` and `object_entity_class` are
# [MECHANISM].

semver: "1.0.0"

entity_rules:
  - match_key: site_ref
    entity_class: trial_site
    identity_keys: [site_ref]
    attribute_keys:
      - site_name
      - country
      - site_classification

  - match_key: cohort_ref
    entity_class: enrollment_cohort
    identity_keys: [cohort_ref]
    attribute_keys:
      - protocol_arm
      - enrollment_status
      - cohort_classification

relationship_rules:
  - relationship_type: enrolls_at
    subject_entity_class: enrollment_cohort
    object_entity_class: trial_site
