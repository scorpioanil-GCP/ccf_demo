# yaml-language-server: $schema=../../../docs/schemas/ccf.agent-definition.json
# Skilling-example agent definition — a declared, versioned Control Plane
# artifact (CLAUDE.md §6.1/§6.2; D-IMPL-28). Clinical-trials-operations domain,
# D-IMPL-52.
#
# **This definition NEVER CHANGES during the example.** Skilling is channel 2:
# capability changes travel through the Control Plane grant ledger, not through
# agent re-declaration (§6.2). The test module asserts this file is
# byte-identical before and after the whole grant/exercise/revoke cycle, and
# that the definition's content hash — the agent's identity — never moves.
#
# The axis-4 ref points at `agent-policy-regime.yaml`, which carries the
# D-IMPL-29 `skill_governance` envelope the tier-1 check reads.
#
# Absent from the manifest on purpose: author-versioned artifacts register
# through `register_versioned` (the D-05 bump check), which `load_and_boot`'s
# `register_typed` path does not run. See `agent-registration.yaml`.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the agent name, tenant, product-class names, role and selection
# values are [ADAPT]; the six axis keys (`archetypes`, `context_contract`,
# `perspective`, `policy_regime`, `halflife_debt_profile`,
# `instruction_bindings`), the versioning keys and `ref` are [MECHANISM].

schema_version: "1.0.0"
artifact_version: "1.0.0"
name: enrollment-analytics
tenant: helix-trials

# axis 1 — ordered archetype list (D-IMPL-19)
archetypes: [analytics_insights]

# axis 2 — context contract: the product class this fabric serves. The
# permitted skill's `required_context_products` must be a subset of this
# (tier 1); the impermissible skill's required scopes exceed axis 4.
context_contract:
  consumes:
    - product_class: helix-trials.enrollment-summary
      schema_version: "1.0.0"

# axis 3 — perspective (Π role-conditioning)
perspective:
  role: trial-operations-analyst
  selection_params:
    protocol_arm: arm-a

# axis 4 — policy regime (versioned-URI ref, never inline)
policy_regime:
  ref: "ccf-artifact://helix-trials/policy-bundle/trial-operations-regime@1.0.0"

# axis 5 — half-life and debt profile (versioned-URI ref)
halflife_debt_profile:
  ref: "ccf-artifact://helix-trials/debt-profile/enrollment-review@1.0.0"

# axis 6 — instruction bindings: an empty list is an allowed author statement
# (this agent's run needs no prompt artifact; example 01 demonstrates a
# populated axis 6).
instruction_bindings: []
