# yaml-language-server: $schema=../../../../docs/schemas/ccf.signal-batch.json
# The LEAD ARRANGER's event stream — L1 signal envelopes (syndicated-lending
# domain, whitepaper §8.3 Pattern 4).
#
# A handful of events, but not a flat happy path: the stream is built so the
# producer's fabric has something real to do at each layer.
#
#   * ev-202 asserts the SAME facility as ev-201 from a DIFFERENT source with
#     identical attributes -> one claim whose lineage accumulates by set-union
#     (INV-CH7-17), not a second node.
#   * ev-204 introduces a second, permitted compliance certificate — an
#     insurance-evidence filing — that the similarity operator must rank out,
#     so "similarity did something" is distinguishable from an identity
#     function.
#   * ev-206 adds a SECOND covenant-relevant certificate (an auditor
#     confirmation of the same leverage breach) that similarity must KEEP, so
#     the exchanged product carries two certificates and the cross-process
#     admission story covers a multi-certificate payload.
#   * ev-205 carries a RESTRICTED borrower disclosure — a material-adverse-
#     change notice under confidentiality — which the policy operator must
#     substitute out along with the edge that would otherwise leak its
#     existence by absence. This is the confidentiality envelope the whitepaper
#     names: each party may surface only the slice its agreement permits.
#
# The document adopts the SDK's OWN envelope vocabulary — `source: {system_id}`,
# `raw_payload:` — rather than a flat shape a loader would have to translate. A
# translation removed is one that cannot drift.
#
# Payload keys are the *source systems'* vocabulary, never the fabric's.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: everything under `raw_payload:` and every source system id is
# [ADAPT]; the envelope keys (`envelope_id`, `tenant_id`, `source`,
# `system_id`, `ingestion_timestamp`, `observed_time`, `raw_payload`) are
# [MECHANISM].

