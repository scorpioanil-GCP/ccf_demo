# yaml-language-server: $schema=../../../../docs/schemas/ccf.projection-requirements.json
# The operator set THE PRODUCER'S PROJECTION requires (design E2;
# docs/DECISIONS.md D-IMPL-86 and its correction of 2026-08-05;
# syndicated-lending domain, whitepaper §8.3 Pattern 4).
#
# This is a PRODUCER-side document. It is named by `producer-manifest.yaml`
# only; the consumer deployment runs no projection and has no plan, so it has
# no requirements document and gains nothing from one.
#
# **Why this is a second document rather than a duplicate to factor out.** It
# names the same four operator keys `product-class.yaml` names, and that is the
# design rather than a redundancy. The two state two different facts:
#
#   * `product-class.yaml`'s `required_operator_keys` is the Control Plane
#     CLAIM — the value that fills the assembled product's
#     `lineage.operators_invoked` and therefore the value that TRAVELS over the
#     wire to the consumer as `declared_operator_keys`.
#   * this document's `required_operator_keys` is what the PLAN requires — the
#     value `CovenantSlicePlan.required_operators()` returns, which is what the
#     engine plans and therefore what actually runs in this process.
#
# With one document those were the same value reaching both sides of Gate 2
# (lineage strict equality, INV-CH7-47) through pure transforms, so the gate
# could not fail on anything an author could write.
#
# **What holds the two documents together.** `refuse_operator_set_divergence`
# (`ccf.deployment.binder`), called in `producer_child.py` between constructing
# the plan and `ProjectionEngine.execute`. Edit one key in either document and
# the child refuses before anything is assembled, signed or served — so the
# consumer never receives a claim the producer's own plan contradicts.
#
# **Not the `consumer-lineage.yaml` shape, deliberately.** That document is a
# hand-authored, genuinely disjoint lineage on the CONSUMER side, where a second
# independent statement is exactly right because nothing derives it from the
# producer's. A second copy of the PRODUCER's own operator set with nothing
# binding it to the first is the failure mode E2 exists to avoid, which is why
# the binder above is not optional here.
#
# Order is not significant on either side — the binder compares sets, and the
# engine imposes the dependency order (INV-CH7-28).
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the `plan_id` value and the operator key names are [ADAPT]; the
# keys `semver`, `plan_id` and `required_operator_keys` are [MECHANISM].

semver: "1.0.0"

# Which projection these requirements govern. It matches the plan's own
# `plan_id`, because the plan reads it from here.
plan_id: harborline-syndications.syndicated-covenant-context.plan

required_operator_keys:
  - traversal.typed-neighborhood
  - temporal.as-of-boundary
  - policy.principal-subgraph
  - similarity.corpus-select
