# yaml-language-server: $schema=../../../../docs/schemas/ccf.declared-artifact.json
# Where the producer registers its two author-versioned artifacts
# (syndicated-lending domain, whitepaper §8.3 Pattern 4).
#
# `agent-definition.yaml` and `prompt-artifact.yaml` are absent from
# `producer-manifest.yaml` on purpose. Both carry D-IMPL-28 two-field
# versioning and must register through `ControlPlaneRegistry.register_versioned`,
# which holds the author's `artifact_version` claim against content identity
# (the D-05 bump check); `load_and_boot` registers through `register_typed`,
# which does not. Routing them through the manifest would silently drop that
# check, so `producer_child.py` registers them itself — and reads the keys from
# here rather than carrying them as literals (§6.4).
#
# **`role: load` in the manifest.** A pointer to where something will be
# registered is not itself a permission; the registration is.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: `class_id` and every key path is [ADAPT]; the keys `semver`,
# `class_id` and `declaration` are [MECHANISM].

semver: "1.0.0"
class_id: harborline-syndications.agent-registration

declaration:
  agent_definition_key: harborline-syndications/agents/covenant-slice-assembler
  prompt_artifact_key: harborline-syndications/prompt/covenant-brief
  policy_regime_key: harborline-syndications/policy-bundle/syndications-desk-regime
  halflife_debt_profile_key: harborline-syndications/debt-profile/covenant-review
