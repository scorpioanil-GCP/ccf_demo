# yaml-language-server: $schema=../../../../docs/schemas/ccf.operator-parameters.similarity.json
# Declared similarity-operator parameters (D-IMPL-38; syndicated-lending
# domain). Read as: rank compliance certificates against the leverage-covenant
# query and keep those at or above 40%.
#
# `similarity_corpus_attribute_by_class` lives here, with the operator that
# reads it (15-13 R1). Its semantics are fixed and are not repaired: a class
# ABSENT from this map contributes no corpus entry, silently, because the map is
# this deployment's statement of which classes are rankable; an entity of a
# class this map DOES name that carries no such attribute is REFUSED at
# registry-build time. Refuse, never repair.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: the query text, the threshold, the ranked classes and the
# attribute names are [ADAPT]; the keys `semver`, `query`,
# `minimum_score_percent`, `ranked_entity_classes` and
# `similarity_corpus_attribute_by_class` are [MECHANISM].

semver: "1.0.0"

query: "leverage covenant headroom breach"
minimum_score_percent: 40
ranked_entity_classes:
  - compliance_certificate

similarity_corpus_attribute_by_class:
  compliance_certificate: certificate_summary

# `24.11-02b` (`D-IMPL-292`): the SDK moved the corpus's version identity onto
# THIS document, where it is read at index construction, and made it required.
# This archived example declared it in `product-governance.yaml` — the
# adopter-namespaced pattern every deployment reproduced because the SDK had no
# declarative home for it. The value below is that same declaration, moved so
# the document still parses under the class its `$schema` header names. Nothing
# else in this retired program is retrofitted (`D-07`, `D-IMPL-265`).
index_version: "harborline-covenant-corpus@2026-06-01"
