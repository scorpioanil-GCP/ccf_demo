# yaml-language-server: $schema=../../../../docs/schemas/ccf.resolution-spec.json
# The PRODUCER deployment's entity- and relationship-resolution rules
# (syndicated-lending domain, whitepaper §8.3 Pattern 4).
#
# One artifact class, one document (15-13 R1): this file is rules only. The
# classification map moved to `operator-parameters-policy.yaml` and the
# similarity corpus map to `operator-parameters-similarity.yaml`, each landing
# with the operator that reads it — D-03 makes `ccf.resolution-spec`
# closed-world over resolution rules alone, and `tenant_id` now lives in
# `producer-manifest.yaml`.
#
# [ADAPT] domain vocabulary — safe to change for your domain
# [MECHANISM] structural keys interpreted by the factory — do not rename
#
# In this file: entity classes, relationship types, match keys, identity keys
# and attribute names are [ADAPT]; the keys `semver`, `entity_rules`,
# `relationship_rules`, `match_key`, `entity_class`, `identity_keys`,
# `attribute_keys`, `relationship_type`, `subject_entity_class` and
# `object_entity_class` are [MECHANISM].

semver: "1.0.0"

# Source payload vocabulary -> E nodes. `match_key` selects a rule by presence;
# `identity_keys` mint the canonical URI, so the same facility arriving from two
# source systems converges on one node without either system knowing about the
# other.
entity_rules:
  - match_key: facility_ref
    entity_class: facility
    identity_keys: [facility_ref]
    attribute_keys:
      - facility_name
      - facility_kind
      - facility_classification

  - match_key: covenant_ref
    entity_class: covenant
    identity_keys: [covenant_ref]
    attribute_keys:
      - covenant_label
      - covenant_type
      - covenant_classification

  - match_key: certificate_ref
    entity_class: compliance_certificate
    identity_keys: [certificate_ref]
    attribute_keys:
      - certificate_kind
      - certificate_summary
      - certificate_classification

  - match_key: disclosure_ref
    entity_class: borrower_disclosure
    identity_keys: [disclosure_ref]
    attribute_keys:
      - disclosure_state
      - disclosure_classification

# Typed first-class edges, emitted when one envelope resolves both endpoint
# classes — co-occurrence in one source event is the evidence. Subjects are
# chosen so the traversal walks forward from the facility seed.
relationship_rules:
  - relationship_type: contains
    subject_entity_class: facility
    object_entity_class: covenant

  - relationship_type: evidenced_by
    subject_entity_class: covenant
    object_entity_class: compliance_certificate

  - relationship_type: discloses
    subject_entity_class: covenant
    object_entity_class: borrower_disclosure
