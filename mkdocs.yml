# CCF SDK documentation site (Phase 14, D-IMPL-71).
#
# This file lives at the REPO ROOT, not inside `public/`: `pymdownx.snippets`
# resolves `base_path` against the process CWD, not against the config file's
# directory (14-RESEARCH Pitfall 2), and `make` always runs at the repo root.
#
# Every tuning knob below carries its citation. Two of MkDocs' defaults are
# silently permissive and are explicitly closed here — `pymdownx.snippets`
# `check_paths` and the whole `validation:` block. Without them this build
# reports success on documentation that is quietly empty or quietly broken.

site_name: CCF SDK
site_description: Cognitive Context Fabric SDK — governed, typed, replay-ready context

# D-01: publication is default-deny by existence. `public/` is the ENTIRE
# published surface; nothing outside it is a documentation source.
docs_dir: public
# Build output only, gitignored (D-02 / 14-RESEARCH Pitfall 6).
site_dir: site
# Belt-and-braces: promotes WARNING to error even without `--strict` on the
# command line, so `make docs` and `make docs-strict` gate identically.
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

# 14-RESEARCH Pitfall 3: every level below defaults to `info`, and `--strict`
# only promotes WARNING. Without this block a dead `[link](nope.md)` builds
# clean at exit 0 — the gate would exist and gate nothing.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

# D-06: the never-publish charter is deliberately out of nav — exactly like its
# precedent, examples/external/README.md.
#
# 14-RESEARCH A5 proposed `not_in_nav` on a file named `README.md`; that
# assumption is FALSIFIED. MkDocs 1.6 treats `README.md` as an alias for
# `index.md`, and when both exist in a directory it emits `Excluding
# 'README.md' from the site because it conflicts with 'index.md'` — a WARNING,
# therefore fatal under `strict: true`. `not_in_nav` cannot silence it, because
# the file never becomes a page at all.
#
# Dave's ruling (2026-08-03, wave 1 gate): keep the charter PUBLISHED rather
# than source-tree-only. Renaming it to `charter.md` sidesteps the README alias
# entirely, so `not_in_nav` works as originally intended — the page builds and
# is reachable by URL, but no nav entry points at it. No `exclude_docs` needed.
not_in_nav: |
  charter.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # The two packages under [tool.mypy] files — CLAUDE.md §10 / §14.
          paths: ["src", "runtime"]
          options:
            # PUBLISH SAFETY, not aesthetics (D-02): rendered source would put
            # whole module bodies and their internal comments onto published
            # pages, widening the leak surface far beyond docstrings.
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            members_order: source
            extensions:
              # Renders Pydantic models' JSON Schema — the typed-contract
              # surface CLAUDE.md §11 requires at every boundary.
              - griffe_pydantic:
                  schema: true

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.snippets:
      # 14-RESEARCH Pitfall 2: resolved against the process CWD (repo root
      # under make), NOT this file's directory. Note this leaves the internal
      # deliverable tree nominally reachable by a `--8<--` directive; that is a
      # known non-guard (Pitfall 4). The boundary is the pre-build include-path
      # check and the post-build publish scan, never this setting.
      base_path: ["."]
      # 14-RESEARCH Pitfall 1: at the default `false` BOTH a missing file and a
      # missing named section build clean at exit 0 with an empty block, and
      # `--strict` cannot help because nothing is emitted to warn about.
      # This one line is D-08 in its entirety.
      check_paths: true
      # Blocks `../` escapes above base_path. Never turn this off.
      restrict_base_path: true
      # Snippet regions taken from inside function bodies render flush-left
      # instead of as an accidental code block.
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

# Every path enumerated explicitly — no globs. The nav is authoritative: it
# lists 44 pages, and `charter.md` is the single `not_in_nav` page, for the 45
# markdown files under `public/`. (The eleven `.mmd` diagram sources under
# `public/diagrams/` are embedded by the Concepts pages, not nav entries.)
#
# Both figures are RE-MEASURED whenever a page is added, and were re-measured
# 43 -> 44 and 44 -> 45 when `concepts/the-first-context-product.md` landed.
# Measured, too: NO gate reads either number. `tools/docs_tests/` and
# `tools/publish_scan*` were swept for them and the only hits were the unrelated
# `CONTROL 43` / `CONTROL 44` docstrings in
# `tools/docs_tests/test_requirement_ledger.py`. What IS gated is membership,
# not arithmetic: `validation.nav.omitted_files` under `strict: true` fails the
# build for a page under `public/` that no nav entry names, and
# `tools/docs_tests/test_advisory_discharge.py::nav_pages` parses this block.
nav:
  - Home: index.md
  - Tutorial:
      - Adopter's guide: tutorial/adopters-guide.md
      - How data folds into context: tutorial/demo-walkthrough.md
  - How-to:
      # D-17 placement: the security and deployment notes lead the How-to
      # section.
      - Manage keys and secrets: how-to/security-and-deployment.md
      - Grant and revoke a skill: how-to/grant-and-revoke-a-skill.md
      - Run agents cross-process: how-to/run-agents-cross-process.md
      - Compose a workflow with HITL: how-to/compose-a-workflow-with-hitl.md
      - Swap the artifact store: how-to/swap-the-artifact-store.md
      - Reconstruct a governed determination: how-to/reconstruct-a-governed-determination.md
      - Condition acquisition on the verified credential: how-to/condition-acquisition-on-the-verified-credential.md
      - Bind a harness adapter: how-to/bind-a-harness-adapter.md
      - Write a graph backend adapter: how-to/write-a-graph-backend-adapter.md
  - Concepts:
      # D-11 placement: the adoption argument leads Concepts because a
      # first-time reader reaches this section without finishing the tutorial.
      - Answers no document contains: concepts/answers-no-document-contains.md
      - The first Context Product: concepts/the-first-context-product.md
      - Pillars:
          - Data and Context Layer: concepts/pillars/data-context.md
          - Orchestration Layer: concepts/pillars/orchestration.md
          - Core Agent Types: concepts/pillars/agent-types.md
          - Human in the Loop and Control: concepts/pillars/hitl.md
          - Experience Layer: concepts/pillars/experience.md
      - Invariants: concepts/invariants.md
      - Replay anatomy: concepts/replay-anatomy.md
      - Whitepaper cross-reference: concepts/whitepaper-index.md
  - Reference:
      - Protocols:
          - Storage and Context Graph: reference/protocols/storage-and-graph.md
          - Similarity: reference/protocols/similarity.md
          - Operators and projection: reference/protocols/operators-and-projection.md
          - Context Products: reference/protocols/context-products.md
          - Harness adapter: reference/protocols/harness-adapter.md
          - Artifact store: reference/protocols/artifact-store.md
          - Orchestration and workflow: reference/protocols/orchestration-and-workflow.md
          - HITL: reference/protocols/hitl.md
          - Agents: reference/protocols/agents.md
          - Peering: reference/protocols/peering.md
          - Half-life and debt: reference/protocols/halflife-and-debt.md
          - Runtime surfaces: reference/protocols/runtime-surfaces.md
      - Definition artifacts:
          - Agent definitions: reference/artifacts/agent-definitions.md
          - Task definitions: reference/artifacts/task-definitions.md
          - Prompt artifacts: reference/artifacts/prompt-artifacts.md
          - Workflow definitions: reference/artifacts/workflow-definitions.md
          - Skill catalog: reference/artifacts/skill-catalog.md
          - Skill grants: reference/artifacts/skill-grants.md
          - Control Plane artifacts: reference/artifacts/control-plane-artifacts.md
          - Product registration: reference/artifacts/product-registration.md
          - Deployment manifest: reference/artifacts/deployment-manifest.md
      # Context Product specifications ship WITH the SDK (Dave, 2026-08-29):
      # the authoring standard, the generation recipe and the delivery recipe
      # — the three GOVERNING documents, and nothing else. `public/` is the
      # whole published surface and publication is default-deny by existence
      # (D-01).
      #
      # Individual CP-SPECs do NOT live here (Dave, 2026-08-29). A specification
      # lives in its own example's `spec/` directory, beside the artifacts and
      # code it governs. `CP-SPEC-001` sat here only to bootstrap the authoring
      # process and was deleted at `59831ea5` once it had served that purpose —
      # by then it had drifted to 640 lines against a 1,355-line canonical
      # source, silently dropping every section that recorded an open question.
      - Specifications:
          - Authoring standard v0.3: reference/specifications/Context_Product_Specification_Standard_v0-3.md
          - How a spec is generated: reference/specifications/spec_generation.md
          - How an example is delivered: reference/specifications/example_delivery.md
      - HTTP API: reference/http-api.md
      - Controls register: reference/controls-register.md
      - Performance: reference/performance.md
      # D-17 placement: the surface-record toolchain is maintainer-facing, so it
      # sits last in Reference rather than among the adopter-facing surfaces.
      - How the surface record works: reference/surface-toolchain.md
