[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf"
version = "0.1.0"
description = "Cognitive Context Fabric SDK — governed, typed, replay-ready context for AI agents"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "drcastillo" }]

# Pins per 04-RESEARCH.md Standard Stack (all slopcheck-audited 2026-07-25).
# Pins per 06-RESEARCH.md Standard Stack (slopcheck-audited 2026-07-26) — the four
# cross-process dependencies below (`mcp`, `joserfc`, `a2a-sdk`, `uvicorn`).
dependencies = [
  "jinja2==3.1.6",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "sqlite-vec==0.1.9",
  "psycopg[binary]==3.3.4",
  # 06-RESEARCH.md Standard Stack — MCP client + server, all five CLAUDE.md §7.1 edges.
  "mcp==1.28.1",
  # 06-RESEARCH.md Standard Stack — detached-JWS sign/verify for the IdentityProvider
  # reference impl (D-13); RFC 7797 unencoded/detached payload support.
  "joserfc==1.7.4",
  # 06-RESEARCH.md Standard Stack — LF A2A WireProtocol implementation (D-IMPL-14 default).
  "a2a-sdk==1.1.2",
  # 06-RESEARCH.md Standard Stack — ASGI host for MCP egress, the MCP ArtifactStore server,
  # and the typed-HTTP A2A server; named explicitly for the `sockets=[...]` ephemeral-port
  # pattern (D-16). `starlette` arrives transitively and is not pinned directly;
  # `httpx` was transitive-via-mcp through Phase I.3 and is now a direct pin (see below).
  "uvicorn==0.51.0",
  # 07-RESEARCH.md Standard Stack — HTTP API skeleton (D-IMPL-23): OpenAPI is generated
  # from the existing extra=forbid Pydantic contracts; hand-assembling a spec from
  # model_json_schema() is a spec-drift hand-roll. All of fastapi's deps (starlette,
  # pydantic, typing-extensions) are already present. Constraint interaction, recorded
  # for the gate per review: google-adk already constrains `fastapi>=0.133`, so future
  # ADK bumps may contend with this exact pin.
  "fastapi==0.140.0",
  # 07-RESEARCH.md Standard Stack — promoted from transitive-via-mcp to a direct pin
  # because first-party CLI code imports it (was previously noted above as arriving
  # transitively and unpinned).
  "httpx==0.28.1",
]

# The `ccf` CLI (EXPR-02; D-IMPL-22) — the third v0 Experience Layer front
# door, a thin httpx client over the HTTP API with a --local dev mode.
[project.scripts]
ccf = "ccf_runtime.cli.main:main"

# ---------------------------------------------------------------------------
# The one documented command that installs and enables all three harness legs
# plus MCP, A2A, and JOSE (06-CONTEXT.md D-08):
#
#     pip install -e ".[dev]"
#
# `dev` includes `harnesses`, which composes the three per-harness extras.
# To install a single harness leg only:  pip install -e ".[langgraph]"
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# chromadb is NEVER a core dependency (heavy transitive tree) — 04-RESEARCH.md Standard Stack.
chroma = ["chromadb==1.5.9"]
# Harness SDKs are NEVER core dependencies — 06-CONTEXT.md D-08. The reason is stronger
# than the `chroma` weight argument: harness neutrality is an install-time property as
# well as an import-time one (CLAUDE.md §7.3). A LangGraph deployment must not be made to
# install Google's SDK. Pins per 06-RESEARCH.md Standard Stack.
# The exact pin also fixes the transitive `google-genai` version, which
# `tests/examples/test_ext00_fixture_schemas.py` depends on for
# `GenerateContentResponse._from_response` — a PRIVATE SDK method. See the
# comment at that call site: it degrades to structural assertions if a
# future bump removes the method, so this is a stability note, not a lock.
adk = ["google-adk==2.5.0"]
claude-agent = ["claude-agent-sdk==0.2.128"]
langgraph = ["langgraph==1.2.9"]
# Anthropic SDK for the external-consumer example family's client leg
# (examples/external, EXAM-04). Never a core dependency — same D-08 posture as
# the harness extras. Pin per 13.1-RESEARCH.md Package Legitimacy Audit ([OK],
# github.com/anthropics/anthropic-sdk-python).
anthropic = ["anthropic==0.120.2"]
# Aggregate extra satisfying D-08's one-command requirement. Self-referential extras are
# resolved by the pinned setuptools>=77 / pip in use (research assumption A1, verified
# empirically at plan 06-02 execution).
harnesses = ["ccf[adk,claude-agent,langgraph]"]
# 11-RESEARCH.md Standard Stack (D-01): pytest-benchmark is the locked timing
# harness for the perf battery — benchmarks are pytest tests under perf/ and
# never join always-on CI (Phase-8 D-10 / D-IMPL-70). A1 compatibility with
# the pytest 9.1.1 pin verified empirically at plan 11-01 execution.
perf = ["pytest-benchmark==5.2.3"]
# Phase 14 D-IMPL-71: the documentation toolchain. Never a core dependency — the
# SDK's runtime has no use for a static-site generator, and a docs build is a
# build-time concern only. `mkdocs` is exact-pinned rather than `>=` for a reason
# stronger than reproducibility: MkDocs 2.0 is announced as a backward-incompatible
# rewrite with no migration path, and every plugin below stops working on it
# (14-RESEARCH.md Pitfall 7). A `>=` here would silently break the docs gate the
# day 2.0 lands on PyPI.
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mkdocstrings[python]==1.0.6",
  "mkdocstrings-python==2.0.5",
  "pymdown-extensions==11.0.1",
  "griffe-pydantic==1.3.1",
]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.161.5",
  "testcontainers==4.15.0",
  "mypy==2.3.0",
  "pytest-cov==7.1.0",
  # D-08: CI and contributors get all three harness legs from `pip install -e ".[dev]"`.
  "ccf[harnesses]",
  # Phase 11 D-01: dev environments get the perf harness from the same one command.
  "ccf[perf]",
  # Phase 13.1: CI installs the Anthropic client leg for examples/external (EXAM-04).
  "ccf[anthropic]",
  # Phase 14 D-IMPL-71: the docs toolchain arrives with the same one command, so no
  # existing CI job's `pip install -e ".[dev]"` step changes to gain `make docs`.
  "ccf[docs]",
]

# Single distribution for v0 shipping two packages: the `ccf` library (src layout,
# CLAUDE.md §10 L1–L6) and the `ccf_runtime` host package (CLAUDE.md §14) — D-05.
[tool.setuptools.packages.find]
where = ["src", "runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires a Postgres backend (service container in CI, testcontainers locally) — D-10",
  "chroma: requires the optional `chroma` extra — D-13",
  "conformance: shared parametrized Protocol conformance suite — D-16",
  "crossproc: spawns real subprocesses over loopback — D-15/D-16",
  "harness: requires a harness extra (adk | claude-agent | langgraph) — D-08/D-09",
]

# `runtime` joins `src` here per 06-RESEARCH.md finding B2: the majority of Phase I.3's
# new code (harness adapters, A2A transports, both MCP servers) lands in `/runtime`,
# which was previously type-checked by nothing while the I.1 and I.2 gate evidence both
# cite "mypy --strict clean".
[tool.mypy]
files = ["src", "runtime"]
python_version = "3.12"
strict = true
warn_unreachable = true

# PyYAML ships no inline types and the stub package is not a runtime dependency
# of the SDK. The single `src` import of it (the Control Plane artifact loader)
# immediately validates whatever it parses through a typed artifact contract, so
# the untyped boundary is one call deep and closed by validation, not by trust.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# chromadb is an optional extra and is deliberately absent from `dev` (04-RESEARCH.md:
# "NEVER a core dependency"), so a `dev`-only environment — which is exactly what CI
# installs — cannot resolve it and `mypy` fails on the one guarded import in
# `ccf.similarity.chroma_index`. Without this override the type-check result depends on
# whether an optional extra happens to be installed, which makes "mypy --strict clean"
# an environment-dependent claim. The boundary is closed by the SimilarityIndex Protocol:
# the adapter's public surface is fully typed and every value returned by chromadb is
# converted into a CCF-owned type before it leaves the module.
[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true

# The two overrides above are deliberately written one block per module rather than as a
# single blanket block. A blanket block is an untracked widening: it would silently absorb
# any future untyped import, and the honest claim (D-21) has to name exactly which
# boundaries are untyped.
#
# **Four harness/transport overrides were REMOVED in 06-16, having been measured inert.**
# `google-adk` 2.5.0, `langgraph` 1.2.9, `langchain-core`, and `claude-agent-sdk` 0.2.128
# all ship a `py.typed` marker, and `mypy` passes over `src` + `runtime` with none of the
# four blocks present — verified by deleting them and re-running. `mcp` and `a2a-sdk` ship
# `py.typed` too and never had a block. The removed comments asserted the opposite
# ("ships no py.typed marker"), which was factually wrong for every one of them.
#
# This is recorded rather than quietly deleted because it is the mirror image of the
# defect D-21 exists to prevent: a claim of *looseness* that does not hold understates the
# enforcement in force, and a gate citing "these vendor boundaries are not strict-checked"
# would have been describing a config, not the build. Those seams are genuinely
# strict-checked. If a future vendor release drops its marker, `mypy` fails and the block
# comes back with a comment that is true when written.

# a2a-sdk 1.1.2 is protobuf-generated (`a2a_pb2`), so its runtime types are not the
# typed boundary and must never be treated as one (06-RESEARCH.md Pitfall 5): CCF's own
# ContextProduct contract is the boundary at the A2A seam, and every inbound product is
# re-validated into it before the Control Plane admission gate (D-12). Scoped to the
# generated/vendor surface rather than adding `types-protobuf`, which would type the
# wire shapes CCF deliberately declines to trust.
[[tool.mypy.overrides]]
module = ["a2a.*"]
ignore_missing_imports = true
